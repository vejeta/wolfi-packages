name: Build Wolfi APK Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      package_filter:
        description: 'Build specific packages (comma-separated, e.g. "mujs,zlib" or leave empty for all)'
        required: false
        default: ''
        type: string
      architectures:
        description: 'Target architectures (comma-separated, e.g. "x86_64" or "x86_64,aarch64")'
        required: false
        default: 'x86_64,aarch64'
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the build of its previous commit.
# Other events get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  MELANGE_VERSION: latest

jobs:
  prepare-build-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      wave1: ${{ steps.waves.outputs.wave1 }}
      wave2: ${{ steps.waves.outputs.wave2 }}
      wave3: ${{ steps.waves.outputs.wave3 }}
      wave4: ${{ steps.waves.outputs.wave4 }}
      wave5: ${{ steps.waves.outputs.wave5 }}
      wave6: ${{ steps.waves.outputs.wave6 }}
      wave7: ${{ steps.waves.outputs.wave7 }}
      wave8: ${{ steps.waves.outputs.wave8 }}
      wave9: ${{ steps.waves.outputs.wave9 }}
      wave10: ${{ steps.waves.outputs.wave10 }}
      wave11: ${{ steps.waves.outputs.wave11 }}
      wave12: ${{ steps.waves.outputs.wave12 }}
      wave13: ${{ steps.waves.outputs.wave13 }}
      wave14: ${{ steps.waves.outputs.wave14 }}
      wave15: ${{ steps.waves.outputs.wave15 }}
      wave16: ${{ steps.waves.outputs.wave16 }}
      wave17: ${{ steps.waves.outputs.wave17 }}
      wave18: ${{ steps.waves.outputs.wave18 }}
      wave19: ${{ steps.waves.outputs.wave19 }}
      wave20: ${{ steps.waves.outputs.wave20 }}
      wave21: ${{ steps.waves.outputs.wave21 }}
      wave22: ${{ steps.waves.outputs.wave22 }}
      wave23: ${{ steps.waves.outputs.wave23 }}
      wave24: ${{ steps.waves.outputs.wave24 }}
      architectures: ${{ steps.waves.outputs.architectures }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build waves
        id: waves
        env:
          EVENT: ${{ github.event_name }}
          FILTER: ${{ github.event.inputs.package_filter }}
          ARCH_INPUT: ${{ github.event.inputs.architectures }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          pip install --quiet pyyaml
          # Pull requests and pushes build the recipes they change; manual
          # runs build the filtered recipes, or all of them. Recipes that
          # depend on each other are split into waves (scripts/build-order.py).
          # When the build tooling changes, pull requests and pushes rebuild
          # only what is not published yet, plus a few canary recipes; a
          # manual run without a filter rebuilds everything.
          reuse="--skip-published https://downloads.sourceforge.net/project/wolfi --canary mujs,libxmlb,appstream"
          case "$EVENT" in
            pull_request) sel="--changed-from $PR_BASE $reuse" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0*$' \
                 && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                sel="--changed-from $PUSH_BEFORE $reuse"
              else
                sel="--all $reuse"
              fi ;;
            *) if [ -n "$FILTER" ]; then sel="--filter $FILTER"; else sel="--all"; fi ;;
          esac
          [ -n "$ARCH_INPUT" ] || ARCH_INPUT="x86_64,aarch64"
          echo "Selection: $sel ($ARCH_INPUT)"
          result=$(python3 scripts/build-order.py $sel --arch "$ARCH_INPUT" --max-waves 24)
          echo "$result" | jq .
          for i in $(seq 1 24); do
            echo "wave$i=$(echo "$result" | jq -c ".waves[$((i-1))]")" >> "$GITHUB_OUTPUT"
          done
          echo "architectures=$(echo "$ARCH_INPUT" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  wave-1:
    needs: prepare-build-matrix
    if: needs.prepare-build-matrix.outputs.wave1 != '[]'
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 1
      builds: ${{ needs.prepare-build-matrix.outputs.wave1 }}

