name: Build Wolfi APK Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      package_filter:
        description: 'Build specific packages (comma-separated, e.g. "mujs,zlib" or leave empty for all)'
        required: false
        default: ''
        type: string
      architectures:
        description: 'Target architectures (comma-separated, e.g. "x86_64" or "x86_64,aarch64")'
        required: false
        default: 'x86_64,aarch64'
        type: string

permissions:
  contents: read

# A new push to a pull request cancels the build of its previous commit.
# Other events get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  MELANGE_VERSION: latest

jobs:
  prepare-build-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      wave1: ${{ steps.waves.outputs.wave1 }}
      wave2: ${{ steps.waves.outputs.wave2 }}
      wave3: ${{ steps.waves.outputs.wave3 }}
      wave4: ${{ steps.waves.outputs.wave4 }}
      wave5: ${{ steps.waves.outputs.wave5 }}
      wave6: ${{ steps.waves.outputs.wave6 }}
      architectures: ${{ steps.waves.outputs.architectures }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build waves
        id: waves
        env:
          EVENT: ${{ github.event_name }}
          FILTER: ${{ github.event.inputs.package_filter }}
          ARCH_INPUT: ${{ github.event.inputs.architectures }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          pip install --quiet pyyaml
          # Pull requests and pushes build the recipes they change; manual
          # runs build the filtered recipes, or all of them. Recipes that
          # depend on each other are split into waves (scripts/build-order.py).
          # When the build tooling changes, pull requests and pushes rebuild
          # only what is not published yet, plus a few canary recipes; a
          # manual run without a filter rebuilds everything.
          reuse="--skip-published https://downloads.sourceforge.net/project/wolfi --canary mujs,libxmlb,appstream"
          case "$EVENT" in
            pull_request) sel="--changed-from $PR_BASE $reuse" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0*$' \
                 && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                sel="--changed-from $PUSH_BEFORE $reuse"
              else
                sel="--all $reuse"
              fi ;;
            *) if [ -n "$FILTER" ]; then sel="--filter $FILTER"; else sel="--all"; fi ;;
          esac
          [ -n "$ARCH_INPUT" ] || ARCH_INPUT="x86_64,aarch64"
          echo "Selection: $sel ($ARCH_INPUT)"
          result=$(python3 scripts/build-order.py $sel --arch "$ARCH_INPUT")
          echo "$result" | jq .
          for i in 1 2 3 4 5 6; do
            echo "wave$i=$(echo "$result" | jq -c ".waves[$((i-1))]")" >> "$GITHUB_OUTPUT"
          done
          echo "architectures=$(echo "$ARCH_INPUT" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  wave-1:
    needs: prepare-build-matrix
    if: needs.prepare-build-matrix.outputs.wave1 != '[]'
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 1
      builds: ${{ needs.prepare-build-matrix.outputs.wave1 }}

  wave-2:
    needs: [prepare-build-matrix, wave-1]
    if: ${{ !cancelled() && needs.prepare-build-matrix.outputs.wave2 != '[]' }}
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 2
      builds: ${{ needs.prepare-build-matrix.outputs.wave2 }}

  wave-3:
    needs: [prepare-build-matrix, wave-2]
    if: ${{ !cancelled() && needs.prepare-build-matrix.outputs.wave3 != '[]' }}
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 3
      builds: ${{ needs.prepare-build-matrix.outputs.wave3 }}

  wave-4:
    needs: [prepare-build-matrix, wave-3]
    if: ${{ !cancelled() && needs.prepare-build-matrix.outputs.wave4 != '[]' }}
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 4
      builds: ${{ needs.prepare-build-matrix.outputs.wave4 }}

  wave-5:
    needs: [prepare-build-matrix, wave-4]
    if: ${{ !cancelled() && needs.prepare-build-matrix.outputs.wave5 != '[]' }}
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 5
      builds: ${{ needs.prepare-build-matrix.outputs.wave5 }}

  wave-6:
    needs: [prepare-build-matrix, wave-5]
    if: ${{ !cancelled() && needs.prepare-build-matrix.outputs.wave6 != '[]' }}
    uses: ./.github/workflows/build-wave.yml
    secrets: inherit
    with:
      wave: 6
      builds: ${{ needs.prepare-build-matrix.outputs.wave6 }}

  build-summary:
    name: Build Summary
    needs: [wave-1, wave-2, wave-3, wave-4, wave-5, wave-6]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Display build summary
        run: |
          echo "=== Build Summary ==="
          echo ""
          echo "Total artifacts:"
          find all-artifacts -name "*.apk" | wc -l
          echo ""
          echo "Total size:"
          du -sh all-artifacts
          echo ""
          for arch in x86_64 aarch64; do
            echo ""
            echo "$arch packages:"
            find all-artifacts -path "*$arch*" -name "*.apk" -exec basename {} \; | sort
          done

  consolidate-cache:
    name: Consolidate Package Cache
    needs: [prepare-build-matrix, wave-1, wave-2, wave-3, wave-4, wave-5, wave-6]
    runs-on: ubuntu-latest
    if: always()
    strategy:
      matrix:
        arch: ${{ fromJson(needs.prepare-build-matrix.outputs.architectures) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts for ${{ matrix.arch }}
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: 'apk-packages-*-${{ matrix.arch }}'

      - name: Restore existing package cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ./consolidated-cache/${{ matrix.arch }}
          key: wolfi-packages-consolidated-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            wolfi-packages-consolidated-${{ matrix.arch }}-

      - name: Consolidate packages into cache directory
        run: |
          echo "=== Consolidating packages into cache ==="
          mkdir -p ./consolidated-cache/${{ matrix.arch }}

          # Count existing cached packages
          EXISTING_COUNT=$(find ./consolidated-cache/${{ matrix.arch }} -name "*.apk" 2>/dev/null | wc -l || echo "0")
          echo "Existing packages in cache: $EXISTING_COUNT"

          # Copy all newly built packages
          echo "Copying newly built packages..."
          find artifacts -name "*.apk" -exec cp -v {} ./consolidated-cache/${{ matrix.arch }}/ \;

          # Count total packages
          TOTAL_COUNT=$(find ./consolidated-cache/${{ matrix.arch }} -name "*.apk" 2>/dev/null | wc -l)
          NEW_COUNT=$((TOTAL_COUNT - EXISTING_COUNT))

          echo ""
          echo "=== Cache Statistics ==="
          echo "Previously cached: $EXISTING_COUNT packages"
          echo "Newly added: $NEW_COUNT packages"
          echo "Total in cache: $TOTAL_COUNT packages"
          echo ""
          echo "Cache contents:"
          ls -lh ./consolidated-cache/${{ matrix.arch }}/*.apk 2>/dev/null | tail -20

      - name: Generate APKINDEX for cache
        run: |
          echo "=== Generating APKINDEX for cache ==="

          if ls ./consolidated-cache/${{ matrix.arch }}/*.apk 1> /dev/null 2>&1; then
            cd ./consolidated-cache/${{ matrix.arch }}

            # Generate APKINDEX using Alpine container
            docker run --rm \
              -v $PWD:/work \
              -w /work \
              alpine:latest \
              sh -c "apk add --no-cache apk-tools abuild && \
                apk index --allow-untrusted -o APKINDEX.tar.gz *.apk && \
                ls -lh APKINDEX.tar.gz"

            cd ../..
            echo "APKINDEX generated successfully"
          else
            echo "No packages to index"
          fi

      - name: Save consolidated cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ./consolidated-cache/${{ matrix.arch }}
          key: wolfi-packages-consolidated-${{ matrix.arch }}-${{ github.run_id }}
