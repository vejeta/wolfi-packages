name: Tools

on:
  push:
    paths:
      - 'tools/**'
      - 'scripts/build-order.py'
      - 'scripts/test_build_order.py'
      - 'scripts/remove-retired.py'
      - 'scripts/test_remove_retired.py'
      - 'scripts/test_scala_build.py'
      - 'scripts/package-list.py'
      - 'scripts/test_package_list.py'
      - 'scripts/sourceforge-readme.py'
      - 'scripts/test_sourceforge_readme.py'
      - 'README.md'
      - 'packages/*.yaml'
      - 'PACKAGES.md'
      - 'pipelines/scala/**'
      - '.github/workflows/tools.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/build-order.py'
      - 'scripts/test_build_order.py'
      - 'scripts/remove-retired.py'
      - 'scripts/test_remove_retired.py'
      - 'scripts/test_scala_build.py'
      - 'scripts/package-list.py'
      - 'scripts/test_package_list.py'
      - 'scripts/sourceforge-readme.py'
      - 'scripts/test_sourceforge_readme.py'
      - 'README.md'
      - 'packages/*.yaml'
      - 'PACKAGES.md'
      - 'pipelines/scala/**'
      - '.github/workflows/tools.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional test dependencies
        run: pip install pyyaml
      - name: pkg-check
        run: python -m unittest discover -s tools/pkg-check -v
      - name: debian-to-melange
        run: python -m unittest discover -s tools/debian-to-melange -v
      - name: alpine-to-melange
        run: python -m unittest discover -s tools/alpine-to-melange -v
      - name: melange-to-debian
        run: python -m unittest discover -s tools/melange-to-debian -v
      - name: texlive-to-melange
        run: python -m unittest discover -s tools/texlive-to-melange -v
      - name: scripts and the scala/build pipeline
        run: python -m unittest discover -s scripts -v
