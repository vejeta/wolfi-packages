#
# https://wolfi.vejeta.com is the address users configure; it redirects to where
# the packages are stored (SourceForge), and serves the signing key itself. Check
# both, every week and when the documentation changes.
name: Repository URL

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'scripts/repository-url-check/**'
      - '.github/workflows/repository-url.yml'

permissions:
  contents: read

jobs:
  check:
    name: wolfi.vejeta.com serves the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Indexes and key through the address, as Go clients (apko, melange) fetch them
        working-directory: scripts/repository-url-check
        run: go run . https://wolfi.vejeta.com
