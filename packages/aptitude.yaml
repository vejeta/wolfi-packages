package:
  name: aptitude
  version: '0.8.13'
  epoch: 0
  description: Terminal-based package manager
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - dpkg  # used by the maintainer scripts
      - aptitude-common
      # Debian Recommends (not supported by apk): libdpkg-perl, sensible-utils
  scriptlets:
    post-install: |
      #!/bin/sh
      # Converted from debian/postinst by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postinst() (
      # aptitude needs the apt xapian index stuff now, so make sure it at
      # least exists.

      set -e

      mandir=/usr/share/man

      if [ "$1" = "configure" ]
      then
        slaves="--slave $mandir/man8/aptitude.8.gz aptitude.8.gz $mandir/man8/aptitude-curses.8.gz"
        for lang in cs de es fi fr gl it ja pl ; do
          slaves="$slaves --slave $mandir/$lang/man8/aptitude.8.gz aptitude.$lang.8.gz $mandir/$lang/man8/aptitude-curses.8.gz"
        done
        update-alternatives \
          --install /usr/bin/aptitude aptitude /usr/bin/aptitude-curses 30 $slaves
      fi
      )
      debian_postinst configure
    post-upgrade: |
      #!/bin/sh
      # Converted from debian/postinst by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postinst() (
      # aptitude needs the apt xapian index stuff now, so make sure it at
      # least exists.

      set -e

      mandir=/usr/share/man

      if [ "$1" = "configure" ]
      then
        slaves="--slave $mandir/man8/aptitude.8.gz aptitude.8.gz $mandir/man8/aptitude-curses.8.gz"
        for lang in cs de es fi fr gl it ja pl ; do
          slaves="$slaves --slave $mandir/$lang/man8/aptitude.8.gz aptitude.$lang.8.gz $mandir/$lang/man8/aptitude-curses.8.gz"
        done
        update-alternatives \
          --install /usr/bin/aptitude aptitude /usr/bin/aptitude-curses 30 $slaves
      fi
      )
      debian_postinst configure "$2"
    pre-deinstall: |
      #!/bin/sh
      # Converted from debian/prerm by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_prerm() (
      set -e

      if [ "$1" = "remove" ]; then
          update-alternatives --remove aptitude /usr/bin/aptitude-curses
      fi
      )
      debian_prerm remove
    post-deinstall: |
      #!/bin/sh
      # Converted from debian/postrm by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postrm() (
      # postrm script for #PACKAGE#
      #
      # see: dh_installdeb(1)

      set -e

      # summary of how this script can be called:
      #        * <postrm> `remove'
      #        * <postrm> `purge'
      #        * <old-postrm> `upgrade' <new-version>
      #        * <new-postrm> `failed-upgrade' <old-version>
      #        * <new-postrm> `abort-install'
      #        * <new-postrm> `abort-install' <old-version>
      #        * <new-postrm> `abort-upgrade' <old-version>
      #        * <disappearer's-postrm> `disappear' <r>overwrit>r> <new-version>
      # for details, see /usr/doc/packaging-manual/

      case "$1" in
             remove|upgrade|failed-upgrade|abort-install|abort-upgrade|disappear)

              ;;
            purge)
              # Clear out /var/lib/aptitude
      	rm -fr /var/lib/aptitude
      	# Clear out the log
      	rm -f /var/log/aptitude /var/log/aptitude.[0-9].gz
      	;;

          *)
              echo "postrm called with unknown argument \`$1'" >&2
              exit 0

      esac

      # dh_installdeb will replace this with shell code automatically
      # generated by other debhelper scripts.
      )
      debian_postrm remove
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf-archive
      - gettext
      - libapt-pkg-dev  # Wolfi Community Packages
      - boost-dev  # Debian: libboost-dev
      - cppunit-dev  # Debian: libcppunit-dev
      - libcwidget-dev  # Wolfi Community Packages
      - gtest-dev  # Debian: libgmock-dev
      - ncurses-dev  # Debian: libncurses-dev
      - libsigc++-dev  # Wolfi Community Packages (Debian: libsigc++-2.0-dev)
      - sqlite-dev  # Debian: libsqlite3-dev
      - xapian-core-dev  # Wolfi Community Packages (Debian: libxapian-dev)
      - pkgconf-dev  # Debian: pkgconf
      - docbook-xml
      - elinks  # Wolfi Community Packages
      - rsvg-convert  # Debian: librsvg2-bin
      - po4a  # Wolfi Community Packages
      - libxslt  # Debian: xsltproc
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0008-Add-missing-include-to-build-with-gcc-14.patch 0010-cmdline-terminal-Include-cstdint-for-UINT16_MAX.patch adjust-libapt-pkg7.0.patch apt_2.1.19_compatibility.patch fix-FTBFS-1011681.patch fix-aptitude-changelog-parser.patch fix-bashism-related-issue-with-fixman-scripts.patch fix-ftbfs-with-gcc-10.patch fix-ftbfs-with-gcc-12.patch fix-ftbfs-with-t64.patch; do mv aptitude/$f .recipe-files/; done
      rmdir aptitude 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/aptitude/aptitude_${{package.version}}.orig.tar.xz
      expected-sha256: 0ef50cb5de27215dd30de74dd9b46b318f017bd0ec3f5c4735df7ac0beb40248
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - uses: patch
    with:
      patches: .recipe-files/fix-ftbfs-with-gcc-10.patch .recipe-files/apt_2.1.19_compatibility.patch .recipe-files/fix-FTBFS-1011681.patch .recipe-files/fix-bashism-related-issue-with-fixman-scripts.patch .recipe-files/fix-ftbfs-with-gcc-12.patch .recipe-files/fix-aptitude-changelog-parser.patch .recipe-files/fix-ftbfs-with-t64.patch .recipe-files/0008-Add-missing-include-to-build-with-gcc-14.patch .recipe-files/adjust-libapt-pkg7.0.patch .recipe-files/0010-cmdline-terminal-Include-cstdint-for-UINT16_MAX.patch
  - uses: autoconf/configure
    with:
      opts: '--htmldir=''$${docdir}/html'' --program-transform=''s&aptitude$$&aptitude-curses&'' --disable-boost-lib-checks --disable-docs $(CONFIGURE_OPTS_TESTS)'
  - uses: autoconf/make
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make install DESTDIR="${{targets.destdir}}"
      (cd ${{targets.destdir}}/usr/share/man/gl/man8/ && mv aptitude.8 aptitude-curses.8)
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/var/lib/aptitude"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/aptitude
  - name: From debian/rules override_dh_installdocs
    runs: |
      pkgs=`dh_listpackages | grep ^aptitude-doc`;  	for pkg in $pkgs; do  	  echo "  installing html for $pkg";  	  ll=`echo $pkg | sed -e 's/^aptitude-doc-//'`;  	  mkdir -p "debian/$pkg/usr/share/doc/aptitude/html";  	  cp -Rf "${{targets.destdir}}/usr/share/doc/aptitude/html/$ll"  	      "debian/$pkg/usr/share/doc/aptitude/html/$ll";  	done
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Alternatives (links update-alternatives makes)
    runs: |
      alt() {
        for s in "" .gz; do
          t="${2%.gz}$s" l="${1%.gz}$s"
          [ -e "${{targets.destdir}}$t" ] && [ ! -e "${{targets.destdir}}$l" ] || continue
          mkdir -p "$(dirname "${{targets.destdir}}$l")" && ln -s "$t" "${{targets.destdir}}$l" && return
        done
      }
      alt /usr/bin/aptitude /usr/bin/aptitude-curses
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: aptitude-common
    description: Architecture independent files for the aptitude package manager
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/aptitude"
          cp -a TODO "${{targets.contextdir}}/usr/share/doc/aptitude/"
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}"/usr/bin/aptitude-*-state-bundle "${{targets.contextdir}}/usr/bin/"
          mv "${{targets.destdir}}/usr/bin/aptitude-changelog-parser" "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/share/aptitude"
          mv "${{targets.destdir}}/usr/share/aptitude/FAQ" "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}/usr/share/aptitude/NEWS" "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}"/usr/share/aptitude/README* "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}"/usr/share/aptitude/aptitude-defaults* "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}"/usr/share/aptitude/help*.txt "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}"/usr/share/aptitude/mine-help*.txt "${{targets.contextdir}}/usr/share/aptitude/"
          mv "${{targets.destdir}}/usr/share/aptitude/section-descriptions" "${{targets.contextdir}}/usr/share/aptitude/"
          mkdir -p "${{targets.contextdir}}/usr/share"
          mv "${{targets.destdir}}/usr/share/locale" "${{targets.contextdir}}/usr/share/"
          mv "${{targets.destdir}}/usr/share/man" "${{targets.contextdir}}/usr/share/"
          ln -sf /usr/share/aptitude/NEWS "${{targets.contextdir}}/usr/share/doc/aptitude/NEWS"
          ln -sf /usr/share/aptitude/README "${{targets.contextdir}}/usr/share/doc/aptitude/README"
          ln -sf /usr/share/common-licenses/GPL "${{targets.contextdir}}/usr/share/aptitude/COPYING"
