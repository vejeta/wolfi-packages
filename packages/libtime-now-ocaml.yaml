# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-time-now
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libtime-now-ocaml
  version: '0.17.0'
  epoch: 0
  description: Current time for OCaml (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libjane-street-headers-ocaml-dev  # Wolfi Community Packages
      - libjst-config-ocaml-dev  # Wolfi Community Packages
      - libppx-base-ocaml-dev  # Wolfi Community Packages
      - libppx-cold-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      - libppx-globalize-ocaml-dev  # Wolfi Community Packages
      - libppx-hash-ocaml-dev  # Wolfi Community Packages
      - libppx-optcomp-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/time_now
      tag: v${{package.version}}
      expected-commit: 112f3885262b236a36c0dce1b6790c0561ded7ca
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p time_now -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" time_now
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libtime-now-ocaml"
      mv "${{targets.destdir}}/usr/doc/time_now/CHANGES.md" "${{targets.destdir}}/usr/share/doc/libtime-now-ocaml/"
      rmdir "${{targets.destdir}}/usr/doc/time_now" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libtime-now-ocaml
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      find ${{targets.destdir}}/ -name LICENSE.md -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libtime-now-ocaml-dev
    description: Current time for OCaml (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/time_now"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*opam* "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*dune* "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.ml "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.mli "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.a "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/time_now/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/time_now/"
    dependencies:
      runtime:
        - libppx-hash-ocaml-dev  # Wolfi Community Packages
        - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
        - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
        - libjane-street-headers-ocaml-dev  # Wolfi Community Packages
        - libtime-now-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: janestreet/time_now
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libtime-now-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
