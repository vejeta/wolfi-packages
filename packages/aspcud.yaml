# Debian packaging: https://salsa.debian.org/debian/aspcud
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - test dependency 'cudf-tools' (Debian 'cudf-tools') not found in Wolfi; left out
# - autopkgtest 'upstream' left out: it needs packages that are not in Wolfi
package:
  name: aspcud
  version: '1.9.6'
  epoch: 0
  description: CUDF solver based on Answer Set Programming
  copyright:
    - license: MIT
    - license: LicenseRef-public-domain
      paths:
        - 'lemon/*'
  dependencies:
    runtime:
      - gringo  # Wolfi Community Packages
      - clasp  # Wolfi Community Packages
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - boost-dev  # Debian: libboost-dev
      - cmake
      - re2c
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in cmake-version; do mv aspcud/$f .recipe-files/; done
      rmdir aspcud 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/potassco/aspcud
      tag: v${{package.version}}
      expected-commit: 671e0b3428063e8c8139ff32ad8119924583b7e6
  - uses: patch
    with:
      patches: .recipe-files/cmake-version
  - uses: cmake/configure
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share/aspcud"
      mkdir -p "${{targets.destdir}}/usr/share/cudf/solvers"
      mkdir -p "${{targets.destdir}}/usr/share/doc/aspcud/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/aspcud/examples/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/aspcud
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: potassco/aspcud
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/aspcud/LICENSE.md
    - uses: test/tw/ldd-check
    # TODO(debian-to-melange): autopkgtest 'upstream' left out; it needs packages that are not in Wolfi
