# gringo 5.8.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/gringo
# Debian packaging: https://salsa.debian.org/science-team/gringo
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with pkgkde_symbolshelper has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: gringo
  version: '5.8.0'
  epoch: 0
  description: Grounding tools for (disjunctive) logic programs
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): clasp
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - catch  # Wolfi Community Packages
      - catch2  # Wolfi Community Packages
      - re2c
      - bison
      - lua5.4-dev  # Debian: liblua5.4-dev
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in compilation-with-re2c-4.3.1 gringo-manpages.patch gringo-python3-utf8.patch link-libatomic-check.patch use-system-catch-for-glibc-2.34-compat.patch; do mv gringo/$f .recipe-files/; done
      rmdir gringo 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/potassco/gringo
      tag: v${{package.version}}
      expected-commit: 78107e88e69d626daf46a37155510c26e8bb7f2b
  - uses: patch
    with:
      patches: .recipe-files/gringo-manpages.patch .recipe-files/gringo-python3-utf8.patch .recipe-files/link-libatomic-check.patch .recipe-files/use-system-catch-for-glibc-2.34-compat.patch .recipe-files/compilation-with-re2c-4.3.1
  - uses: cmake/configure
    with:
      opts: -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -LAH -DCMAKE_SKIP_RPATH=YES -DCLINGO_MANAGE_RPATH=OFF -DLIB_POTASSCO_BUILD_APP=ON -DLIB_POTASSCO_BUILD_TESTS=ON -DCLASP_BUILD_APP=OFF -DCLASP_BUILD_TESTS=OFF -DCLASP_BUILD_EXAMPLES=OFF -DCLINGO_BUILD_EXAMPLES=ON -DCLINGO_BUILD_TESTS=ON -DCLINGO_BUILD_WITH_PYTHON=OFF
      output-dir: build.dir/hardening_mt
  - uses: cmake/build
    with:
      output-dir: build.dir/hardening_mt
  - uses: cmake/install
    with:
      output-dir: build.dir/hardening_mt
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a build.dir/hardening_mt/bin/gringo "${{targets.destdir}}/usr/bin/"
      cp -a build.dir/hardening_mt/bin/clingo "${{targets.destdir}}/usr/bin/"
      cp -a build.dir/hardening_mt/bin/reify "${{targets.destdir}}/usr/bin/"
      cp -a build.dir/hardening_mt/bin/lpconvert "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/lib"
      cp -a build.dir/hardening_mt/bin/libclingo.so.4.0 "${{targets.destdir}}/usr/lib/"
      install -Dm644 gringo.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 clingo.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 reify.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 lpconvert.1 -t "${{targets.destdir}}/usr/share/man/man1"
      ln -sf /usr/bin/clingo "${{targets.destdir}}/usr/bin/iclingo"
      ln -sf /usr/bin/clingo "${{targets.destdir}}/usr/bin/oclingo"
      ln -sf /usr/lib/libclingo.so.4.0 "${{targets.destdir}}/usr/lib/libclingo.so.4"
      ln -sf /usr/lib/libclingo.so.4 "${{targets.destdir}}/usr/lib/libclingo.so"
      mkdir -p "${{targets.destdir}}/usr/share/man/man1"
      ln -sf /usr/share/man/man1/clingo.1 "${{targets.destdir}}/usr/share/man/man1/iclingo.1"
      ln -sf /usr/share/man/man1/clingo.1 "${{targets.destdir}}/usr/share/man/man1/oclingo.1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/gringo"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/gringo/"
      cp -a examples "${{targets.destdir}}/usr/share/doc/gringo/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/gringo
  - uses: strip
update:
  enabled: true
  github:
    identifier: potassco/gringo
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        gringo --version || (gringo --help 2>&1 || true) | grep -qi -e usage -e gringo
        clingo --version || (clingo --help 2>&1 || true) | grep -qi -e usage -e clingo
        reify --version || (reify --help 2>&1 || true) | grep -qi -e usage -e reify
        lpconvert --version || (lpconvert --help 2>&1 || true) | grep -qi -e usage -e lpconvert
        test -f /usr/share/licenses/gringo/LICENSE.md
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/potassco/gringo
        tag: v${{package.version}}
        expected-commit: 78107e88e69d626daf46a37155510c26e8bb7f2b
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/gringo.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/gringo.templates" && break
        done
    - name: 'autopkgtest: gringo5'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # clingo+lua: cannot example
        # Author: Thomas Krennwallner <tkren@kr.tuwien.ac.at>
        # Date: 2018-02-04

        set -o pipefail

        clingo /usr/share/doc/gringo/examples/clingo/cannot/{cannot-lua,example}.lp

        result=$?
        test $result -eq 30
