package:
  name: py3-openstep-plist
  version: '0.5.2'
  epoch: 0
  description: 'Parser for the "old style" OpenStep property list format'
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - python3-dev  # Debian: python3-all-dev
      - py3.13-cython-bin  # Debian: cython3
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - coreutils
      - findutils
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/openstep-plist
      tag: v${{package.version}}
      expected-commit: b374321260e8bb1a17bd28010c0ea47830fab505
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-openstep-plist
  - name: From debian/rules execute_after_dh_auto_clean
    runs: |
      rm -fv src/openstep_plist/_version.py
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: fonttools/openstep-plist
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-openstep-plist/LICENSE
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import openstep_plist
