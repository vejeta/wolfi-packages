package:
  name: font-daewoo-misc
  version: '1.0.4'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: LicenseRef-font-daewoo-misc
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-daewoo-misc-${{package.version}}.tar.xz
      expected-sha512: be9f550e8cb84f9e24afb6b739c357cb159da8a06f8bc2c26c9fbb62320427dd7522e04d10492cec91ab559b2e5dd5067012ff3225695a8337f1cd7db9801f57
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-mapfiles=/usr/share/fonts/util \
      	--with-fontdir=/usr/share/fonts/misc
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Install the license file (LicenseRef-font-daewoo-misc)
    runs: |
      for f in COPYING LICENSE LICENCE; do
        [ -f "$f" ] && install -Dm644 "$f" -t "${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      done; true
update:
  enabled: true
  release-monitor:
    identifier: 17192
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
