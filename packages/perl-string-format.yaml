package:
  name: perl-string-format
  version: '1.18'
  epoch: 0
  description: Module for flexible printf-like string formatting
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/S/SR/SREZIC/String-Format-${{package.version}}.tar.gz
      expected-sha256: 9e417a8f8d9ea623beea2d13a47c0d5a696fc8602c0509b826cd45f97b76e778
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/perl-string-format
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 6004
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-string-format/COPYING
    - name: Load the module
      runs: |
        perl -MString::Format -e1
