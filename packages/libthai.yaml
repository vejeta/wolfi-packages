# Debian packaging: https://salsa.debian.org/debian/libthai
#
# Conversion notes:
# - udeb package(s) left out: libthai0-udeb, libthai-data-udeb
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/libt/libthai/libthai_0.1.30.orig.tar.xz), which disappears from the pool when Debian updates
# - runtime dependency 'libjs-jquery': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libthai
  version: '0.1.30'
  epoch: 0
  description: Thai language support library
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - libthai-data
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libdatrie-dev  # Wolfi Community Packages
      - libdatrie1-bin  # Wolfi Community Packages
      - pkgconf-dev  # Debian: pkgconf
      - doxygen
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/libt/libthai/libthai_${{package.version}}.orig.tar.xz
      expected-sha256: ddba8b53dfe584c3253766030218a88825488a51a7deef041d096e715af64bdd
  - uses: autoconf/configure
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) -C src
      make -j$(nproc) -C data
      make -j$(nproc) -C doc
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make -C include install DESTDIR=${{targets.destdir}}/
      make -C src     install DESTDIR=${{targets.destdir}}/
      make install-am DESTDIR=${{targets.destdir}}/
      make -C data install DESTDIR=${{targets.destdir}}/
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libthai
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libthai-dev
    description: Development files for Thai language support library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include"
          mv "${{targets.destdir}}"/usr/include/* "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/lib*.a "${{targets.contextdir}}/usr/lib/"
          mv "${{targets.destdir}}"/usr/lib/lib*.so "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/lib/pkgconfig"
          mv "${{targets.destdir}}"/usr/lib/pkgconfig/* "${{targets.contextdir}}/usr/lib/pkgconfig/"
    dependencies:
      runtime:
        - libdatrie-dev  # Wolfi Community Packages
        - pkgconf-dev  # Debian: pkgconf
        - libthai
  - name: libthai-data
    description: Data files for Thai language support library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/libthai"
          mv "${{targets.destdir}}"/usr/share/libthai/* "${{targets.contextdir}}/usr/share/libthai/"
  - name: libthai-doc
    description: Documentation files for Thai language support library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libthai0/html"
          ln -sf /usr/share/javascript/jquery/jquery.js "${{targets.contextdir}}/usr/share/doc/libthai0/html/jquery.js"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libthai-doc"
          cp -a doc/html/ "${{targets.contextdir}}/usr/share/doc/libthai-doc/"
update:
  enabled: true
  release-monitor:
    identifier: 1737
test:
  environment:
    contents:
      packages:
        - busybox
        - build-base  # Debian: build-essential
        - libthai-dev
        - pkgconf-dev  # Debian: pkgconf
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libthai/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/libt/libthai/libthai_${{package.version}}.orig.tar.xz
        expected-sha256: ddba8b53dfe584c3253766030218a88825488a51a7deef041d096e715af64bdd
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc perl-base=perl pkgconf=pkgconf-dev' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libthai0.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libthai0.templates" && break
        done
    - name: 'autopkgtest: build'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        # autopkgtest check: Build and run a program against libthai, to verify that
        # the headers and pkg-config file are installed correctly

        set -e

        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" 0 INT QUIT ABRT PIPE TERM
        cd $WORKDIR

        if [ -n "${DEB_HOST_GNU_TYPE:-}" ]; then
            CROSS_COMPILE="$DEB_HOST_GNU_TYPE-"
        else
            CROSS_COMPILE=
        fi

        cat <<EOF > libthaitest.c
        #include <thai/tis.h>
        #include <thai/thinp.h>
        #include <assert.h>

        int main (int argc, char *argv[])
        {
          assert (th_isaccept (TIS_KO_KAI, TIS_SARA_AA, ISC_STRICT));
          return 0;
        }
        EOF

        ${CROSS_COMPILE}gcc -o libthaitest libthaitest.c $(${CROSS_COMPILE}pkg-config --cflags --libs libthai)
        echo "build: OK"
        [ -x libthaitest ]
        ./libthaitest
        echo "run: OK"
