# Generated by debian-to-melange 0.1.0 from Debian source package
# tyxml 4.6.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/tyxml
# Debian packaging: https://salsa.debian.org/ocaml-team/tyxml
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libtyxml-ocaml-dev
  version: '4.6.0'
  epoch: 0
  description: Typed XML in OCaml (development files)
  copyright:
    - license: LGPL-2.1+-exc
  dependencies:
    runtime:
      - libtyxml-ocaml  # Debian: ${ocaml:Depends}
      - ocaml-findlib-compat  # Debian: ${ocaml:Depends}
      - libuutf-ocaml-dev  # Debian: ${ocaml:Depends}
      - libre-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - libuutf-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/tyxml
      tag: ${{package.version}}
      expected-commit: d2916535536f2134bad7793a598ba5b7327cae41
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p tyxml -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" tyxml
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libtyxml-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/tyxml/* "${{targets.destdir}}/usr/share/doc/libtyxml-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/tyxml" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libtyxml-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libtyxml-ocaml
    description: Typed XML in OCaml (plugins)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/tyxml"
          mv "${{targets.destdir}}/usr/lib/ocaml/tyxml/META" "${{targets.contextdir}}/usr/lib/ocaml/tyxml/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/tyxml/*.cma "${{targets.contextdir}}/usr/lib/ocaml/tyxml/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/tyxml/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/tyxml/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/tyxml/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/tyxml/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
  - name: libtyxml-ocaml-doc
    description: Typed XML in OCaml (documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc"
          ln -sf /usr/share/doc/libtyxml-ocaml-dev/api "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/api"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/examples"
          cp -a examples/* "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/examples/"
update:
  enabled: true
  github:
    identifier: ocsigen/tyxml
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libtyxml-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
