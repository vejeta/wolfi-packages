package:
  name: libcsexp-ocaml-dev
  version: '1.5.2'
  epoch: 0
  description: Parsing and printing of S-expressions in Canonical form (dev)
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-dune/csexp
      tag: ${{package.version}}
      expected-commit: e6c4768e10c61bcb04d09748744dad55602149c6
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcsexp-ocaml-dev"
      cp -a usr/doc/csexp/* "${{targets.destdir}}/usr/share/doc/libcsexp-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-csexp
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcsexp-ocaml
    description: Parsing and printing of S-expressions in Canonical form (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libcsexp-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: ocaml-dune/csexp
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-csexp/LICENSE.md
    - uses: test/tw/ldd-check
