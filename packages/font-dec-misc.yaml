package:
  name: font-dec-misc
  version: '1.0.4'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: HPND-sell-variant
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-dec-misc-${{package.version}}.tar.xz
      expected-sha512: bf6c0e4924835346f1f7913a04fa3903a7c55d292317526dd8eaa799dfb3b52eb2157c34692d659b41a18123af8389785dcb4aa0c31fc387cb368642801c3335
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-mapfiles=/usr/share/fonts/util \
      	--with-fontdir=/usr/share/fonts/misc
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: true
