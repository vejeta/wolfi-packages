environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - dpkg-dev
      - util-linux-misc  # Debian: bsdextrautils
      - gettext
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in ucf.conf; do mv ucf/$f .recipe-files/; done
      rmdir ucf 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/u/ucf/ucf_${{package.version}}.tar.xz
      expected-sha256: 872a87e72f8b3133ac8897a708e9533bc27df92586c3731d57ef4f4cdd50a07c
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a ucf "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/etc"
      cp -a ucf.conf "${{targets.destdir}}/etc/"
      mkdir -p "${{targets.destdir}}/usr/share/ucf"
      cp -a ucf_library.sh "${{targets.destdir}}/usr/share/ucf/"
      cp -a ucf_helper_functions.sh "${{targets.destdir}}/usr/share/ucf/"
      cp -a ucfq "${{targets.destdir}}/usr/bin/"
      cp -a ucfr "${{targets.destdir}}/usr/bin/"
      install -Dm644 man/ucf.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 man/ucf.conf.5 -t "${{targets.destdir}}/usr/share/man/man5"
      install -Dm644 man/ucf_helper_functions.sh.5 -t "${{targets.destdir}}/usr/share/man/man5"
      install -Dm644 man/ucfq.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 man/ucfr.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/var/lib/ucf"
      mkdir -p "${{targets.destdir}}/usr/share/doc/ucf"
      cp -a examples "${{targets.destdir}}/usr/share/doc/ucf/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/ucf
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
      install -Dm644 .recipe-files/ucf.conf "${{targets.destdir}}"/etc/ucf-debconf.conf
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - util-linux-misc  # Debian: bsdextrautils
        - debconf  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        ucf --version || (ucf --help 2>&1 || true) | grep -qi -e usage -e ucf
        ucfq --version || (ucfq --help 2>&1 || true) | grep -qi -e usage -e ucfq
        ucfr --version || (ucfr --help 2>&1 || true) | grep -qi -e usage -e ucfr
        test -f /usr/share/licenses/ucf/COPYING
        test -f /etc/ucf-debconf.conf
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/u/ucf/ucf_${{package.version}}.tar.xz
        expected-sha256: 872a87e72f8b3133ac8897a708e9533bc27df92586c3731d57ef4f4cdd50a07c
    - name: 'autopkgtest: UCF_TEST_BINDIR= UCF_TEST_LIBDIR=/usr/share/ucf ./t/run_root'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        UCF_TEST_BINDIR= UCF_TEST_LIBDIR=/usr/share/ucf ./t/run_rootless
