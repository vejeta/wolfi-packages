#
# Conversion notes:
# - build dependency 'menhir' (Debian 'menhir') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libopam-file-format-ocaml-dev
  version: '2.2.0'
  epoch: 0
  description: Parser and printer for the opam file syntax
  copyright:
    - license: LGPL-2.1-only WITH linking exception
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): opam, ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): menhir is not in Wolfi (Debian: menhir); left out
      - ocaml-dune
      - ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/opam-file-format
      tag: ${{package.version}}
      expected-commit: 59d9a6b585ac3fd141004f155a459e78f39993ac
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libopam-file-format-ocaml-dev"
      cp -a usr/doc/*/* "${{targets.destdir}}/usr/share/doc/libopam-file-format-ocaml-dev/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/opam-file-format
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml/opam-file-format
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/opam-file-format/LICENSE
    - uses: test/tw/ldd-check
