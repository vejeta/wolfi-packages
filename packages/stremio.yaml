#
# Generated by debian-to-melange 0.1.0 from Debian source package
# stremio 1.2.0+ds-1 (https://tracker.debian.org/pkg/stremio), then adapted:
# - Rust crates come from crates.io, pinned by upstream's Cargo.lock (the
#   Wolfi way), so Debian's patches that align crate versions with Debian's
#   librust-* packages (0001, 0002) are not used.
# - data/server.js (not free software) is removed, as in Debian's +ds
#   tarball; stremio-server-installer downloads it at install time.
# - The GSettings schema is compiled into a private directory that the
#   wrapper adds to GSETTINGS_SCHEMA_DIR, so no shared gschemas.compiled is
#   shipped.
# The Qt5-based Stremio shell 4.x is packaged as stremio-qt5.
package:
  name: stremio
  version: '1.2.0'
  epoch: 0
  description: Modern media center (GTK4/WebKitGTK client)
  copyright:
    - license: GPL-3.0-only
    - license: MIT
      paths:
        - data/com.stremio.Stremio.metainfo.xml
  dependencies:
    runtime:
      - glib-networking  # TLS for libsoup/WebKitGTK
      - gtk-4-compiled-gschemas
      - nodejs
      - stremio-server-installer

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - rust  # Debian: cargo
      - pkgconf-dev  # Debian: pkgconf
      - gtk-4-dev  # Debian: libgtk-4-dev
      - libadwaita-dev  # Wolfi Community Packages (Debian: libadwaita-1-dev)
      - webkitgtk-6.0-dev  # Wolfi Community Packages (Debian: libwebkitgtk-6.0-dev)
      - mpv-dev  # Wolfi Community Packages (Debian: libmpv-dev)
      - libepoxy-dev
      - mesa-dev  # Debian: libegl-dev
      - gettext
      - glib  # Debian: libglib2.0-bin (glib-compile-schemas, used by build.rs)
  environment:
    RUSTFLAGS: --remap-path-prefix=/home/build=.
    # build.rs compiles the GSettings schema into $XDG_DATA_HOME
    XDG_DATA_HOME: /home/build/.xdg-data

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Stremio/stremio-linux-shell
      tag: v${{package.version}}
      expected-commit: c6e7cd22e23ed6401e573fe7fe1a023fc07399a2

  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf data/server.js

  - uses: patch
    with:
      patches: stremio/0003-add-man-page.patch stremio/0004-fix-window-state-typo.patch

  - name: Build
    runs: |
      cargo auditable build --release --locked

  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      install -D -m755 target/release/stremio-linux-shell ${{targets.destdir}}/usr/libexec/stremio/stremio-bin
      install -D -m755 stremio/stremio-wrapper ${{targets.destdir}}/usr/bin/stremio

  - name: Install files
    runs: |
      install -Dm644 data/com.stremio.Stremio.desktop -t "${{targets.destdir}}/usr/share/applications"
      install -Dm644 data/com.stremio.Stremio.metainfo.xml -t "${{targets.destdir}}/usr/share/metainfo"
      install -Dm644 data/icons/com.stremio.Stremio.svg -t "${{targets.destdir}}/usr/share/icons/hicolor/scalable/apps"
      install -Dm644 data/stremio.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 stremio/copyright "${{targets.destdir}}"/usr/share/doc/stremio/copyright
      # Private, precompiled GSettings schema (see the wrapper)
      install -Dm644 data/com.stremio.Stremio.gschema.xml -t "${{targets.destdir}}/usr/share/stremio/schemas"
      glib-compile-schemas "${{targets.destdir}}/usr/share/stremio/schemas"

  - uses: strip

subpackages:
  - name: stremio-doc
    description: Modern media center (GTK4/WebKitGTK client) (documentation)
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: Stremio/stremio-linux-shell
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - name: Files are installed
      runs: |
        test -x /usr/bin/stremio
        test -x /usr/libexec/stremio/stremio-bin
        test -f /usr/share/applications/com.stremio.Stremio.desktop
        test -f /usr/share/stremio/schemas/gschemas.compiled
        grep -q "GSETTINGS_SCHEMA_DIR" /usr/bin/stremio
    - uses: test/tw/ldd-check
      with:
        files: /usr/libexec/stremio/stremio-bin
