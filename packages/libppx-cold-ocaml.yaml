# Generated by debian-to-melange 0.1.0 from Debian source package
# ppx-cold 0.17.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ppx-cold
# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-cold
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-cold-ocaml
  version: '0.17.0'
  epoch: 0
  description: Provide the @cold annotation for OCaml (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_cold
      tag: v${{package.version}}
      expected-commit: 150c14534f8bdafdda98f55f08ce414ec29d05d3
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_cold -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_cold
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-cold-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-cold-ocaml-dev
    description: Provide the @cold annotation for OCaml (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*opam*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*dune*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_cold/ppx.exe" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.cmi; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.cmt*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.ml; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.mli; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.a; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.cmx; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_cold/*.cmxa; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_cold/"
          done
          true
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-cold-ocaml-dev"
          mv "${{targets.destdir}}"/usr/doc/ppx_cold/* "${{targets.contextdir}}/usr/share/doc/libppx-cold-ocaml-dev/"
          rmdir "${{targets.destdir}}/usr/doc/ppx_cold" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libppx-cold-ocaml  # Debian: ${ocaml:Depends}
        - libbase-ocaml-dev  # Debian: ${ocaml:Depends}
        - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: janestreet/ppx_cold
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-cold-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
