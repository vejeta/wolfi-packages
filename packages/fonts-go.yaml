# Debian packaging: https://salsa.debian.org/fonts-team/fonts-go
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-go/fonts-go_0~20170330.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-go
  version: '0~20170330'
  epoch: 0
  description: High-quality WGL4 TrueType fonts for Go project
  copyright:
    - license: BSD-3-Clause
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-go/$f .recipe-files/; done
      rmdir fonts-go 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-go/fonts-go_${{package.version}}.orig.tar.xz
      expected-sha256: cc0bff4d503ccfa96b465e9a62847161ad46b1150463c361a5b95fc14c7e12cd
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-go/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-go/copyright
