package:
  name: perl-latex-tounicode
  version: '1.95'
  epoch: 0
  description: Convert LaTeX commands to Unicode
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
      - help2man
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/B/BO/BORISV/LaTeX-ToUnicode-${{package.version}}.tar.gz
      expected-sha256: 6e75c41b5c3260761231156fd9b5f256134bc0e1f03ee0a44e445f10576aecc7
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 ltx2unitxt.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-latex-tounicode
  - name: From debian/rules execute_before_dh_installman
    runs: |
      make -f Makefile.TDS ltx2unitxt.1
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 12089
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-latex-tounicode/LICENSE
    - name: Load the module
      runs: |
        perl -MLaTeX::ToUnicode -e1
