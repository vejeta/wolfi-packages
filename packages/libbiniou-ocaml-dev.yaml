# biniou 1.2.2-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/biniou
# Debian packaging: https://salsa.debian.org/ocaml-team/biniou
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libbiniou-ocaml-dev
  version: '1.2.2'
  epoch: 0
  description: Flexible binary data format in OCaml - development files
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - libbiniou-ocaml  # Debian: ${ocaml:Depends}
      - libcamlp-streams-ocaml-dev  # Debian: ${ocaml:Depends}
      - libeasy-format-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libcamlp-streams-ocaml-dev  # Wolfi Community Packages
      - libeasy-format-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in bdump.1; do mv libbiniou-ocaml-dev/$f .recipe-files/; done
      rmdir libbiniou-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-community/biniou
      tag: ${{package.version}}
      expected-commit: b434dd9ad488e042cf71554af7296b7bd98c9a6a
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p biniou -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" biniou
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/bdump.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbiniou-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/biniou/* "${{targets.destdir}}/usr/share/doc/libbiniou-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/biniou" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libbiniou-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libbiniou-ocaml
    description: Flexible binary data format in OCaml - plugins
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/biniou"
          mv "${{targets.destdir}}/usr/lib/ocaml/biniou/META" "${{targets.contextdir}}/usr/lib/ocaml/biniou/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/biniou/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/biniou/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/biniou/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/biniou/"
          done
          true
update:
  enabled: true
  github:
    identifier: ocaml-community/biniou
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        bdump --version || (bdump --help 2>&1 || true) | grep -qi -e usage -e bdump
        test -f /usr/share/licenses/libbiniou-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
