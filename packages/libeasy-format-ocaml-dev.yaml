#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libeasy-format-ocaml-dev
  version: '1.3.4'
  epoch: 0
  description: Easy(ier) pretty printing for OCaml - development files
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - libeasy-format-ocaml  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Use-dune-2.9.patch; do mv libeasy-format-ocaml-dev/$f .recipe-files/; done
      rmdir libeasy-format-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-community/easy-format
      tag: ${{package.version}}
      expected-commit: ba4962884509ceec63905dd6e0ccb429be4f9f66
  - uses: patch
    with:
      patches: .recipe-files/0001-Use-dune-2.9.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p easy-format -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" easy-format
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libeasy-format-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libeasy-format-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libeasy-format-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/easy-format/* "${{targets.destdir}}/usr/share/doc/libeasy-format-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/easy-format" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libeasy-format-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libeasy-format-ocaml
    description: Easy(ier) pretty printing for OCaml - plugins
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/easy-format"
          mv "${{targets.destdir}}/usr/lib/ocaml/easy-format/META" "${{targets.contextdir}}/usr/lib/ocaml/easy-format/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/easy-format/*.cma "${{targets.contextdir}}/usr/lib/ocaml/easy-format/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/easy-format/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/easy-format/"
update:
  enabled: true
  github:
    identifier: ocaml-community/easy-format
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libeasy-format-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
