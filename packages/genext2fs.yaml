package:
  name: genext2fs
  version: '1.6.3'
  epoch: 0
  description: Generate ext2 filesystems as a normal user
  copyright:
    - license: GPL-2.0-only
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - autoconf
      - automake
      - libarchive-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv genext2fs/* .recipe-files/
      rmdir genext2fs
  - uses: git-checkout
    with:
      repository: https://github.com/bestouff/genext2fs
      tag: v${{package.version}}
      expected-commit: 15b90801015983cd31e149bc1c2f945722d38e9a
  - uses: patch
    with:
      patches: .recipe-files/fix-tests.patch
  - name: Prepare
    runs: |
      ./autogen.sh
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--localstatedir=/var \
      	--enable-libarchive
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: genext2fs-doc
    description: Generate ext2 filesystems as a normal user (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: bestouff/genext2fs
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
