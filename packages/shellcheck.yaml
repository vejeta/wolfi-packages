# https://gitlab.alpinelinux.org/alpine/aports/-/tree/master/community/shellcheck
# Upstream: https://github.com/koalaman/shellcheck
#
# Conversion notes:
# - options=net: the build needs network access
# - check() not run (pass --with-check to add it to the build)
package:
  name: shellcheck
  version: '0.11.0'
  epoch: 0
  description: A static analysis tool for shell scripts
  copyright:
    - license: GPL-3.0-or-later
  target-architecture:
    - aarch64
    - x86_64
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - cabal-install-bootstrap  # Alpine: cabal
      - ghc-bootstrap  # Alpine: ghc
      - libffi-dev
      - pandoc-cli  # Alpine: pandoc
      - curl  # cabal's https transport
  environment:
    CABAL_CONFIG: /home/build/.cabal-config
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv shellcheck/* .recipe-files/
      rmdir shellcheck
  - name: cabal configuration
    runs: |
      cat > /home/build/.cabal-config <<'EOF'
      http-transport: curl
      repository hackage.haskell.org
        url: https://hackage.haskell.org/
      EOF
  - uses: git-checkout
    with:
      repository: https://github.com/koalaman/shellcheck
      tag: v${{package.version}}
      expected-commit: aac0823e6b58f8a499e856e93738082691cbf212
  - name: Prepare
    runs: |
      pkgname="${{package.name}}"
      pkgver="${{package.version}}"
      srcdir="/home/build/_srcdir"
      builddir="/home/build"
      startdir="/home/build"
      _cabal_home="$srcdir/dist"
      cabal_update() {
      	msg "Freezing $pkgname dependencies"

      	# Resolve deps and generate fresh cabal.config with version constraints.
      	HOME="$_cabal_home" cabal update
      	(
      		cd "$builddir"
      		HOME="$_cabal_home" cabal v1-freeze --shadow-installed-packages

      		# Add version tag at the first line.
      		sed -i "1i--$pkgver" "cabal.config"

      		mv "cabal.config" "$startdir/"
      	)

      	if ! abuild checksum; then
      		die "Failed to update checksum, run 'abuild checksum' manually"
      	fi
      }
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/shellcheck-0.11.0" ] || ln -s /home/build "/home/build/_srcdir/shellcheck-0.11.0"
      cp -a /home/build/.recipe-files/cabal.config "$srcdir"/

      ./striptests

      if [ "$(head -n 1 "$srcdir/cabal.config")" != "--$pkgver" ]; then
      	die "Requirements file is outdated, run 'abuild cabal_update'"
      fi

      ln -sf "$srcdir/cabal.config" "$builddir/cabal.config"
  - name: Build
    runs: |
      pkgname="${{package.name}}"
      srcdir="/home/build/_srcdir"
      _cabal_home="$srcdir/dist"
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/shellcheck-0.11.0" ] || ln -s /home/build "/home/build/_srcdir/shellcheck-0.11.0"
      cp -a /home/build/.recipe-files/cabal.config "$srcdir"/

      # ghc version path
      export PATH="$PATH:/usr/lib/llvm15/bin"
      HOME="$_cabal_home" cabal update
      HOME="$_cabal_home" cabal v1-install \
      	--disable-documentation \
      	--only-dependencies
      HOME="$_cabal_home" cabal v1-configure \
      	--prefix='/usr' \
      	--bindir='$prefix/bin' \
      	--docdir='$prefix/share/doc' \
      	--datadir='$prefix/share' \
      	--htmldir='$docdir/html' \
      	--libdir='$prefix/lib' \
      	--libsubdir="$pkgname" \
      	--datasubdir="$pkgname" \
      	--dynlibdir="$pkgname" \
      	--sysconfdir='/etc' \
      	--disable-library-profiling \
      	--disable-profiling \
      	--disable-shared \
      	--enable-executable-stripping \
      	--flags='GMP FFI standalone'
      HOME="$_cabal_home" cabal v1-build -j
      ./manpage
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"
      srcdir="/home/build/_srcdir"
      _cabal_home="$srcdir/dist"
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/shellcheck-0.11.0" ] || ln -s /home/build "/home/build/_srcdir/shellcheck-0.11.0"
      cp -a /home/build/.recipe-files/cabal.config "$srcdir"/

      HOME="$_cabal_home" cabal v1-copy --destdir="$pkgdir"

      rm -r "$pkgdir/usr/lib/$pkgname"

      mkdir -p "$pkgdir/usr/share/doc/$pkgname"
      mv "$pkgdir/usr/share/doc/LICENSE" "$pkgdir/usr/share/doc/$pkgname"

      install -Dm644 shellcheck.1 -t "$pkgdir"/usr/share/man/man1/
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: shellcheck-doc
    description: A static analysis tool for shell scripts (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
update:
  enabled: true
  github:
    identifier: koalaman/shellcheck
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
