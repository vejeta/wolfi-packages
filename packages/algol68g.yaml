# algol68g 3.1.2-1.2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/algol68g
#
# Conversion notes:
# - license GPL-3.0-or-later read from the notice in debian/copyright (not DEP-5); check it
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/a/algol68g/algol68g_3.1.2.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: algol68g
  version: '3.1.2'
  epoch: 0
  description: Implementation of Algol 68 as defined by the Revised Report
  copyright:
    - license: GPL-3.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/algol68g/algol68g_${{package.version}}.orig.tar.gz
      expected-sha256: bcac9a5e20ef14c8c693ef418988cb056e76c290fc9d6fa1f6564231dc78261d
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 00-increase-time-limit-on-rv64.patch; do mv algol68g/$f .recipe-files/; done
      rmdir algol68g 2>/dev/null || true
  - uses: patch
    with:
      patches: .recipe-files/00-increase-time-limit-on-rv64.patch
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/algol68g"
      cp -a AUTHORS "${{targets.destdir}}/usr/share/doc/algol68g/"
      cp -a NEWS "${{targets.destdir}}/usr/share/doc/algol68g/"
      cp -a README "${{targets.destdir}}/usr/share/doc/algol68g/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/algol68g
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/algol68g/COPYING
    - uses: test/tw/ldd-check
