# Generated by debian-to-melange 0.1.0 from Debian source package
# comic-neue 2.51-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/comic-neue
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-comic-neue
#
# Conversion notes:
# - build dependency 'sfnt2woff-zopfli' (Debian 'sfnt2woff-zopfli') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - port debian/rules override_dh_auto_build: for otf in $(wildcard instance_otf/*.otf) ;  	do  		sfnt2woff-zopfli $${otf} ;  		woff2_compress $${otf} ;  	done
package:
  name: fonts-comic-neue
  version: '2.51'
  epoch: 0
  description: Less horrible remake of Comic Sans
  copyright:
    - license: SIL-OFL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - fontmake
      # TODO(debian-to-melange): sfnt2woff-zopfli is not in Wolfi (Debian: sfnt2woff-zopfli); left out
      - woff2
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-comic-neue/$f .recipe-files/; done
      rmdir fonts-comic-neue 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/crozynski/comicneue
      tag: ${{package.version}}
      expected-commit: 1fa968608b1f4f7f1775824df3d2081fc93e2e9f
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf __MACOSX OTF *.pdf *.eot *.otf *.ttf *.woff *.woff2
  - uses: patch
    with:
      patches: ''
  # TODO(debian-to-melange): port debian/rules override_dh_auto_build: for otf in $(wildcard instance_otf/*.otf) ;  	do  		sfnt2woff-zopfli $${otf} ;  		woff2_compress $${otf} ;  	done
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/etc/fonts/conf.d"
      ln -sf /usr/share/fontconfig/conf.avail/30-comic-sans.conf "${{targets.destdir}}/etc/fonts/conf.d/30-comic-sans.conf"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-comic-neue/examples"
      cp -a Fonts/WebFonts/font.css "${{targets.destdir}}/usr/share/doc/fonts-comic-neue/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-comic-neue"
      cp -a FONTLOG.txt "${{targets.destdir}}/usr/share/doc/fonts-comic-neue/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-comic-neue/copyright
update:
  enabled: true
  github:
    identifier: crozynski/comicneue
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-comic-neue/copyright
