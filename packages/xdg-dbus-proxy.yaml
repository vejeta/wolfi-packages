package:
  name: xdg-dbus-proxy
  version: '0.1.9'
  epoch: 0
  description: Filtering proxy for D-Bus connections
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    runtime:
      - dbus
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - docbook-xml  # Alpine: docbook-xsl
      - glib-dev
      - libxslt
      - meson
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/flatpak/xdg-dbus-proxy/releases/download/${{package.version}}/xdg-dbus-proxy-${{package.version}}.tar.xz
      expected-sha512: 531b1b80fcf003def0b81ab6191f40c4b1cc01f4b984df05a5fec0eee2fd70183f80d4309e89636a5b317a54654fd34539be29201a17a0ed6e8e72794bf716da
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      abuild_meson . output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: xdg-dbus-proxy-doc
    description: Filtering proxy for D-Bus connections (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: flatpak/xdg-dbus-proxy
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
