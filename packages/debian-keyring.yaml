package:
  name: debian-keyring
  version: '2026.06.27'
  epoch: 0
  description: OpenPGP certificates of Debian Developers and Maintainers
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): gnupg
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - dpkg-dev
      - gnupg
      - gawk
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in changelog.old; do mv debian-keyring/$f .recipe-files/; done
      rmdir debian-keyring 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/debian-keyring/debian-keyring_${{package.version}}.tar.xz
      expected-sha256: 6944faec058f6ef1a7508fef841c267730a0b7467cebcebb5ecd7b2b605b18d7
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}/usr/share/keyrings/debian-keyring.pgp" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/keyrings"
        cp -a output/keyrings/debian-keyring.pgp "${{targets.destdir}}/usr/share/keyrings/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/keyrings/debian-nonupload.pgp" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/keyrings"
        cp -a output/keyrings/debian-nonupload.pgp "${{targets.destdir}}/usr/share/keyrings/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/keyrings/debian-maintainers.pgp" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/keyrings"
        cp -a output/keyrings/debian-maintainers.pgp "${{targets.destdir}}/usr/share/keyrings/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/keyrings/debian-role-keys.pgp" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/keyrings"
        cp -a output/keyrings/debian-role-keys.pgp "${{targets.destdir}}/usr/share/keyrings/"
      fi
      mkdir -p "${{targets.destdir}}/usr/share/keyrings"
      ln -sf /usr/share/keyrings/debian-keyring.pgp "${{targets.destdir}}/usr/share/keyrings/debian-keyring.gpg"
      ln -sf /usr/share/keyrings/debian-nonupload.pgp "${{targets.destdir}}/usr/share/keyrings/debian-nonupload.gpg"
      ln -sf /usr/share/keyrings/debian-maintainers.pgp "${{targets.destdir}}/usr/share/keyrings/debian-maintainers.gpg"
      ln -sf /usr/share/keyrings/debian-role-keys.pgp "${{targets.destdir}}/usr/share/keyrings/debian-role-keys.gpg"
      mkdir -p "${{targets.destdir}}/usr/share/doc/debian-keyring"
      cp -a README "${{targets.destdir}}/usr/share/doc/debian-keyring/"
      cp -a .recipe-files/changelog.old "${{targets.destdir}}/usr/share/doc/debian-keyring/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/debian-keyring
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/debian-keyring/LICENSE
