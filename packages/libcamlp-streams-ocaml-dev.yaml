# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libcamlp-streams-ocaml-dev
  version: '5.0.1'
  epoch: 0
  description: Stream and Genlex libraries for use with Camlp4 and Camlp5 (dev files)
  copyright:
    - license: LGPL-2.1-OCaml
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/camlp-streams
      tag: v${{package.version}}
      expected-commit: 567fa15f32192a6a7cd12e6c9e804fec43460126
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p camlp-streams -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" camlp-streams
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcamlp-streams-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/*/* "${{targets.destdir}}/usr/share/doc/libcamlp-streams-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/*" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libcamlp-streams-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcamlp-streams-ocaml
    description: Stream and Genlex libraries for use with Camlp4 and Camlp5 (runtime files)
    pipeline:
      - runs: |
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/META; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: ocaml/camlp-streams
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcamlp-streams-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
