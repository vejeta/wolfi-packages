# Debian packaging: https://salsa.debian.org/python-team/packages/python-distutils-extra
#
# Conversion notes:
# - Debian-native package: source from the Debian archive
# - autopkgtests converted to the test pipeline (1 steps)
# - Wolfi Python layout: py3.X-distutils-extra for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-distutils-extra
  version: '3.5'
  epoch: 0
  description: Enhancements to the Python3 build system
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    provider-priority: 0
vars:
  pypi-package: distutils-extra
  import: distutils_extra
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - perl
      - dpkg-dev
      - gobject-introspection  # Debian: gir1.2-glib-2.0
      - intltool
      - py3-supported-pyflakes  # Wolfi Community Packages (Debian: pyflakes3)
      - py3-supported-gobject3  # Debian: python3-gi
      - py3-supported-httplib2  # Debian: python3-httplib2
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/python-distutils-extra/python-distutils-extra_${{package.version}}.tar.xz
      expected-sha256: 0ca718b79d056c5031c82fbd0f201617f7dd6472a2955f22e8cfceb42737aaea
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-distutils-extra"
      cp -a doc/* "${{targets.destdir}}/usr/share/doc/py3-distutils-extra/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-setuptools
        - intltool
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-distutils-extra
        - py3-supported-gobject3  # Debian: python3-gi
        - py3-supported-httplib2  # Debian: python3-httplib2
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - py3-supported-distutils-extra
  pipeline:
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/p/python-distutils-extra/python-distutils-extra_${{package.version}}.tar.xz
        expected-sha256: 0ca718b79d056c5031c82fbd0f201617f7dd6472a2955f22e8cfceb42737aaea
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-distutils-extra=py3-distutils-extra python3-gi=py3-supported-gobject3 python3-httplib2=py3-supported-httplib2' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-distutils-extra.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-distutils-extra.templates" && break
        done
    - name: 'autopkgtest: cd test; python3 ./auto.py -v'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        cd test; python3 ./auto.py -v
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
