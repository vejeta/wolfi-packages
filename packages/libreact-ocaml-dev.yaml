#
# Conversion notes:
# - upstream tarball from debian/watch
# - dh --with ocaml has no direct melange equivalent; review
# - port debian/rules override_dh_auto_install: opam-installer --prefix=$(DESTDIR) --libdir=.$(OCAML_STDLIB_DIR) react.install && rm -f $(DESTDIR)/doc/react/LICENSE.md
package:
  name: libreact-ocaml-dev
  version: '1.2.2'
  epoch: 0
  description: Functional reactive programming in OCaml
  copyright:
    - license: ISC
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://erratique.ch/software/react/releases/react-${{package.version}}.tbz
      expected-sha256: c4add315d6f1f153d115ee7ca8dd60c1265ff4d408c266125fcb5124fd228f99
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: opam-installer --prefix=$(DESTDIR) --libdir=.$(OCAML_STDLIB_DIR) react.install && rm -f $(DESTDIR)/doc/react/LICENSE.md
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/ocaml/react"
      cp -a usr/lib/ocaml/react/opam "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.ml* "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.cmi "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.cmt* "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.cmx "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.cmxa "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react.a "${{targets.destdir}}/usr/lib/ocaml/react/"
      cp -a usr/lib/ocaml/react/react_top* "${{targets.destdir}}/usr/lib/ocaml/react/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libreact-ocaml-dev"
      cp -a doc/react/* "${{targets.destdir}}/usr/share/doc/libreact-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libreact-ocaml-dev
subpackages:
  - name: libreact-ocaml
    description: Functional reactive programming in OCaml (plugins)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/react"
          cp -a usr/lib/ocaml/react/META "${{targets.contextdir}}/usr/lib/ocaml/react/"
          cp -a usr/lib/ocaml/react/react.cma "${{targets.contextdir}}/usr/lib/ocaml/react/"
          cp -a usr/lib/ocaml/react/react.cmxs "${{targets.contextdir}}/usr/lib/ocaml/react/"
update:
  enabled: true
  release-monitor:
    identifier: 7261
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libreact-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
