# Generated by debian-to-melange 0.1.0 from Debian source package
# react 1.2.2-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/react
# Debian packaging: https://salsa.debian.org/ocaml-team/react
#
# Conversion notes:
# - upstream tarball from debian/watch
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libreact-ocaml-dev
  version: '1.2.2'
  epoch: 0
  description: Functional reactive programming in OCaml
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libreact-ocaml  # Debian: ${ocaml:Depends}
      - libtopkg-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - build-base  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://erratique.ch/software/react/releases/react-${{package.version}}.tbz
      expected-sha256: c4add315d6f1f153d115ee7ca8dd60c1265ff4d408c266125fcb5124fd228f99
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      opam-installer --prefix=${{targets.destdir}}/ --libdir=./usr/lib/ocaml react.install
      rm -f ${{targets.destdir}}/doc/react/LICENSE.md
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libreact-ocaml-dev"
      cp -a doc/react/* "${{targets.destdir}}/usr/share/doc/libreact-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libreact-ocaml-dev
subpackages:
  - name: libreact-ocaml
    description: Functional reactive programming in OCaml (plugins)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/react"
          mv "${{targets.destdir}}/usr/lib/ocaml/react/META" "${{targets.contextdir}}/usr/lib/ocaml/react/"
          mv "${{targets.destdir}}/usr/lib/ocaml/react/react.cma" "${{targets.contextdir}}/usr/lib/ocaml/react/"
          mv "${{targets.destdir}}/usr/lib/ocaml/react/react.cmxs" "${{targets.contextdir}}/usr/lib/ocaml/react/"
update:
  enabled: true
  release-monitor:
    identifier: 7261
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libreact-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
