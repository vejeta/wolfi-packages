package:
  name: arch-test
  version: '0.22'
  epoch: 0
  description: Detect architectures supported by your machine/kernel
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): binutils-x86-64-linux-gnu is not in Wolfi (Debian: binutils-x86-64-linux-gnu); left out
      # TODO(debian-to-melange): binutils-aarch64-linux-gnu is not in Wolfi (Debian: binutils-aarch64-linux-gnu); left out
      # TODO(debian-to-melange): binutils-arm-linux-gnueabihf is not in Wolfi (Debian: binutils-arm-linux-gnueabihf); left out
      # TODO(debian-to-melange): binutils-m68k-linux-gnu is not in Wolfi (Debian: binutils-m68k-linux-gnu); left out
      # TODO(debian-to-melange): binutils-powerpc-linux-gnu is not in Wolfi (Debian: binutils-powerpc-linux-gnu); left out
      # TODO(debian-to-melange): binutils-powerpc64le-linux-gnu is not in Wolfi (Debian: binutils-powerpc64le-linux-gnu); left out
