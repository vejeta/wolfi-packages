update:
  enabled: true
  github:
    identifier: c-cube/qcheck
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib
        - ocaml-dune
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-qcheck/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/c-cube/qcheck
        tag: v${{package.version}}
        expected-commit: b8a7d93a54dbe3a1edf6541b3e00cd1850e70f75
        recurse-submodules: true
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-qcheck/ocaml-qcheck_0.91-2.debian.tar.xz
        strip-components: 0
        expected-sha256: b96a097db534256179bd8d5af6acfbce5bb073e3243d278c00966130d4cf62f8
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libqcheck-ocaml.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libqcheck-ocaml.templates" && break
        done
    - name: 'autopkgtest: test'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        testdir=$(mktemp -d)
        trap "rm -rf ${testdir}" 0 INT QUIT ABRT PIPE TERM

        cp -r "$(dirname "$0")/../../example" "${testdir}/example"
        cp debian/tests/dune-project-examples "${testdir}/example/dune-project"

        cd "${testdir}/example"

        cat <<'EOF' > qcheck-examples.opam
        opam-version: "1.2"
        name: "qcheck-examples"
        version: "0"
        depends: ["qcheck" "oUnit"]
        EOF

        sed -i 's/package qcheck/package qcheck-examples/' dune
        sed -i 's/package qcheck-ounit/package qcheck-examples/' ounit/dune
        rm -rf alcotest

        for test in QCheck_runner_test.exe ounit/QCheck_ounit_test.exe ounit/QCheck_test.exe
        do
        	dune build -p qcheck-examples $test

        	if [ -x "_build/default/$test" ]; then
        		echo "built $test"
        	else
        		echo "$test does not exist"
        		exit 1
        	fi
        done
