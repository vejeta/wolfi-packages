package:
  name: libqcheck-ocaml
  version: '0.91'
  epoch: 0
  description: QuickCheck inspired property-based testing for OCaml (Runtime library)
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocaml-compiler-libs  # Debian: ocaml
      - libalcotest-ocaml-dev  # Wolfi Community Packages
      - libounit-ocaml-dev  # Wolfi Community Packages
      - ocaml-odoc  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in debian-dune; do mv ocaml-qcheck/$f .recipe-files/; done
      rmdir ocaml-qcheck 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/c-cube/qcheck
      tag: v${{package.version}}
      expected-commit: b8a7d93a54dbe3a1edf6541b3e00cd1850e70f75
      recurse-submodules: true
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_deriving_qcheck,qcheck,qcheck-alcotest,qcheck-core,qcheck-ounit -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_deriving_qcheck qcheck qcheck-alcotest qcheck-core qcheck-ounit
  # TODO(debian-to-melange): port debian/rules execute_after_dh_auto_build: dune build -p "$(shell xargs echo < debian/debian-dune | tr ' ' ',')" @doc
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-qcheck
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
