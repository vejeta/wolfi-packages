          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.ml* "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.a "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/qcheck-alcotest/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/qcheck-alcotest/"
