# https://tracker.debian.org/pkg/fonts-gfs-olga
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-gfs-olga
#
# Conversion notes:
# - license MIT read from the notice in debian/copyright (not DEP-5); check it
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-gfs-olga/fonts-gfs-olga_1.1.orig.tar.bz2), which disappears from the pool when Debian updates
package:
  name: fonts-gfs-olga
  version: '1.1'
  epoch: 0
  description: Ancient Greek oblique font revival (companion to GFS Didot)
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-gfs-olga/$f .recipe-files/; done
      rmdir fonts-gfs-olga 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-gfs-olga/fonts-gfs-olga_${{package.version}}.orig.tar.bz2
      expected-sha256: d6a05de967cbac31193596b6e143629461341c3418b66555eeb75dded385bd7a
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/olga"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-gfs-olga"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-gfs-olga/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-gfs-olga/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-gfs-olga/copyright
