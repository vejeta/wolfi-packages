package:
  name: elinks
  version: '0.20.0'
  epoch: 0
  description: Advanced and well-established feature-rich text mode web browser
  copyright:
    - license: GPL-2.0-or-later AND GPL-3.0-or-later AND MIT AND MPL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - bzip2-dev
      - curl-dev
      - expat-dev
      - gettext-dev
      - libgpm-dev  # Alpine: gpm-dev
      - libidn2-dev
      - linux-headers
      - meson  # Alpine: muon
      - openssl-dev
      - python3
      - xmlto
      - zlib-dev
      - bzip2
      - curl
      - expat
      - gettext
      - gpm
      - openssl
      - zlib
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/rkd77/elinks/releases/download/v${{package.version}}/elinks-${{package.version}}.tar.xz
      expected-sha512: a1ad2e94c73f20f7bbed6b47634d7c3b2343bd2e7a13a0563f701711724cae08a4906cc3adc24000742287a1653468ab3edd82db7708d3e5a336889a326dda44
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      LDFLAGS="$LDFLAGS" \
      abuild_meson \
      	-Db_lto=true \
      	-Dgettext=true \
      	-Dhtml-highlight=true \
      	-Dbacktrace=false \
      	-D256-colors=true \
      	-Dtrue-color=true \
      	-Dtre=false \
      	-Dlibcss=false \
      	-Dreproducible=true \
      	-Dsource-date-epoch="$SOURCE_DATE_EPOCH" \
      	output .
      ninja -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: elinks-doc
    description: Advanced and well-established feature-rich text mode web browser (doc)
    pipeline:
      - uses: split/alldocs
  - name: elinks-lang
    description: Advanced and well-established feature-rich text mode web browser (lang)
    pipeline:
      - uses: split/locales
update:
  enabled: true
  github:
    identifier: rkd77/elinks
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
