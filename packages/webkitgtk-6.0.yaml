pipeline:
  - uses: fetch
    with:
      uri: https://webkitgtk.org/releases/webkitgtk-${{package.version}}.tar.xz
      expected-sha512: a685e1642eaa544a1dba2dce0433a5a0eeb84bfa34001e5fe4047464e7e85b1127d05674e8c64cb0312d665531c2875b3de103d60600bb5d742ccff7ef8a9fe8
  - uses: patch
    with:
      patches: webkitgtk-6.0/x11-include-order.patch
  - name: Build
    runs: |
      # clang/lld, as Alpine and Arch do: faster, and smaller debug info.
      export CC=clang
      export CXX=clang++
      export LDFLAGS="$LDFLAGS -fuse-ld=lld"
      export AR=llvm-ar
      export NM=llvm-nm
      export RANLIB=llvm-ranlib
      # No debug info: the build tree would not fit on a CI runner otherwise.
      export CFLAGS="$CFLAGS -g0 -U_FORTIFY_SOURCE"
      export CXXFLAGS="$CXXFLAGS -g0 -U_FORTIFY_SOURCE"

      # Optional features whose dependencies are not in Wolfi are disabled:
      # gamepad (libmanette), speech synthesis (flite), hyphenation (hyphen),
      # sysprof tracing. GObject introspection and the MiniBrowser and
      # WebDriver tools are not built.
      cmake -B build -G Ninja \
      	-DPORT=GTK \
      	-DCMAKE_BUILD_TYPE=Release \
      	-DCMAKE_SKIP_RPATH=ON \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DCMAKE_INSTALL_LIBDIR=lib \
      	-DUSE_GTK4=ON \
      	-DENABLE_DOCUMENTATION=OFF \
      	-DENABLE_INTROSPECTION=OFF \
      	-DENABLE_JOURNALD_LOG=OFF \
      	-DENABLE_MINIBROWSER=OFF \
      	-DENABLE_WEBDRIVER=OFF \
      	-DENABLE_SAMPLING_PROFILER=OFF \
      	-DENABLE_GAMEPAD=OFF \
      	-DENABLE_SPEECH_SYNTHESIS=OFF \
      	-DENABLE_SPELLCHECK=ON \
      	-DUSE_LIBHYPHEN=OFF \
      	-DUSE_LIBBACKTRACE=OFF \
      	-DUSE_SYSPROF_CAPTURE=OFF \
      	-DUSE_SYSTEM_SYSPROF_CAPTURE=OFF
      cmake --build build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" cmake --install build
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
