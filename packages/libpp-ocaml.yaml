# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-pp
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libpp-ocaml
  version: '2.0.0'
  epoch: 0
  description: Pretty printing for OCaml applications (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - libjane-street-headers-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      - libppx-expect-ocaml-dev  # Wolfi Community Packages
      - libppx-hash-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libtime-now-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-dune/pp
      tag: ${{package.version}}
      expected-commit: b6741dd41ef5fc5bda8b3640097ac29818a43577
  - name: Prepare the build system (from debian/rules override_dh_autoreconf)
    runs: |
      if ! test -f pp.opam.bak; then  	  cp pp.opam pp.opam.bak ;  	fi
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p pp -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" pp
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libpp-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libpp-ocaml-dev
    description: Pretty printing for OCaml applications (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/pp"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*opam* "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*dune* "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.ml "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.mli "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.a "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/pp/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/pp/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libpp-ocaml-dev"
          mv "${{targets.destdir}}"/usr/doc/pp/* "${{targets.contextdir}}/usr/share/doc/libpp-ocaml-dev/"
          rmdir "${{targets.destdir}}/usr/doc/pp" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libpp-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: ocaml-dune/pp
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libpp-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
