package:
  name: libantlr4-runtime-dev
  version: '4.10'
  epoch: 0
  description: ANTLR Parser Generator - C++ runtime support (development files)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - libantlr4-runtime4.10
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - libutfcpp-dev  # Wolfi Community Packages
      - pkgconf-dev  # Debian: pkg-config
      - util-linux-dev  # Debian: uuid-dev
      - bash  # the source has bash scripts; Essential in Debian
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in use-system-googletest.patch; do mv libantlr4-runtime-dev/$f .recipe-files/; done
      rmdir libantlr4-runtime-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/antlr4-cpp-runtime/antlr4-cpp-runtime_${{package.version}}+dfsg.orig.tar.xz
      expected-sha256: 42bde857c1644cd1b1ee8ded2e9a97b4cc083ee85181772c06c9292173abf638
      strip-components: 0
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf demo runtime/*.vcxproj runtime/*.vcxproj.filters runtime/antlrcpp-ios runtime/antlrcpp.xcodeproj runtime/thirdparty
  - uses: patch
    with:
      patches: .recipe-files/use-system-googletest.patch
  - uses: cmake/configure
    with:
      opts: -DANTLR_BUILD_CPP_TESTS=OFF -DANTLR4_INSTALL=ON
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/include"
      mkdir -p "${{targets.destdir}}/usr/lib"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libantlr4-runtime-dev"
      cp -a "${{targets.destdir}}/usr/share/doc/libantlr4/README.md" "${{targets.destdir}}/usr/share/doc/libantlr4-runtime-dev/"
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/libantlr4-runtime-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libantlr4-runtime4.10
    description: ANTLR Parser Generator - C++ runtime support (shared library)
    pipeline:
      # TODO(debian-to-melange): no debian/libantlr4-runtime4.10.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
        - libantlr4-runtime4.10  # Debian's @: the binary packages of the source
        - cmake
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - patch  # to apply Debian's patches to the tested source
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libantlr4-runtime-dev/LICENSE.txt
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/a/antlr4-cpp-runtime/antlr4-cpp-runtime_${{package.version}}+dfsg.orig.tar.xz
        expected-sha256: 42bde857c1644cd1b1ee8ded2e9a97b4cc083ee85181772c06c9292173abf638
        strip-components: 0
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/a/antlr4-cpp-runtime/antlr4-cpp-runtime_4.10+dfsg-1.debian.tar.xz
        strip-components: 0
        expected-sha256: 809b015a30062eae81e70227a43ef4c23e9f0e0c2aa103d1a1ad1cee3d74967a
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libantlr4-runtime-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libantlr4-runtime-dev.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'autopkgtest: cmake'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        mkdir -p debian/tests
        cat > "debian/tests/cmake" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/bash
        # Test the usability of CMake definitions in order to prevent regressions.

        cd "$AUTOPKGTEST_TMP"

        cat > CMakeLists.txt <<END
        cmake_minimum_required(VERSION 3.0)
        project(antlr4_runtime_autopkgtest)

        find_package(antlr4-runtime REQUIRED)
        END

        mkdir build && cd build && cmake ..
        AUTOPKGTEST_SCRIPT
        chmod +x "debian/tests/cmake"
        "$PWD/debian/tests/cmake"
