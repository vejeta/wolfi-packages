#
# Conversion notes:
# - Debian-native package: source from the Debian archive
# - dh --with python3,sphinxdoc has no direct melange equivalent; review
# - runtime dependency 'libjs-jquery': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - runtime dependency 'libjs-underscore': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: py3-apt
  version: '3.1.0'
  epoch: 0
  description: Python 3 interface to libapt-pkg
  copyright:
    - license: GPL-2.0-or-later
    - license: Permissive
      paths:
        - tests/test_all.py
        - tests/test_hashes.py
  dependencies:
    runtime:
      - py3-apt-common
      - distro-info-data  # Wolfi Community Packages
      # Debian Recommends (not supported by apk): lsb-release, iso-codes
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - perl
      - dpkg-dev
      - apt  # Wolfi Community Packages
      - apt-utils  # Wolfi Community Packages
      - distro-info-data  # Wolfi Community Packages
      - fakeroot  # Wolfi Community Packages
      - libapt-pkg-dev  # Wolfi Community Packages
      - python3-dev  # Debian: python3-all-dev
      - py3-supported-distutils-extra  # Wolfi Community Packages (Debian: python3-distutils-extra)
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-sphinx-bin  # commands of Debian's python3-sphinx
      - py3-supported-sphinx  # Debian: python3-sphinx
      - gnupg
      - gnupg-dirmngr  # Debian: dirmngr
      - py3-pycodestyle  # Wolfi Community Packages (Debian: pycodestyle)
      - py3-pyflakes  # Wolfi Community Packages (Debian: pyflakes3)
      - coreutils
      - findutils
  environment:
    DATE_CMD: env TZ=UTC LC_ALL=C.UTF-8 date
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv py3-apt/$f .recipe-files/; done
      rmdir py3-apt 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/python-apt/python-apt_${{package.version}}.tar.xz
      expected-sha256: daf46b0ed85061ccee64c3aa3004c695b33047f9f62f0de7863966c287731d5a
  - uses: py/pip-build-install
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      PYTHONPATH=${{targets.destdir}}`python3 -c 'import sysconfig; print(sysconfig.get_path("platlib"))'` sphinx-build doc/source build/sphinx/html
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      mkdir -p ${{targets.outdir}}/py3-apt-common/usr/share/
      mv ${{targets.destdir}}/usr/share/locale ${{targets.outdir}}/py3-apt-common/usr/share/
      mv ${{targets.destdir}}/usr/share/python-apt ${{targets.outdir}}/py3-apt-common/usr/share/
      rmdir ${{targets.destdir}}/usr/share
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/py3-apt/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: py3-apt-doc
    description: Python interface to libapt-pkg (API documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/py3-apt-doc/examples"
          cp -a doc/examples/*.py "${{targets.contextdir}}/usr/share/doc/py3-apt-doc/examples/"
          cp -a doc/source/examples/*.py "${{targets.contextdir}}/usr/share/doc/py3-apt-doc/examples/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/py3-apt-doc"
          cp -a build/sphinx/html/ "${{targets.contextdir}}/usr/share/doc/py3-apt-doc/"
  - name: py3-apt-dev
    description: Python interface to libapt-pkg (development files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include/python-apt"
          mv "${{targets.destdir}}/python/python-apt.h" "${{targets.contextdir}}/usr/include/python-apt/"
          mv "${{targets.destdir}}/python/generic.h" "${{targets.contextdir}}/usr/include/python-apt/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/py3-apt-dev/examples"
          cp -a doc/client-example.cc "${{targets.contextdir}}/usr/share/doc/py3-apt-dev/examples/"
    dependencies:
      runtime:
        - py3-apt
        - libapt-pkg-dev  # Wolfi Community Packages
  - name: py3-apt-common
    description: Python interface to libapt-pkg (locales)
    pipeline:
      - runs: |
          true
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - apt-utils  # Wolfi Community Packages
        - binutils
        - fakeroot  # Wolfi Community Packages
        - intltool
        - py3-pycodestyle  # Wolfi Community Packages (Debian: pycodestyle)
        - py3-pyflakes  # Wolfi Community Packages (Debian: pyflakes3)
        - gnupg
        - distro-info-data  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/doc/py3-apt/copyright
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        imports: import apt
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/p/python-apt/python-apt_${{package.version}}.tar.xz
        expected-sha256: daf46b0ed85061ccee64c3aa3004c695b33047f9f62f0de7863966c287731d5a
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='dirmngr=gnupg-dirmngr libc-bin=glibc libc6=glibc perl-base=perl pycodestyle=py3-pycodestyle pyflakes3=py3-pyflakes python3-all=python3' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-apt.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-apt.templates" && break
        done
    - name: 'autopkgtest: run-tests'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        # from debian/rules
        for python in $(py3versions -s); do
            $python tests/test_all.py -q
        done
