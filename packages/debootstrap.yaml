package:
  name: debootstrap
  version: '1.0.142'
  epoch: 0
  description: Debian/Ubuntu bootstrap scripts
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - debian-archive-keyring
      - dpkg
      - perl
      - gnutar  # Alpine: tar
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - debian-archive-keyring
      - dpkg
      - perl
      - gnutar  # Alpine: tar
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv debootstrap/* .recipe-files/
      rmdir debootstrap
  - uses: fetch
    with:
      uri: https://salsa.debian.org/installer-team/debootstrap/-/archive/${{package.version}}/debootstrap-${{package.version}}.tar.bz2
      expected-sha512: e979fecd3acd2c553869f2f03a7f2452e3c13159047c8eb34d16e683cc9db57bccdfebb9fa2b3e1ed609d86eca72c2b4a8edd7a104999b0302346c66b48e4b3b
  - uses: patch
    with:
      patches: .recipe-files/auto-detect-arch.patch
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      install -Dm644 $pkgname.8 \
      	"$pkgdir"/usr/share/man/man8/$pkgname.8
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: debootstrap-doc
    description: Debian/Ubuntu bootstrap scripts (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 412
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
