        RET="${GPM_DEVICE:-}"
        device="$RET"
        RET="${GPM_RESPONSIVENESS:-}"
        responsiveness="$RET"
        RET="${GPM_REPEAT_TYPE:-ms3}"
        repeat_type="$RET"
        RET="${GPM_SAMPLE_RATE:-}"
        sample_rate="$RET"
        RET="${GPM_TYPE:-}"
        type="$RET"
