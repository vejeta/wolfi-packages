           [ -z "$device" ] || [ "$device" = /dev/mouse ]; then
          return 0
        fi
        if [ -n "$repeat_type" ] && [ "$repeat_type" != "none" ]; then
          ln -s gpmdata /dev/mouse
        else
          ln -s ${device#/dev/} /dev/mouse
