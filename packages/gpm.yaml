environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bison
      - gawk  # Debian: mawk
      - texinfo
      - autoconf
      - automake
      - libtool
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 001_missing_V_option.patch 002_force_repeat_000 005_types_000 007_doc_fix_000 007_doc_fix_001 007_doc_fix_FAQ 010_ps2_rework.patch 013_xterm_mouse_support_000 014_has_mouse_control.patch 031_max_consoles.patch 050_dont_link_libcurses 060_no_blocking_on_mouse_device_under_x 070_struct_ucred 080_cross-compile.patch 090_linux3_versions 091_glibc_2.17_types 092_fix-format-not-a-string-literal-and-no-format-arguments.patch 093_fix-typos.patch 094_gpm-1.20.7-glibc-2.26-1.patch 095_fix-compilation-with-gcc-10.patch 096_fix-compilation-against-musl-libc.patch 097-implicit 098-gcc-15 gpm-microtouch-setup.8 gpm-systemd-wrapper.sh gpm.apm gpm.conf gpm.conf.5 gpm.service; do mv gpm/$f .recipe-files/; done
      rmdir gpm 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://nico.schottelius.org/software/gpm/archives/gpm-${{package.version}}.tar.gz
      expected-sha256: c7e4661c24e05ae13547176b649bac8e3a0db2575f7dd57559f9e0b509f90f49
  - uses: patch
    with:
      patches: .recipe-files/001_missing_V_option.patch .recipe-files/002_force_repeat_000 .recipe-files/005_types_000 .recipe-files/007_doc_fix_000 .recipe-files/007_doc_fix_001 .recipe-files/007_doc_fix_FAQ .recipe-files/010_ps2_rework.patch .recipe-files/013_xterm_mouse_support_000 .recipe-files/014_has_mouse_control.patch .recipe-files/031_max_consoles.patch .recipe-files/050_dont_link_libcurses .recipe-files/060_no_blocking_on_mouse_device_under_x .recipe-files/070_struct_ucred .recipe-files/080_cross-compile.patch .recipe-files/090_linux3_versions .recipe-files/091_glibc_2.17_types .recipe-files/092_fix-format-not-a-string-literal-and-no-format-arguments.patch .recipe-files/093_fix-typos.patch .recipe-files/094_gpm-1.20.7-glibc-2.26-1.patch .recipe-files/095_fix-compilation-with-gcc-10.patch .recipe-files/096_fix-compilation-against-musl-libc.patch .recipe-files/097-implicit .recipe-files/098-gcc-15
  - name: Prepare the build system (from debian/rules override_dh_update_autotools_config)
    runs: |
      ./autogen.sh
  - uses: autoconf/configure
    with:
      opts: --without-curses
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) -C contrib/control
      make -j$(nproc)
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      mkdir -p ${{targets.outdir}}/libgpm2/usr/lib
      mkdir -p ${{targets.outdir}}/libgpm-dev/usr/lib
      ln -s libgpm.so.2 ${{targets.outdir}}/libgpm-dev/usr/lib/libgpm.so
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/gpm"
      cp -a contrib/control/gpm_has_mouse_control "${{targets.destdir}}/usr/lib/gpm/"
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a contrib/scripts/microtouch-setup "${{targets.destdir}}/usr/bin/gpm-microtouch-setup"
      mkdir -p "${{targets.destdir}}/etc/apm/event.d"
      cp -a .recipe-files/gpm.apm "${{targets.destdir}}/etc/apm/event.d/gpm"
      cp -a src/prog/mouse-test "${{targets.destdir}}/usr/bin/gpm-mouse-test"
      cp -a src/gpm "${{targets.destdir}}/usr/bin/"
      cp -a src/prog/mev "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share/gpm"
      cp -a .recipe-files/gpm-systemd-wrapper.sh "${{targets.destdir}}/usr/share/gpm/"
      install -Dm644 .recipe-files/gpm-microtouch-setup.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 .recipe-files/gpm.conf.5 -t "${{targets.destdir}}/usr/share/man/man5"
      install -Dm644 doc/gpm-mouse-test.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 doc/gpm-types.7 -t "${{targets.destdir}}/usr/share/man/man7"
      install -Dm644 doc/gpm.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 doc/mev.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 .recipe-files/gpm.service "${{targets.destdir}}/usr/lib/systemd/system/gpm.service"
      mkdir -p "${{targets.destdir}}/usr/share/doc/gpm/examples"
      cp -a conf/gpm-syn.conf "${{targets.destdir}}/usr/share/doc/gpm/examples/"
      cp -a conf/gpm-twiddler.conf "${{targets.destdir}}/usr/share/doc/gpm/examples/"
      cp -a contrib/emacs/t-mouse.el "${{targets.destdir}}/usr/share/doc/gpm/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/gpm"
      cp -a MANIFEST "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a README "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a README.versions "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a TODO "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a doc/Announce "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a doc/FAQ "${{targets.destdir}}/usr/share/doc/gpm/"
      cp -a doc/README* "${{targets.destdir}}/usr/share/doc/gpm/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/gpm
      install -Dm644 .recipe-files/gpm.conf "${{targets.destdir}}"/etc/gpm.conf
  - uses: strip
subpackages:
  - name: libgpm2
    description: General Purpose Mouse - shared library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          cp -a src/lib/libgpm.so.2.1.0 "${{targets.contextdir}}/usr/lib/libgpm.so.2"
  - name: libgpm-dev
    description: General Purpose Mouse - development files
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include"
          cp -a src/headers/gpm.h "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr/lib"
          cp -a src/lib/libgpm.a "${{targets.contextdir}}/usr/lib/"
    dependencies:
      runtime:
        - glibc-dev  # Debian: libc6-dev
        - libgpm2
update:
  enabled: true
  release-monitor:
    identifier: 1242
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -x /usr/bin/gpm-microtouch-setup
        test -x /usr/bin/gpm-mouse-test
        test -x /usr/bin/gpm
        mev --version || (mev --help 2>&1 || true) | grep -qi -e usage -e mev
        test -f /usr/share/licenses/gpm/COPYING
        test -f /etc/gpm.conf
    - uses: test/tw/ldd-check
