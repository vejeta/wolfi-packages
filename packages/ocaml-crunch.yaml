# ocaml-crunch 4.1.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-crunch
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-crunch
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: ocaml-crunch
  version: '4.1.0'
  epoch: 0
  description: Convert a filesystem into a static OCaml module (tool)
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - libptime-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/ocaml-crunch
      tag: v${{package.version}}
      expected-commit: da3e5dc0fdf5ac960c1b10063d500505e81366a1
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p crunch -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" --etcdir=/etc --datadir=/usr/share/ocaml-dune/data --docdir=/usr/share/ocaml-dune/doc --mandir=/usr/share/ocaml-dune/man crunch
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-crunch
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcrunch-ocaml-dev
    description: Convert a filesystem into a static OCaml module (dev files)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/crunch ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/crunch && find . -type f ! \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/crunch/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/crunch/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/crunch/"$p"
          done; true
          for d in "${{targets.destdir}}"/usr/share/ocaml-dune/*/crunch; do
            [ -d "$d" ] || continue
            r=${d#"${{targets.destdir}}"/}
            mkdir -p "${{targets.contextdir}}"/$(dirname "$r") && mv "$d" "${{targets.contextdir}}"/"$r"
          done
    dependencies:
      runtime:
        - libcrunch-ocaml  # Debian: ${ocaml:Depends}
        - libcmdliner-ocaml-dev  # Debian: ${ocaml:Depends}
        - libptime-ocaml-dev  # Debian: ${ocaml:Depends}
  - name: libcrunch-ocaml
    description: Convert a filesystem into a static OCaml module (runtime files)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/crunch ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/crunch && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/crunch/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/crunch/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/crunch/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/crunch/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
update:
  enabled: true
  github:
    identifier: mirage/ocaml-crunch
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-crunch/LICENSE.md
    - uses: test/tw/ldd-check
