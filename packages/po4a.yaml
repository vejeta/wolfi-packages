package:
  name: po4a
  version: '0.74'
  epoch: 0
  description: Tools for helping translation of documentation
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - diffutils
      - gettext
      - perl
      - perl-pod-parser
      - perl-syntax-keyword-try
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - docbook-xml  # Alpine: docbook-xsl
      - libxml2-utils  # Alpine: docbook-xsl
      - libxslt  # Alpine: docbook-xsl
      - perl-module-build
      - diffutils
      - gettext
      - perl
      - perl-pod-parser
      - perl-syntax-keyword-try
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/mquinson/po4a/releases/download/v${{package.version}}/po4a-${{package.version}}.tar.gz
      expected-sha512: 2156b95a62788694b4c47dc651f7a0571b2e15159d6d8bcee0c6b0538aecd5b81012ae76e15ef333a7662f6b1e59b717f8bbe8137126042ae2cfe614db5b6d66
  - name: Build
    runs: |
      perl Build.PL \
      	--installdirs=vendor \
      	--create_packlist=0
      ./Build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      ./Build install --destdir="$pkgdir"
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: po4a-doc
    description: Tools for helping translation of documentation (doc)
    pipeline:
