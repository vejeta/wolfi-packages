package:
  name: libresult-ocaml-dev
  version: '1.5'
  epoch: 0
  description: Compatibility Result module (dev files)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-findlib
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/result
      tag: ${{package.version}}
      expected-commit: b0b9cd6e9cce8d2b7ad11127a6135540ec3f8a92
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libresult-ocaml-dev"
      cp -a usr/doc/result/* "${{targets.destdir}}/usr/share/doc/libresult-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-result
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libresult-ocaml
    description: Compatibility Result module (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libresult-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/result
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-result/LICENSE.md
    - uses: test/tw/ldd-check
