package:
  name: perl-mail-sendmail
  version: '0.83'
  epoch: 0
  description: Simple platform independent mailer
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-sys-hostname-long
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-sys-hostname-long
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv perl-mail-sendmail/* .recipe-files/
      rmdir perl-mail-sendmail
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/N/NE/NEILB/Mail-Sendmail-${{package.version}}.tar.gz
      expected-sha512: 5c6676e3819ad321720c083cb3df9bfc65a029dcd04415441a78f220d42b9cf50bb7e7b60afb2f79b7d948fbf2093c58e07a603d9a45738fe0968b8cb21667c4
  - uses: patch
    with:
      patches: .recipe-files/test-localhost.patch
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-mail-sendmail-doc
    description: Simple platform independent mailer (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
update:
  enabled: true
  release-monitor:
    identifier: 14191
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
