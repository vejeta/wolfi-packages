package:
  name: sequoia-sqv
  version: '1.5.0'
  epoch: 0
  description: Simple signature verification program
  copyright:
    - license: GPL-2.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - rust  # Alpine: cargo
      - cargo-auditable
      - clang  # Alpine: clang-dev
      - openssl-3.6-dev  # Alpine: openssl-dev; openssl-sys predates OpenSSL 4
      - openssl
pipeline:
  - uses: fetch
    with:
      uri: https://gitlab.com/sequoia-pgp/sequoia-sqv/-/archive/v${{package.version}}/sequoia-sqv-v${{package.version}}.tar.bz2
      expected-sha512: acd9ce91789c91fb2ccf44469f1cb12a4cac70bd9d5aee70b2146794c5c557579658b52507a2815fe2de6a0c4fda9d6575e1e45a08751eeac0332991e1731197
  - name: Prepare
    runs: |
      CTARGET="${{host.triplet.rust}}"

      cargo fetch --target="$CTARGET" --locked
  - name: Build
    runs: |
      cargo auditable build --release --frozen --no-default-features --features crypto-openssl
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      install -Dm755 target/release/sqv -t "$pkgdir"/usr/bin
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 191618
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
