package:
  name: perl-yaml-libyaml
  version: '0.910.0'
  epoch: 0
  description: Perl YAML Serialization using XS and libyaml
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
    provides:
      - perl-yaml-xs=0.910.0-r1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-dev
      - perl
      - file
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/T/TI/TINITA/YAML-LibYAML-v${{package.version}}.tar.gz
      expected-sha512: c25b3b01b8ef9509d4c0797182a1f882992855e65f15cd4c1ef10cbd389cee6569bb300efde588ac42443733656523ef50874991cb60a530b7e24c1b55fc2e14
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: perl-yaml-libyaml-doc
    description: Perl YAML Serialization using XS and libyaml (doc)
    pipeline:
      - uses: split/alldocs
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          file; find "$pkgdir" -name "*.pod" | while read -r file; do
          	amove "${file#"$pkgdir"}"
          done
update:
  enabled: true
  release-monitor:
    identifier: 3548
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
