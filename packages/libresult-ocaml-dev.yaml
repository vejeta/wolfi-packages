# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-result 1.5-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-result
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-result
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libresult-ocaml-dev
  version: '1.5'
  epoch: 0
  description: Compatibility Result module (dev files)
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
      - libresult-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/result
      tag: ${{package.version}}
      expected-commit: b0b9cd6e9cce8d2b7ad11127a6135540ec3f8a92
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p result -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" result
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libresult-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/result/* "${{targets.destdir}}/usr/share/doc/libresult-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/result" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libresult-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libresult-ocaml
    description: Compatibility Result module (runtime files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/result"
          mv "${{targets.destdir}}/usr/lib/ocaml/result/META" "${{targets.contextdir}}/usr/lib/ocaml/result/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/result/*.cma "${{targets.contextdir}}/usr/lib/ocaml/result/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/result/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/result/"
update:
  enabled: true
  github:
    identifier: janestreet/result
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libresult-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
