package:
  name: libre-ocaml-dev
  version: '1.14.0'
  epoch: 0
  description: Regular expression library for OCaml
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-re/ocaml-re_${{package.version}}.orig.tar.gz
      expected-sha256: dcb6f525d17597a265a894c9cf22caa37804118a841918fffa4767572ae172c4
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p re -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" re
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libre-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/re/* "${{targets.destdir}}/usr/share/doc/libre-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/re" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libre-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml/ocaml-re
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - ocaml-dune
        - libounit-ocaml-dev  # Wolfi Community Packages
        - libppx-inline-test-ocaml-dev  # Wolfi Community Packages
        - libppx-expect-ocaml-dev  # Wolfi Community Packages
        - js-of-ocaml  # Wolfi Community Packages
        - nodejs
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libre-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-re/ocaml-re_${{package.version}}.orig.tar.gz
        expected-sha256: dcb6f525d17597a265a894c9cf22caa37804118a841918fffa4767572ae172c4
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-re/ocaml-re_1.14.0-2.debian.tar.xz
        strip-components: 0
        expected-sha256: 400cca1115223fae435952db7e8da8afa187030d63863009e047dd39cc81df10
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libre-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libre-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: tests'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        cat > "$AUTOPKGTEST_TMP/tests" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/bash
        set -e

        outdir=${ADT_ARTIFACTS:-/tmp}/ocaml-re-tests
        mkdir -p ${outdir}

        cp -a lib_test ${outdir}
        cp debian/tests/dune-project ${outdir}/lib_test/
        mkdir -p ${outdir}/lib_test/lib/
        cp lib/*.{ml,mli} ${outdir}/lib_test/lib/
        cd ${outdir}/lib_test
        sed -i '/modes/s/native/byte/g' expect/dune

        echo "* Run tests"
        dune runtest 2>&1
        AUTOPKGTEST_SCRIPT
        chmod +x "$AUTOPKGTEST_TMP/tests"
        "$AUTOPKGTEST_TMP/tests"
