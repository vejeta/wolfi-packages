package:
  name: libre-ocaml-dev
  version: '1.14.0'
  epoch: 0
  description: Regular expression library for OCaml
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-findlib
      - ocaml-dune
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-re/ocaml-re_${{package.version}}.orig.tar.gz
      expected-sha256: dcb6f525d17597a265a894c9cf22caa37804118a841918fffa4767572ae172c4
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libre-ocaml-dev"
      cp -a usr/doc/re/* "${{targets.destdir}}/usr/share/doc/libre-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libre-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml/ocaml-re
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libre-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
    # TODO(debian-to-melange): autopkgtest 'tests' left out; it needs packages that are not in Wolfi
