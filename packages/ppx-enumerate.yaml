#
# Conversion notes:
# - build dependency 'libbase-ocaml-dev' (Debian 'libbase-ocaml-dev') not found in Wolfi; left out
# - build dependency 'libppxlib-jane-ocaml-dev' (Debian 'libppxlib-jane-ocaml-dev') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-enumerate-ocaml
  version: '0.17.0'
  epoch: 0
  description: List all values of a finite type (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): libbase-ocaml-dev is not in Wolfi (Debian: libbase-ocaml-dev); left out
      # TODO(debian-to-melange): libppxlib-jane-ocaml-dev is not in Wolfi (Debian: libppxlib-jane-ocaml-dev); left out
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-dune
      - ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_enumerate
      tag: v${{package.version}}
      expected-commit: 3c5348bdcfba1fcd8471286939adfd03535cf67e
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-enumerate
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-enumerate-ocaml-dev
    description: List all values of a finite type (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-enumerate-ocaml-dev"
          cp -a usr/doc/ppx_enumerate/* "${{targets.contextdir}}/usr/share/doc/libppx-enumerate-ocaml-dev/"
update:
  enabled: true
  github:
    identifier: janestreet/ppx_enumerate
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-enumerate/LICENSE.md
    - uses: test/tw/ldd-check
