package:
  name: perl-cgi-formbuilder
  version: '3.20'
  epoch: 0
  description: Easily generate and process stateful forms
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-cgi
      - perl-html-template
      - perl-text-template
      - perl-template-toolkit
      - perl-cgi-session
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-cgi
      - perl-html-template
      - perl-text-template
      - perl-template-toolkit
      - perl-cgi-session
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/B/BI/BIGPRESH/CGI-FormBuilder-${{package.version}}.tar.gz
      expected-sha512: ecba725d77f36abfdc43074981f884ddcce7d3e72828fdfce08c30450cb6b445f8e04b48257ee576167e6556646256e7a75e873a4c422ae4c19890b17408c9ae
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-cgi-formbuilder-doc
    description: Easily generate and process stateful forms (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          file; find "$pkgdir" -name "*.pod" | while read -r file; do
          	amove "${file#"$pkgdir"}"
          done
update:
  enabled: true
  release-monitor:
    identifier: 5869
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
