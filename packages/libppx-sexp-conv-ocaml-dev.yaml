package:
  name: libppx-sexp-conv-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Generation of S-expressions from type definitions (dev files)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libppx-sexp-conv-ocaml  # Debian: ${ocaml:Depends}
      - libbase-ocaml-dev  # Debian: ${ocaml:Depends}
      - libsexplib0-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-jane-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libsexplib0-ocaml-dev  # Wolfi Community Packages
      - libppxlib-jane-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_sexp_conv
      tag: v${{package.version}}
      expected-commit: 61df807fa9499dd309928c7595a8367525851be3
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_sexp_conv -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_sexp_conv
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-sexp-conv-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ppx_sexp_conv/* "${{targets.destdir}}/usr/share/doc/libppx-sexp-conv-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ppx_sexp_conv" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-sexp-conv-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-sexp-conv-ocaml
    description: Generation of S-expressions from type definitions (runtime files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_sexp_conv"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_sexp_conv/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_sexp_conv/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_sexp_conv/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_sexp_conv/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_sexp_conv/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_sexp_conv/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_sexp_conv/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_sexp_conv/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: janestreet/ppx_sexp_conv
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-sexp-conv-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
