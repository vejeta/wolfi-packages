# https://tracker.debian.org/pkg/python-ttfautohint-py
# Debian packaging: https://salsa.debian.org/python-team/packages/python-ttfautohint-py
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-ttfautohint-py for Python 3.10, 3.11, 3.12, 3.13
package:
  name: py3-ttfautohint-py
  version: '0.6.1'
  epoch: 0
  description: Python wrapper for ttfautohint (Python 3)
  copyright:
    - license: MIT
    - license: OFL-1.1
      paths:
        - 'tests/data/*'
  dependencies:
    provider-priority: 0
vars:
  pypi-package: ttfautohint-py
  import: ttfautohint
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - bash  # the source has bash scripts; Essential in Debian
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/ttfautohint-py
      tag: v${{package.version}}
      expected-commit: 022db623cfbac53926e8e5323d9dc32943bcf414
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - ttfautohint
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: fonttools/ttfautohint-py
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-ttfautohint-py
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
