# utfcpp 4.2.1-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/utfcpp
# Debian packaging: https://salsa.debian.org/debian/utfcpp
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libutfcpp-dev
  version: '4.2.1'
  epoch: 0
  description: 'UTF8-CPP: UTF-8 with C++ - dev'
  copyright:
    - license: BSL-1.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0003-CMakeLists.txt-Prefer-usr-share-cmake-for-cmake-file.patch; do mv libutfcpp-dev/$f .recipe-files/; done
      rmdir libutfcpp-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/nemtrif/utfcpp
      tag: v${{package.version}}
      expected-commit: 3d1ff6dbf54e471c846dff55dda6c8ee10c0ee5c
  - uses: patch
    with:
      patches: .recipe-files/0003-CMakeLists.txt-Prefer-usr-share-cmake-for-cmake-file.patch
  - uses: cmake/configure
    with:
      output-dir: test_bin
  - uses: cmake/build
    with:
      output-dir: test_bin
  - uses: cmake/install
    with:
      output-dir: test_bin
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/include"
      ln -sf /usr/include/utf8cpp/utf8.h "${{targets.destdir}}/usr/include/utf8.h"
      ln -sf /usr/include/utf8cpp/utf8 "${{targets.destdir}}/usr/include/utf8"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libutfcpp-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: libutfcpp-doc
    description: 'UTF8-CPP: UTF-8 with C++ - documentation'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libutfcpp-doc"
          cp -a README.md "${{targets.contextdir}}/usr/share/doc/libutfcpp-doc/"
update:
  enabled: true
  github:
    identifier: nemtrif/utfcpp
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - build-base  # Debian: g++
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - patch  # to apply Debian's patches to the tested source
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libutfcpp-dev/LICENSE
    - uses: git-checkout
      with:
        repository: https://github.com/nemtrif/utfcpp
        tag: v${{package.version}}
        expected-commit: 3d1ff6dbf54e471c846dff55dda6c8ee10c0ee5c
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/u/utfcpp/utfcpp_4.2.1-1.debian.tar.xz
        strip-components: 0
        expected-sha256: 0f282ba8c3a5fd2e47aa7f3549fbbf287a6c8b8a08897ec13823f79a6c063b53
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='g++=build-base libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libutfcpp-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libutfcpp-dev.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'autopkgtest: run-sample'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        cp debian/tests/sample/* $AUTOPKGTEST_TMP
        cd $AUTOPKGTEST_TMP

        g++ -o open_utf8_file open_utf8_file.cpp
        ./open_utf8_file utf8-file.txt
