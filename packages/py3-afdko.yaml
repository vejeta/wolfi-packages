# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: py3-afdko
  version: '4.0.1'
  epoch: 0
  description: Adobe Font Development Kit for OpenType (Python 3)
  copyright:
    - license: Apache-2.0
    - license: BSD-3-Clause-Adobe
      paths:
        - 'python/afdko/resources/*'
    - license: BSD-3-Clause
      paths:
        - cmake/ExternalAntlr4Cpp.cmake
  dependencies:
    runtime:
      - afdko-bin
      - py3-supported-fontpens  # Wolfi Community Packages (Debian: python3-fontpens)
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-scikit-build  # Debian: python3-skbuild
      - libantlr4-runtime-dev  # Wolfi Community Packages
      - libxml2-dev
      - cmake
      - ninja  # Debian: ninja-build
      - antlr4  # Wolfi Community Packages
      - coreutils
      - findutils
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
    FORCE_SYSTEM_LIBXML2: '1'
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in fix-escape-syntax-warning.patch no-external-antlr4.patch remove-cmake-ninja-requirement.patch scripts_afdko scripts_afdko.1 skip-antlr-version-check.patch; do mv py3-afdko/$f .recipe-files/; done
      rmdir py3-afdko 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/adobe-type-tools/afdko
      tag: ${{package.version}}
      expected-commit: 150e6bbcd76ec8f41798c466a4f6beef2fffded7
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf tests
  - uses: patch
    with:
      patches: .recipe-files/skip-antlr-version-check.patch .recipe-files/remove-cmake-ninja-requirement.patch .recipe-files/no-external-antlr4.patch .recipe-files/fix-escape-syntax-warning.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      (cd c/makeotf/lib/hotconv; python3 BuildGrammar.py -f)
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/py3-afdko
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: afdko
    description: Adobe Font Development Kit for OpenType
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/libexec/afdko"
          mv "${{targets.destdir}}/usr/bin/buildcff2vf" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/buildmasterotfs" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/charplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/checkoutlinesufo" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/comparefamily" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/digiplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/fontplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/fontplot2" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/fontsetplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/hintplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/makeinstancesufo" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/makeotf" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/otc2otf" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/otf2otc" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/otf2ttf" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/otfautohint" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/otfstemhist" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/ttfcomponentizer" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/ttfdecomponentizer" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/ttxn" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/waterfallplot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a .recipe-files/scripts_afdko "${{targets.contextdir}}/usr/bin/"
          install -Dm644 .recipe-files/scripts_afdko.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          find "${{targets.contextdir}}/usr/bin" -type f -exec chmod 755 {} +
    dependencies:
      runtime:
        - python3
        - py3-afdko
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            test -x /usr/bin/afdko
  - name: afdko-bin
    description: Adobe Font Development Kit for OpenType (Binaries)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/libexec/afdko"
          mv "${{targets.destdir}}/usr/bin/detype1" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/makeotfexe" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/mergefonts" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/rotatefont" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/sfntdiff" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/sfntedit" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/spot" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/tx" "${{targets.contextdir}}/usr/libexec/afdko/"
          mv "${{targets.destdir}}/usr/bin/type1" "${{targets.contextdir}}/usr/libexec/afdko/"
  - name: afdko-doc
    description: Adobe Font Development Kit for OpenType (common documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/afdko"
          cp -a docs "${{targets.contextdir}}/usr/share/doc/afdko/"
update:
  enabled: true
  github:
    identifier: adobe-type-tools/afdko
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-afdko/LICENSE.md
    - uses: python/import
      with:
        python: python3
        imports: import afdko
