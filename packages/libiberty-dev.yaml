package:
  name: libiberty-dev
  version: '20260327'
  epoch: 0
  description: Library of utility functions used by GNU programs
  copyright:
    - license: GPL-3.0-or-later
      paths:
        - config.guess
        - config.sub
        - 'config/*'
        - 'include/*'
    - license: GPL-2.0-or-later
      paths:
        - config-ml.in
        - config.rpath
    - license: GPL-3.0-or-later
      paths:
        - include/dwarf2.h
    - license: LGPL-2.1-or-later
      paths:
        - 'libiberty/*'
        - include/demangle.h
        - include/leb128.h
        - include/safe-ctype.h
        - include/timeval-utils.h
        - include/xregex2.h
    - license: GFDL
      paths:
        - libiberty/libiberty.texi
    - license: LGPL-2.0-or-later
      paths:
        - include/vtv-change-permission.h
    - license: permissive
      paths:
        - install-sh
    - license: LicenseRef-public-domain
      paths:
        - mkinstalldirs
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright use-ldflags.diff; do mv libiberty-dev/$f .recipe-files/; done
      rmdir libiberty-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/libi/libiberty/libiberty_${{package.version}}.orig.tar.xz
      expected-sha256: a9c05b1053380a6472a088ffa2d742a8dfd85d9e1bef01c1ce627b4a4e6cc775
  - uses: patch
    with:
      patches: .recipe-files/use-ldflags.diff
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/libiberty-dev/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/libiberty-dev/copyright
    - uses: test/tw/ldd-check
