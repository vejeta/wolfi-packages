# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/libi/libiberty/libiberty_20260327.orig.tar.xz), which disappears from the pool when Debian updates
# - test dependency 'libc-dev' (Debian 'libc-dev') not found in Wolfi; left out
