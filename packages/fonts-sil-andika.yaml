# fonts-sil-andika 7.000-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-sil-andika
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-sil-andika
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-sil-andika
  version: '7.000'
  epoch: 0
  description: Font family designed for literacy use
  copyright:
    - license: OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-andika/$f .recipe-files/; done
      rmdir fonts-sil-andika 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-andika
      tag: v${{package.version}}
      expected-commit: 6944336aca1d4763179c50e1dcb3028fe8ef60db
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/web"
      ln -sf /usr/share/fonts-sil-andika/woff2/Andika-Regular.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/web/Andika-Regular.woff2"
      ln -sf /usr/share/fonts-sil-andika/woff2/Andika-Italic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/web/Andika-Italic.woff2"
      ln -sf /usr/share/fonts-sil-andika/woff2/Andika-Bold.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/web/Andika-Bold.woff2"
      ln -sf /usr/share/fonts-sil-andika/woff2/Andika-BoldItalic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/web/Andika-BoldItalic.woff2"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-andika"
      cp -a README.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/"
      cp -a documentation/ "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/"
      cp -a web/ "${{targets.destdir}}/usr/share/doc/fonts-sil-andika/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-andika/copyright
update:
  enabled: true
  github:
    identifier: silnrsi/font-andika
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-andika/copyright
