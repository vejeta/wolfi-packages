package:
  name: perl-alien-libxml2
  version: '0.20'
  epoch: 0
  description: Install the C libxml2 library on your system
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-alien-build
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-dev
      - libxml2-dev
      - perl-alien-build
      - perl-alien-build-plugin-download-gitlab  # TODO(alpine-to-melange): not in Wolfi
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Libxml2-${{package.version}}.tar.gz
      expected-sha512: 151184c3e9234d00120bf64e0da27a63f5628f01b6bb61576c05fa1a567c193e08f906394e3849262936c3fa9ea8849d0eb1cab8bf46bd1ce6c941002871ee9d
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-alien-libxml2-doc
    description: Install the C libxml2 library on your system (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 19537
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
