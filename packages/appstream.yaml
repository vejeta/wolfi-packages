package:
  name: appstream
  version: '1.2.1'
  epoch: 0
  description: Provides a standard for creating app stores across distributions
  copyright:
    - license: LGPL-2.1-or-later
  scriptlets:
    post-install: |
      #!/bin/sh

      umask 022
      /usr/bin/appstreamcli refresh-cache --force

      # /var/cache/app-info was replaced by /var/cache/swcatalog
      # Remove this lines once 0.15.3 or greater is available in two
      # consecutive releases
      rm -rf /var/cache/app-info/cache
      test -d /var/cache/app-info && rmdir --ignore-fail-on-non-empty /var/cache/app-info

      exit 0
    post-upgrade: |
      #!/bin/sh
      appstream.post-install
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - curl-dev
      - glib-dev
      - gobject-introspection-dev
      - glib-gir  # GLib .gir files (part of glib-dev on Alpine)
      - gperf
      - itstool
      - libfyaml-dev  # Wolfi Community Packages
      - libxml2-dev
      - libxmlb-dev  # Wolfi Community Packages
      - meson
      - vala
      - wayland-dev
      - yaml-dev
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ximion/appstream
      tag: v${{package.version}}
      expected-commit: 4e3a4de973810e25bbada1b822185ed4d90eb1f5
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      abuild_meson \
      	-Db_lto=true \
      	-Dqt=false \
      	-Dsystemd=false \
      	-Dbash-completion=false \
      	-Ddocs=false \
      	-Dman=false \
      	-Dapidocs=false \
      	-Dinstall-docs=false \
      	-Dstemming=false \
      	-Dvapi=true \
      	-Dapt-support=false \
      	-Dgir=true \
      	-Dcompose=false \
      	. output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output

      # Remove installed-tests, there is no switch to disable installing them
      rm -rf "$pkgdir"/usr/share/installed-tests
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: appstream-dev
    description: Provides a standard for creating app stores across distributions (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: appstream-doc
    description: Provides a standard for creating app stores across distributions (doc)
    pipeline:
      - uses: split/alldocs
  - name: appstream-lang
    description: Provides a standard for creating app stores across distributions (lang)
    pipeline:
      - uses: split/locales
update:
  enabled: true
  github:
    identifier: ximion/appstream
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
