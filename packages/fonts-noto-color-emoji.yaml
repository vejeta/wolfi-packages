#
# Conversion notes:
# - build dependency 'py3-nototools' (Debian 'python3-nototools') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-noto-color-emoji
  version: '2.051'
  epoch: 0
  description: Color emoji font from Google
  copyright:
    - license: Apache-2.0
    - license: SIL-1.1
      paths:
        - 'fonts/*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - py3.12-fonttools-bin  # Debian: fonttools
      - imagemagick-7  # Debian: imagemagick
      - netpbm  # Debian: imagemagick
      - cairo-dev  # Debian: libcairo2-dev
      - libpng-dev
      - pkgconf-dev  # Debian: pkg-config
      - pngquant
      # TODO(debian-to-melange): py3-nototools is not in Wolfi (Debian: python3-nototools); left out
      - zopfli
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in add_vs_cmap.patch build-all-flags.patch verbose.patch; do mv fonts-noto-color-emoji/$f .recipe-files/; done
      rmdir fonts-noto-color-emoji 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/noto-emoji
      tag: v${{package.version}}
      expected-commit: 8998f5dd683424a73e2314a8c1f1e359c19e8742
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf fonts/*.ttf
  - uses: patch
    with:
      patches: .recipe-files/add_vs_cmap.patch .recipe-files/build-all-flags.patch .recipe-files/verbose.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) PNGQUANT=/usr/bin/pngquant  		VIRTUAL_ENV=true  		BYPASS_SEQUENCE_CHECK=true  		NotoColorEmoji.ttf
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/fonts-noto-color-emoji
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  github:
    identifier: googlefonts/noto-emoji
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-noto-color-emoji/LICENSE
