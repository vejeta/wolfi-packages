# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-noto-color-emoji
  version: '2.051'
  epoch: 0
  description: Color emoji font from Google
  copyright:
    - license: Apache-2.0
    - license: SIL-1.1
      paths:
        - 'fonts/*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - py3.13-fonttools-bin  # Debian: fonttools
      - imagemagick-7  # Debian: imagemagick
      - netpbm  # Debian: imagemagick
      - cairo-dev  # Debian: libcairo2-dev
      - libpng-dev
      - pkgconf-dev  # Debian: pkg-config
      - pngquant
      - py3.13-notofonttools-bin  # commands of Debian's python3-nototools
      - py3-supported-notofonttools  # Debian: python3-nototools
      - zopfli
      - python3  # the interpreter of Debian's python3-* build dependencies
      - which  # the Makefile runs which; Essential in Debian (debianutils)
      - bash  # the source has bash scripts; Essential in Debian
      - coreutils
      - findutils
pipeline:
  - name: 'Debian''s names of the commands of python3-nototools (Debian drops .py: add_vs_cmap)'
    runs: |
      mkdir -p /usr/local/bin
      ln -sf /usr/bin/add_vs_cmap.py /usr/local/bin/add_vs_cmap
      ln -sf /usr/bin/autofix_for_release.py /usr/local/bin/autofix_for_release
      ln -sf /usr/bin/create_image.py /usr/local/bin/create_image
      ln -sf /usr/bin/decompose_ttc.py /usr/local/bin/decompose_ttc
      ln -sf /usr/bin/drop_hints.py /usr/local/bin/drop_hints
      ln -sf /usr/bin/dump_otl.py /usr/local/bin/dump_otl
      ln -sf /usr/bin/fix_khmer_and_lao_coverage.py /usr/local/bin/fix_khmer_and_lao_coverage
      ln -sf /usr/bin/fix_noto_cjk_thin.py /usr/local/bin/fix_noto_cjk_thin
      ln -sf /usr/bin/generate_sample_text.py /usr/local/bin/generate_sample_text
      ln -sf /usr/bin/merge_fonts.py /usr/local/bin/merge_fonts
      ln -sf /usr/bin/merge_noto.py /usr/local/bin/merge_noto
      ln -sf /usr/bin/noto_lint.py /usr/local/bin/noto_lint
      ln -sf /usr/bin/scale.py /usr/local/bin/scale
      ln -sf /usr/bin/subset.py /usr/local/bin/subset
      ln -sf /usr/bin/subset_symbols.py /usr/local/bin/subset_symbols
      ln -sf /usr/bin/test_vertical_extents.py /usr/local/bin/test_vertical_extents
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in add_vs_cmap.patch build-all-flags.patch verbose.patch; do mv fonts-noto-color-emoji/$f .recipe-files/; done
      rmdir fonts-noto-color-emoji 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/noto-emoji
      tag: v${{package.version}}
      expected-commit: 8998f5dd683424a73e2314a8c1f1e359c19e8742
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf fonts/*.ttf
  - uses: patch
    with:
      patches: .recipe-files/add_vs_cmap.patch .recipe-files/build-all-flags.patch .recipe-files/verbose.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) PNGQUANT=/usr/bin/pngquant  		VIRTUAL_ENV=true  		BYPASS_SEQUENCE_CHECK=true  		NotoColorEmoji.ttf
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/fonts-noto-color-emoji
  - name: From debian/rules override_dh_install
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/truetype/noto"
      cp -a NotoColorEmoji.ttf "${{targets.destdir}}/usr/share/fonts/truetype/noto/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: true
  github:
    identifier: googlefonts/noto-emoji
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-noto-color-emoji/LICENSE
