package:
  name: ikiwiki
  version: '3.20260201'
  epoch: 0
  description: Ikiwiki is a wiki compiler. It converts wiki pages into HTML pages suitable for publishing on a website.
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - perl-cgi-formbuilder
      - perl-cgi-session
      - perl-html-parser
      - perl-html-scrubber
      - perl-html-template
      - perl-locale-gettext
      - perl-mail-sendmail
      - perl-rpc-xml
      - perl-text-markdown
      - perl-timedate
      - perl-time-duration
      - perl-uri
      - perl-yaml
      - perl-yaml-libyaml
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-cgi-formbuilder
      - perl-cgi-session
      - perl-html-parser
      - perl-html-scrubber
      - perl-html-template
      - perl-locale-gettext
      - perl-mail-sendmail
      - perl-rpc-xml
      - perl-text-markdown
      - perl-timedate
      - perl-time-duration
      - perl-uri
      - perl-yaml
      - perl-yaml-libyaml
      - gettext  # msgfmt for the -lang subpackage
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv ikiwiki/* .recipe-files/
      rmdir ikiwiki
  - uses: fetch
    with:
      uri: http://deb.debian.org/debian/pool/main/i/ikiwiki/ikiwiki_${{package.version}}.orig.tar.xz
      expected-sha512: 78df8240dd7b09f6fa644e19784f7737d42c5bb5c2028ca518ffb937fb833ee55f311aa559ada61fecaccb7863fa8950c4f8b938af65c3f2343dc4a80803b9e2
  - uses: patch
    with:
      patches: .recipe-files/plugin-img-add-webp.patch
  - name: Prepare
    runs: |
      # Install module into the vendor directories
      sed -i -e 's/sbin/bin/g' Makefile.PL
  - name: Build
    runs: |
      perl Makefile.PL PREFIX="/usr" INSTALL_BASE= INSTALLDIRS=vendor
      make PREFIX="/usr"
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make install DESTDIR="$pkgdir"

      # otherwise perl breaks
      find "$pkgdir" \( -name '.packlist' -or -name '*.pod' \) -exec rm '{}' +
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: ikiwiki-doc
    description: Ikiwiki is a wiki compiler. It converts wiki pages into HTML pages suitable for publishing on a website. (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
  - name: ikiwiki-lang
    description: Ikiwiki is a wiki compiler. It converts wiki pages into HTML pages suitable for publishing on a website. (lang)
    pipeline:
      - uses: split/locales
update:
  enabled: true
  release-monitor:
    identifier: 1371
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
