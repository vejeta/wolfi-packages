pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv ikiwiki/* .recipe-files/
      rmdir ikiwiki
  - uses: fetch
    with:
      uri: http://deb.debian.org/debian/pool/main/i/ikiwiki/ikiwiki_${{package.version}}.orig.tar.xz
      expected-sha512: 78df8240dd7b09f6fa644e19784f7737d42c5bb5c2028ca518ffb937fb833ee55f311aa559ada61fecaccb7863fa8950c4f8b938af65c3f2343dc4a80803b9e2
  - uses: patch
    with:
      patches: .recipe-files/plugin-img-add-webp.patch
  - name: Prepare
    runs: |
      # Install module into the vendor directories
      sed -i -e 's/sbin/bin/g' Makefile.PL
  - name: Build
    runs: |
      perl Makefile.PL PREFIX="/usr" INSTALL_BASE= INSTALLDIRS=vendor
      make PREFIX="/usr"
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make install DESTDIR="$pkgdir"

      # otherwise perl breaks
      find "$pkgdir" \( -name '.packlist' -or -name '*.pod' \) -exec rm '{}' +
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
