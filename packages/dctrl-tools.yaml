environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - gettext
      - po4a  # Wolfi Community Packages
      - libc-bin
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in GNUmakefile_remove---force-from-po4a-call reproducible_build.patch; do mv dctrl-tools/$f .recipe-files/; done
      rmdir dctrl-tools 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ajkaijanaho/dctrl-tools
      tag: ${{package.version}}
      expected-commit: b9f34b722c0e73832807877c8062750482441e63
  - uses: patch
    with:
      patches: .recipe-files/GNUmakefile_remove---force-from-po4a-call .recipe-files/reproducible_build.patch
  - name: 'Drop -Werror from the upstream makefiles (a newer toolchain than Debian''s)'
    runs: |
      sed -i 's/ -Werror\b\([^=]\|$\)/\1/g' GNUmakefile
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) prefix=/usr sysconfdir=/etc
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make install DESTDIR="${{targets.destdir}}" PREFIX=/usr prefix=/usr sysconfdir=/etc
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/dctrl-tools
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  github:
    identifier: ajkaijanaho/dctrl-tools
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/dctrl-tools/COPYING
    - uses: test/tw/ldd-check
