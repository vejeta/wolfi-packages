#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libsedlex-ocaml
  version: '3.8.1'
  epoch: 0
  description: Unicode-friendly lexer generator for OCaml (Runtime library)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libgen-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libmenhir-ocaml-dev  # Wolfi Community Packages
      - menhir  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-community/sedlex
      tag: v${{package.version}}
      expected-commit: 8bfec9063cc840b1bda0c4de7fab9670a467fce6
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p sedlex -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" sedlex
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libsedlex-ocaml
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      sed -i 's/uchar//g' ${{targets.destdir}}/usr/lib/ocaml/sedlex/META
      sed -i 's/uchar//g' ${{targets.destdir}}/usr/lib/ocaml/sedlex/dune-package
      sed -i 's/"uchar"//g' ${{targets.destdir}}/usr/lib/ocaml/sedlex/opam
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libsedlex-ocaml-dev
    description: Unicode-friendly lexer generator for OCaml (Development package)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libsedlex-ocaml-dev/examples"
          cp -a examples/dune* "${{targets.contextdir}}/usr/share/doc/libsedlex-ocaml-dev/examples/"
          cp -a examples/*.ml "${{targets.contextdir}}/usr/share/doc/libsedlex-ocaml-dev/examples/"
    dependencies:
      runtime:
        - libsedlex-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: ocaml-community/sedlex
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - ocaml-findlib  # Debian: ocaml-findlib
        - ocamlfind  # Debian: ocaml-findlib
        - ocaml-dune
        - menhir  # Wolfi Community Packages
        - libmenhir-ocaml-dev  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libsedlex-ocaml/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/ocaml-community/sedlex
        tag: v${{package.version}}
        expected-commit: 8bfec9063cc840b1bda0c4de7fab9670a467fce6
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libsedlex-ocaml.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libsedlex-ocaml.templates" && break
        done
    - name: 'autopkgtest: test-examples'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        testdir=$(mktemp -d)
        trap "rm -rf ${testdir}" 0 INT QUIT ABRT PIPE TERM

        cp -r "$(dirname "$0")/../../examples" "${testdir}/example"
        cd "${testdir}/example"

        sed -i 's/sedlex_ppx/sedlex.ppx/g' dune

        echo "(lang dune 2.9)" > dune-project
        echo "(using menhir 2.1)" >> dune-project
        dune build @runtest --verbose

        echo "test: OK"
