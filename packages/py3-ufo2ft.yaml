# Generated by debian-to-melange 0.1.0 from Debian source package
# ufo2ft 3.8.1-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ufo2ft
# Debian packaging: https://salsa.debian.org/fonts-team/ufo2ft
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: booleanoperations, cffsubr, fontmath, fonttools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-ufo2ft for Python 3.12, 3.13
package:
  name: py3-ufo2ft
  version: '3.8.1'
  epoch: 0
  description: Bridge from UFOs to fonttools objects
  copyright:
    - license: MIT
    - license: Apache-2.0
      paths:
        - tests/data/UseMyMetrics.ufo/fontinfo.plist
    - license: OFL-1.1
      paths:
        - 'tests/data/ContourOrderTest.ufo/*'
  dependencies:
    provider-priority: 0
vars:
  pypi-package: ufo2ft
  import: ufo2ft
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-fontmath  # Wolfi Community Packages (Debian: python3-fontmath)
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-ufolib2  # Wolfi Community Packages (Debian: python3-ufolib2)
      - py3-supported-defcon  # Wolfi Community Packages (Debian: python3-defcon)
      - py3-compreffor  # Wolfi Community Packages (Debian: python3-compreffor)
      - py3-supported-booleanoperations  # Wolfi Community Packages (Debian: python3-booleanoperations)
      - py3-supported-cffsubr  # Wolfi Community Packages (Debian: python3-cffsubr)
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in openTypeOS2Type-default.patch; do mv py3-ufo2ft/$f .recipe-files/; done
      rmdir py3-ufo2ft 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/ufo2ft
      tag: v${{package.version}}
      expected-commit: 13678cb86824f378c8f702213eee2f13bd4fd90d
  - uses: patch
    with:
      patches: .recipe-files/openTypeOS2Type-default.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-ufo2ft"
      cp -a README.rst "${{targets.destdir}}/usr/share/doc/py3-ufo2ft/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-booleanoperations
        - py${{range.key}}-cffsubr
        - py${{range.key}}-fontmath
        - py${{range.key}}-fonttools
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
        # Debian Recommends (not supported by apk): python3-skia-pathops
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: googlefonts/ufo2ft
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-ufo2ft
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
