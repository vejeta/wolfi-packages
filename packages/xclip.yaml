package:
  name: xclip
  version: '0.13'
  epoch: 0
  description: Command line interface to X selections
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): xauth
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - libx11-dev
      - libxmu-dev
      - psmisc
      - xauth
      - xvfb
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/astrand/xclip
      tag: ${{package.version}}
      expected-commit: 9aa7090c3b8b437c6489edca32ae43d82e0c1281
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Add-f-flags-to-tar.patch 0002-Correct-spelling-mistakes.patch 0003-Avoid-printf-s-NULL.patch 0004-Corrected-URL-to-Freedesktop-clipboard-spec.patch 0005-Update-INSTALL-with-needed-Ubuntu-deps-as-example-46.patch 0006-Fix-typos-49.patch 0007-Prepend-rm-arguments-with-in-xclip-cutfile-44.patch 0008-Fix-uninitialized-variables-causing-segfault.patch; do mv xclip/$f .recipe-files/; done
      rmdir xclip 2>/dev/null || true
  - uses: patch
    with:
      patches: .recipe-files/0001-Add-f-flags-to-tar.patch .recipe-files/0002-Correct-spelling-mistakes.patch .recipe-files/0003-Avoid-printf-s-NULL.patch .recipe-files/0004-Corrected-URL-to-Freedesktop-clipboard-spec.patch .recipe-files/0005-Update-INSTALL-with-needed-Ubuntu-deps-as-example-46.patch .recipe-files/0006-Fix-typos-49.patch .recipe-files/0007-Prepend-rm-arguments-with-in-xclip-cutfile-44.patch .recipe-files/0008-Fix-uninitialized-variables-causing-segfault.patch
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/man/man1"
      ln -sf /usr/share/man/man1/xclip-copyfile.1 "${{targets.destdir}}/usr/share/man/man1/xclip-cutfile.1"
      ln -sf /usr/share/man/man1/xclip-copyfile.1 "${{targets.destdir}}/usr/share/man/man1/xclip-pastefile.1"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/xclip
  - uses: strip
update:
  enabled: true
  github:
    identifier: astrand/xclip
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/xclip/COPYING
    - uses: test/tw/ldd-check
