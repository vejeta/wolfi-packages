  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      mkdir -p debbuild/shared/
      gn gen debbuild/shared --args='is_official_build=true  	extra_cflags_cc=string_split(getenv("CXXFLAGS"))  	extra_cflags_c=string_split(getenv("CFLAGS"))  	skia_use_system_expat=true  	skia_use_system_harfbuzz=true  	skia_use_system_icu=true  	skia_use_system_libjpeg_turbo=true  	skia_use_system_libpng=true  	skia_use_system_libwebp=true  	skia_use_system_zlib=true  	skia_use_dng_sdk=false  	skia_use_wuffs=false  	skia_enable_spirv_validation=false is_component_build=true  	extra_ldflags=string_split(getenv("LDFLAGS"))  	skia_so_version=$(echo "146.20260602" | sed -E 's/^([0-9]+).*$/\1/')'
      ninja -C debbuild/shared -j $(nproc) --verbose skia
      mkdir -p debbuild/static/
      gn gen debbuild/static --args='is_official_build=true  	extra_cflags_cc=string_split(getenv("CXXFLAGS"))  	extra_cflags_c=string_split(getenv("CFLAGS"))  	skia_use_system_expat=true  	skia_use_system_harfbuzz=true  	skia_use_system_icu=true  	skia_use_system_libjpeg_turbo=true  	skia_use_system_libpng=true  	skia_use_system_libwebp=true  	skia_use_system_zlib=true  	skia_use_dng_sdk=false  	skia_use_wuffs=false  	skia_enable_spirv_validation=false skia_no_pic=true'
      ninja -C debbuild/static -j $(nproc) --verbose skia
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      install -D -m 0755 debbuild/shared/libskia.so ${{targets.destdir}}/usr/lib/libskia.so.$(echo "146.20260602" | sed -E 's/^([0-9.]+).*$/\1/')
      ln -s libskia.so.$(echo "146.20260602" | sed -E 's/^([0-9.]+).*$/\1/') ${{targets.destdir}}/usr/lib/libskia.so.$(echo "146.20260602" | sed -E 's/^([0-9]+).*$/\1/')
      ln -s libskia.so.$(echo "146.20260602" | sed -E 's/^([0-9]+).*$/\1/') ${{targets.destdir}}/usr/lib/libskia.so
      install -D -m 0644 debbuild/static/libskia.a ${{targets.destdir}}/usr/lib/libskia.a
      python3 bin/install-headers.py --src include/ --dest ${{targets.destdir}}/usr/include/skia --ignore '.*/android/.*' --ignore include/codec/SkRawDecoder.h --ignore include/codec/SkJpegxlDecoder.h --ignore include/codec/SkAvifDecocer.h
      mkdir -p ${{targets.destdir}}/usr/include/skia
      cp modules/skcms/src/skcms_public.h ${{targets.destdir}}/usr/include/skia/skcms.h
      python3 bin/install-pc.py ${{targets.destdir}}/usr/lib/pkgconfig/skia.pc
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}"/usr/lib/libskia.so.* >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib"
        cp -a usr/lib/libskia.so.* "${{targets.destdir}}/usr/lib/"
      fi
      mkdir -p "${{targets.destdir}}/usr/share/doc/libskia"
      cp -a .recipe-files/README.Debian.security "${{targets.destdir}}/usr/share/doc/libskia/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libskia
subpackages:
  - name: libskia-dev
    description: Development files for Skia
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          if ls -d "${{targets.destdir}}/usr/lib/libskia.so" >/dev/null 2>&1; then
            mv "${{targets.destdir}}/usr/lib/libskia.so" "${{targets.contextdir}}/usr/lib/"
          else
            cp -a usr/lib/libskia.so "${{targets.contextdir}}/usr/lib/"
          fi
          if ls -d "${{targets.destdir}}/usr/lib/libskia.a" >/dev/null 2>&1; then
            mv "${{targets.destdir}}/usr/lib/libskia.a" "${{targets.contextdir}}/usr/lib/"
          else
            cp -a usr/lib/libskia.a "${{targets.contextdir}}/usr/lib/"
          fi
          mkdir -p "${{targets.contextdir}}/usr/lib/pkgconfig"
          if ls -d "${{targets.destdir}}/usr/lib/pkgconfig/skia.pc" >/dev/null 2>&1; then
            mv "${{targets.destdir}}/usr/lib/pkgconfig/skia.pc" "${{targets.contextdir}}/usr/lib/pkgconfig/"
          else
            cp -a usr/lib/pkgconfig/skia.pc "${{targets.contextdir}}/usr/lib/pkgconfig/"
          fi
          mkdir -p "${{targets.contextdir}}/usr/include/skia"
          if ls -d "${{targets.destdir}}"/usr/include/skia/* >/dev/null 2>&1; then
            mv "${{targets.destdir}}"/usr/include/skia/* "${{targets.contextdir}}/usr/include/skia/"
          else
            cp -a usr/include/skia/* "${{targets.contextdir}}/usr/include/skia/"
          fi
    dependencies:
      runtime:
        - libskia
