      rmdir libskia 2>/dev/null || true
  - uses: fetch
    with:
      uri: 'https://deb.debian.org/debian/pool/main/libs/libskia/libskia_${{package.version}}~git.3476902+dfsg.orig.tar.xz'
      expected-sha256: 40282b875f8bd41cafce224384e44ca0f95e8db836084e54adb1904d63f5345f
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf demos.skia.org/* modules/canvaskit/* platform_tools/* resources/* site/* tests/* third_party/freetype2/*
