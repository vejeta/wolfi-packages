#
# Conversion notes:
# - build dependency 'afdko' (Debian 'afdko') not found in Wolfi; left out
# - build dependency 'py3-skia-pathops' (Debian 'python3-skia-pathops') not found in Wolfi; left out
# - build dependency 'py3-ufo2ft' (Debian 'python3-ufo2ft') not found in Wolfi; left out
# - build dependency 'py3-ufolib2' (Debian 'python3-ufolib2') not found in Wolfi; left out
# - build dependency 'py3-uharfbuzz' (Debian 'python3-uharfbuzz') not found in Wolfi; left out
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-cantarell/fonts-cantarell_0.311.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: fonts-cantarell
  version: '0.311'
  epoch: 0
  description: Sans serif font family designed for on-screen readability
  copyright:
    - license: OFL-1.1
    - license: CC0-1.0
      paths:
        - 'appstream/*'
  dependencies:
    runtime:
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): afdko is not in Wolfi (Debian: afdko); left out
      - meson
      - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
      - py3-supported-fonttools  # Debian: python3-fonttools
      # TODO(debian-to-melange): py3-skia-pathops is not in Wolfi (Debian: python3-skia-pathops); left out
      # TODO(debian-to-melange): py3-ufo2ft is not in Wolfi (Debian: python3-ufo2ft); left out
      # TODO(debian-to-melange): py3-ufolib2 is not in Wolfi (Debian: python3-ufolib2); left out
      # TODO(debian-to-melange): py3-uharfbuzz is not in Wolfi (Debian: python3-uharfbuzz); left out
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-cantarell/fonts-cantarell_${{package.version}}.orig.tar.gz
      expected-sha256: d1e49988ad6935da0973092435c9152299b30869c3edeb10abf87345d9ba85bd
  - uses: meson/configure
    with:
      opts: -Dfontsdir=/usr/share/fonts/opentype/cantarell -Duseprebuilt=false -Dbuildstatics=false -Dbuildvf=true
  - uses: meson/compile
  - uses: meson/install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-cantarell"
      cp -a NEWS "${{targets.destdir}}/usr/share/doc/fonts-cantarell/"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/fonts-cantarell/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/fonts-cantarell
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-cantarell/COPYING
