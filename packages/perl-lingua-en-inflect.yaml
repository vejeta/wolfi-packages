package:
  name: perl-lingua-en-inflect
  version: '1.905'
  epoch: 0
  description: Perl module to pluralize English words
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv perl-lingua-en-inflect/$f .recipe-files/; done
      rmdir perl-lingua-en-inflect 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/D/DC/DCONWAY/Lingua-EN-Inflect-${{package.version}}.tar.gz
      expected-sha256: 05c29ec3482e572313a60da2181b0b30c5db7cf01f8ae7616ad67e1b66263296
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-lingua-en-inflect/examples"
      cp -a demo/* "${{targets.destdir}}/usr/share/doc/perl-lingua-en-inflect/examples/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-lingua-en-inflect/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 6662
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-lingua-en-inflect/copyright
    - name: Load the module
      runs: |
        perl -MLingua::EN::Inflect -e1
