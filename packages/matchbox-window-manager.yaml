environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - pkgconf-dev  # Debian: pkgconf
      - startup-notification-dev  # Debian: libstartup-notification0-dev
      - libmatchbox-dev  # Wolfi Community Packages
      - libx11-dev
      - libxext-dev
      - libxt-dev
      - libxft-dev
pipeline:
  - uses: git-checkout
    with:
      repository: https://git.yoctoproject.org/matchbox-window-manager
