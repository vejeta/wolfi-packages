# - abuild helper default_doc in doc()
package:
  name: perl-alien-build
  version: '2.84'
  epoch: 0
  description: Build external dependencies for use in CPAN
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-file-chdir
      - perl-path-tiny
      - perl-capture-tiny
      - perl-ffi-checklib
      - perl-file-which
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-dev
      - perl-file-which
      - perl
      - perl-file-chdir
      - perl-path-tiny
      - perl-capture-tiny
      - perl-ffi-checklib
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Build-${{package.version}}.tar.gz
      expected-sha512: 48f67543e44651f73d4f7668ea4e34d2b522cf8ca6cf4eb0713f13809d5876ed1c1439340e3f0277cac989e17bc03fc0d7671bc26272a39e7fbeb7cef5862784
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-alien-build-doc
    description: Build external dependencies for use in CPAN (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          file; find "$pkgdir" -name "*.pod" | while read -r file; do
          	amove "${file#"$pkgdir"}"
          done
update:
  enabled: true
  release-monitor:
    identifier: 15795
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
