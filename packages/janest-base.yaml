package:
  name: libbase-ocaml-dev
  version: '0.17.3'
  epoch: 0
  description: 'Jane Street''s alternative standard library (development)'
  copyright:
    - license: MIT
    - license: Apache-2.0
      paths:
        - src/map.ml
        - src/random.mli
        - src/set.ml
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - libdune-configurator-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libsexplib0-ocaml-dev is not in Wolfi (Debian: libsexplib0-ocaml-dev); left out
      # TODO(debian-to-melange): libocaml-intrinsics-kernel-ocaml-dev is not in Wolfi (Debian: libocaml-intrinsics-kernel-ocaml-dev); left out
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/base
      tag: v${{package.version}}
      expected-commit: f8d1d3ad1894590cd19d11b9a89fe799caee5e57
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbase-ocaml-dev"
      cp -a usr/doc/base/* "${{targets.destdir}}/usr/share/doc/libbase-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/janest-base
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libbase-ocaml
    description: 'Jane Street''s alternative standard library (runtime)'
    pipeline:
      # TODO(debian-to-melange): no debian/libbase-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/base
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/janest-base/LICENSE.md
    - uses: test/tw/ldd-check
