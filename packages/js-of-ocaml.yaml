package:
  name: js-of-ocaml
  version: '6.4.1'
  epoch: 0
  description: OCaml bytecode to JavaScript compiler (compiler)
  copyright:
    - license: LGPL-2.1-or-later
    - license: LGPL-2-exception
      paths:
        - 'lib/*'
    - license: LGPL-2-exception
      paths:
        - 'runtime/*'
    - license: QPL-exception
      paths:
        - 'tools/*'
    - license: WTFPL
      paths:
        - 'examples/boulderdash/*'
        - 'examples/minesweeper/*'
  dependencies:
    runtime:
      - libjs-of-ocaml-dev
      # Debian Recommends (not supported by apk): binaryen, ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libgraphics-ocaml-dev  # Wolfi Community Packages
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libyojson-ocaml-dev  # Wolfi Community Packages
      - liblwt-ocaml-dev  # Wolfi Community Packages
      - libtyxml-ocaml-dev  # Wolfi Community Packages
      - libreactivedata-ocaml-dev  # Wolfi Community Packages
      - libsedlex-ocaml-dev  # Wolfi Community Packages
      - menhir  # Wolfi Community Packages
      - libmenhir-ocaml-dev  # Wolfi Community Packages
      - rsync
      - binaryen
      - ocaml-odoc  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Disable-build-of-toplevel.-bc-.js.patch 0002-Fix-FTBFS-with-dune-3.24.1.patch; do mv js-of-ocaml/$f .recipe-files/; done
      rmdir js-of-ocaml 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/js_of_ocaml
      tag: ${{package.version}}
      expected-commit: 02ac3ba6a21f6f58b0a4c69b799ac6f43023d674
  - uses: patch
    with:
      patches: .recipe-files/0001-Disable-build-of-toplevel.-bc-.js.patch .recipe-files/0002-Fix-FTBFS-with-dune-3.24.1.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p js_of_ocaml,js_of_ocaml-compiler,js_of_ocaml-lwt,js_of_ocaml-ppx,js_of_ocaml-ppx_deriving_json,js_of_ocaml-toplevel,js_of_ocaml-tyxml,wasm_of_ocaml-compiler -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" js_of_ocaml js_of_ocaml-compiler js_of_ocaml-lwt js_of_ocaml-ppx js_of_ocaml-ppx_deriving_json js_of_ocaml-toplevel js_of_ocaml-tyxml wasm_of_ocaml-compiler
  - name: From debian/rules execute_before_dh_auto_build
    runs: |
      rm -f compiler/tests-jsoo/dune         # makes the build fail on amd64
      rm -f compiler/lib-runtime/tests/dune  # makes the build fail on bytecode architectures
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/js-of-ocaml/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/js-of-ocaml/examples/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/js-of-ocaml
  - name: From debian/rules execute_after_dh_install
    runs: |
      mkdir -p ${{targets.outdir}}/libjs-of-ocaml-doc/usr/share/doc/libjs-of-ocaml-doc
      rm -rf ${{targets.outdir}}/libjs-of-ocaml-doc/usr/share/doc/libjs-of-ocaml-doc/api
      rm -rf ${{targets.outdir}}/libjs-of-ocaml-doc/usr/share/doc/libjs-of-ocaml-doc/manual
      cp -a _build/default/_doc/_html ${{targets.outdir}}/libjs-of-ocaml-doc/usr/share/doc/libjs-of-ocaml-doc/html
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libjs-of-ocaml-dev
    description: OCaml bytecode to JavaScript compiler (development files)
    pipeline:
      - uses: split/dev
  - name: libjs-of-ocaml
    description: OCaml bytecode to JavaScript compiler (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libjs-of-ocaml.install; define which files go to this subpackage
      - runs: |
          true
  - name: libjs-of-ocaml-doc
    description: OCaml bytecode to JavaScript compiler (documentation)
    pipeline:
      - uses: split/manpages
update:
  enabled: true
  github:
    identifier: ocsigen/js_of_ocaml
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/js-of-ocaml/LICENSE
    - uses: test/tw/ldd-check
