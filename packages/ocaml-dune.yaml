  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr"
      cp -a usr/bin "${{targets.destdir}}/usr/"
      mkdir -p "${{targets.destdir}}/usr/share"
      cp -a usr/share/emacs "${{targets.destdir}}/usr/share/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/ocaml-dune"
      cp -a usr/doc/dune/* "${{targets.destdir}}/usr/share/doc/ocaml-dune/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-dune
  - uses: strip
