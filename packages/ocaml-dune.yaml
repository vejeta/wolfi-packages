pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Fix-build-on-hurd.patch; do mv ocaml-dune/$f .recipe-files/; done
      rmdir ocaml-dune 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/dune
      tag: ${{package.version}}
      expected-commit: a5d7d322823927dd5d85ae102fd7d442be2f7e66
  - uses: patch
    with:
      patches: .recipe-files/0001-Fix-build-on-hurd.patch
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
