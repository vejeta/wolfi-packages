# Debian packaging: https://salsa.debian.org/fonts-team/fonts-gfs-solomos
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-gfs-solomos/fonts-gfs-solomos_1.1.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-gfs-solomos
  version: '1.1'
  epoch: 0
  description: Ancient Greek oblique font
  copyright:
    - license: OFL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-gfs-solomos/$f .recipe-files/; done
      rmdir fonts-gfs-solomos 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-gfs-solomos/fonts-gfs-solomos_${{package.version}}.orig.tar.xz
      expected-sha256: 55f377e8bf9e7c786f7a92610491fab73b76fdb54425b703b252cfab3cb10fc0
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/solomos"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-gfs-solomos"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-gfs-solomos/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-gfs-solomos/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-gfs-solomos/copyright
