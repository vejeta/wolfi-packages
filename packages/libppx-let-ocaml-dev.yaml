# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-let-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Ppx rewriter for monadic and applicative bindings (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
      - libppx-let-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libppx-here-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_let
      tag: v${{package.version}}
      expected-commit: f34bef0ae0577263bea9ae36a9d3e3677c03b389
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_let -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_let
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-let-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ppx_let/* "${{targets.destdir}}/usr/share/doc/libppx-let-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ppx_let" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-let-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-let-ocaml
    description: Ppx rewriter for monadic and applicative bindings (runtime files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_let"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_let/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_let/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_let/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppx_let/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_let/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppx_let/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_let/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_let/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: janestreet/ppx_let
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-let-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
