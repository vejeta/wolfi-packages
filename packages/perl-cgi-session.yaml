package:
  name: perl-cgi-session
  version: '4.49'
  epoch: 0
  description: Perl module for persistent session data in CGI applications
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl
      - perl-crypt-sysrandom  # TODO(alpine-to-melange): not in Wolfi
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-crypt-sysrandom  # TODO(alpine-to-melange): not in Wolfi
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/M/MA/MARKSTOS/CGI-Session-${{package.version}}.tar.gz
      expected-sha512: 4efc06b0f97d6a1a9afa553847092aaf5ffd5f104af72d72bc4f115b90082ec285718c2562f10dbc4ed80dc209b089394a84ea0bb5dd1d2e2c2f048317bcd8ac
  - name: Build
    runs: |
      perl Makefile.PL INSTALLDIRS=vendor
      make MAN1EXT=1p MAN3EXT=3pm
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make install MAN1EXT=1p MAN3EXT=3pm DESTDIR="$pkgdir"
      find "$pkgdir" -name perllocal.pod -delete
      find "$pkgdir" -name .packlist -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
