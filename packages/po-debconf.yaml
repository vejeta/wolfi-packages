package:
  name: po-debconf
  version: '1.0.22'
  epoch: 0
  description: Tool for managing templates file translations with gettext
  copyright:
    - license: GPL-2.0-only OR GPL-2.0-or-later
    - license: GPL-2.0-or-later
      paths:
        - podebconf-report-po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/de.po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/es.po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/fr.po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/pt.po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/ru.po
    - license: GPL-2.0-only
      paths:
        - doc/po4a/po/vi.po
    - license: GPL-2.0-only
      paths:
        - doc/en/podebconf-report-po.1.pod
    - license: GPL-2.0-only
      paths:
        - 'doc/es/*'
  dependencies:
    runtime:
      - gettext
      - intltool-debian  # Wolfi Community Packages
      - perl  # Debian: ${perl:Depends}
      # Debian Recommends (not supported by apk): libcompress-zlib-perl, libmail-sendmail-perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - dpkg-dev
      - po4a  # Wolfi Community Packages
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/po-debconf/po-debconf_${{package.version}}.tar.xz
      expected-sha256: d3f896f2cde156c1cf75c37725f9b6500e5fdc2e1cfab6c575328214b4951d00
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}/usr/bin/debconf-gettextize" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a debconf-gettextize "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/debconf-updatepo" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a debconf-updatepo "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}"/usr/share/doc/po-debconf/manpages.vi/*.html >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/doc/po-debconf/manpages.vi"
        cp -a doc/vi/*.html "${{targets.destdir}}/usr/share/doc/po-debconf/manpages.vi/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/encodings" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf"
        cp -a encodings "${{targets.destdir}}/usr/share/po-debconf/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/po2debconf" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a po2debconf "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/podebconf-display-po" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a podebconf-display-po "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/podebconf-report-po" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a podebconf-report-po "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/call" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/call "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/call-po" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/call-po "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/submit" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/submit "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/submit-po" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/submit-po "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/translators" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/translators "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/templates/translators-po" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf/templates"
        cp -a podebconf-report-po_templates/translators-po "${{targets.destdir}}/usr/share/po-debconf/templates/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/po-debconf/pot-header" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/po-debconf"
        cp -a pot-header "${{targets.destdir}}/usr/share/po-debconf/"
      fi
      mkdir -p "${{targets.destdir}}/usr/share/doc/po-debconf"
      cp -a README "${{targets.destdir}}/usr/share/doc/po-debconf/"
      cp -a README-trans "${{targets.destdir}}/usr/share/doc/po-debconf/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/po-debconf
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - perl  # Debian: libcompress-zlib-perl
        - perl-mail-sendmail  # Wolfi Community Packages (Debian: libmail-sendmail-perl)
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - debconf  # Priority: required in Debian, so on every testbed
  pipeline:
    - runs: |
        debconf-gettextize --version || (debconf-gettextize --help 2>&1 || true) | grep -qi -e usage -e debconf-gettextize
        debconf-updatepo --version || (debconf-updatepo --help 2>&1 || true) | grep -qi -e usage -e debconf-updatepo
        po2debconf --version || (po2debconf --help 2>&1 || true) | grep -qi -e usage -e po2debconf
        podebconf-display-po --version || (podebconf-display-po --help 2>&1 || true) | grep -qi -e usage -e podebconf-display-po
        podebconf-report-po --version || (podebconf-report-po --help 2>&1 || true) | grep -qi -e usage -e podebconf-report-po
        test -f /usr/share/licenses/po-debconf/COPYING
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/p/po-debconf/po-debconf_${{package.version}}.tar.xz
        expected-sha256: d3f896f2cde156c1cf75c37725f9b6500e5fdc2e1cfab6c575328214b4951d00
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc libcompress-zlib-perl=perl libmail-sendmail-perl=perl-mail-sendmail perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/po-debconf.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/po-debconf.templates" && break
        done
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'autopkgtest: upstream-tests.sh'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e

        cd tests
        ./run.pl
