# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libparmap-ocaml
  version: '1.2.5'
  epoch: 0
  description: Small OCaml library allowing to exploit multicore architectures (runtime)
  copyright:
    - license: LGPL-2-with-linking-exception
    - license: GPL-2.0-or-later
      paths:
        - 'tests/*'
    - license: GPL-2.0-or-later
      paths:
        - 'example/*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libdune-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Do-not-run-tests-that-are-too-heavy-for-buildds.patch; do mv libparmap-ocaml/$f .recipe-files/; done
      rmdir libparmap-ocaml 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/rdicosmo/parmap
      tag: ${{package.version}}
      expected-commit: 963608763589e03de38e744d359884d491e65460
  - uses: patch
    with:
      patches: .recipe-files/0001-Do-not-run-tests-that-are-too-heavy-for-buildds.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p parmap -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" parmap
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libparmap-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libparmap-ocaml-dev
    description: Small OCaml library allowing to exploit multicore architectures (development)
    pipeline:
      - runs: |
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*opam*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*dune*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.ml*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmi; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmt*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.a; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmx; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmxa; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libparmap-ocaml-dev"
          for f in "${{targets.destdir}}"/usr/doc/parmap/*; do cp -a "$f" "${{targets.contextdir}}/usr/share/doc/libparmap-ocaml-dev/"; done
          rm -rf "${{targets.destdir}}"/usr/doc/parmap/*
          rmdir "${{targets.destdir}}/usr/doc/parmap" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libparmap-ocaml  # Debian: ${ocaml:Depends}
        - libdune-ocaml-dev  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: rdicosmo/parmap
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libparmap-ocaml/LICENSE
    - uses: test/tw/ldd-check
