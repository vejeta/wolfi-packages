package:
  name: libocaml-compiler-libs-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: OCaml compiler libraries repackaged
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-compiler-libs  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ocaml-compiler-libs
      tag: v${{package.version}}
      expected-commit: 6df244cbefc636856efc116fee8a345013b49afa
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ocaml-compiler-libs -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ocaml-compiler-libs
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocaml-compiler-libs-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/ocaml-compiler-libs/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libocaml-compiler-libs-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/ocaml-compiler-libs/*
      rmdir "${{targets.destdir}}/usr/doc/ocaml-compiler-libs" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libocaml-compiler-libs-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: janestreet/ocaml-compiler-libs
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libocaml-compiler-libs-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
