package:
  name: capnproto
  version: '1.5.0'
  epoch: 0
  description: 'Tools for working with the Cap''n Proto format'
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - openssl-dev
      - zlib-dev
      - cmake
      - linux-headers
      - ninja  # Alpine: samurai
      - openssl
      - zlib
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv capnproto/* .recipe-files/
      rmdir capnproto
  - uses: fetch
    with:
      uri: https://capnproto.org/capnproto-c++-${{package.version}}.tar.gz
      expected-sha512: e287c6b9399a2495e3c98c99d3d7ec5756e64890bd7449da9ef88ee341bc3ceb1a7d176f7375cbba1fd3fb1d8c0733949e3c99bd50fe62066d6ab488abd7954d
  - uses: patch
    with:
      patches: .recipe-files/test.patch
  - name: Build
    runs: |
      cmake -B build -G Ninja \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DCMAKE_INSTALL_LIBDIR=lib \
      	-DBUILD_SHARED_LIBS=True \
      	-DCMAKE_BUILD_TYPE=None
      cmake --build build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" cmake --install build
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: capnproto-dev
    description: 'Tools for working with the Cap''n Proto format (dev)'
    pipeline:
      - uses: split/dev
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/bin
    dependencies:
      runtime:
        - openssl-dev
        - zlib-dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
update:
  enabled: true
  release-monitor:
    identifier: 11515
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
