package:
  name: libptime-ocaml-dev
  version: '1.2.0'
  epoch: 0
  description: POSIX time for OCaml (development)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libptime-ocaml  # Debian: ${ocaml:Depends}
      - libjs-of-ocaml-dev  # Debian: ${ocaml:Depends}
      - libtopkg-ocaml-dev  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - libjs-of-ocaml-dev  # Wolfi Community Packages
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://erratique.ch/software/ptime/releases/ptime-${{package.version}}.tbz
      expected-sha256: 9616747fdf490ec36e8024cab27ee01e3a0af577d8a23226638fa4034de73ab0
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      opam-installer --prefix=${{targets.destdir}}/ --libdir=./usr/lib/ocaml ptime.install
      rm -f ${{targets.destdir}}/doc/*/LICENSE*
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libptime-ocaml-dev"
      cp -a doc/*/* "${{targets.destdir}}/usr/share/doc/libptime-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libptime-ocaml-dev
subpackages:
  - name: libptime-ocaml
    description: POSIX time for OCaml (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/stublibs"
          mv "${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll*.so "${{targets.contextdir}}/usr/lib/ocaml/stublibs/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/META; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  release-monitor:
    identifier: 256614
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libptime-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
