    description: Metapackage ensuring an init system is installed
    pipeline:
      - runs: |
          true
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - build-base  # Debian: build-essential
        - fakeroot  # Wolfi Community Packages
        - fakechroot  # Wolfi Community Packages
        - perl-test-deep  # Debian: libtest-deep-perl
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -x /usr/bin/deb-systemd-helper
        test -x /usr/bin/deb-systemd-invoke
        test -x /usr/bin/invoke-rc.d
        test -x /usr/bin/service
        test -x /usr/bin/update-rc.d
        test -f /usr/share/doc/init-system-helpers/copyright
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/i/init-system-helpers/init-system-helpers_1.69+nmu3.tar.xz
        expected-sha256: 2f2e77959651aac19902681d67e2c740056de5df1193f776fe80a0ad78af42d3
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc libtest-deep-perl=perl-test-deep perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
    - name: 'autopkgtest: t'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set -eu

        export TEST_ON_REAL_SYSTEM=1
        export TEST_INSTALLED=1

        # test with fakechroot
        for test in t/*.t; do
            echo "======== $(basename $test) (fakechroot) ======="
            fakechroot fakeroot perl $test
        done
        # test with DPKG_ROOT
        for test in t/*.t; do
            echo "======== $(basename $test) (DPKG_ROOT) ======="
            TEST_DPKG_ROOT=1 perl $test
        done
