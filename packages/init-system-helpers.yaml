  - name: From debian/rules execute_after_dh_auto_build
    runs: |
      set -e ;  	for file in script/deb-*; do  		pod2man --section=1p --utf8 --center="init-system-helpers" --release=${{package.version}} $file $file.1p;  	done
      set -e ;  	for file in man8/*.rst ; do  		rst2man $file ${file%.rst}.8 ;  	done
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a script/deb-systemd-helper "${{targets.destdir}}/usr/bin/"
      cp -a script/deb-systemd-invoke "${{targets.destdir}}/usr/bin/"
      cp -a script/invoke-rc.d "${{targets.destdir}}/usr/bin/"
      cp -a script/service "${{targets.destdir}}/usr/bin/"
      cp -a script/update-rc.d "${{targets.destdir}}/usr/bin/"
      install -Dm644 man8/invoke-rc.d.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 man8/service.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 man8/update-rc.d.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 script/deb-systemd-helper.1p -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 script/deb-systemd-invoke.1p -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/etc/rc0.d"
      mkdir -p "${{targets.destdir}}/etc/rc1.d"
      mkdir -p "${{targets.destdir}}/etc/rc2.d"
      mkdir -p "${{targets.destdir}}/etc/rc3.d"
      mkdir -p "${{targets.destdir}}/etc/rc4.d"
      mkdir -p "${{targets.destdir}}/etc/rc5.d"
      mkdir -p "${{targets.destdir}}/etc/rc6.d"
      mkdir -p "${{targets.destdir}}/etc/rcS.d"
      mkdir -p "${{targets.destdir}}/etc/systemd/system"
      mkdir -p "${{targets.destdir}}/etc/systemd/user"
      mkdir -p "${{targets.destdir}}/var/lib/systemd"
