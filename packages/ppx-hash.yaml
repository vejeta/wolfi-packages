package:
  name: libppx-hash-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: Ppx writer generating hash functions (development)
  copyright:
    - license: MIT
    - license: CC0-1.0
      paths:
        - 'runtime-lib/siphash/siphash.c*'
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libounit-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libppx-compare-ocaml-dev is not in Wolfi (Debian: libppx-compare-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-sexp-conv-ocaml-dev is not in Wolfi (Debian: libppx-sexp-conv-ocaml-dev); left out
      # TODO(debian-to-melange): libppxlib-jane-ocaml-dev is not in Wolfi (Debian: libppxlib-jane-ocaml-dev); left out
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_hash
      tag: v${{package.version}}
      expected-commit: abaac61f5f752ad661cc14b62cceb6f4bc1de9ac
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-hash-ocaml-dev"
      cp -a usr/doc/ppx_hash/* "${{targets.destdir}}/usr/share/doc/libppx-hash-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-hash
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-hash-ocaml
    description: Ppx writer generating hash functions (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libppx-hash-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_hash
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-hash/LICENSE.md
    - uses: test/tw/ldd-check
