package:
  name: font-isas-misc
  version: '1.0.4'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: HPND
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-isas-misc-${{package.version}}.tar.xz
      expected-sha512: 7c8cc9083600949fff4a0373f9f22df80f6a2c97d8d56bc2c4d03b102d16ad071b984b1ecf547d2d17ede9335e5c3a418512631a18938b7728c66b4339dcedd5
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-mapfiles=/usr/share/fonts/util \
      	--with-fontdir=/usr/share/fonts/misc \
      make
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install

      install -Dm644 COPYING "$pkgdir/usr/share/licenses/$pkgname/COPYING"
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: font-isas-misc-doc
    description: X.org misc font (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 17193
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
