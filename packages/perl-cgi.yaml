package:
  name: perl-cgi
  version: '4.72'
  epoch: 0
  description: Handle Common Gateway Interface requests and responses
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-html-parser
      - perl-uri
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-html-parser
      - perl-uri
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/L/LE/LEEJO/CGI-${{package.version}}.tar.gz
      expected-sha512: ec7f9d3707e6fba766b147625df5c6bda325e9d9d92e677d20c550a52fba919e249ad1242277521efa75985d94685ed60979b591b48b1f02b1846ffe2db71738
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-cgi-doc
    description: Handle Common Gateway Interface requests and responses (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          file; find "$pkgdir" -name "*.pod" | while read -r file; do
          	amove "${file#"$pkgdir"}"
          done
update:
  enabled: true
  release-monitor:
    identifier: 2687
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
