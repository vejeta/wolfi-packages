package:
  name: libbase-ocaml-dev
  version: '0.17.3'
  epoch: 0
  description: 'Jane Street''s alternative standard library (development)'
  copyright:
    - license: MIT
    - license: Apache-2.0
      paths:
        - src/map.ml
        - src/random.mli
        - src/set.ml
  dependencies:
    runtime:
      - libbase-ocaml  # Debian: ${ocaml:Depends}
      - libdune-configurator-ocaml-dev  # Debian: ${ocaml:Depends}
      - libsexplib0-ocaml-dev  # Debian: ${ocaml:Depends}
      - libocaml-intrinsics-kernel-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libdune-configurator-ocaml-dev  # Wolfi Community Packages
      - libsexplib0-ocaml-dev  # Wolfi Community Packages
      - libocaml-intrinsics-kernel-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/base
      tag: v${{package.version}}
      expected-commit: f8d1d3ad1894590cd19d11b9a89fe799caee5e57
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p base -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" base
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbase-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/base/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libbase-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/base/*
      rmdir "${{targets.destdir}}/usr/doc/base" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libbase-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libbase-ocaml
    description: 'Jane Street''s alternative standard library (runtime)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml"
          mv "${{targets.destdir}}/usr/lib/ocaml/stublibs" "${{targets.contextdir}}/usr/lib/ocaml/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/base"
          mv "${{targets.destdir}}/usr/lib/ocaml/base/META" "${{targets.contextdir}}/usr/lib/ocaml/base/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/base/base_internalhash_types"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/base_internalhash_types/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/base/base_internalhash_types/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/base/base_internalhash_types/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/base/base_internalhash_types/"
          done
          true
update:
  enabled: true
  github:
    identifier: janestreet/base
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libbase-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
