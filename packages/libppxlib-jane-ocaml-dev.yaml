# Debian packaging: https://salsa.debian.org/ocaml-team/ppxlib-jane
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppxlib-jane-ocaml-dev
  version: '0.17.4'
  epoch: 0
  description: Utilities to work on AST of the Jane Street OCaml compiler (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libppxlib-jane-ocaml  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppxlib_jane
      tag: v${{package.version}}
      expected-commit: 7614fc7d9bef1b69a74c417c3df5eb3a9ed61719
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppxlib_jane -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppxlib_jane
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppxlib-jane-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ppxlib_jane/* "${{targets.destdir}}/usr/share/doc/libppxlib-jane-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ppxlib_jane" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppxlib-jane-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppxlib-jane-ocaml
    description: Utilities to work on AST of the Jane Street OCaml compiler (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppxlib_jane"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppxlib_jane/META" "${{targets.contextdir}}/usr/lib/ocaml/ppxlib_jane/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppxlib_jane/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppxlib_jane/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppxlib_jane/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppxlib_jane/"
update:
  enabled: true
  github:
    identifier: janestreet/ppxlib_jane
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppxlib-jane-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
