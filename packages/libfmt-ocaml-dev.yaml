#
# Conversion notes:
# - upstream tarball from debian/watch
# - dh --with ocaml has no direct melange equivalent; review
# - port debian/rules override_dh_auto_install: opam-installer --prefix=$(DESTDIR) --libdir=.$(OCAML_STDLIB_DIR) fmt.install && rm -f $(DESTDIR)/doc/fmt/LICENSE.md
package:
  name: libfmt-ocaml-dev
  version: '0.11.0'
  epoch: 0
  description: OCaml Format pretty-printer combinators (development)
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Avoid-infinite-loop-in-test.patch; do mv libfmt-ocaml-dev/$f .recipe-files/; done
      rmdir libfmt-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://erratique.ch/software/fmt/releases/fmt-${{package.version}}.tbz
      expected-sha256: 857cfd47a54b52429cd9b3e2665e44173cd1bd3b435bece7172f984ad5376a1b
  - uses: patch
    with:
      patches: .recipe-files/0001-Avoid-infinite-loop-in-test.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --with-base-unix true --with-cmdliner true --tests true
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: opam-installer --prefix=$(DESTDIR) --libdir=.$(OCAML_STDLIB_DIR) fmt.install && rm -f $(DESTDIR)/doc/fmt/LICENSE.md
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/ocaml/fmt"
      cp -a usr/lib/ocaml/fmt/opam "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.ml* "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.cmi "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.cmt* "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.cmx "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.cmxa "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      cp -a usr/lib/ocaml/fmt/*.a "${{targets.destdir}}/usr/lib/ocaml/fmt/"
      for f in "."/usr/lib/ocaml/fmt/*/*.ml*; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      for f in "."/usr/lib/ocaml/fmt/*/*.cmi; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      for f in "."/usr/lib/ocaml/fmt/*/*.cmt*; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      for f in "."/usr/lib/ocaml/fmt/*/*.cmx; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      for f in "."/usr/lib/ocaml/fmt/*/*.cmxa; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      for f in "."/usr/lib/ocaml/fmt/*/*.a; do
        [ -e "$f" ] || continue
        r="${f#./}"
        mkdir -p "${{targets.destdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.destdir}}/$r"
      done
      mkdir -p "${{targets.destdir}}/usr/share/doc/libfmt-ocaml-dev"
      cp -a doc/fmt/* "${{targets.destdir}}/usr/share/doc/libfmt-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libfmt-ocaml-dev
subpackages:
  - name: libfmt-ocaml
    description: OCaml Format pretty-printer combinators (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/fmt"
          cp -a usr/lib/ocaml/fmt/META "${{targets.contextdir}}/usr/lib/ocaml/fmt/"
          cp -a usr/lib/ocaml/fmt/fmt.cma "${{targets.contextdir}}/usr/lib/ocaml/fmt/"
          cp -a usr/lib/ocaml/fmt/fmt.cmxs "${{targets.contextdir}}/usr/lib/ocaml/fmt/"
          for f in "."/usr/lib/ocaml/fmt/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#./}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.contextdir}}/$r"
          done
          for f in "."/usr/lib/ocaml/fmt/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#./}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && cp -a "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libfmt-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
