package:
  name: mmdebstrap
  version: '1.6.0'
  epoch: 0
  description: Create a Debian chroot
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # TODO(debian-to-melange): apt is not in Wolfi (Debian: apt); left out
      # Debian Recommends (not supported by apk): arch-test, gpg, libdistro-info-perl, libdpkg-perl, mount, python3, uidmap
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - help2man
      - python3
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-hurd-profile.sh-shfmt-and-shellcheck.patch 0001-tests-check-against-debootstrap-dist-isc-dhcp-client.patch 0001-tests-manually-add-entries-in-dev-to-tar1.txt.patch copyright; do mv mmdebstrap/$f .recipe-files/; done
      rmdir mmdebstrap 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_${{package.version}}.orig.tar.gz
      expected-sha256: fefd758092243f6d38bc4070867f1887c87f762031869fc8fdbc5d16918d390b
  - uses: patch
    with:
      patches: .recipe-files/0001-hurd-profile.sh-shfmt-and-shellcheck.patch .recipe-files/0001-tests-check-against-debootstrap-dist-isc-dhcp-client.patch .recipe-files/0001-tests-manually-add-entries-in-dev-to-tar1.txt.patch
  # TODO(debian-to-melange): port debian/rules override_dh_install: mkdir -p debian/tmp/usr/bin && cp -a mmdebstrap debian/tmp/usr/bin/mmdebstrap && cp -a tarfilter debian/tmp/usr/bin/mmtarfilter && cp -a mmdebstrap-autopkgtest-build-qemu debian/tmp/usr/bin/mmdebstrap
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/mmdebstrap/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/mmdebstrap/examples/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/mmdebstrap/copyright
  - name: From debian/rules override_dh_installman
    runs: |
      mkdir -p .
      pod2man ${{targets.destdir}}/usr/bin/mmdebstrap > ./mmdebstrap.1
      pod2man ${{targets.destdir}}/usr/bin/mmdebstrap-autopkgtest-build-qemu > ./mmdebstrap-autopkgtest-build-qemu.1
      help2man --no-info --name "filter a tarball like dpkg does" --version-string="1.6.0" ${{targets.destdir}}/usr/bin/mmtarfilter > ./mmtarfilter.1
      rm ./mmdebstrap.1 ./mmtarfilter.1 ./mmdebstrap-autopkgtest-build-qemu.1
update:
  enabled: true
  release-monitor:
    identifier: 389856
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/mmdebstrap/copyright
    # TODO(debian-to-melange): autopkgtest '
testsuite,' left out; it needs packages that are not in Wolfi
    # TODO(debian-to-melange): autopkgtest 'false' left out; it needs packages that are not in Wolfi
