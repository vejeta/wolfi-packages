# Generated by debian-to-melange 0.1.0 from Debian source package
# mmdebstrap 1.6.0-5 (3.0 (quilt)).
# https://tracker.debian.org/pkg/mmdebstrap
# Debian packaging: https://salsa.debian.org/debian/mmdebstrap
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.6.0.orig.tar.gz), which disappears from the pool when Debian updates
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: mmdebstrap
  version: '1.6.0'
  epoch: 0
  description: Create a Debian chroot
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - apt  # Wolfi Community Packages
      - perl  # Debian: ${perl:Depends}
      # Debian Recommends (not supported by apk): arch-test, gpg, libdistro-info-perl, libdpkg-perl, mount, python3, uidmap
      - setpriv  # used by the shell scripts; Essential in Debian
      - perl-ph-headers  # Wolfi Community Packages; the Perl code requires *.ph
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - help2man
      - python3
      - coreutils
      - findutils
      - perl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-hurd-profile.sh-shfmt-and-shellcheck.patch 0001-tests-check-against-debootstrap-dist-isc-dhcp-client.patch 0001-tests-manually-add-entries-in-dev-to-tar1.txt.patch copyright; do mv mmdebstrap/$f .recipe-files/; done
      rmdir mmdebstrap 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_${{package.version}}.orig.tar.gz
      expected-sha256: fefd758092243f6d38bc4070867f1887c87f762031869fc8fdbc5d16918d390b
  - uses: patch
    with:
      patches: .recipe-files/0001-hurd-profile.sh-shfmt-and-shellcheck.patch .recipe-files/0001-tests-check-against-debootstrap-dist-isc-dhcp-client.patch .recipe-files/0001-tests-manually-add-entries-in-dev-to-tar1.txt.patch
  - name: From debian/rules override_dh_install
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      cp -a mmdebstrap ${{targets.destdir}}/usr/bin/mmdebstrap
      cp -a tarfilter ${{targets.destdir}}/usr/bin/mmtarfilter
      cp -a mmdebstrap-autopkgtest-build-qemu ${{targets.destdir}}/usr/bin/mmdebstrap-autopkgtest-build-qemu
      mkdir -p ${{targets.destdir}}/usr/lib/apt/solvers
      cp -a proxysolver ${{targets.destdir}}/usr/lib/apt/solvers/mmdebstrap-dump-solution
      mkdir -p ${{targets.destdir}}/usr/share/mmdebstrap
      mkdir -p ${{targets.destdir}}/usr/share
      cp -a hooks ${{targets.destdir}}/usr/share/mmdebstrap
      mkdir -p ${{targets.destdir}}/usr/libexec/mmdebstrap
      mkdir -p ${{targets.destdir}}/usr/libexec
      cp -a gpgvnoexpkeysig ${{targets.destdir}}/usr/libexec/mmdebstrap
      cp -a ldconfig.fakechroot ${{targets.destdir}}/usr/libexec/mmdebstrap
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}/usr/bin" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr"
        cp -a usr/bin "${{targets.destdir}}/usr/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/solvers" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt"
        cp -a usr/lib/apt/solvers "${{targets.destdir}}/usr/lib/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/libexec/mmdebstrap" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/libexec"
        cp -a usr/libexec/mmdebstrap "${{targets.destdir}}/usr/libexec/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/mmdebstrap" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share"
        cp -a usr/share/mmdebstrap "${{targets.destdir}}/usr/share/"
      fi
      mkdir -p "${{targets.destdir}}/usr/share/doc/mmdebstrap/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/mmdebstrap/examples/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/mmdebstrap/copyright
  - name: From debian/rules override_dh_installman
    runs: |
      pod2man ${{targets.destdir}}/usr/bin/mmdebstrap > ./mmdebstrap.1
      pod2man ${{targets.destdir}}/usr/bin/mmdebstrap-autopkgtest-build-qemu > ./mmdebstrap-autopkgtest-build-qemu.1
      help2man --no-info --name "filter a tarball like dpkg does" --version-string="1.6.0" ${{targets.destdir}}/usr/bin/mmtarfilter > ./mmtarfilter.1
      install -Dm644 ./mmdebstrap.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 ./mmtarfilter.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 ./mmdebstrap-autopkgtest-build-qemu.1 -t "${{targets.destdir}}/usr/share/man/man1"
      rm ./mmdebstrap.1 ./mmtarfilter.1 ./mmdebstrap-autopkgtest-build-qemu.1
update:
  enabled: true
  release-monitor:
    identifier: 389856
test:
  environment:
    contents:
      packages:
        - busybox
        - shadow  # Debian: adduser
        - apt-cudf  # Wolfi Community Packages
        - arch-test  # Wolfi Community Packages
        - aspcud  # Wolfi Community Packages
        - black  # Wolfi Community Packages
        - py3.13-codespell-bin  # Debian: codespell
        - debian-archive-keyring  # Wolfi Community Packages
        - debootstrap  # Wolfi Community Packages
        - diffoscope
        - e2fsprogs
        - fakechroot  # Wolfi Community Packages
        - fakeroot  # Wolfi Community Packages
        - genext2fs  # Wolfi Community Packages
        - gpg
        - dctrl-tools  # Wolfi Community Packages (Debian: grep-dctrl)
        - iputils  # Debian: iputils-ping
        - libcap-utils  # Debian: libcap2-bin
        - perl-perl-critic  # Wolfi Community Packages (Debian: libperl-critic-perl)
        - mmdebstrap
        - mount
        - perl-doc
        - perl-tidy  # Debian: perltidy
        - procps
        - python3
        - py3-apt  # Wolfi Community Packages (Debian: python3-apt)
        - py3-supported-debian  # Wolfi Community Packages (Debian: python3-debian)
        - shellcheck  # Wolfi Community Packages
        - shfmt
        - squashfs-tools-ng  # Wolfi Community Packages
        - sudo
        - tzdata
        - just-newuidmap-newgidmap  # Debian: uidmap
        - util-linux-misc  # Debian: util-linux-extra
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - runuser
        - script
        - setpriv  # used by the source's shell scripts; Essential in Debian
        - apt  # the Debian testbed's apt sources
  pipeline:
    - runs: |
        test -f /usr/share/doc/mmdebstrap/copyright
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_${{package.version}}.orig.tar.gz
        expected-sha256: fefd758092243f6d38bc4070867f1887c87f762031869fc8fdbc5d16918d390b
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/m/mmdebstrap/mmdebstrap_1.6.0-5.debian.tar.xz
        strip-components: 0
        expected-sha256: c7259cf452f7912cc34e1035f4cb15275ba166173556f4df94867ed7301cf430
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='adduser=shadow codespell=py3.13-codespell-bin grep-dctrl=dctrl-tools iputils-ping=iputils libc-bin=glibc libc6=glibc libcap2-bin=libcap-utils libperl-critic-perl=perl-perl-critic perl-base=perl perltidy=perl-tidy python3-apt=py3-apt python3-debian=py3-supported-debian uidmap=just-newuidmap-newgidmap util-linux-extra=util-linux-misc uuid-runtime=util-linux-misc' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/mmdebstrap.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/mmdebstrap.templates" && break
        done
    - name: apt sources (as on a Debian unstable testbed)
      runs: |
        [ -e /etc/debian_version ] || echo forky/sid > /etc/debian_version
        if [ ! -s /etc/apt/sources.list ] && [ -z "$(ls /etc/apt/sources.list.d 2>/dev/null)" ]; then
          mkdir -p /etc/apt/sources.list.d
          printf 'Types: deb\nURIs: http://deb.debian.org/debian\nSuites: unstable\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n' > /etc/apt/sources.list.d/debian.sources
        fi
        apt-get update
    - name: 'autopkgtest: testsuite'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        export AUTOPKGTEST_NORMAL_USER=build
        chmod 755 / 2>/dev/null || true
        chmod 1777 "$AUTOPKGTEST_TMP"
        chmod -R a+rX "$PWD" 2>/dev/null || true
        rc=0
        (
        set -exu

        # dump information about the autopkgtest runner
        # print to stderr to prevent wrong interleaving with set -x output
        cat /etc/debian_version >&2
        env >&2
        nproc >&2
        apt-config dump >&2
        apt-cache policy >&2
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/preferences.d/*; do
        	[ -e "$f" ] || continue
        	echo "dumping contents of $f" >&2
        	cat "$f" >&2
        done

        # The mmdebstrap autopkgtest can take a very long time and it cannot be split
        # into multiple individual tests because they all rely on the existence of the
        # local package cache. We cannot re-generate this cache multiple times because
        # if a dinstall happens while this autopkgtest is running (not unlikely because
        # this test takes 2 hours easy) then the chroots might not be bit-by-bit
        # identical with each other anymore. Being independent of unfortunate Debian
        # mirror updates is one of the reasons the cache exists.
        #
        # By default (and this cannot be changed), a autopkgtest "test" is allowed to
        # last 10000 seconds or 2:46:40 hours. If this test takes too long, we return
        # exit code 77, marking it as "skipped".

        TIME_BEGIN=$(date +%s)

        # the archive with the highest priority where the base-files package comes from
        # determines whether we are on stable, testing or unstable
        DEFAULT_DIST=$(cat << END | python3 -
        import apt_pkg, sys
        apt_pkg.init()
        c = apt_pkg.Cache(None)
        d = apt_pkg.DepCache(c)
        s = apt_pkg.SourceList()
        s.read_main_list()

        highest_prio = -1
        highest_archive = None
        for pkgfile, _ in d.get_candidate_ver(c["base-files"]).file_list:
        	print("processing: %s"%pkgfile, file=sys.stderr)
        	index = s.find_index(pkgfile)
        	if index is None:
        		print("index is none -- skipping", file=sys.stderr)
        		continue
        	if not index.is_trusted:
        		print("index is not trusted -- skipping", file=sys.stderr)
        		continue
        	archive = pkgfile.archive
        	if archive not in ["stable", "testing", "unstable"]:
        		print("index archive %s is %s -- skipping"%(index, archive), file=sys.stderr)
        		continue
        	prio = d.policy.get_priority(pkgfile)
        	if prio > highest_prio:
        		highest_prio = prio
        		highest_archive = archive
        if highest_archive is None:
        	print("highest priority apt archive is neither stable, testing or unstable", file=sys.stderr)
        	for f in c.file_list:
        		print('========================', file=sys.stderr)
        		for a in ['architecture', 'archive', 'codename', 'component', 'filename', 'id', 'index_type', 'label', 'not_automatic', 'not_source', 'origin', 'site', 'size', 'version']:
        			print("%s: %s"%(a, getattr(f, a, None)), file=sys.stderr)
        		print("priority: ", d.policy.get_priority(f), file=sys.stderr)
        	exit(1)
        print("highest archive priority: %s"%highest_archive, file=sys.stderr)
        print(highest_archive)
        END
        )

        # On stable and testing we can run tests that require m-a:same packages to
        # exist in the same version across multiple architectures. Only on unstable we
        # disable this because packages in unstable are often out-of-sync.
        RUN_MA_SAME_TESTS=yes
        case $DEFAULT_DIST in
        	unstable)
        		RUN_MA_SAME_TESTS=no
        		;;
        	stable|testing)
        		# nothing to do
        		;;
        	*)
        		echo "unknown distribution $DEFAULT_DIST, must be one of stable, testing or unstable" >&2
        		;;
        esac

        SRC="$(pwd)"

        # change to temporary directory to not interfere with the source
        cd "$AUTOPKGTEST_TMP"

        # coverage.sh expects the scripts to be in the current directory
        # we copy make_mirror.sh instead of symlinking it because we are going to patch
        # it
        cp -a "$SRC/make_mirror.sh" make_mirror.sh
        cp -a "$SRC/hooks" .
        cp -a "$SRC/tests" .
        for f in run_qemu.sh run_null.sh coverage.sh gpgvnoexpkeysig coverage.py coverage.txt caching_proxy.py .perltidyrc mmdebstrap-autopkgtest-build-qemu hurd.sh hurd-profile.sh hurd-compare.py; do
          ln -s "$SRC/$f" "$f"
        done

        # on Debian Salsa CI, $AUTOPKGTEST_NORMAL_USER is empty
        if [ -z "$AUTOPKGTEST_NORMAL_USER" ]; then
        	AUTOPKGTEST_NORMAL_USER=debci
        	useradd --create-home --groups sudo "$AUTOPKGTEST_NORMAL_USER"
        #	useradd --create-home --groups kvm "$AUTOPKGTEST_NORMAL_USER"
        #	ls -lha /dev/kvm || true
        #	lsmod | grep kvm || true
        else
        	adduser "$AUTOPKGTEST_NORMAL_USER" sudo
        #	adduser "$AUTOPKGTEST_NORMAL_USER" kvm
        fi

        mkdir ./shared
        chown "$AUTOPKGTEST_NORMAL_USER" ./shared

        echo "$AUTOPKGTEST_NORMAL_USER ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

        # we cannot use mini_httpd (or most other http servers) because they perform a
        # chdir() into the directory that is to be served on startup. But later on we
        # completely remove and replace that directory when creating the Debian mirror.
        # Thus we need a really stupid server which is able to cope with having its
        # www-root being replaced under its feet.
        #mini_httpd -D -h 127.0.0.1 -p 80 -u "$AUTOPKGTEST_NORMAL_USER" -T UTF-8 -dd "$AUTOPKGTEST_TMP/shared/cache" &
        python3 -m http.server --directory="$AUTOPKGTEST_TMP/shared/cache" --bind 127.0.0.1 80 2>/dev/null &
        HTTPD_PID=$!
        trap "kill $HTTPD_PID" INT QUIT TERM EXIT

        # create a fake mmdebstrap file in the current directory that coverage.sh can
        # copy
        cat << END > ./mmdebstrap
        #!/usr/bin/perl
        use strict;
        use warnings;
        exit(1)
        END

        # must not be used during testing -- installed version must be used instead
        cat << END > ./tarfilter
        #!/usr/bin/env python3
        exit(1)
        END

        # add entries to /etc/subuid and /etc/subgid if they don't exist yet
        if [ ! -e /etc/subuid ] || ! grep "$AUTOPKGTEST_NORMAL_USER" /etc/subuid; then
        	echo "$AUTOPKGTEST_NORMAL_USER:100000:65536" >> /etc/subuid
        fi
        if [ ! -e /etc/subgid ] || ! grep "$AUTOPKGTEST_NORMAL_USER" /etc/subgid; then
        	echo "$AUTOPKGTEST_NORMAL_USER:100000:65536" >> /etc/subgid
        fi

        ret=0
        timeout 50m runuser -u "$AUTOPKGTEST_NORMAL_USER" -- env CMD=mmdebstrap DEFAULT_DIST=$DEFAULT_DIST RUN_MA_SAME_TESTS=$RUN_MA_SAME_TESTS HAVE_QEMU=no HAVE_BINFMT=no USE_HOST_APT_CONFIG=yes "$SRC/make_mirror.sh" || ret=$?
        if [ "$ret" -ne 0 ]; then
        	echo "./make_mirror.sh failed" >&2
        	exit 77
        fi

        # subtract 10 seconds to account for the inaccuracy in measuring time
        TIMEOUT=$((10000-$(date +%s)+$TIME_BEGIN-10))

        # now run the script
        # we set CMD so that Devel::Cover is not used
        # HAVE_QEMU=no because there is no kvm kernel module
        # HAVE_BINFMT=no because there is no binfmt_misc kernel module
        ret=0
        timeout $TIMEOUT runuser -u "$AUTOPKGTEST_NORMAL_USER" -- env CMD="mmdebstrap --setup-hook=$SRC/debian/tests/sourcesfilter --hook-dir=$SRC/hooks/file-mirror-automount" DEFAULT_DIST=$DEFAULT_DIST RUN_MA_SAME_TESTS=$RUN_MA_SAME_TESTS HAVE_QEMU=no HAVE_BINFMT=no USE_HOST_APT_CONFIG=yes "$SRC/coverage.sh" --exitfirst || ret=$?
        if [ "$ret" -eq 124 ]; then
        	echo "command timed out after $TIMEOUT seconds" >&2
        	exit 77
        elif [ "$ret" -ne 0 ]; then
        	exit $ret
        fi

        # subtract 10 seconds to account for the inaccuracy in measuring time
        TIMEOUT=$((10000-$(date +%s)+$TIME_BEGIN-10))

        # exit successfully if there is not enough time left
        if [ "$TIMEOUT" -lt 3000 ]; then
        	echo "skipping remaining tests due to lack of remaining time" >&2
        	exit 0
        fi

        du -hs ./shared

        # FORCE_UPDATE=yes to force rebuilding the cache
        # ONLY_HOSTARCH=yes to limit the number of downloaded content
        # RUN_MA_SAME_TESTS=no because foreign arches are missing
        ret=0
        timeout $TIMEOUT runuser -u "$AUTOPKGTEST_NORMAL_USER" -- env CMD=mmdebstrap DEFAULT_DIST=$DEFAULT_DIST ONLY_HOSTARCH=yes FORCE_UPDATE=yes RUN_MA_SAME_TESTS=no HAVE_QEMU=no HAVE_BINFMT=no "$SRC/make_mirror.sh" || ret=$?
        if [ "$ret" -ne 0 ]; then
        	echo "./make_mirror.sh failed" >&2
        	exit 77
        fi

        # subtract 10 seconds to account for the inaccuracy in measuring time
        TIMEOUT=$((10000-$(date +%s)+$TIME_BEGIN-10))

        # run only those tests that were skipped because of USE_HOST_APT_CONFIG=yes but
        # ignore if any of them fails
        # failures here are irrelevant for transition testing because they cannot
        # respect the apt pinning options given by the test environment
        SKIPPED_TESTS=$(grep-dctrl --exact-match --field Needs-APT-Config true --no-field-names --show-field=Test < coverage.txt)
        # for tar1.txt also add create-directory test
        SKIPPED_TESTS="create-directory $SKIPPED_TESTS"
        timeout $TIMEOUT runuser -u "$AUTOPKGTEST_NORMAL_USER" -- env CMD="mmdebstrap" DEFAULT_DIST=$DEFAULT_DIST RUN_MA_SAME_TESTS=no HAVE_QEMU=no HAVE_BINFMT=no http_proxy= "$SRC/coverage.py" --exitfirst $SKIPPED_TESTS || exit 77

        du -hs ./shared

        exit 0
        ) || rc=$?
        if [ $rc = 77 ]; then echo 'autopkgtest skipped (exit status 77)'; else exit $rc; fi
