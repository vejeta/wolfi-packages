pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv libghc-pandoc-lua-engine-dev/$f .recipe-files/; done
      rmdir libghc-pandoc-lua-engine-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/haskell-pandoc-lua-engine/haskell-pandoc-lua-engine_${{package.version}}.orig.tar.gz
      expected-sha256: 1eeaedd4b2188a634c45bf1b2a58d7f4cf9788d059f151d82318d413e58ece08
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/libghc-pandoc-lua-engine-dev/copyright
subpackages:
  - name: libghc-pandoc-lua-engine-prof
    description: ${haskell:ShortDescription}${haskell:ShortBlurb}
    pipeline:
      # TODO(debian-to-melange): no debian/libghc-pandoc-lua-engine-prof.install; define which files go to this subpackage
      - runs: |
          true
  - name: libghc-pandoc-lua-engine-doc
    description: ${haskell:ShortDescription}${haskell:ShortBlurb}
    pipeline:
      - uses: split/manpages
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/libghc-pandoc-lua-engine-dev/copyright
    - uses: test/tw/ldd-check
