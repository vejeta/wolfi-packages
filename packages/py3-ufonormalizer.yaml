# Generated by debian-to-melange 0.1.0 from Debian source package
# ufonormalizer 0.6.3-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ufonormalizer
# Debian packaging: https://salsa.debian.org/fonts-team/ufonormalizer
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-ufonormalizer for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-ufonormalizer
  version: '0.6.3'
  epoch: 0
  description: Normalize the XML and other data inside of a UFO
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
vars:
  pypi-package: ufonormalizer
  import: ufonormalizer
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    LC_ALL: C.UTF-8
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/unified-font-object/ufoNormalizer
      tag: ${{package.version}}
      expected-commit: 8190c3be2a462175d4fd32439af66afa77e87414
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          if [ -d "${{targets.contextdir}}"/usr/bin ]; then
            mkdir -p "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr"
            cp -a "${{targets.contextdir}}"/usr/bin "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr/"
          fi
      - runs: |
          install -Dm644 LICENSE.txt -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
      - runs: |
          rm -rf "${{targets.contextdir}}"/usr/bin
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: ${{vars.pypi-package}} commands for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}-bin
    pipeline:
      - runs: |
          true
  - name: ufonormalizer
    description: Normalize the XML and other data inside of a UFO
    pipeline:
      - runs: |
          true
    dependencies:
      runtime:
        - py3.13-${{vars.pypi-package}}-bin
update:
  enabled: true
  github:
    identifier: unified-font-object/ufoNormalizer
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-ufonormalizer
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
