package:
  name: fakechroot
  version: '2.20.1'
  epoch: 0
  description: Gives a fake chroot environment - utilities
  copyright:
    - license: LGPL-2.1-or-later
    - license: BSD-3-Clause
      paths:
        - src/__opendir2.c
    - license: LGPL-2.1-only
      paths:
        - src/audit_log_acct_message.c
    - license: BSD-2-Clause
      paths:
        - src/dedotdot.c
    - license: BSD-3-Clause
      paths:
        - src/fts.c
    - license: BSD-3-Clause AND LGPL-2.1-or-later
      paths:
        - src/getcwd_real.c
    - license: BSD-3-Clause
      paths:
        - src/popen.c
    - license: LGPL-2.1-only
      paths:
        - src/rawmemchr.c
    - license: LGPL-3.0-or-later
      paths:
        - src/rpl_lstat.c
    - license: LGPL-3.0-or-later
      paths:
        - src/stpcpy.c
    - license: LGPL-3.0-or-later
      paths:
        - src/strchrnul.c
    - license: BSD-1-clause
      paths:
        - src/strlcpy.c
  dependencies:
    runtime:
      - binutils
      - libfakechroot
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - libtool
      - which  # Wolfi Community Packages (Debian: gnu-which)
      - jemalloc-dev  # Debian: libjemalloc-dev
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-New-statx-function.patch 0002-src-lckpwdf.c-create-an-empty-etc-.pwd.lock.patch 0003-check-return-value-of-dladdr.patch 0004-tmpnam.c-fix-heap-overflow.patch 0005-declare-missing-bufs-remove-ver-from-lstat.patch 0006-fix-glibc-2.33-compatibility.patch 0007-wrap-fstatat-and-fstatat64.patch 0008-Wrap-all-functions-accessing-etc-passwd-etc-group-an.patch 0009-add-test-t-rm.t-and-amend-test-t-touch.t-with-no-der.patch 0010-support-glibc-2.34-by-wrapping-__-f-l-stat-at-64_tim.patch 0011-also-investigate-.interp-section-for-architectures-t.patch 0012-test-touch.inc.sh-use-testtree-variable.patch 0013-symlink.t-also-test-lutimes-if-available-as-well-as-.patch 0014-wrap-__lutimes64-for-glibc-2.37.patch 0015-__readlink_chk-__readlinkat_chk-properly-pass-buffer.patch; do mv fakechroot/$f .recipe-files/; done
      rmdir fakechroot 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/dex4er/fakechroot
      tag: ${{package.version}}
      expected-commit: 8c5fff4db88038407ecf5c49813b9d9a75401a3f
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf Makefile.in aclocal.m4 build-aux config.h.in configure m4/libtool.m4 m4/ltoptions.m4 m4/ltsugar.m4 m4/ltversion.m4 m4/lt~obsolete.m4 man/Makefile.in man/fakechroot.1 scripts/Makefile.in src/Makefile.in test/Makefile.in test/src/Makefile.in
  - uses: patch
    with:
      patches: .recipe-files/0001-New-statx-function.patch .recipe-files/0002-src-lckpwdf.c-create-an-empty-etc-.pwd.lock.patch .recipe-files/0003-check-return-value-of-dladdr.patch .recipe-files/0004-tmpnam.c-fix-heap-overflow.patch .recipe-files/0005-declare-missing-bufs-remove-ver-from-lstat.patch .recipe-files/0006-fix-glibc-2.33-compatibility.patch .recipe-files/0007-wrap-fstatat-and-fstatat64.patch .recipe-files/0008-Wrap-all-functions-accessing-etc-passwd-etc-group-an.patch .recipe-files/0009-add-test-t-rm.t-and-amend-test-t-touch.t-with-no-der.patch .recipe-files/0010-support-glibc-2.34-by-wrapping-__-f-l-stat-at-64_tim.patch .recipe-files/0011-also-investigate-.interp-section-for-architectures-t.patch .recipe-files/0012-test-touch.inc.sh-use-testtree-variable.patch .recipe-files/0013-symlink.t-also-test-lutimes-if-available-as-well-as-.patch .recipe-files/0014-wrap-__lutimes64-for-glibc-2.37.patch .recipe-files/0015-__readlink_chk-__readlinkat_chk-properly-pass-buffer.patch
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
    with:
      opts: '--enable-dependency-tracking --with-libpath=no V=1 EXTRA_CFLAGS=''-Wall'' PROVEFLAGS="$(PROVEFLAGS)" ac_cv_path_CHROOT=/usr/sbin/chroot ac_cv_path_DEBOOTSTRAP=/usr/sbin/debootstrap ac_cv_path_ECHO=/bin/echo ac_cv_path_ENV=/usr/bin/env ac_cv_path_FAKEROOT=/usr/bin/fakeroot ac_cv_path_ISCHROOT=/usr/bin/ischroot ac_cv_path_LDCONFIG=/sbin/ldconfig ac_cv_path_LDD=/usr/bin/ldd ac_cv_path_PERL=/usr/bin/perl ac_cv_path_SHELL=/bin/sh'
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fakechroot/examples"
      cp -a scripts/relocatesymlinks.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      cp -a scripts/restoremode.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      cp -a scripts/savemode.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      cp -a test/archlinux.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      cp -a test/debootstrap.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      cp -a test/testtree.sh "${{targets.destdir}}/usr/share/doc/fakechroot/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fakechroot"
      cp -a NEWS.md "${{targets.destdir}}/usr/share/doc/fakechroot/"
      cp -a THANKS.md "${{targets.destdir}}/usr/share/doc/fakechroot/"
      install -Dm644 COPYING LICENSE -t "${{targets.destdir}}"/usr/share/licenses/fakechroot
  - name: From debian/rules execute_after_dh_auto_clean
    runs: |
      rm -f man/fakechroot.1
  - name: From debian/rules execute_after_dh_auto_install-arch
    runs: |
      echo /usr/lib/fakechroot > ${{targets.outdir}}/libfakechroot/etc/ld.so.conf.d/fakechroot-${{host.triplet.gnu}}.conf
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libfakechroot
    description: Gives a fake chroot environment - runtime
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/fakechroot"
          mv "${{targets.destdir}}"/usr/lib/fakechroot/*.so "${{targets.contextdir}}/usr/lib/fakechroot/"
          mkdir -p "${{targets.contextdir}}/etc/ld.so.conf.d"
update:
  enabled: true
  github:
    identifier: dex4er/fakechroot
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        * --version || (* --help 2>&1 || true) | grep -qi -e usage -e *
        test -x /usr/bin/*
        test -f /usr/share/licenses/fakechroot/COPYING
    # TODO(debian-to-melange): autopkgtest 'mmdebstrap' left out; it needs packages that are not in Wolfi
