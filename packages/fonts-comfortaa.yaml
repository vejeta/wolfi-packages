# Generated by debian-to-melange 0.1.0 from Debian source package
# fonts-comfortaa 3.001+ds-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-comfortaa
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-comfortaa
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-comfortaa/fonts-comfortaa_3.001+ds.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-comfortaa
  version: '3.001'
  epoch: 0
  description: Stylish, modern true type font
  copyright:
    - license: OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - fontmake
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright fonts-comfortaa.metainfo.xml; do mv fonts-comfortaa/$f .recipe-files/; done
      rmdir fonts-comfortaa 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-comfortaa/fonts-comfortaa_${{package.version}}+ds.orig.tar.xz
      expected-sha256: cdfb1b6d157c864c84b5f95cf6af2eaee0dd573dc61ae5eb7181ce3e8110e08f
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf old documentation/*.png documentation/*.pdf DESCRIPTION*html
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      fontmake -g sources/Comfortaa.glyphs -o ttf
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/truetype/comfortaa"
      cp -a fonts/TTF/*.ttf "${{targets.destdir}}/usr/share/fonts/truetype/comfortaa/"
      mkdir -p "${{targets.destdir}}/usr/share/metainfo"
      cp -a .recipe-files/fonts-comfortaa.metainfo.xml "${{targets.destdir}}/usr/share/metainfo/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-comfortaa"
      cp -a FONTLOG.txt "${{targets.destdir}}/usr/share/doc/fonts-comfortaa/"
      cp -a OFL.txt "${{targets.destdir}}/usr/share/doc/fonts-comfortaa/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-comfortaa/copyright
update:
  enabled: true
  release-monitor:
    identifier: 6487
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-comfortaa/copyright
