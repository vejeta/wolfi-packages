package:
  name: libppx-optcomp-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Optional compilation for OCaml (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-findlib
      - ocaml-dune
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libstdio-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_optcomp
      tag: v${{package.version}}
      expected-commit: b37b49acf8c9b934251ce04c78a9ea509d79b3c8
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-optcomp-ocaml-dev"
      cp -a usr/doc/ppx_optcomp/* "${{targets.destdir}}/usr/share/doc/libppx-optcomp-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-optcomp
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-optcomp-ocaml
    description: Optional compilation for OCaml (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libppx-optcomp-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_optcomp
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-optcomp/LICENSE.md
    - uses: test/tw/ldd-check
