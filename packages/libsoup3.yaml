package:
  name: libsoup3
  version: '3.6.6'
  epoch: 0
  description: Gnome HTTP client/server Library
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    runtime:
      - glib-networking  # Wolfi Community Packages
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - brotli-dev
      - gobject-introspection-dev
      - glib-gir  # GLib .gir files (part of glib-dev on Alpine)
      - libgcrypt-dev
      - libpsl-dev
      - meson
      - nghttp2-dev
      - sqlite-dev
      - vala
      - zlib-dev
pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libsoup/3.6/libsoup-${{package.version}}.tar.xz
      expected-sha512: 4018dc6f9823fd82cde0fecbb50cd1b5dd0ff4963f92f7ea465e67faf81e71580709eec59914ddbdff317963a88e4a8024e60e44087041175bc21e04022857d2
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }
      want_check() { return 1; }

      abuild_meson \
      	-Db_lto=true \
      	-Dtls_check=false \
      	-Dintrospection=enabled \
      	-Dvapi=enabled \
      	-Dtests="$(want_check && echo true || echo false)" \
      	. output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libsoup3-dev
    description: Gnome HTTP client/server Library (dev)
