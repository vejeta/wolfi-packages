package:
  name: libastring-ocaml-dev
  version: '0.8.5'
  epoch: 0
  description: Alternative String module for OCaml (development)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libastring-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://erratique.ch/software/astring/releases/astring-${{package.version}}.tbz
      expected-sha256: 865692630c07c3ab87c66cdfc2734c0fdfc9c34a57f8e89ffec7c7d15e7a70fa
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      opam-installer --prefix=${{targets.destdir}}/ --libdir=./usr/lib/ocaml astring.install
      rm -f ${{targets.destdir}}/doc/astring/LICENSE.md
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libastring-ocaml-dev"
      cp -a doc/astring/* "${{targets.destdir}}/usr/share/doc/libastring-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libastring-ocaml-dev
subpackages:
  - name: libastring-ocaml
    description: Alternative String module for OCaml (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/astring"
          mv "${{targets.destdir}}/usr/lib/ocaml/astring/META" "${{targets.contextdir}}/usr/lib/ocaml/astring/"
          mv "${{targets.destdir}}/usr/lib/ocaml/astring/astring.cma" "${{targets.contextdir}}/usr/lib/ocaml/astring/"
          mv "${{targets.destdir}}/usr/lib/ocaml/astring/astring.cmxs" "${{targets.contextdir}}/usr/lib/ocaml/astring/"
update:
  enabled: true
  release-monitor:
    identifier: 63825
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libastring-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
