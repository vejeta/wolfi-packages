package:
  name: libsigc++
  version: '2.12.2'
  epoch: 0
  description: Type-safe Signal Framework for C++
  copyright:
    - license: LGPL-3.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - meson
      - docbook-xml  # Alpine: docbook-xsl-nons
      - libxml2-utils  # Alpine: docbook-xsl-nons
      - libxslt  # Alpine: docbook-xsl-nons
      - perl
      - doxygen
      - graphviz
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/libsigcplusplus/libsigcplusplus/releases/download/${{package.version}}/libsigc++-${{package.version}}.tar.xz
      expected-sha512: a277a60dcf3bf6972656e565b233490e4b3dd2ce2c8cd0e2a340b9600f608310dfa4596a5a5f0f840dc1da717c035bc535d466d155d9b27225577d598a45bd89
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      abuild_meson \
      	-Db_lto=true \
      	-Dbuild-documentation=true \
      	. output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: libsigc++-dev
    description: Type-safe Signal Framework for C++ (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: libsigc++-devhelp
    description: Type-safe Signal Framework for C++ (devhelp)
    pipeline:
      # TODO(alpine-to-melange): no function for subpackage libsigc++-devhelp
      - runs: |
          true
  - name: libsigc++-doc
    description: Type-safe Signal Framework for C++ (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: libsigcplusplus/libsigcplusplus
    use-tag: true
test:
