package:
  name: which
  version: '2.25'
  epoch: 0
  description: A utility to show the full path of commands
  copyright:
    - license: GPL-2.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/which/which-${{package.version}}.tar.gz
      expected-sha512: 0c3dfa54858bd0ff6f9567f8224e0ea2b165ab585724adcce63df042703427c813c71fc0affe45950e45c0aa280f038eb9d1a7218df8372b214f99885ba5f2aa
  - uses: patch
    with:
      patches: which/gcc15.patch
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: which-doc
    description: A utility to show the full path of commands (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 5127
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
