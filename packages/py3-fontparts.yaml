# fontparts 0.14.1-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fontparts
# Debian packaging: https://salsa.debian.org/fonts-team/fontparts
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fontparts/fontparts_0.14.1.orig.tar.gz), which disappears from the pool when Debian updates
# - no debian/python-fontparts-doc.install; define which files go to this subpackage
# - autopkgtests converted to the test pipeline (1 steps)
# - Wolfi Python layout: py3.X-fontparts for Python 3.12, 3.13
package:
  name: py3-fontparts
  version: '0.14.1'
  epoch: 0
  description: API for interacting with the parts of fonts
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
vars:
  pypi-package: fontparts
  import: fontParts
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-booleanoperations  # Wolfi Community Packages (Debian: python3-booleanoperations)
      - py3-supported-defcon  # Wolfi Community Packages (Debian: python3-defcon)
      - py3-supported-fontmath  # Wolfi Community Packages (Debian: python3-fontmath)
      - py3-supported-fontpens  # Wolfi Community Packages (Debian: python3-fontpens)
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-sphinx  # Debian: python3-sphinx
      - coreutils
      - findutils
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in Backport-beginPath-change.patch remove-external-fonts-in-doc.patch; do mv py3-fontparts/$f .recipe-files/; done
      rmdir py3-fontparts 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fontparts/fontparts_${{package.version}}.orig.tar.gz
      expected-sha256: 7be901aa95357d376a4582b785b283346019e540a82002712a0e64cc9e0f576b
  - uses: patch
    with:
      patches: .recipe-files/Backport-beginPath-change.patch .recipe-files/remove-external-fonts-in-doc.patch
  - name: From debian/rules execute_before_dh_sphinxdoc
    runs: |
      PYTHONPATH=./Lib sphinx-build documentation/source debian/python-fontparts-doc/usr/share/doc/fontparts/html/
  - name: From debian/rules execute_after_dh_clean
    runs: |
      rm -fv Lib/fontParts/_version.py
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-booleanoperations
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - name: py3-fontparts-doc
    description: API for interacting with the parts of fonts (common documentation)
    pipeline:
      # TODO(debian-to-melange): no debian/python-fontparts-doc.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: robotools/fontParts
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-fontparts
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - patch  # to apply Debian's patches to the tested source
        - py3-supported-fontparts
  pipeline:
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/f/fontparts/fontparts_${{package.version}}.orig.tar.gz
        expected-sha256: 7be901aa95357d376a4582b785b283346019e540a82002712a0e64cc9e0f576b
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/f/fontparts/fontparts_0.14.1-4.debian.tar.xz
        strip-components: 0
        expected-sha256: 022c386c6b4ba229117b55053a6e13044dfd6ee9f9a2542c22ff8b6b58b597a6
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-all=python3 python3-fontparts=py3-fontparts' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-fontparts.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-fontparts.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: py3versions (as on a Debian testbed)
      runs: |
        mkdir -p /usr/local/bin
        cat > /usr/local/bin/py3versions <<'EOF'
        #!/bin/sh
        v=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
        case "$*" in *v*) echo "$v";; *) echo "python$v";; esac
        EOF
        chmod +x /usr/local/bin/py3versions
    - name: 'autopkgtest: set -e ; for py in $(py3versions -r 2>/dev/null) ; do cd "$A'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e ; for py in $(py3versions -r 2>/dev/null) ; do cd "$AUTOPKGTEST_TMP" ; echo "Testing with $py:" ; $py -c "import fontParts; print(fontParts)" ; done
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
