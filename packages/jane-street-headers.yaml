# Generated by debian-to-melange 0.1.0 from Debian source package
# jane-street-headers 0.17.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/jane-street-headers
# Debian packaging: https://salsa.debian.org/ocaml-team/jane-street-headers
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libjane-street-headers-ocaml
  version: '0.17.0'
  epoch: 0
  description: Common header files for Jane Street packages (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml-dune
      - ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/jane-street-headers
      tag: v${{package.version}}
      expected-commit: 7c166660dd6470e28a64cb4c453fd8b791c02724
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/jane-street-headers
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libjane-street-headers-ocaml-dev
    description: Common header files for Jane Street projects (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libjane-street-headers-ocaml-dev"
          cp -a usr/doc/jane-street-headers/* "${{targets.contextdir}}/usr/share/doc/libjane-street-headers-ocaml-dev/"
update:
  enabled: true
  github:
    identifier: janestreet/jane-street-headers
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/jane-street-headers/LICENSE.md
    - uses: test/tw/ldd-check
