#
# Conversion notes:
# - license MIT read from the notice in debian/copyright (not DEP-5); check it
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-gfs-complutum/fonts-gfs-complutum_1.1.orig.tar.bz2), which disappears from the pool when Debian updates
package:
  name: fonts-gfs-complutum
  version: '1.1'
  epoch: 0
  description: 'Ancient Greek font revival from the University of Alcalá, Spain'
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-gfs-complutum/$f .recipe-files/; done
      rmdir fonts-gfs-complutum 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-gfs-complutum/fonts-gfs-complutum_${{package.version}}.orig.tar.bz2
      expected-sha256: 0849e50f65285905b19e45e9e7b31972fe9b6bf9f0bd6b727856ed51677f38a5
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/complutum"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-gfs-complutum"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-gfs-complutum/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-gfs-complutum/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-gfs-complutum/copyright
