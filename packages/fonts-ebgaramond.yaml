#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-ebgaramond/fonts-ebgaramond_0.016+git20230418.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-ebgaramond
  version: 0.016_git20230418
  epoch: 0
  description: EB Garamond OpenType fonts
  copyright:
    - license: OFL-1.1
    - license: LaTeX
      paths:
        - tests/test-microtype.tex
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - fontforge
      - py3-supported-fontforge  # Debian: python3-fontforge
      - ttfautohint
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Build-12-Bold.patch 0002-Do-not-use-git-to-determine-version.patch; do mv fonts-ebgaramond/$f .recipe-files/; done
      rmdir fonts-ebgaramond 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-ebgaramond/fonts-ebgaramond_0.016+git20230418.orig.tar.xz
      expected-sha256: b96a185ae47dc729636116f9a273baac7d1e29bcddbc6e8e2ca9f54023c4107b
  - uses: patch
    with:
      patches: .recipe-files/0001-Build-12-Bold.patch .recipe-files/0002-Do-not-use-git-to-determine-version.patch
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-ebgaramond"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/fonts-ebgaramond/"
      cp -a README.xelualatex "${{targets.destdir}}/usr/share/doc/fonts-ebgaramond/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/fonts-ebgaramond
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: fonts-ebgaramond-extra
    description: EB Garamond SmallCaps and TrueType fonts
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/ebgaramond"
          mv "${{targets.destdir}}"/build/*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/ebgaramond/"
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/opentype/ebgaramond"
          mv "${{targets.destdir}}"/build/*SC*.otf "${{targets.contextdir}}/usr/share/fonts/opentype/ebgaramond/"
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/woff/ebgaramond"
          mv "${{targets.destdir}}"/web/*.woff "${{targets.contextdir}}/usr/share/fonts/woff/ebgaramond/"
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-ebgaramond/COPYING
