package:
  name: libppx-sexp-conv-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Generation of S-expressions from type definitions (dev files)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-findlib
      - ocaml-dune
      # TODO(debian-to-melange): libbase-ocaml-dev is not in Wolfi (Debian: libbase-ocaml-dev); left out
      # TODO(debian-to-melange): libsexplib0-ocaml-dev is not in Wolfi (Debian: libsexplib0-ocaml-dev); left out
      # TODO(debian-to-melange): libppxlib-jane-ocaml-dev is not in Wolfi (Debian: libppxlib-jane-ocaml-dev); left out
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_sexp_conv
      tag: v${{package.version}}
      expected-commit: 61df807fa9499dd309928c7595a8367525851be3
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-sexp-conv-ocaml-dev"
      cp -a usr/doc/ppx_sexp_conv/* "${{targets.destdir}}/usr/share/doc/libppx-sexp-conv-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-sexp-conv
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-sexp-conv-ocaml
    description: Generation of S-expressions from type definitions (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libppx-sexp-conv-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_sexp_conv
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
