package:
  name: happy
  version: '2.1.7'
  epoch: 0
  description: Parser generator for Haskell
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      # TODO(debian-to-melange): haskell-happy-lib-data is not in Wolfi (Debian: haskell-happy-lib-data); left out
      # TODO(debian-to-melange): haskell-happy-lib-data is not in Wolfi (Debian: haskell-happy-lib-data); left out
      # Debian Recommends (not supported by apk): ${haskell:Recommends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): haskell-devscripts is not in Wolfi (Debian: haskell-devscripts); left out
      - ghc  # Wolfi Community Packages
      - ghc-prof  # Wolfi Community Packages
      # TODO(debian-to-melange): libghc-happy-lib-dev is not in Wolfi (Debian: libghc-happy-lib-dev); left out
      # TODO(debian-to-melange): libghc-happy-lib-dev is not in Wolfi (Debian: libghc-happy-lib-dev); left out
      - happy
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/happy/happy_${{package.version}}.orig.tar.gz
      expected-sha256: 9e390f0ab082d11d46598f6215b2f6e8253059721860f81082409091532d7e2a
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/happy/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/happy/examples/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/happy
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 1294
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        happy --version || (happy --help 2>&1 || true) | grep -qi -e usage -e happy
        test -f /usr/share/licenses/happy/LICENSE
    - uses: test/tw/ldd-check
