# - runtime dependency 'haskell-happy-lib-data' (Debian 'haskell-happy-lib-data') not found in Wolfi; left out
# - build dependency 'haskell-devscripts' (Debian 'haskell-devscripts') not found in Wolfi; left out
# - build dependency 'libghc-happy-lib-dev' (Debian 'libghc-happy-lib-dev') not found in Wolfi; left out
