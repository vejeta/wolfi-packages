package:
  name: font-cursor-misc
  version: '1.0.4'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: LicenseRef-font-cursor-misc
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - util-macros
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - util-macros
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-cursor-misc-${{package.version}}.tar.xz
      expected-sha512: 22bd86a81cdfb1e17f885dc3961071c08920171a6f0736ae52d95c8e576b1debc7570aa3b7e1007f474b50435fba411f0eb1847894e8b52f6e6268d91cf9f2db
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-fontdir=/usr/share/fonts/misc
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Install the license file (LicenseRef-font-cursor-misc)
    runs: |
      for f in COPYING LICENSE LICENCE; do
        [ -f "$f" ] && install -Dm644 "$f" -t "${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      done; true
update:
  enabled: true
  release-monitor:
    identifier: 17210
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
