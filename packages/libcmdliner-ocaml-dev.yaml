#
# Generated by debian-to-melange 0.1.0 from Debian source package
# cmdliner 2.1.1-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/cmdliner
# Debian packaging: https://salsa.debian.org/ocaml-team/cmdliner
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/c/cmdliner/cmdliner_2.1.1.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libcmdliner-ocaml-dev
  version: '2.1.1'
  epoch: 0
  description: Declarative definition of command line interfaces
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - libresult-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/cmdliner/cmdliner_${{package.version}}.orig.tar.bz2
      expected-sha256: 05b938d1def4f54c478178f1982822834510431ed98f2ac67cb4d90aa120d6b6
  - runs: |
      make -j$(nproc)
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make DESTDIR=${{targets.destdir}}/ LIBDIR=${{targets.destdir}}/usr/lib/ocaml/cmdliner install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/examples"
      cp -a test/* "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libcmdliner-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 16583
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcmdliner-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
