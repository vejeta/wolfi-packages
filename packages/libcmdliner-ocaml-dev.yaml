# https://tracker.debian.org/pkg/cmdliner
# Debian packaging: https://salsa.debian.org/ocaml-team/cmdliner
#
# Conversion notes:
# - build dependency 'libresult-ocaml-dev' (Debian 'libresult-ocaml-dev') not found in Wolfi; left out
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/c/cmdliner/cmdliner_2.1.1.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
# - port debian/rules override_dh_auto_install: make DESTDIR=$(DESTDIR) LIBDIR=$(DESTDIR)$(OCAML_STDLIB_DIR)/cmdliner install
package:
  name: libcmdliner-ocaml-dev
  version: '2.1.1'
  epoch: 0
  description: Declarative definition of command line interfaces
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-findlib
      - ocamlbuild
      # TODO(debian-to-melange): libresult-ocaml-dev is not in Wolfi (Debian: libresult-ocaml-dev); left out
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/cmdliner/cmdliner_${{package.version}}.orig.tar.bz2
      expected-sha256: 05b938d1def4f54c478178f1982822834510431ed98f2ac67cb4d90aa120d6b6
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: make DESTDIR=$(DESTDIR) LIBDIR=$(DESTDIR)$(OCAML_STDLIB_DIR)/cmdliner install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr"
      cp -a usr/share "${{targets.destdir}}/usr/"
      cp -a usr/bin "${{targets.destdir}}/usr/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/examples"
      cp -a test/* "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/libcmdliner-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libcmdliner-ocaml-dev
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 16583
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcmdliner-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
