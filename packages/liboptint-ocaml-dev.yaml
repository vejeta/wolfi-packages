#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: liboptint-ocaml-dev
  version: '0.3.0'
  epoch: 0
  description: Efficient integer types on 64-bit architectures (dev)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - liboptint-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/optint
      tag: v${{package.version}}
      expected-commit: 66d321700e7c8c6cbcd3cd7c391e35d4943eac4b
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p optint -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" optint
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/liboptint-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/optint/* "${{targets.destdir}}/usr/share/doc/liboptint-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/optint" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/liboptint-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: liboptint-ocaml
    description: Efficient integer types on 64-bit architectures (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/optint"
          mv "${{targets.destdir}}/usr/lib/ocaml/optint/META" "${{targets.contextdir}}/usr/lib/ocaml/optint/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/optint/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/optint/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/optint/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/optint/"
          done
          true
update:
  enabled: true
  github:
    identifier: mirage/optint
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/liboptint-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
