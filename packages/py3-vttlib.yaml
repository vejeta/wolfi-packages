#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: fonttools, pyparsing, ufolib2
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - autopkgtests converted to the test pipeline (1 steps)
# - Wolfi Python layout: py3.X-vttlib for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-vttlib
  version: '0.11.0'
  epoch: 0
  description: Python library to extract VTT (Microsoft Visual TrueType) font hinting data
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
vars:
  pypi-package: vttlib
  import: vttLib
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-wheel  # Debian: python3-wheel
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Remove-test-requiring-non-DFSG-data.patch; do mv py3-vttlib/$f .recipe-files/; done
      rmdir py3-vttlib 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/daltonmaag/vttLib
      tag: v${{package.version}}
      expected-commit: e1c52d34347000f86fb2f8aaf7b95ef774cf1ef0
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf tests/data/LICENSE_NotoSans tests/data/LICENSE_UbuTestData.txt tests/data/NotoSans-*.ttf tests/data/NotoSans-*.ttx tests/data/UbuTestData.ufo tests/cli_test.py
  - uses: patch
    with:
      patches: .recipe-files/0001-Remove-test-requiring-non-DFSG-data.patch
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-fonttools
        - py${{range.key}}-pyparsing
        - py${{range.key}}-ufolib2
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: daltonmaag/vttLib
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
        - py3-supported-fonttools  # Debian: python3-fonttools
        - py3-supported-pyparsing  # Debian: python3-pyparsing
        - py3.13-pytest-bin  # commands of Debian's python3-pytest
        - py3-supported-pytest  # Debian: python3-pytest
        - py3-supported-ufolib2  # Wolfi Community Packages (Debian: python3-ufolib2)
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - patch  # to apply Debian's patches to the tested source
        - py3-supported-vttlib
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/daltonmaag/vttLib
        tag: v${{package.version}}
        expected-commit: e1c52d34347000f86fb2f8aaf7b95ef774cf1ef0
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/p/python-vttlib/python-vttlib_0.11.0+dfsg-5.debian.tar.xz
        strip-components: 0
        expected-sha256: c8f7bf54d69ca2792c944678865d81e41d3228288d8cc4c1eff8657dd54be272
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-all=python3 python3-fonttools=py3.13-fonttools-bin python3-pyparsing=py3-supported-pyparsing python3-pytest=py3.13-pytest-bin python3-ufolib2=py3-supported-ufolib2' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-vttlib.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-vttlib.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: py3versions (as on a Debian testbed)
      runs: |
        mkdir -p /usr/local/bin
        cat > /usr/local/bin/py3versions <<'EOF'
        #!/bin/sh
        v=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
        case "$*" in *v*) echo "$v";; *) echo "python$v";; esac
        EOF
        chmod +x /usr/local/bin/py3versions
    - name: 'autopkgtest: python3-tests'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        mkdir -p debian/tests
        cat > "debian/tests/python3-tests" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/bash
        set -euo pipefail

        cp -a tests $AUTOPKGTEST_TMP
        cd $AUTOPKGTEST_TMP

        for p in $(py3versions -s); do
            # Cannot run all of of the tests because of non DFSG-compliant test data
            "${p}" -m pytest tests/vttLib_test.py -v
        done
        AUTOPKGTEST_SCRIPT
        chmod +x "debian/tests/python3-tests"
        "$PWD/debian/tests/python3-tests"
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
