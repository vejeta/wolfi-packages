package:
  name: sharutils
  version: '4.15.2'
  epoch: 0
  description: Utilities for manipulating shell archives
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - bzip2
      - xz
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - gettext-dev
      - texinfo
      - bzip2
      - xz
      - gettext
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv sharutils/* .recipe-files/
      rmdir sharutils
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/sharutils/sharutils-${{package.version}}.tar.xz
      expected-sha512: 80d0b804a0617e11e5c23dc0d59b218bbf93e40aaf5e9a5401a18ef9cb700390aab711e2b2e2f26c8fd5b8ef99a91d3405e01d02cadabcba7639979314e59f8d
  - uses: patch
    with:
      patches: .recipe-files/format-security.patch .recipe-files/gcc-10.patch .recipe-files/Backport-stdbool.m4-from-gnulib-devel-0-52.2.patch .recipe-files/Port-getcwd.m4-to-ISO-C23.patch .recipe-files/Port-the-code-to-ISO-C23.patch
  - name: Prepare
    runs: |
      autoreconf -vif
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--infodir=/usr/share/info \
      	--localstatedir=/var \
      	--disable-dependency-tracking
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      rm -f "$pkgdir"/usr/lib/charset.alias
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: sharutils-lang
    description: Utilities for manipulating shell archives (lang)
    pipeline:
      - uses: split/locales
  - name: sharutils-doc
    description: Utilities for manipulating shell archives (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 4805
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
