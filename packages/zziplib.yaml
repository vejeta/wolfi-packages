#
# Conversion notes:
# - check() not run (pass --with-check to add it to the build)
package:
  name: zziplib
  version: '0.13.80'
  epoch: 0
  description: Lightweight library to easily extract data from zip files
  copyright:
    - license: LGPL-2.0-or-later OR MPL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - cmake
      - python3
      - ninja  # Alpine: samurai
      - zlib-dev
      - zlib
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gdraheim/zziplib
      tag: v${{package.version}}
      expected-commit: f58313c1f65f46bf73f3526d1afd4d6bb46cc4ae
  - name: Build
    runs: |
      want_check() { return 1; }

      cmake -B build -G Ninja \
      	-DCMAKE_BUILD_TYPE=None \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DCMAKE_INSTALL_LIBDIR=lib \
      	-DBUILD_SHARED_LIBS=ON \
      	-DBUILD_TESTS="$(want_check && echo ON || echo OFF)" \
      	-DMSVC_STATIC_RUNTIME=OFF \
      	-DZZIPSDL=OFF \
      	-DZZIPTEST="$(want_check && echo ON || echo OFF)" \
      	-DZZIP_TESTCVE=OFF \
      	-DZZIPWRAP=OFF
      cmake --build build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" cmake --install build
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: zziplib-dev
    description: Lightweight library to easily extract data from zip files (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: zziplib-doc
    description: Lightweight library to easily extract data from zip files (doc)
    pipeline:
      - uses: split/alldocs
  - name: zziplib-utils
    description: Utilities for the zziplib library
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/bin
update:
  enabled: true
  github:
    identifier: gdraheim/zziplib
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
