# reactivedata 0.3-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/reactivedata
# Debian packaging: https://salsa.debian.org/ocaml-team/reactivedata
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libreactivedata-ocaml-dev
  version: '0.3'
  epoch: 0
  description: FRP with incremental changes in data structures
  copyright:
    - license: LGPL-2.1-exc
  dependencies:
    runtime:
      - libreactivedata-ocaml  # Debian: ${ocaml:Depends}
      - libreact-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - libreact-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/reactiveData
      tag: ${{package.version}}
      expected-commit: c72638b21d2a088ba3f1603f3eae32256d65f46f
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p reactiveData -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" reactiveData
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libreactivedata-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/reactiveData/* "${{targets.destdir}}/usr/share/doc/libreactivedata-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/reactiveData" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libreactivedata-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libreactivedata-ocaml
    description: FRP with incremental changes in data structures (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/reactiveData"
          mv "${{targets.destdir}}/usr/lib/ocaml/reactiveData/META" "${{targets.contextdir}}/usr/lib/ocaml/reactiveData/"
          mv "${{targets.destdir}}/usr/lib/ocaml/reactiveData/reactiveData.cma" "${{targets.contextdir}}/usr/lib/ocaml/reactiveData/"
          mv "${{targets.destdir}}/usr/lib/ocaml/reactiveData/reactiveData.cmxs" "${{targets.contextdir}}/usr/lib/ocaml/reactiveData/"
update:
  enabled: true
  github:
    identifier: ocsigen/reactiveData
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libreactivedata-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
