# Generated by debian-to-melange 0.1.0 from Debian source package
# fonts-paratype 20181108-4 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-paratype
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-paratype
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-paratype/fonts-paratype_20181108.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: fonts-paratype
  version: '20181108'
  epoch: 0
  description: ParaType font collection for the languages of Russia
  copyright:
    - license: ParaType-Free-Font-License
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-paratype/$f .recipe-files/; done
      rmdir fonts-paratype 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-paratype/fonts-paratype_${{package.version}}.orig.tar.gz
      expected-sha256: f3521fc81b2b8af44e0e567095b0acfc56c9b252f06b0c6f005139e9ddd73f46
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-paratype/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-paratype/copyright
