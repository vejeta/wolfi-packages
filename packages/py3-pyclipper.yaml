package:
  name: py3-pyclipper
  version: '1.4.0'
  epoch: 0
  description: Cython wrapper for the Clipper library
  copyright:
    - license: MIT
    - license: Boost-1.0
      paths:
        - 'src/clipper.*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3.13-cython-bin  # Debian: cython3
      - python3-dev  # Debian: python3-all-dev
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/pyclipper
      tag: ${{package.version}}
      expected-commit: f998920369565dca56d346bb30c5741e273f0b9b
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-pyclipper"
      cp -a README.rst "${{targets.destdir}}/usr/share/doc/py3-pyclipper/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-pyclipper
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: fonttools/pyclipper
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-pyclipper/LICENSE
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import pyclipper
