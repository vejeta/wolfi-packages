# Generated by debian-to-melange 0.1.0 from Debian source package
# ppx-globalize 0.17.2-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ppx-globalize
# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-globalize
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-globalize-ocaml
  version: '0.17.2'
  epoch: 0
  description: Copy local values to the global heap (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppxlib-jane-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_globalize
      tag: v${{package.version}}
      expected-commit: dcda2b5d04a94aafca8c32f5ab835de203442061
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_globalize -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_globalize
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-globalize-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-globalize-ocaml-dev
    description: Copy local values to the global heap (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*opam* "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*dune* "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.ml "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.mli "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.a "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_globalize/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/ppx_globalize/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-globalize-ocaml-dev"
          mv "${{targets.destdir}}"/usr/doc/ppx_globalize/* "${{targets.contextdir}}/usr/share/doc/libppx-globalize-ocaml-dev/"
          rmdir "${{targets.destdir}}/usr/doc/ppx_globalize" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_globalize
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-globalize-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
