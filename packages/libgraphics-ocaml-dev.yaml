# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-graphics 5.2.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-graphics
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-graphics
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocaml-graphics/ocaml-graphics_5.2.0.orig.tar.gz), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libgraphics-ocaml-dev
  version: '5.2.0'
  epoch: 0
  description: OCaml graphics library (dev)
  copyright:
    - license: LGPL-2.1-exception
  dependencies:
    runtime:
      - libx11-dev
      - libxft-dev
      - libgraphics-ocaml  # Debian: ${ocaml:Depends}
      - ttf-dejavu  # Debian: fontconfig-config depends on fonts-dejavu-core
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libdune-ocaml-dev  # Wolfi Community Packages
      - libx11-dev
      - libxft-dev
      - pkgconf-dev  # Debian: pkg-config
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-graphics/ocaml-graphics_${{package.version}}.orig.tar.gz
      expected-sha256: 365fa08f67233aa54bf95da6ba2d69c7449c0ff179d3bcf065571e7980aff1c5
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p graphics -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" graphics
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libgraphics-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/graphics/* "${{targets.destdir}}/usr/share/doc/libgraphics-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/graphics" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libgraphics-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libgraphics-ocaml
    description: OCaml graphics library (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/stublibs"
          mv "${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll*.so "${{targets.contextdir}}/usr/lib/ocaml/stublibs/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/graphics"
          mv "${{targets.destdir}}/usr/lib/ocaml/graphics/META" "${{targets.contextdir}}/usr/lib/ocaml/graphics/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/graphics/*.cma "${{targets.contextdir}}/usr/lib/ocaml/graphics/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/graphics/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/graphics/"
update:
  enabled: true
  github:
    identifier: ocaml/graphics
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libgraphics-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
