# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-mmap 1.2.0-3 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-mmap
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-mmap
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libmmap-ocaml-dev
  version: '1.2.0'
  epoch: 0
  description: File mapping functionality in OCaml (development)
  copyright:
    - license: LGPL-2.1-with-linking-exception
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libbigarray-compat-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/mmap
      tag: v${{package.version}}
      expected-commit: b5efb79871d290072a17f755566c8288cf069e4f
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p mmap -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" mmap
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libmmap-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/mmap/* "${{targets.destdir}}/usr/share/doc/libmmap-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/mmap" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libmmap-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libmmap-ocaml
    description: File mapping functionality in OCaml (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/mmap"
          mv "${{targets.destdir}}/usr/lib/ocaml/mmap/META" "${{targets.contextdir}}/usr/lib/ocaml/mmap/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/mmap/*.cma "${{targets.contextdir}}/usr/lib/ocaml/mmap/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/mmap/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/mmap/"
update:
  enabled: true
  github:
    identifier: mirage/mmap
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libmmap-ocaml-dev/LICENSE
    - uses: test/tw/ldd-check
