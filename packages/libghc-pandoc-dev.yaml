pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 2001_templates_avoid_privacy_breach.patch 2002_program_package_hint.patch 3b91fcdd2cfbbdb5cd1200f88e9111bdc4c422ac.patch copyright fix-tests-older-skylighting-format-blaze use-python3.patch; do mv libghc-pandoc-dev/$f .recipe-files/; done
      rmdir libghc-pandoc-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/haskell-pandoc/haskell-pandoc_${{package.version}}.orig.tar.gz
      expected-sha256: 50a04f7e8b244491546c45e81a6e7a0263d7e8c46a776b80738d51294a79f8a8
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - uses: patch
    with:
      patches: .recipe-files/2001_templates_avoid_privacy_breach.patch .recipe-files/2002_program_package_hint.patch .recipe-files/use-python3.patch .recipe-files/fix-tests-older-skylighting-format-blaze .recipe-files/3b91fcdd2cfbbdb5cd1200f88e9111bdc4c422ac.patch
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/libghc-pandoc-dev/copyright
subpackages:
  - name: libghc-pandoc-prof
    description: ${haskell:ShortDescription}${haskell:ShortBlurb}
    pipeline:
      # TODO(debian-to-melange): no debian/libghc-pandoc-prof.install; define which files go to this subpackage
      - runs: |
          true
  - name: libghc-pandoc-doc
    description: ${haskell:ShortDescription}${haskell:ShortBlurb}
    pipeline:
      - uses: split/manpages
  - name: pandoc-data
    description: ${haskell:ShortDescription}${haskell:ShortBlurb}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/pandoc"
          mv "${{targets.destdir}}/usr/share/pandoc/data" "${{targets.contextdir}}/usr/share/pandoc/"
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/libghc-pandoc-dev/copyright
    - uses: test/tw/ldd-check
