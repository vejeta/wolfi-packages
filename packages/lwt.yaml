package:
  name: liblwt-ocaml-dev
  version: '6.1.2'
  epoch: 0
  description: Cooperative light-weight thread library for OCaml
  copyright:
    - license: MIT
    - license: BSD-C2
      paths:
        - 'src/core/lwt_mvar.ml*'
        - 'src/core/lwt_condition.ml*'
  dependencies:
    runtime:
      - libev-dev
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libev-dev
      - ocaml-findlib
      - ocaml-dune
      - libdune-ocaml-dev  # Wolfi Community Packages
      - cppo  # Wolfi Community Packages
      # TODO(debian-to-melange): libfindlib-ocaml-dev is not in Wolfi (Debian: libfindlib-ocaml-dev); left out
      # TODO(debian-to-melange): libreact-ocaml-dev is not in Wolfi (Debian: libreact-ocaml-dev); left out
      # TODO(debian-to-melange): libresult-ocaml-dev is not in Wolfi (Debian: libresult-ocaml-dev); left out
      # TODO(debian-to-melange): libmmap-ocaml-dev is not in Wolfi (Debian: libmmap-ocaml-dev); left out
      # TODO(debian-to-melange): libppxlib-ocaml-dev is not in Wolfi (Debian: libppxlib-ocaml-dev); left out
      # TODO(debian-to-melange): libocplib-endian-ocaml-dev is not in Wolfi (Debian: libocplib-endian-ocaml-dev); left out
      - ocaml  # Debian: libseq-ocaml-dev
      # TODO(debian-to-melange): libppx-let-ocaml-dev is not in Wolfi (Debian: libppx-let-ocaml-dev); left out
      # TODO(debian-to-melange): libcompiler-libs-ocaml-dev is not in Wolfi (Debian: libcompiler-libs-ocaml-dev); left out
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in Comment-out-unix_mcast-tests.patch Disable-page_size-test.patch; do mv lwt/$f .recipe-files/; done
      rmdir lwt 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/lwt
      tag: ${{package.version}}
      expected-commit: da71600f47a9a1561ddf2585937aeaaf42bceaf1
  - uses: patch
    with:
      patches: .recipe-files/Comment-out-unix_mcast-tests.patch .recipe-files/Disable-page_size-test.patch
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/liblwt-ocaml-dev"
      cp -a usr/doc/*/* "${{targets.destdir}}/usr/share/doc/liblwt-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/lwt
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: liblwt-ocaml
    description: Cooperative light-weight thread library for OCaml (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/liblwt-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: ocsigen/lwt
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/lwt/LICENSE.md
    - uses: test/tw/ldd-check
