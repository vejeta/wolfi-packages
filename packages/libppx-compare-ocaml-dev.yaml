#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-compare-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: Generation of comparison functions from OCaml types (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libppx-compare-ocaml  # Debian: ${ocaml:Depends}
      - libbase-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-jane-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppxlib-jane-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_compare
      tag: v${{package.version}}
      expected-commit: 898b96da6ccd3c33d6a5cb35af6b80affe67137f
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_compare -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_compare
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-compare-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/ppx_compare/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libppx-compare-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/ppx_compare/*
      rmdir "${{targets.destdir}}/usr/doc/ppx_compare" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-compare-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-compare-ocaml
    description: Generation of comparison functions from OCaml types (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_compare/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_compare/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_compare/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/"
          done
          true
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/runtime-lib"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_compare/runtime-lib/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/runtime-lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_compare/runtime-lib/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_compare/runtime-lib/"
          done
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_compare
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-compare-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
