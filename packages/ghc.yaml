        	    /usr/share/doc/ghc-doc/html/libraries/haddock-bundle.min.js \
        	    /usr/share/doc/ghc-doc/html/libraries/quick-jump.css \
        	    /usr/share/doc/ghc-doc/html/libraries/linuwial.css \
        	    /usr/share/doc/ghc-doc/html/libraries/synopsis.png
            ;;
            *)
                echo "prerm called with unknown argument \`$1'" >&2
                exit 0
            ;;
        esac

        # dh_installdeb will replace this with shell code automatically
        # generated by other debhelper scripts.


        exit 0
        )
        debian_ghc_doc_prerm remove
update:
  enabled: true
  release-monitor:
    identifier: 906
test:
  environment:
    contents:
      packages:
        - busybox
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ghc/LICENSE
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/g/ghc/ghc_${{package.version}}.orig.tar.xz
        expected-sha256: d266864b9e0b7b741abe8c9d6a790d7c01c21cf43a1419839119255878ebc59a
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/ghc.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/ghc.templates" && break
        done
    - name: 'autopkgtest: compile'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" 0 INT QUIT ABRT PIPE TERM
        cd ${WORKDIR}

        cat >simple.hs <<EOF
        main :: IO ()
        main = putStrLn "Hello"
        EOF

        ghc -O -Wall -o simple simple.hs
        echo "compile: OK"
        test -x simple
        ./simple
        echo "run: OK"
