pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0004-llvmGen-Pass-mcmodel-medium-option-to-LLVM-backend-on-LoongArch.patch 0005-Pass-the-mcmodel-medium-parameter-to-CC-via-GHC.patch ARM-VFPv3D16 allow-setting-llvm-program alpha-fix-ieee_set_fp_control-invocation.patch armhf-target-platform buildpath-abi-stability.patch fix-determinism-in-linker ghc-prim-modern-atomics.patch gnu-hurd-getExecutablePath gnu-hurd-linklm gnu-hurd-os-string haddock-remove-googleapis-fonts hadrian-bootstrap-plan hadrian-disable-threaded hadrian-enable-interpreter hadrian-haddock-opts hadrian-relpath hadrian-unreg-template-haskell hppa-sparc64-support.patch kfreebsd-aclocal.m4 llvm-newer-version local-mathjax no-missing-haddock-file-warning ppc64el-fix-clrri time_t-time use-unbundled-sphinx-rtd-theme x32-use-native-x86_64-insn.patch; do mv ghc/$f .recipe-files/; done
      rmdir ghc 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/g/ghc/ghc_${{package.version}}.orig.tar.xz
      expected-sha256: d266864b9e0b7b741abe8c9d6a790d7c01c21cf43a1419839119255878ebc59a
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - uses: patch
    with:
      patches: .recipe-files/ARM-VFPv3D16 .recipe-files/no-missing-haddock-file-warning .recipe-files/buildpath-abi-stability.patch .recipe-files/x32-use-native-x86_64-insn.patch .recipe-files/kfreebsd-aclocal.m4 .recipe-files/local-mathjax .recipe-files/haddock-remove-googleapis-fonts .recipe-files/use-unbundled-sphinx-rtd-theme .recipe-files/hadrian-haddock-opts .recipe-files/hadrian-relpath .recipe-files/allow-setting-llvm-program .recipe-files/hadrian-disable-threaded .recipe-files/hadrian-enable-interpreter .recipe-files/ppc64el-fix-clrri .recipe-files/time_t-time .recipe-files/llvm-newer-version .recipe-files/alpha-fix-ieee_set_fp_control-invocation.patch .recipe-files/0004-llvmGen-Pass-mcmodel-medium-option-to-LLVM-backend-on-LoongArch.patch .recipe-files/0005-Pass-the-mcmodel-medium-parameter-to-CC-via-GHC.patch .recipe-files/hadrian-bootstrap-plan .recipe-files/hadrian-unreg-template-haskell .recipe-files/gnu-hurd-getExecutablePath .recipe-files/hppa-sparc64-support.patch .recipe-files/ghc-prim-modern-atomics.patch .recipe-files/armhf-target-platform .recipe-files/fix-determinism-in-linker .recipe-files/gnu-hurd-linklm .recipe-files/gnu-hurd-os-string
  - uses: autoconf/configure
    with:
      opts: --host $(shell dpkg-architecture -qDEB_BUILD_GNU_TYPE) --build $(shell dpkg-architecture -qDEB_BUILD_GNU_TYPE) --target $(shell dpkg-architecture -qDEB_HOST_GNU_TYPE) --disable-ld-override --with-system-libffi LLC=llc-21 OPT=opt-21 LLVMAS=clang-21
  - uses: autoconf/make
  # TODO(debian-to-melange): port debian/rules override_dh_auto_build: hadrian/hadrian  		-V -j$(NUMJOBS)  		--flavour=release  		--docs=no-haddocks --docs=no-sphinx-html --docs=no-sphinx-pdfs  		binary-dist-dir  		$(EXTRA_HADRIAN_FLAGS) && hadrian/hadrian  		-V -j$(NUMJ
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      mkdir -p debian
      find ${{targets.destdir}}/usr/bin \( -type f -o -type l \)                 > debian/ghc.install
      find ${{targets.destdir}}/usr/lib/ghc \( -type f -o -type l \) ! \( -name "*.p_*" -o -name "lib*_p.a" \) >> debian/ghc.install
      find ${{targets.destdir}}/var				 >> debian/ghc.install
      echo ${{targets.destdir}}/usr/share/lintian/overrides/ghc >> debian/ghc.install
      find ${{targets.destdir}}/usr/lib/ghc \( -type f -o -type l \) \( -name "*.p_*" -o -name "lib*_p.a" \) > debian/ghc-prof.install
      echo ${{targets.destdir}}/usr/share/lintian/overrides/ghc-prof >> debian/ghc-prof.install
      sed -i s,^debian/tmp,, debian/*.install debian/*.links
      find ${{targets.destdir}}/usr/share/doc/ghc-doc/html/libraries/*/ -name "*.txt"  		-printf "%p /usr/lib/ghc-doc/hoogle//%f\n" > debian/ghc-doc.links
      find ${{targets.destdir}}/usr/share/doc/ghc-doc/html \( -type f -o -type l \) > debian/ghc-doc.install
      find ${{targets.destdir}}/usr/lib/ghc-doc \( -type f -o -type l \)      >> debian/ghc-doc.install
      echo ${{targets.destdir}}/usr/share/doc/ghc-doc/index.html >> debian/ghc-doc.install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/ghc/lib"
      ln -sf /var/lib/ghc/package.conf.d "${{targets.destdir}}/usr/lib/ghc/lib/package.conf.d"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ghc
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
