package:
  name: sequoia-sq
  version: '1.4.1'
  epoch: 0
  description: Command-line frontends for Sequoia
  copyright:
    - license: GPL-2.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - bzip2-dev
      - capnproto-dev
      - rust  # Alpine: cargo
      - cargo-auditable
      - clang  # Alpine: clang-dev
      - openssl-dev
      - sqlite-dev
      - bzip2
      - capnproto
      - openssl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv sequoia-sq/* .recipe-files/
      rmdir sequoia-sq
  - uses: fetch
    with:
      uri: https://gitlab.com/sequoia-pgp/sequoia-sq/-/archive/v${{package.version}}/sequoia-sq-v${{package.version}}.tar.bz2
      expected-sha512: 0328a8536f00e8ba0edc206f147891307dd4376affe17a4c5a5e291978a7aba65e8047735b7539876eb279987f7ce402dcf0a5c34eed61ac2555a8acb7d6c0f7
  - uses: patch
    with:
      patches: .recipe-files/update-rustix-crate.patch
  - name: Prepare
    runs: |
      CTARGET="${{host.triplet.rust}}"

      cargo fetch --target="$CTARGET" --locked
  - name: Build
    runs: |
      export CARGO_TARGET_DIR=target
      cargo auditable build --frozen --release --no-default-features --features crypto-openssl
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      install -Dm755 target/release/sq \
      	-t "$pkgdir"/usr/bin/
      install -Dm644 target/release/build/sequoia-sq-*/out/shell-completions/_sq \
      	"$pkgdir"/usr/share/zsh/site-functions/_sq
      install -Dm644 target/release/build/sequoia-sq-*/out/shell-completions/sq.bash \
      	"$pkgdir"/usr/share/bash-completion/completions/sq
      install -Dm644 target/release/build/sequoia-sq-*/out/shell-completions/sq.fish \
      	"$pkgdir"/usr/share/fish/vendor_completions.d/sq.fish
      install -Dm644 target/release/build/sequoia-sq-*/out/man-pages/*.1 \
      	-t "$pkgdir"/usr/share/man/man1/
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: sequoia-sq-doc
    description: Command-line frontends for Sequoia (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
  - name: sequoia-sq-bash-completion
    description: Command-line frontends for Sequoia (bash-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/bash-completion/completions
  - name: sequoia-sq-fish-completion
    description: Command-line frontends for Sequoia (fish-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/fish/vendor_completions.d
  - name: sequoia-sq-zsh-completion
    description: Command-line frontends for Sequoia (zsh-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/zsh/site-functions
update:
  enabled: true
  release-monitor:
    identifier: 191617
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
