#
# Conversion notes:
# - check() not run (pass --with-check to add it to the build)
# - abuild helper default_doc in doc()
package:
  name: netpbm
  version: '11.16.1'
  epoch: 0
  description: Toolkit for manipulation of graphic images
  copyright:
    - license: IJG AND BSD-3-Clause AND GPL-2.0-only
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - flex
      - ghostscript
      - libjpeg-turbo-dev
      - libpng-dev
      - libx11-dev
      - libxml2-dev
      - perl
      - sed
      - tiff-dev
      - zlib-dev
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/ceamac/netpbm-make-dist/releases/download/v${{package.version}}/netpbm-${{package.version}}.tar.xz
      expected-sha512: 9f40c8005317583d951d9beb9e7f6173942f61ef209bbfbdc7727c2dd09b26f7787e9f2629c14284831b73eb0a379fc1b4254ff36c2f8c2d2c6aa24347398610
  - uses: patch
    with:
      patches: netpbm/01-makefile.patch netpbm/02-installnetpbm.patch
  - name: Build
    runs: |
      srcdir="/home/build/_srcdir"
      mkdir -p "$srcdir"
      cp -a /home/build/netpbm/config.mk "$srcdir"/
      cp -a /home/build/netpbm/manweb.conf "$srcdir"/

      export CFLAGS="$CFLAGS -std=gnu17"
      cat config.mk.in "$srcdir"/config.mk > config.mk

      make
      make package pkgdir="$PWD/pkgdir"
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"
      srcdir="/home/build/_srcdir"
      builddir="/home/build"
      mkdir -p "$srcdir"
      cp -a /home/build/netpbm/config.mk "$srcdir"/
      cp -a /home/build/netpbm/manweb.conf "$srcdir"/

      mkdir -p "$pkgdir"/usr/bin/ \
      	"$pkgdir"/usr/include/netpbm \
      	"$pkgdir"/usr/lib/pkgconfig

      BUILDDIR="$builddir" PKGDIR="$pkgdir" ./installnetpbm

      sed -i -e "s|$pkgdir||g" "$pkgdir"/usr/lib/pkgconfig/netpbm.pc

      install -Dm644 -t "$pkgdir"/etc "$srcdir"/manweb.conf

      install -Dm644 -t "$pkgdir"/usr/share/doc/$pkgname/html \
      	"$builddir"/userguide/*.html

      install -Dm644 "$builddir"/doc/copyright_summary \
      	"$pkgdir"/usr/share/licenses/$pkgname/COPYING
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: netpbm-static
    description: Toolkit for manipulation of graphic images (static)
    pipeline:
      - uses: split/static
  - name: netpbm-dev
    description: Toolkit for manipulation of graphic images (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: netpbm-doc
    description: Toolkit for manipulation of graphic images (doc)
    pipeline:
      - uses: split/alldocs
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove etc/manweb.conf
          amove usr/bin/manweb
    dependencies:
      runtime:
        - lynx
        - perl
  - name: netpbm-extras
    description: Toolkit for manipulation of graphic images (perl scripts)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/bin/pamfixtrunc
          amove usr/bin/pbmtox10bm
          amove usr/bin/pgmcrater
          amove usr/bin/pnmflip
          amove usr/bin/pnmquant
          amove usr/bin/pnmquantall
          amove usr/bin/ppmfade
          amove usr/bin/ppmquant
          amove usr/bin/ppmquantall
          amove usr/bin/ppmrainbow
          amove usr/bin/ppmshadow
    dependencies:
      runtime:
        - perl
update:
  enabled: true
  github:
    identifier: ceamac/netpbm-make-dist
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
