# https://tracker.debian.org/pkg/extlib
# Debian packaging: https://salsa.debian.org/ocaml-team/extlib
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libextlib-ocaml-dev
  version: '1.8.0'
  epoch: 0
  description: Extended standard library for OCaml
  copyright:
    - license: LGPL-2.0-or-later WITH OCaml-linking exception
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocaml-compiler-libs  # Debian: ocaml
      - cppo  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ygrek/ocaml-extlib
      tag: ${{package.version}}
      expected-commit: 037e18fd59575fd7cebae5887348c7ca320d91fe
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p extlib -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" extlib
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libextlib-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/extlib/* "${{targets.destdir}}/usr/share/doc/libextlib-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/extlib" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/extlib
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libextlib-ocaml
    description: Extended standard library for OCaml (plugins)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/extlib"
          mv "${{targets.destdir}}/usr/lib/ocaml/extlib/META" "${{targets.contextdir}}/usr/lib/ocaml/extlib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/extlib/*.cma "${{targets.contextdir}}/usr/lib/ocaml/extlib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/extlib/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/extlib/"
update:
  enabled: true
  github:
    identifier: ygrek/ocaml-extlib
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/extlib/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/ygrek/ocaml-extlib
        tag: ${{package.version}}
        expected-commit: 037e18fd59575fd7cebae5887348c7ca320d91fe
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libextlib-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libextlib-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: native-code'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        testdir=$(mktemp -d)
        trap "rm -rf ${testdir}" 0 INT QUIT ABRT PIPE TERM
        cd ${testdir}

        cat <<EOF > test.ml
        open ExtString
        module S = String
        let _ = assert (S.starts_with "foo" ~prefix:"f")
        EOF

        if [ -x '/usr/bin/ocamlopt' ]
        then
            ocamlfind ocamlopt -o native-code-test -package extlib -linkpkg test.ml

            echo "build: OK"

            [ -x native-code-test ]
            ./native-code-test

            echo "run: OK"
        else
            echo "skip native-code test since ocamlopt is not available"
        fi
