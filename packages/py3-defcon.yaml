#
# Generated by debian-to-melange 0.1.0 from Debian source package
# defcon 0.12.2-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/defcon
# Debian packaging: https://salsa.debian.org/fonts-team/defcon
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-defcon for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-defcon
  version: '0.12.2'
  epoch: 0
  description: UFO based objects for use in font editing applications
  copyright:
    - license: MIT
    - license: Unicode
      paths:
        - Lib/defcon/tools/unicodeTools.py
        - tools/UnicodeData.txt
  dependencies:
    provider-priority: 0
vars:
  pypi-package: defcon
  import: defcon
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-fontpens  # Wolfi Community Packages (Debian: python3-fontpens)
      - py3-supported-sphinx  # Debian: python3-sphinx
      - py3-supported-sphinx-rtd-theme  # Debian: python3-sphinx-rtd-theme
      - coreutils
      - findutils
  environment:
    LC_ALL: C.UTF-8
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv py3-defcon/$f .recipe-files/; done
      rmdir py3-defcon 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/robotools/defcon
      tag: ${{package.version}}
      expected-commit: 488f79ad0588c2ce6d939758be9c607078d1d45d
  - name: From debian/rules execute_before_dh_sphinxdoc
    runs: |
      PYTHONPATH=Lib sphinx-build -b html documentation/source/ ${{targets.destdir}}/usr/share/doc/defcon/html/
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        # Debian Recommends (not supported by apk): python3-fontpens
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 .recipe-files/copyright "${{targets.contextdir}}"/usr/share/doc/py${{range.key}}-${{vars.pypi-package}}/copyright
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: robotools/defcon
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-defcon
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
