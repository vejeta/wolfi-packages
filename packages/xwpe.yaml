# xwpe 1.6.6-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/xwpe
# Debian packaging: https://salsa.debian.org/debian/xwpe
#
# Conversion notes:
# - upstream from debian/watch (git), pinned to the tag's commit
# - test dependency 'x11-apps' is a bundle; using xwd
# - test dependency 'x11-xserver-utils' is a bundle; using xmodmap, xrdb, xset
# - autopkgtests converted to the test pipeline (2 steps)
package:
  name: xwpe
  version: '1.6.6'
  epoch: 0
  description: Programming environment and editor for console and X11
  copyright:
    - license: GPL-2.0-only
    - license: FSFAP
      paths:
        - io.codeberg.mendezr.xwpe.metainfo.xml
    - license: MIT
      paths:
        - icons/xwpe.svg
        - icons/xwpe-small.svg
  dependencies:
    runtime:
      - ttf-dejavu  # Debian: fontconfig-config depends on fonts-dejavu-core
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - pkgconf-dev  # Debian: pkgconf
      - texinfo
      - libgpm-dev  # Wolfi Community Packages (Debian: libgpmg1-dev)
      - ncurses-dev  # Debian: libncurses-dev
      - libx11-dev
      - libxext-dev
      - libxft-dev
      - fontconfig-dev  # Debian: libfontconfig-dev
      - freetype-dev  # Debian: libfreetype-dev
      - cairo-dev  # Debian: libcairo2-dev
      - pango-dev  # Debian: libpango1.0-dev
      - libvterm-dev
      - json-c-dev  # Debian: libjson-c-dev
      - xorgproto  # Debian: x11proto-core-dev
      - zlib-dev  # Debian: zlib1g-dev
      - rsvg-convert  # Debian: librsvg2-bin
pipeline:
  - uses: git-checkout
    with:
      repository: https://codeberg.org/mendezr/xwpe.git
      tag: v${{package.version}}
      expected-commit: 163ba2ff997f88b54470d477bff2379517c13008
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/xwpe"
      cp -a README "${{targets.destdir}}/usr/share/doc/xwpe/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/xwpe
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  git:
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
        - py3-supported-pyte  # Wolfi Community Packages (Debian: python3-pyte)
        - py3.13-pytest-bin  # commands of Debian's python3-pytest
        - py3-supported-pytest  # Debian: python3-pytest
        - glibc-locale-en  # Debian: locales-all
        - build-base  # Debian: gcc
        - glibc-dev  # Debian: libc6-dev
        - gfortran
        - gdb
        - perl
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - python3
        - py3-supported-pillow  # Debian: python3-pil
        - xvfb-run  # Debian: xvfb
        - xkbcomp  # Debian: xvfb
        - xkeyboard-config  # Debian: xvfb
        - matchbox-window-manager  # Wolfi Community Packages
        - xdotool  # Wolfi Community Packages
        - xwd  # Wolfi Community Packages, Debian: x11-apps
        - xmodmap  # Debian: x11-xserver-utils
        - xrdb  # Debian: x11-xserver-utils
        - xset  # Debian: x11-xserver-utils
        - xclip  # Wolfi Community Packages
        - imagemagick-7  # Debian: imagemagick
        - netpbm  # Debian: imagemagick
  pipeline:
    - runs: |
        test -f /usr/share/licenses/xwpe/COPYING
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://codeberg.org/mendezr/xwpe.git
        tag: v${{package.version}}
        expected-commit: 163ba2ff997f88b54470d477bff2379517c13008
    - name: 'autopkgtest: XWPE_TEST_WAIT_SCALE=3 WPE_BIN=/usr/bin/wpe python3 -m pytes'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        (
        XWPE_TEST_WAIT_SCALE=3 WPE_BIN=/usr/bin/wpe python3 -m pytest -q tests --ignore=tests/x11
        ) || echo 'autopkgtest marked flaky failed (ignored)'
    - name: 'autopkgtest: XWPE_TEST_WAIT_SCALE=3 XWPE_BIN=/usr/bin/xwpe python3 -m pyt'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        (
        XWPE_TEST_WAIT_SCALE=3 XWPE_BIN=/usr/bin/xwpe python3 -m pytest -q tests/x11
        ) || echo 'autopkgtest marked flaky failed (ignored)'
