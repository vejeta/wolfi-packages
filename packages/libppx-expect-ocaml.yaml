# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-expect
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-expect-ocaml
  version: '0.17.3'
  epoch: 0
  description: Testing framework for OCaml (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libjane-street-headers-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      - libppx-hash-ocaml-dev  # Wolfi Community Packages
      - libppx-here-ocaml-dev  # Wolfi Community Packages
      - libppx-inline-test-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - libsexplib0-ocaml-dev  # Wolfi Community Packages
      - libstdio-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_expect
      tag: v${{package.version}}
      expected-commit: 49b86d5ac2e11602b2464b9970e569f32c877d9b
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_expect -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_expect
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-expect-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-expect-ocaml-dev
    description: Testing framework for OCaml (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*opam* "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*dune* "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.a "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.ml "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.mli "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.a; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.cmi; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.cmt*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.ml; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.mli; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/ppx_expect/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.cmx; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_expect/*/*.cmxa; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-expect-ocaml-dev"
          mv "${{targets.destdir}}"/usr/doc/ppx_expect/* "${{targets.contextdir}}/usr/share/doc/libppx-expect-ocaml-dev/"
          rmdir "${{targets.destdir}}/usr/doc/ppx_expect" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libppx-expect-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: janestreet/ppx_expect
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-expect-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
