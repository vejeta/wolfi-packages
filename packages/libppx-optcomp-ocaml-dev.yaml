# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-optcomp-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Optional compilation for OCaml (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
      - libppx-optcomp-ocaml  # Debian: ${ocaml:Depends}
      - libbase-ocaml-dev  # Debian: ${ocaml:Depends}
      - libstdio-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libstdio-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_optcomp
      tag: v${{package.version}}
      expected-commit: b37b49acf8c9b934251ce04c78a9ea509d79b3c8
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_optcomp -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_optcomp
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-optcomp-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/ppx_optcomp/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libppx-optcomp-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/ppx_optcomp/*
      rmdir "${{targets.destdir}}/usr/doc/ppx_optcomp" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-optcomp-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-optcomp-ocaml
    description: Optional compilation for OCaml (runtime files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_optcomp"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_optcomp/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_optcomp/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_optcomp/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_optcomp/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_optcomp/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_optcomp/"
          done
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_optcomp
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-optcomp-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
