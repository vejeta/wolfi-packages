package:
  name: libocplib-endian-ocaml-dev
  version: '1.2'
  epoch: 0
  description: Optimised functions to read and write int16/32/64 (development)
  copyright:
    - license: LGPL-2.2+-with-linking-exception
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - cppo  # Wolfi Community Packages
      - libfindlib-ocaml  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv ocplib-endian/$f .recipe-files/; done
      rmdir ocplib-endian 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/OCamlPro/ocplib-endian
      tag: ${{package.version}}
      expected-commit: 10292cd3ffa4d23d737e3f855ad04f22d3d95460
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocplib-endian-ocaml-dev"
      cp -a usr/doc/ocplib-endian/* "${{targets.destdir}}/usr/share/doc/libocplib-endian-ocaml-dev/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/ocplib-endian/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libocplib-endian-ocaml
    description: Optimised functions to read and write int16/32/64 (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libocplib-endian-ocaml.install; define which files go to this subpackage
      - runs: |
          true
    dependencies:
      runtime:
        - libfindlib-ocaml  # Wolfi Community Packages
update:
  enabled: true
  github:
    identifier: OCamlPro/ocplib-endian
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/ocplib-endian/copyright
    - uses: test/tw/ldd-check
