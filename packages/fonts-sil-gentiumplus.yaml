# fonts-sil-gentiumplus 6.200-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-sil-gentiumplus
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-sil-gentiumplus
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-sil-gentiumplus
  version: '6.200'
  epoch: 0
  description: Font family for wide range of languages that use Latin, Cyrillic, Greek scripts
  copyright:
    - license: OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-gentiumplus/$f .recipe-files/; done
      rmdir fonts-sil-gentiumplus 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-gentium
      tag: v${{package.version}}
      expected-commit: 125d16a60c23ddb34f0908d762a86a69ac5e55d3
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/web"
      ln -sf /usr/share/fonts-sil-gentiumplus/woff2/GentiumPlus-Regular.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/web/GentiumPlus-Regular.woff2"
      ln -sf /usr/share/fonts-sil-gentiumplus/woff2/GentiumPlus-Italic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/web/GentiumPlus-Italic.woff2"
      ln -sf /usr/share/fonts-sil-gentiumplus/woff2/GentiumPlus-Bold.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/web/GentiumPlus-Bold.woff2"
      ln -sf /usr/share/fonts-sil-gentiumplus/woff2/GentiumPlus-BoldItalic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/web/GentiumPlus-BoldItalic.woff2"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus"
      cp -a README.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/"
      cp -a documentation/ "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/"
      cp -a web/ "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-gentiumplus/copyright
update:
  enabled: true
  github:
    identifier: silnrsi/font-gentium
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-gentiumplus/copyright
