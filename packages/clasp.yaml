# Debian packaging: https://salsa.debian.org/science-team/clasp
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: clasp
  version: '3.3.5'
  epoch: 0
  description: Conflict-driven nogood learning answer set solver
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): gringo
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - catch  # Wolfi Community Packages
      - cmake
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in clasp-manpage.patch link-libatomic-check-gcc.patch use-system-catch-for-glibc-2.34-compat.patch; do mv clasp/$f .recipe-files/; done
      rmdir clasp 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/potassco/clasp
      tag: v${{package.version}}
      expected-commit: c18347343d051e242dd95819b11a23ce66916bc6
  - uses: patch
    with:
      patches: .recipe-files/clasp-manpage.patch .recipe-files/link-libatomic-check-gcc.patch .recipe-files/use-system-catch-for-glibc-2.34-compat.patch
  - uses: cmake/configure
    with:
      opts: -DLIB_POTASSCO_BUILD_APP=OFF -DCLASP_BUILD_TESTS=ON -DLIB_POTASSCO_BUILD_TESTS=ON -DCLASP_BUILD_EXAMPLES=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.10
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      install -Dm644 clasp.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share/doc/clasp"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/clasp/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/clasp
  - uses: strip
update:
  enabled: true
  github:
    identifier: potassco/clasp
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - gringo  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/clasp/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/potassco/clasp
        tag: v${{package.version}}
        expected-commit: c18347343d051e242dd95819b11a23ce66916bc6
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/clasp.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/clasp.templates" && break
        done
    - name: 'autopkgtest: clasp2'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        # clasp: gbie1.lp unsat_01.lp is unsatisfiable
        # Author: Thomas Krennwallner <tkren@kr.tuwien.ac.at>
        # Date: 2017-05-07

        set -o pipefail

        gringo /usr/share/doc/gringo/examples/gringo/gbie/{gbie1.lp,instances/unsat_01.lp} | clasp

        result=$?
        test $result -eq 20
