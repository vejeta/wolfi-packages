            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/lwt_ppx ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/lwt_ppx && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/lwt_ppx/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/lwt_ppx/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/lwt_ppx/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/lwt_ppx/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/lwt_react ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/lwt_react && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/lwt_react/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/lwt_react/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/lwt_react/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/lwt_react/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/lwt_retry ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/lwt_retry && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/lwt_retry/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/lwt_retry/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/lwt_retry/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/lwt_retry/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
