package:
  name: liblwt-ocaml-dev
  version: '6.1.2'
  epoch: 0
  description: Cooperative light-weight thread library for OCaml
  copyright:
    - license: MIT
    - license: BSD-C2
      paths:
        - 'src/core/lwt_mvar.ml*'
        - 'src/core/lwt_condition.ml*'
  dependencies:
    runtime:
      - libev-dev
      - liblwt-ocaml  # Debian: ${ocaml:Depends}
      - libdune-ocaml-dev  # Debian: ${ocaml:Depends}
      - ocaml-findlib  # Debian: ${ocaml:Depends}
      - ocamlfind  # Debian: ${ocaml:Depends}
      - ocaml-findlib-compat  # Debian: ${ocaml:Depends}
      - libreact-ocaml-dev  # Debian: ${ocaml:Depends}
      - libresult-ocaml-dev  # Debian: ${ocaml:Depends}
      - libmmap-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
      - libocplib-endian-ocaml-dev  # Debian: ${ocaml:Depends}
      - ocaml-compiler-libs  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - libev-dev
      - libdune-ocaml-dev  # Wolfi Community Packages
      - cppo  # Wolfi Community Packages
      - libreact-ocaml-dev  # Wolfi Community Packages
      - libresult-ocaml-dev  # Wolfi Community Packages
      - libmmap-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libocplib-endian-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: libcompiler-libs-ocaml-dev
      - zstd-dev  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in Comment-out-unix_mcast-tests.patch Disable-page_size-test.patch; do mv liblwt-ocaml-dev/$f .recipe-files/; done
      rmdir liblwt-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/lwt
      tag: ${{package.version}}
      expected-commit: da71600f47a9a1561ddf2585937aeaaf42bceaf1
  - uses: patch
    with:
      patches: .recipe-files/Comment-out-unix_mcast-tests.patch .recipe-files/Disable-page_size-test.patch
  - name: Configure (from debian/rules override_dh_auto_configure)
    runs: |
      dune exec -p lwt src/unix/config/discover.exe -- --save --use-libev true
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p lwt_direct,lwt,lwt_ppx,lwt_react,lwt_retry,lwt_runtime_events -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" lwt_direct lwt lwt_ppx lwt_react lwt_retry lwt_runtime_events
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/liblwt-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/*/* "${{targets.destdir}}/usr/share/doc/liblwt-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/*" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/liblwt-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: liblwt-ocaml
    description: Cooperative light-weight thread library for OCaml (runtime)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/lwt_direct ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/lwt_direct && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/lwt_direct/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/lwt_direct/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/lwt_direct/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/lwt_direct/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/lwt ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/lwt && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
