package:
  name: libbz2-ocaml-dev
  version: '0.8.0'
  epoch: 0
  description: OCaml bindings for the bzip2 compression library
  copyright:
    - license: LGPL-2.1-exception
  dependencies:
    runtime:
      - bzip2-dev  # Debian: libbz2-dev
      - libbz2-ocaml
      - ocaml-findlib
      # Debian Recommends (not supported by apk): ocaml-odoc
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml
      - ocaml-dune
      - bzip2-dev  # Debian: libbz2-dev
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/camlbz2/camlbz2_${{package.version}}.orig.tar.bz2
      expected-sha256: 76bfddcb8922ead8e7dfab9e1203ff4ae1f1bd7d7d8a1ec802230f49912338f2
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      dune build @install
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: dune install --destdir=$(DESTDIR)  		--prefix=/usr --libdir=$(OCAML_STDLIB_DIR)
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbz2-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libbz2-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbz2-ocaml-dev"
      cp -a usr/doc/bz2/README "${{targets.destdir}}/usr/share/doc/libbz2-ocaml-dev/"
      install -Dm644 COPYING LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libbz2-ocaml-dev
subpackages:
  - name: libbz2-ocaml
    description: OCaml bindings for the bzip2 compression library (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libbz2-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  release-monitor:
    identifier: 194648
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml
        - ocaml-findlib
        - libbz2-ocaml-dev
        - bzip2
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libbz2-ocaml-dev/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/c/camlbz2/camlbz2_${{package.version}}.orig.tar.bz2
        expected-sha256: 76bfddcb8922ead8e7dfab9e1203ff4ae1f1bd7d7d8a1ec802230f49912338f2
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libbz2-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libbz2-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: upstream'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set -e

        testdir=${AUTOPKGTEST_TMP:-/tmp}
        cp examples/*.ml ${testdir}
        cd ${testdir}
        ocamlfind ocamlc -package bz2 -linkpkg -o bunzip2 bunzip2.ml
        if [ -x /usr/bin/ocamlopt ]; then
            ocamlfind ocamlopt -package bz2 -linkpkg -o bunzip2 bunzip2.ml
        fi
