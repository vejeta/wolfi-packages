# glyphspkg 0.2.1-3 (3.0 (quilt)).
# https://tracker.debian.org/pkg/glyphspkg
# Debian packaging: https://salsa.debian.org/python-team/packages/glyphspkg
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: openstep-plist
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: glyphspkg
  version: '0.2.1'
  epoch: 0
  description: Converter from .glyphspackage to .glyphs files
  copyright:
    - license: MIT
    - license: Apache-2.0
      paths:
        - Lib/glyphspkg/plist.py
    - license: OFL-1.1
      paths:
        - 'tests/data/*'
  dependencies:
    runtime:
      - py3-openstep-plist  # Wolfi Community Packages (Debian: python3-openstep-plist)
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - coreutils
      - findutils
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jenskutilek/glyphspkg
      tag: v${{package.version}}
      expected-commit: bc3cbc11891d08d779b50b2ed0bbb0eb57d81c07
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/glyphspkg
  - name: From debian/rules execute_after_dh_auto_clean
    runs: |
      rm -f Lib/glyphspkg/_version.py
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  github:
    identifier: jenskutilek/glyphspkg
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/glyphspkg/LICENSE
    - uses: python/import
      with:
        python: python3
        imports: import glyphspkg
