# Debian packaging: https://salsa.debian.org/debian/libdatrie
#
# Conversion notes:
# - udeb package(s) left out: libdatrie1-udeb
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/libd/libdatrie/libdatrie_0.2.14.orig.tar.xz), which disappears from the pool when Debian updates
# - runtime dependency 'libjs-jquery': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - autopkgtests converted to the test pipeline (2 steps)
package:
  name: libdatrie
  version: '0.2.14'
  epoch: 0
  description: Double-array trie library
  copyright:
    - license: LGPL-2.1-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - doxygen
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/libd/libdatrie/libdatrie_${{package.version}}.orig.tar.xz
      expected-sha256: f04095010518635b51c2313efa4f290b7db828d6273e39b2b8858f859dfe81d5
  - uses: autoconf/configure
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) -C datrie
      make -j$(nproc) -C tools
      make -j$(nproc) -C man
      make -j$(nproc) -C doc
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make -C datrie install DESTDIR=${{targets.destdir}}/
      make -C tools  install DESTDIR=${{targets.destdir}}/
      make -C man    install DESTDIR=${{targets.destdir}}/
      make install-am DESTDIR=${{targets.destdir}}/
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libdatrie"
      cp -a NEWS "${{targets.destdir}}/usr/share/doc/libdatrie/"
      cp -a README "${{targets.destdir}}/usr/share/doc/libdatrie/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libdatrie
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libdatrie-dev
    description: Development files for double-array trie library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include"
          mv "${{targets.destdir}}"/usr/include/* "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/lib*.a "${{targets.contextdir}}/usr/lib/"
          mv "${{targets.destdir}}"/usr/lib/lib*.so "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/lib/pkgconfig"
          mv "${{targets.destdir}}"/usr/lib/pkgconfig/* "${{targets.contextdir}}/usr/lib/pkgconfig/"
    dependencies:
      runtime:
        - libdatrie
        - pkgconf-dev  # Debian: pkgconf
  - name: libdatrie1-bin
    description: Programs for double-array trie library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}"/usr/bin/* "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libdatrie1-bin"
          cp -a NEWS "${{targets.contextdir}}/usr/share/doc/libdatrie1-bin/"
          cp -a README "${{targets.contextdir}}/usr/share/doc/libdatrie1-bin/"
  - name: libdatrie-doc
    description: Documentation files for double-array trie library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libdatrie1/html"
          ln -sf /usr/share/javascript/jquery/jquery.js "${{targets.contextdir}}/usr/share/doc/libdatrie1/html/jquery.js"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libdatrie-doc"
          cp -a doc/html/ "${{targets.contextdir}}/usr/share/doc/libdatrie-doc/"
update:
  enabled: true
  release-monitor:
    identifier: 7342
test:
  environment:
    contents:
      packages:
        - busybox
        - build-base  # Debian: build-essential
        - libdatrie-dev
        - pkgconf-dev  # Debian: pkgconf
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - libdatrie1-bin
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libdatrie/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/libd/libdatrie/libdatrie_${{package.version}}.orig.tar.xz
        expected-sha256: f04095010518635b51c2313efa4f290b7db828d6273e39b2b8858f859dfe81d5
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc perl-base=perl pkgconf=pkgconf-dev' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libdatrie1.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libdatrie1.templates" && break
        done
    - name: 'autopkgtest: build'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # autopkgtest check: Build and run a program against libdatrie, to verify that
        # the headers and pkg-config file are installed correctly

        set -e

        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" 0 INT QUIT ABRT PIPE TERM
        cd $WORKDIR

        if [ -n "${DEB_HOST_GNU_TYPE:-}" ]; then
            CROSS_COMPILE="$DEB_HOST_GNU_TYPE-"
        else
            CROSS_COMPILE=
        fi

        cat <<EOF > libdatrietest.c
        #include <datrie/trie.h>
        #include <assert.h>

        int main (int argc, char *argv[])
        {
          AlphaMap* m = alpha_map_new();
          assert (m != 0);
          assert (alpha_map_add_range (m, 0x0061, 0x007a) == 0);

          Trie* t = trie_new (m);
          assert (t != 0);

          alpha_map_free (m);
          trie_free (t);

          return 0;
        }
        EOF

        ${CROSS_COMPILE}gcc -o libdatrietest libdatrietest.c \
            $(${CROSS_COMPILE}pkg-config --cflags --libs datrie-0.2)
        echo "build: OK"
        [ -x libdatrietest ]
        ./libdatrietest
        echo "run: OK"
    - name: 'autopkgtest: tool'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # autopkgtest check: Check if 'trietool' utility works properly

        set -e

        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" 0 INT QUIT ABRT PIPE TERM
        cd $WORKDIR
        cat <<EOF > thaidict.abm
        [0x0e01,0x0e5b]
        EOF

        trietool thaidict add "แดง" 4
        trietool thaidict add "เขียว" 2
        trietool thaidict add "น้ำเงิน" 1
        trietool thaidict add "เหลือง" 6
        trietool thaidict add "ขาว" 7
        trietool thaidict add "ดำ" 0

        echo "dict preparation: OK"

        RES=$(trietool thaidict query "แดง")
        [ $RES -eq 4 ]
        RES=$(trietool thaidict query "เขียว")
        [ $RES -eq 2 ]
        RES=$(trietool thaidict query "น้ำเงิน")
        [ $RES -eq 1 ]
        RES=$(trietool thaidict query "เหลือง")
        [ $RES -eq 6 ]
        RES=$(trietool thaidict query "ขาว")
        [ $RES -eq 7 ]
        RES=$(trietool thaidict query "ดำ")
        [ $RES -eq 0 ]

        echo "dict query: OK"

        N=$(trietool thaidict list | wc -l)
        [ $N -eq 6 ]

        trietool thaidict delete "ดำ"

        N=$(trietool thaidict list | wc -l)
        [ $N -eq 5 ]

        echo "dict delete & list: OK"
