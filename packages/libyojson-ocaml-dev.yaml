# Debian packaging: https://salsa.debian.org/ocaml-team/yojson
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libyojson-ocaml-dev
  version: '3.0.0'
  epoch: 0
  description: JSON library for OCaml - development package
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - libyojson-ocaml  # Debian: ${ocaml:Depends}
      - libeasy-format-ocaml-dev  # Debian: ${ocaml:Depends}
      - libbiniou-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - libeasy-format-ocaml-dev  # Wolfi Community Packages
      - libbiniou-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in ydump.1; do mv libyojson-ocaml-dev/$f .recipe-files/; done
      rmdir libyojson-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-community/yojson
      tag: ${{package.version}}
      expected-commit: b2193e8e0c88c6501710d08b836b3219673383f3
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p yojson -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" yojson
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libyojson-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/yojson/* "${{targets.destdir}}/usr/share/doc/libyojson-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/yojson" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libyojson-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libyojson-ocaml
    description: JSON library for OCaml - runtime package
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/yojson"
          mv "${{targets.destdir}}/usr/lib/ocaml/yojson/META" "${{targets.contextdir}}/usr/lib/ocaml/yojson/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/yojson/*.cma "${{targets.contextdir}}/usr/lib/ocaml/yojson/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/yojson/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/yojson/"
  - name: yojson-tools
    description: JSON library for OCaml - tools
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/ydump" "${{targets.contextdir}}/usr/bin/"
          install -Dm644 .recipe-files/ydump.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            ydump --version || (ydump --help 2>&1 || true) | grep -qi -e usage -e ydump
        - uses: test/tw/ldd-check
update:
  enabled: true
  github:
    identifier: ocaml-community/yojson
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libyojson-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
