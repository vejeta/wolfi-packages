pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 61-apt.rules apt.conf.autoremove apt.systemd.daily default-sequoia.config; do mv apt/$f .recipe-files/; done
      rmdir apt 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/apt/apt_${{package.version}}.tar.xz
      expected-sha256: ce30b74ba6f633b23fb8162c37ae43c68baa5fa00e2367f6de675142df74b96b
  - uses: cmake/configure
    with:
      opts: -DCMAKE_BUILD_RPATH_USE_ORIGIN=ON -DWITH_DOC=ON -DWITH_TESTS=OFF -DCMAKE_INSTALL_LIBEXECDIR=lib
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}"/usr/lib/systemd/system/*.service >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/systemd/system"
        cp -a debian/*.service "${{targets.destdir}}/usr/lib/systemd/system/"
      fi
      if ! ls -d "${{targets.destdir}}"/usr/lib/systemd/system/*.timer >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/systemd/system"
        cp -a debian/*.timer "${{targets.destdir}}/usr/lib/systemd/system/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/udev/rules.d/61-apt.rules" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/udev/rules.d"
        cp -a .recipe-files/61-apt.rules "${{targets.destdir}}/usr/lib/udev/rules.d/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/apt.systemd.daily" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt"
        cp -a .recipe-files/apt.systemd.daily "${{targets.destdir}}/usr/lib/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/apt/default-sequoia.config" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/apt"
        cp -a .recipe-files/default-sequoia.config "${{targets.destdir}}/usr/share/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/etc/apt" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/etc"
        cp -a etc/apt/ "${{targets.destdir}}/etc/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt-cache" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt-cache "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt-cdrom" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt-cdrom "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt-config" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt-config "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt-get" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt-get "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/bin/apt-mark" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/bin"
        cp -a usr/bin/apt-mark "${{targets.destdir}}/usr/bin/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/apt-helper" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt"
        cp -a usr/lib/apt/apt-helper "${{targets.destdir}}/usr/lib/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/apt-extracttemplates" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt"
        cp -a usr/lib/apt/apt-extracttemplates "${{targets.destdir}}/usr/lib/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/methods" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt"
        cp -a usr/lib/apt/methods/ "${{targets.destdir}}/usr/lib/apt/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/planners/dump" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt/planners"
        cp -a usr/lib/apt/planners/dump "${{targets.destdir}}/usr/lib/apt/planners/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/apt/solvers/dump" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/apt/solvers"
        cp -a usr/lib/apt/solvers/dump "${{targets.destdir}}/usr/lib/apt/solvers/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/lib/dpkg/methods/apt" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/lib/dpkg/methods"
        cp -a usr/lib/dpkg/methods/apt/ "${{targets.destdir}}/usr/lib/dpkg/methods/"
      fi
      if ! ls -d "${{targets.destdir}}/usr/share/bash-completion/completions" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr/share/bash-completion"
        cp -a usr/share/bash-completion/completions/ "${{targets.destdir}}/usr/share/bash-completion/"
      fi
      if ! ls -d "${{targets.destdir}}/var" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/"
        cp -a var/ "${{targets.destdir}}//"
      fi
      find "${{targets.destdir}}" -path "*methods/curl*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*methods/curl+https*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*methods/curl+http*" -prune -exec rm -rf {} +
      mkdir -p "${{targets.destdir}}/etc/kernel/postinst.d"
      mkdir -p "${{targets.destdir}}/usr/share/bug/apt"
      mkdir -p "${{targets.destdir}}/etc/apt/keyrings"
      mkdir -p "${{targets.destdir}}/usr/share/doc/apt"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/apt/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/apt
  - name: From debian/rules override_dh_install
    runs: |
      mkdir -p ${{targets.destdir}}/etc/apt/apt.conf.d
      install -m 644 .recipe-files/apt.conf.autoremove ${{targets.destdir}}/etc/apt/apt.conf.d/01autoremove
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libapt-pkg7.0
    description: Package management runtime library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/libapt-pkg*.so.* "${{targets.contextdir}}/usr/lib/"
          for f in "${{targets.destdir}}"/usr/share/locale/*/*/libapt-pkg*.mo; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
    dependencies:
      runtime:
        - db  # libdb-5.3.so: unversioned soname, no so: dependency
        - dpkg  # Essential in Debian; named in Breaks/Conflicts
  - name: apt-doc
    description: Documentation for APT
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc"
          mv "${{targets.destdir}}/usr/share/doc/apt-doc" "${{targets.contextdir}}/usr/share/doc/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/apt-doc"
          cp -a doc/acquire-additional-files.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
          cp -a doc/external-dependency-solver-protocol.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
          cp -a doc/external-installation-planner-protocol.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
          cp -a doc/json-hooks-protocol.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
          cp -a doc/progress-reporting.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
          cp -a doc/srv-records-support.md "${{targets.contextdir}}/usr/share/doc/apt-doc/"
  - name: libapt-pkg-dev
    description: 'Development files for APT''s libapt-pkg and libapt-inst'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include"
          mv "${{targets.destdir}}/usr/include/apt-pkg" "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/libapt-pkg*.so "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/lib/pkgconfig"
          mv "${{targets.destdir}}"/usr/lib/pkgconfig/apt-*.pc "${{targets.contextdir}}/usr/lib/pkgconfig/"
    dependencies:
      runtime:
        - libapt-pkg7.0
  - name: libapt-pkg-doc
    description: Documentation for APT development
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc"
          mv "${{targets.destdir}}/usr/share/doc/libapt-pkg-doc" "${{targets.contextdir}}/usr/share/doc/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libapt-pkg-doc"
          cp -a doc/libapt-pkg2_to_3.txt "${{targets.contextdir}}/usr/share/doc/libapt-pkg-doc/"
          cp -a doc/style.txt "${{targets.contextdir}}/usr/share/doc/libapt-pkg-doc/"
  - name: apt-utils
    description: Package management related utility programs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/apt-ftparchive" "${{targets.contextdir}}/usr/bin/"
          mv "${{targets.destdir}}/usr/bin/apt-sortpkgs" "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/lib/apt"
          mv "${{targets.destdir}}/usr/lib/apt/planners" "${{targets.contextdir}}/usr/lib/apt/"
          mv "${{targets.destdir}}/usr/lib/apt/solvers" "${{targets.contextdir}}/usr/lib/apt/"
          for f in "${{targets.destdir}}"/usr/share/locale/*/*/apt-utils.mo; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          (cd "${{targets.contextdir}}" && find . -path "*/dump*" -prune | while read -r f; do
            mkdir -p "$(dirname "${{targets.destdir}}/$f")" && mv "$f" "${{targets.destdir}}/$f"
          done)
          ln -sf /../lib/apt/apt-extracttemplates "${{targets.contextdir}}/usr/bin/apt-extracttemplates"
    dependencies:
      runtime:
        - apt
        - db  # libdb-5.3.so: unversioned soname, no so: dependency
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            apt-ftparchive --version || (apt-ftparchive --help 2>&1 || true) | grep -qi -e usage -e apt-ftparchive
            apt-sortpkgs --version || (apt-sortpkgs --help 2>&1 || true) | grep -qi -e usage -e apt-sortpkgs
        - uses: test/tw/ldd-check
  - name: apt-transport-https
    description: Transitional package for https support
    pipeline:
      - runs: |
          true
    dependencies:
      runtime:
        - apt
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - libapt-pkg-dev
        - pkgconf-dev  # Debian: pkg-config
        - build-base  # Debian: g++
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - apt-transport-https  # Debian's @: the binary packages of the source
        - apt-utils  # Debian's @: the binary packages of the source
        - libapt-pkg7.0  # Debian's @: the binary packages of the source
        - expect  # Wolfi Community Packages
        - fakeroot  # Wolfi Community Packages
        - wget
        - stunnel  # Debian: stunnel4
        - lsof
        - db-utils  # Debian: db-util
        - gpgv
        - sequoia-chameleon-gnupg  # Wolfi Community Packages (Debian: gpgv-sq)
        - sequoia-sq  # Wolfi Community Packages (Debian: sq)
        - sequoia-sqv  # Wolfi Community Packages (Debian: sqv)
        - moreutils  # Wolfi Community Packages
        - jq
        - perl-file-fcntllock  # Debian: libfile-fcntllock-perl
        - py3-apt  # Wolfi Community Packages (Debian: python3-apt)
        - aptitude  # Wolfi Community Packages
        - valgrind  # Debian: valgrind-if-available
        - gdb
        - ca-certificates-bundle  # Debian: ca-certificates
        - apt
        - dpkg-dev
        - cmake
        - docbook-xml
        - docbook-xsl  # Wolfi Community Packages
        - gettext
        - gtest-dev  # Debian: googletest
        - bzip2-dev  # Debian: libbz2-dev
        - db-dev  # Debian: libdb-dev
        - openssl-dev  # Debian: libssl-dev
        - lz4-dev  # Debian: liblz4-dev
        - xz-dev  # Debian: liblzma-dev
        - libseccomp-dev
        - systemd-dev  # Debian: libsystemd-dev
        - xxhash-dev  # Debian: libxxhash-dev
        - zstd-dev  # Debian: libzstd-dev
        - ninja  # Debian: ninja-build
        - po4a  # Wolfi Community Packages
        - triehash  # Wolfi Community Packages
        - libxslt  # Debian: xsltproc
        - zlib-dev  # Debian: zlib1g-dev
        - doxygen
        - graphviz
        - w3m
        - python3
        - make
        - shadow  # useradd, for the users of the maintainer scripts
  pipeline:
    - runs: |
        apt --version || (apt --help 2>&1 || true) | grep -qi -e usage -e apt
        apt-cache --version || (apt-cache --help 2>&1 || true) | grep -qi -e usage -e apt-cache
        apt-cdrom --version || (apt-cdrom --help 2>&1 || true) | grep -qi -e usage -e apt-cdrom
        apt-config --version || (apt-config --help 2>&1 || true) | grep -qi -e usage -e apt-config
        apt-get --version || (apt-get --help 2>&1 || true) | grep -qi -e usage -e apt-get
        apt-mark --version || (apt-mark --help 2>&1 || true) | grep -qi -e usage -e apt-mark
        test -f /usr/share/licenses/apt/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/a/apt/apt_${{package.version}}.tar.xz
        expected-sha256: ce30b74ba6f633b23fb8162c37ae43c68baa5fa00e2367f6de675142df74b96b
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base ca-certificates=ca-certificates-bundle db-util=db-utils g++=build-base googletest=gtest-dev gpgv-sq=sequoia-chameleon-gnupg libbz2-dev=bzip2-dev libc-bin=glibc libc6=glibc libdb-dev=db-dev libfile-fcntllock-perl=perl-file-fcntllock liblz4-dev=lz4-dev liblzma-dev=xz-dev libssl-dev=openssl-dev libsystemd-dev=systemd-dev libudev-dev=systemd-dev libxxhash-dev=xxhash-dev libzstd-dev=zstd-dev ninja-build=ninja perl-base=perl pkg-config=pkgconf-dev python3-apt=py3-apt sq=sequoia-sq sqv=sequoia-sqv stunnel4=stunnel valgrind-if-available=valgrind xsltproc=libxslt zlib1g-dev=zlib-dev' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/apt.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/apt.templates" && break
        done
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: System users of the maintainer scripts
      runs: |
        { getent passwd _apt >/dev/null || useradd --system --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin _apt; }
    - name: 'autopkgtest: pkg-config-test'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e

        BUILDDIR="$(readlink -f ""$PWD/debian/tests"")/../../build"
        if [ -z "$AUTOPKGTEST_TMP" ]; then
           if [ -f "${BUILDDIR}/apt-pkg/apt-pkg.pc" ]; then
              if [ -n "$PKG_CONFIG_PATH" ]; then
        	 PKG_CONFIG_PATH="${BUILDDIR}/apt-pkg:${PKG_CONFIG_PATH}"
              else
        	 PKG_CONFIG_PATH="${BUILDDIR}/apt-pkg"
              fi
              export PKG_CONFIG_PATH
              echo 'Using PKG_CONFIG_PATH:' "$PKG_CONFIG_PATH"
           fi
        fi

        INCDIR="$(pkg-config --variable=includedir apt-pkg)"
        if [ -z "$AUTOPKGTEST_TMP" ]; then
           if [ -d "${BUILDDIR}/include/apt-pkg" ]; then
              INCDIR="${BUILDDIR}/include"
              CPPFLAGS="${CPPFLAGS} -I${INCDIR}"
           fi
        fi
        echo 'Using include dir:' "$INCDIR"

        if [ -z "$AUTOPKGTEST_TMP" ]; then
           WORKDIR=''
           cleanup() {
              if [ -n "$WORKDIR" ]; then cd /; rm -rf -- "$WORKDIR"; fi
              WORKDIR=''
           }
           trap 'cleanup' 0 HUP INT QUIT ILL ABRT FPE SEGV PIPE TERM
           WORKDIR="$(mktemp -d)"
           cd "$WORKDIR"
        else
           cd "$AUTOPKGTEST_TMP"
        fi

        find "${INCDIR}/apt-pkg" -name '*.h' -type f \
           ! -name 'debsrcrecords.h' \
           ! -name 'header-is-private.h' ! -name 'cachefilter-patterns.h' ! -name 'tagfile-keys.h' \
           -printf '#include <apt-pkg/%f>\n' > pkgconfigtest.cc
        cat >>pkgconfigtest.cc <<EOF
        #include <cstdio>

        int main()
        {
            printf("APT Version: %s\n", pkgVersion);
            return 0;
        }
        EOF

        FAILURE_COUNT=0
        runwithstatus() {
           echo -n "${1}: "
           local OKAY="$2"
           local FAIL="$3"
           shift 3
           if "$@"; then
              if [ -n "$OKAY" ]; then echo "$OKAY"; fi
           else
              FAILURE_COUNT=$(($FAILURE_COUNT + 1))
              if [ -n "$FAIL" ]; then echo "$FAIL"; fi
           fi
        }

        runcompilerwithstandard() {
           local COMPILER="$1"
           shift
           if ! command -v "$COMPILER" >/dev/null; then
              echo "SKIP testing with compiler $COMPILER as it is not available!"
              return
           fi
           for CPPSTD in "$@"; do
              runwithstatus "build $COMPILER ${CPPSTD:-default}" 'OK' '' "$COMPILER" -Wall -Wextra ${CPPFLAGS} ${CPPSTD} -o pkgconfigtest pkgconfigtest.cc `pkg-config --cflags --libs apt-pkg`
              if [ -x pkgconfigtest ]; then
        	 runwithstatus "run $COMPILER ${CPPSTD:-default}" '' 'FAILED' ./pkgconfigtest
        	 rm pkgconfigtest
              fi
           done
        }
        runcompilerwithstandard 'g++' '-std=c++23' '-std=c++20' '-std=c++17' ''

        exit $FAILURE_COUNT
    - name: 'autopkgtest: run-tests'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e

        SOURCE_DIR="$(pwd)"
        if [ -z "$AUTOPKGTEST_TMP" ]; then
           BUILD_DIR=''
           cleanup() {
              if [ -n "$BUILD_DIR" ]; then cd /; rm -rf -- "$BUILD_DIR"; fi
              BUILD_DIR=''
           }
           trap 'cleanup' 0 HUP INT QUIT ILL ABRT FPE SEGV PIPE TERM
           BUILD_DIR="$(mktemp -d)"
        else
           BUILD_DIR="$AUTOPKGTEST_TMP"
        fi

        if [ ! -e "${BUILD_DIR}/CMakeCache.txt" ]; then
           cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -DUSE_SYSTEM_APTPKG=ON -DWITH_DOC=OFF -DUSE_NLS=OFF
        fi

        make -C "${BUILD_DIR}/test/interactive-helper"

        # run tests against the installed apt, use "env -i" to ensure
        # the host env does not pollute our environment
        env -i \
        APT_INTEGRATION_TESTS_SOURCE_DIR="${SOURCE_DIR}" \
        APT_INTEGRATION_TESTS_BUILD_DIR="${BUILD_DIR}" \
        APT_INTEGRATION_TESTS_METHODS_DIR=/usr/lib/apt/methods \
        APT_INTEGRATION_TESTS_LIBEXEC_DIR=/usr/lib/apt/ \
        APT_INTEGRATION_TESTS_INTERNAL_SOLVER=/usr/lib/apt/solvers/apt \
        APT_INTEGRATION_TESTS_DUMP_SOLVER=/usr/lib/apt/solvers/dump \
        APT_INTEGRATION_TESTS_INTERNAL_PLANNER=/usr/lib/apt/planners/apt \
        APT_INTEGRATION_TESTS_FTPARCHIVE_BIN_DIR=/usr/bin \
        APT_INTEGRATION_TESTS_CMDLINE_BIN_DIR=/usr/bin \
        APT_INTEGRATION_TESTS_LIBRARY_PATH=/dev/null/does/not/exist \
        APT_INTEGRATION_TESTS_ARTIFACTS_DIR="${AUTOPKGTEST_ARTIFACTS}" \
        "${SOURCE_DIR}/test/integration/run-tests" -q
