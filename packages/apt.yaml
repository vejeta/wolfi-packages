      - systemd-dev  # Debian: libsystemd-dev
      - xxhash-dev  # Debian: libxxhash-dev
      - zstd-dev  # Debian: libzstd-dev
      - ninja  # Debian: ninja-build
      - pkgconf-dev  # Debian: pkg-config
