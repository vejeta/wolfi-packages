package:
  name: apt
  version: '3.3.4'
  epoch: 0
  description: Commandline package manager
  copyright:
    - license: GPL-2.0-or-later
    - license: GPL-2.0-or-later AND curl
      paths:
        - methods/connect.c
    - license: BSD-3-Clause
      paths:
        - CMake/FindBerkeley.cmake
    - license: MIT
      paths:
        - CMake/Documentation.cmake
        - CMake/FindLFS.cmake
  dependencies:
    runtime:
      - shadow  # used by the maintainer scripts
      - sequoia-sqv  # Wolfi Community Packages (Debian: sqv)
      - libapt-pkg7.0
      - db  # libdb-5.3.so: unversioned soname, no so: dependency
      # Debian Recommends (not supported by apk): ca-certificates
  scriptlets:
    post-install: |
      #!/bin/sh
      # Converted from debian/postinst by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postinst() (
      set -e

      if [ "$1" = 'configure' ] && [ -z "$DPKG_ROOT" ] && ! getent passwd _apt >/dev/null; then
      	# add unprivileged user for the apt methods
      	({ getent passwd _apt >/dev/null || useradd --system --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin _apt; }) || true
      fi

      if [ "$1" = "configure" ] && [ -n "$2" ] && dpkg --compare-versions -- "$2" le-nl "2.4.5~"; then
          rm -f /etc/apt/apt.conf.d/01autoremove-kernels
      fi
      )
      debian_postinst configure
    post-upgrade: |
      #!/bin/sh
      # Converted from debian/postinst by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postinst() (
      set -e

      if [ "$1" = 'configure' ] && [ -z "$DPKG_ROOT" ] && ! getent passwd _apt >/dev/null; then
      	# add unprivileged user for the apt methods
      	({ getent passwd _apt >/dev/null || useradd --system --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin _apt; }) || true
      fi

      if [ "$1" = "configure" ] && [ -n "$2" ] && dpkg --compare-versions -- "$2" le-nl "2.4.5~"; then
          rm -f /etc/apt/apt.conf.d/01autoremove-kernels
      fi
      )
      debian_postinst configure "$2"
    post-deinstall: |
      #!/bin/sh
      # Converted from debian/postrm by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postrm() (
      # apt postrm
      # Copyright (C) 1998, Ben Gertzfield <che@debian.org>

      # This program is free software; you can redistribute it and/or modify
      # it under the terms of the GNU General Public License as published by
      # the Free Software Foundation; either version 2 of the License, or
      # (at your option) any later version.

      set -e


      case "$1" in
             remove)
      		;;
             purge)
      		rm -rf /var/cache/apt
      		rm -rf /var/lib/apt
      esac
      )
      debian_postrm remove
environment:
