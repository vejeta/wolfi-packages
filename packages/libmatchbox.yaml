      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 10-libmb.pc.in 30-build-system 50-implicit-decl fix-build; do mv libmatchbox/$f .recipe-files/; done
      rmdir libmatchbox 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://git.yoctoproject.org/libmatchbox
      branch: master
      expected-commit: 4ce687e71ea70133c2ab0158d297143138141817
  - uses: patch
    with:
      patches: .recipe-files/10-libmb.pc.in .recipe-files/30-build-system .recipe-files/50-implicit-decl .recipe-files/fix-build
  - name: Prepare the build system (from debian/rules override_dh_autoreconf)
    runs: |
      rm -f config.guess config.sub
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
    with:
      opts: --enable-pango --enable-jpeg --enable-png --enable-doxygen-docs
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libmatchbox"
      cp -a NEWS "${{targets.destdir}}/usr/share/doc/libmatchbox/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libmatchbox
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
