    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - libtool
      - pkgconf-dev  # Debian: pkgconf
      - libx11-dev
      - xorgproto  # Debian: x11proto-core-dev
      - libxext-dev
      - libxt-dev
      - glib-dev  # Debian: libglib2.0-dev
      - libpng-dev
      - libjpeg-turbo-dev  # Debian: libjpeg-dev
      - doxygen
