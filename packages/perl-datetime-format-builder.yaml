package:
  name: perl-datetime-format-builder
  version: '0.83'
  epoch: 0
  description: Create DateTime parser classes and objects.
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-datetime-format-strptime  # TODO(alpine-to-melange): not in Wolfi
      - perl-params-validate
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-datetime-format-strptime  # TODO(alpine-to-melange): not in Wolfi
      - perl-params-validate
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/DateTime-Format-Builder-${{package.version}}.tar.gz
      expected-sha512: eb0601dce7bc9adb0b4b6df2058b5f126e36738a9fc1e18c6e09ecf2787fbe7cd9b8ae9a5772590d6fa0df271b5a7fde0f3ab6f2be68e182adaac48ca3ae3837
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
