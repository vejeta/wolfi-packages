environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - dpkg-dev
      - po4a  # Wolfi Community Packages
      - gettext
      - imagemagick-7  # Debian: imagemagick
      - netpbm  # Debian: imagemagick
      - perl-libintl-perl  # Wolfi Community Packages (Debian: libintl-perl)
      - python3
      - coreutils
      - findutils
  environment:
    PERL5LIB: '.'
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in apt.conf copyright; do mv debconf/$f .recipe-files/; done
      rmdir debconf 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/debconf/debconf_${{package.version}}.tar.xz
      expected-sha256: 72265cb0315c0cc58a0d5abf0c032ffac2d071c8ba05bf830f9e0e73ca8ab219
  - runs: |
      make -j$(nproc)
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make prefix=${{targets.outdir}}/debconf-utils install-utils
      make prefix=${{targets.outdir}}/debconf-i18n install-i18n
      make prefix=${{targets.outdir}}/python3-debconf install-python3
      make prefix=${{targets.destdir}} install-rest
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/etc/apt/apt.conf.d"
      cp -a .recipe-files/apt.conf "${{targets.destdir}}/etc/apt/apt.conf.d/70debconf"
      mkdir -p "${{targets.destdir}}/usr/share/bash-completion/completions"
      cp -a bash_completion "${{targets.destdir}}/usr/share/bash-completion/completions/debconf"
      install -Dm644 doc/man/gen/debconf-apt-progress.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf-communicate.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf-copydb.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf-escape.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf-set-selections.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf-show.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/debconf.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 doc/man/gen/dpkg-*configure.8 -t "${{targets.destdir}}/usr/share/man/man8"
      ln -sf /usr/share/bash-completion/completions/debconf "${{targets.destdir}}/usr/share/bash-completion/completions/debconf-show"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/debconf/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
