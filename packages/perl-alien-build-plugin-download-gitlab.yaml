package:
  name: perl-alien-build-plugin-download-gitlab
  version: '0.01'
  epoch: 0
  description: Alien::Build plugin to download from GitLab
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-alien-build
      - perl-uri
      - perl-path-tiny
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
      - perl-alien-build
      - perl-uri
      - perl-path-tiny
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Build-Plugin-Download-GitLab-${{package.version}}.tar.gz
      expected-sha512: 5a1a1dcefbec09732e377c47a961d57cc21a54fef154158dbad1738a93a143348ddc69430b35207d9db111a74592a7120b2abf2f7045818a74a6397bbf07fb06
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-alien-build-plugin-download-gitlab-doc
    description: Alien::Build plugin to download from GitLab (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 293680
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
