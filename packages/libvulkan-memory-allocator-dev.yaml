    runs: |
      rm -rf bin/* docs/*
  - uses: patch
    with:
      patches: .recipe-files/drop-doxygen-path.diff
  - uses: cmake/configure
    with:
      opts: -DVMA_BUILD_DOCUMENTATION=ON
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/libvulkan-memory-allocator-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
