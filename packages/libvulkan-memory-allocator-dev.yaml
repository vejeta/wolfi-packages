pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in drop-doxygen-path.diff; do mv libvulkan-memory-allocator-dev/$f .recipe-files/; done
      rmdir libvulkan-memory-allocator-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator
      tag: v${{package.version}}
      expected-commit: 3aa921224c154a0d2c43912bc88e1c42ce1f7607
