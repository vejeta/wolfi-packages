package:
  name: pandoc-cli
  version: '3.12.1'
  epoch: 0
  description: Universal markup converter
  copyright:
    - license: GPL-2.0-or-later
  target-architecture:
    - aarch64
    - x86_64
  dependencies:
    provides:
      - pandoc=3.12.1-r0
    replaces:
      - pandoc
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - ghc-bootstrap  # Alpine: ghc
      - cabal-install-bootstrap  # Alpine: cabal
      - zlib-dev
      - libffi-dev
      - zlib
      - file
  environment:
    CABAL_CONFIG: /home/build/.cabal-config
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv pandoc-cli/* .recipe-files/
      rmdir pandoc-cli
  - name: cabal configuration
    runs: |
      cat > /home/build/.cabal-config <<'EOF'
      repository hackage.haskell.org
        url: https://hackage.haskell.org/
      EOF
  - uses: fetch
    with:
      uri: https://hackage.haskell.org/package/pandoc-cli-${{package.version}}/pandoc-cli-${{package.version}}.tar.gz
      expected-sha512: 65c3f4bc91fc6b6a9ed9b2a1aeafca2df04513c6eae625cf9fc3f1dd4e0177f7f3eb4cb0980b96d07b227ba4dc8ef23cd18ad90a24d50dce2c3a0f51c99a9d65
  - name: Prepare
    runs: |
      srcdir="/home/build/_srcdir"
      builddir="/home/build"
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/pandoc-cli-3.12.1" ] || ln -s /home/build "/home/build/_srcdir/pandoc-cli-3.12.1"
      cp -a /home/build/.recipe-files/cabal.project.freeze "$srcdir"/

      ln -svf "$srcdir"/cabal.project.freeze "$builddir"/
  - name: Build
    runs: |
      pkgname="${{package.name}}"
      JOBS="$(nproc)"

      cabal v2-update
      cabal v2-build pandoc-cli:exes \
      	--jobs=${JOBS:-1} \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--docdir=/usr/share/doc/$pkgname \
      	--flags="+server +lua" \
      	--constraint="pandoc +embed_data_files"
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      # See https://github.com/haskell/cabal/issues/6919#issuecomment-761563498
      cabal list-bin --allow-newer="base" pandoc-cli:exes |
      	xargs install -Dvm755 -t "$pkgdir"/usr/bin/

      ln -sfv pandoc "$pkgdir"/usr/bin/pandoc-server

      install -Dvm644 man/*.1 -t "$pkgdir"/usr/share/man/man1/
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: pandoc-cli-doc
    description: Universal markup converter (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 340695
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
