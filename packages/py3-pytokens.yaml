package:
  name: py3-pytokens
  version: '0.3.0'
  epoch: 0
  description: Fast, spec-compliant Python 3.13+ tokenizer
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - py3-gpep517
      - py3-installer
      - py3-setuptools
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tusharsadhwani/pytokens
      tag: ${{package.version}}
      expected-commit: 5d02d6df9bb9a779c901bdaf8681308ad9ae4748
  - name: Build
    runs: |
      gpep517 build-wheel \
      	--wheel-dir .dist \
      	--output-fd 3 3>&1 >&2
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      python3 -m installer -d "$pkgdir" \
      	.dist/*.whl
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: true
  github:
    identifier: tusharsadhwani/pytokens
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
