package:
  name: libppx-let-ocaml-dev
  version: '0.17.1'
  epoch: 0
  description: Ppx rewriter for monadic and applicative bindings (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      # TODO(debian-to-melange): libbase-ocaml-dev is not in Wolfi (Debian: libbase-ocaml-dev); left out
      # TODO(debian-to-melange): libppxlib-ocaml-dev is not in Wolfi (Debian: libppxlib-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-here-ocaml-dev is not in Wolfi (Debian: libppx-here-ocaml-dev); left out
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_let
      tag: v${{package.version}}
      expected-commit: f34bef0ae0577263bea9ae36a9d3e3677c03b389
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-let-ocaml-dev"
      cp -a usr/doc/ppx_let/* "${{targets.destdir}}/usr/share/doc/libppx-let-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-let
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-let-ocaml
    description: Ppx rewriter for monadic and applicative bindings (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libppx-let-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppx_let
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-let/LICENSE.md
    - uses: test/tw/ldd-check
