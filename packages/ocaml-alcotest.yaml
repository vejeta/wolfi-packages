package:
  name: libalcotest-ocaml-dev
  version: '1.9.1'
  epoch: 0
  description: Lightweight and colourful test framework for OCaml
  copyright:
    - license: ISC
    - license: Unlicense
      paths:
        - 'examples/*'
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      # TODO(debian-to-melange): libfmt-ocaml-dev is not in Wolfi (Debian: libfmt-ocaml-dev); left out
      # TODO(debian-to-melange): libastring-ocaml-dev is not in Wolfi (Debian: libastring-ocaml-dev); left out
      # TODO(debian-to-melange): libcmdliner-ocaml-dev is not in Wolfi (Debian: libcmdliner-ocaml-dev); left out
      - libre-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libuutf-ocaml-dev is not in Wolfi (Debian: libuutf-ocaml-dev); left out
      # TODO(debian-to-melange): liblwt-ocaml-dev is not in Wolfi (Debian: liblwt-ocaml-dev); left out
      # TODO(debian-to-melange): liblogs-ocaml-dev is not in Wolfi (Debian: liblogs-ocaml-dev); left out
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Do-not-call-Unix.create_process-with-empty-args.patch; do mv ocaml-alcotest/$f .recipe-files/; done
      rmdir ocaml-alcotest 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/alcotest
      tag: ${{package.version}}
      expected-commit: 7db64e91b159ce60937d2ff647208eb25fe37610
  - uses: patch
    with:
      patches: .recipe-files/0001-Do-not-call-Unix.create_process-with-empty-args.patch
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libalcotest-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libalcotest-ocaml-dev/examples/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-alcotest
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: mirage/alcotest
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-alcotest/LICENSE.md
    - uses: test/tw/ldd-check
