package:
  name: squashfs-tools-ng
  version: '1.3.2'
  epoch: 0
  description: New set of tools and libraries for working with SquashFS images
  copyright:
    - license: GPL-3.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - automake
      - libselinux-dev
      - lz4-dev
      - lzo-dev
      - xz-dev
      - zlib-dev
      - zstd-dev
      - lz4
      - lzo
      - xz
      - zlib
      - zstd
pipeline:
  - uses: fetch
    with:
      uri: https://infraroot.at/pub/squashfs/squashfs-tools-ng-${{package.version}}.tar.gz
      expected-sha512: 4a3a194af80aa9ed689cf541106906945f546fa15a5b30feff9df95998105298aa919757b1f17bf8387da0bdb05b70857ce818ce8572411cd5ef25e2b93c2022
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--localstatedir=/var
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: squashfs-tools-ng-dev
    description: New set of tools and libraries for working with SquashFS images (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
