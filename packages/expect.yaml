      autoreconf -fi
  - name: Configure (from debian/rules override_dh_auto_configure)
    runs: |
      cp -f configure configure~
      cp -fb /usr/share/misc/config.guess tclconfig/config.guess
      cp -fb /usr/share/misc/config.sub tclconfig/config.sub
      autoconf
      for v in 9.1 ; do  	     mkdir -p ./debian/$v && (top=$PWD && cd ./debian/$v && "$top"/configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --includedir=/usr/include/tcl$v --with-tcl=/usr/lib/tcl$v --with-tk=/usr/lib/tk$v --with-tclinclude=/usr/include/tcl$v --with-tkinclude=/usr/include/tcl$v --enable-shared --enable-threads --disable-rpath CFLAGS="-Wall -g -D_DEFAULT_SOURCE -D_POSIX_SOURCE -Wno-old-style-definition") ;  	done
