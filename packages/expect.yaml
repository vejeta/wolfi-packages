#
# Conversion notes:
# - builddir=/home/build/_srcdir"/expect$pkgve is not the top directory of the main tarball; review
# - check() not run (pass --with-check to add it to the build)
package:
  name: expect
  version: '5.45.4'
  epoch: 0
  description: A tool for automating interactive applications
  copyright:
    - license: NIST-PD
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - autoconf
      - automake
      - tcl-dev
      - tcl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv expect/* .recipe-files/
      rmdir expect
  - uses: fetch
    with:
      uri: https://downloads.sourceforge.net/project/expect/Expect/${{package.version}}/expect${{package.version}}.tar.gz
      expected-sha512: a8dc25e8175f67e029e15cbcfca1705165c1c4cb2dd37eaaaebffb61e3ba132d9519cd73ca5add4c3358a2b0b7a91e878279e8d0b72143ff2c287fce07e4659a
  - uses: patch
    with:
      patches: .recipe-files/07-file-handle.patch .recipe-files/09-unsafe-traps.patch .recipe-files/10-manpage.patch .recipe-files/12-fdout.patch .recipe-files/22-segfault-with-stubs.patch .recipe-files/24-format.patch .recipe-files/expect-5.45.4-covscan-fixes.patch .recipe-files/expect-c99.patch .recipe-files/expect-configure-c99.patch .recipe-files/gcc15.patch
  - name: Prepare
    runs: |
      update_config_sub() {
      	find . -name config.sub | while read -r _f; do
      		cp "$(ls /usr/share/automake-*/config.sub | tail -1)" "$_f"
      	done
      }

      update_config_sub
      autoreconf -i
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--localstatedir=/var \
      	--mandir=/usr/share/man \
      	--with-tcl=/usr/lib \
      	--with-tclinclude=/usr/include \
      	--disable-rpath
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: expect-dev
    description: A tool for automating interactive applications (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: expect-doc
    description: A tool for automating interactive applications (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 771
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
