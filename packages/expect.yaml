      mkdir -p ${{targets.destdir}}/usr/share/man/man3
      cp ${{targets.destdir}}/usr/share/man/man1/expect.1 ${{targets.destdir}}/usr/share/man/man3/Expect.3tcl
      sed -i -e's:\.TH EXPECT 1:.TH EXPECT 3tcl:' ${{targets.destdir}}/usr/share/man/man3/Expect.3tcl
      if [ -e ${{targets.destdir}}/usr/lib/expect5.45.4/libexpect5.45.4.so ]; then mv ${{targets.destdir}}/usr/lib/expect5.45.4/libexpect5.45.4.so  		${{targets.destdir}}/usr/lib/libexpect.so.5.45.4; fi
