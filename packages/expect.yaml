      mkdir -p -m 755 ${{targets.destdir}}/usr/lib
      if [ -e "$(dirname ${{targets.destdir}}/usr/lib/expect5.45.4/libexpect5.45.4.so)/../libexpect.so.5.45.4" ]; then ln -s ../libexpect.so.5.45.4  		${{targets.destdir}}/usr/lib/expect5.45.4/libexpect5.45.4.so; fi
