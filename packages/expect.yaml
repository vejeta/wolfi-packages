      rm ${{targets.destdir}}/usr/bin/ftp-rfc
      for SCRIPT in ${{targets.destdir}}/usr/bin/* ; do  	    if [ "$(printf "%.6s" "$(basename $SCRIPT)")" != "expect" ] ; then  		sed -e 's/^exec tclsh /exec tclsh9.1 /' $SCRIPT >$(dirname $SCRIPT)/expect_$(basename $SCRIPT) ;  		rm $SCRIPT ;  	    fi  	done
