  description: Automates interactive applications
  copyright:
    - license: NIST-PD
  dependencies:
    runtime:
      - tcl  # Debian: tcl9.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
