      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 01-example-shebang.patch 02-example-cryptdir.patch 05-makefile-soname.patch 07-file-handle.patch 09-unsafe-traps.patch 10-manpage.patch 11-ttyname.patch 12-fdout.patch 13-implicit-defs.patch 16-logfile.patch 18-non-linux.patch 22-segfault-with-stubs.patch 24-format.patch 28-cross.patch 29-suggest-tk.patch 30-editorial-changes-to-manpages.patch 35-expect-empty-match.patch 40-tcl9.patch 41-uninitialized.patch copyright; do mv expect/$f .recipe-files/; done
      rmdir expect 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/e/expect/expect_${{package.version}}.orig.tar.gz
      expected-sha256: d082bf340fdb7a85b1e4e5df4d967d0140835db34a8a035c3102abb5eb62d450
  - name: 'Debian''s /usr/share/misc/config.guess and config.sub (autotools-dev)'
    runs: |
      mkdir -p /usr/share/misc
      for f in config.guess config.sub; do
        ln -sf "$(ls /usr/share/automake-*/$f | tail -1)" /usr/share/misc/$f
      done
  - name: 'Debian''s Tcl/Tk layout'
    runs: |
      mkdir -p /usr/lib/tcl9.1 && ln -sf ../tclConfig.sh /usr/lib/tcl9.1/tclConfig.sh
      [ -e /usr/include/tcl9.1 ] || ln -s . /usr/include/tcl9.1
  - uses: patch
    with:
      patches: .recipe-files/01-example-shebang.patch .recipe-files/02-example-cryptdir.patch .recipe-files/05-makefile-soname.patch .recipe-files/07-file-handle.patch .recipe-files/09-unsafe-traps.patch .recipe-files/10-manpage.patch .recipe-files/11-ttyname.patch .recipe-files/12-fdout.patch .recipe-files/13-implicit-defs.patch .recipe-files/16-logfile.patch .recipe-files/18-non-linux.patch .recipe-files/22-segfault-with-stubs.patch .recipe-files/24-format.patch .recipe-files/28-cross.patch .recipe-files/29-suggest-tk.patch .recipe-files/30-editorial-changes-to-manpages.patch .recipe-files/35-expect-empty-match.patch .recipe-files/40-tcl9.patch .recipe-files/41-uninitialized.patch
