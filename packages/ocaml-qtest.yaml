package:
  name: ocaml-qtest
  version: '2.11.2'
  epoch: 0
  description: Inline (Unit) Tests for OCaml (Executable)
  copyright:
    - license: GPL-3.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libounit-ocaml-dev  # Wolfi Community Packages
      - libqcheck-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in qtest.1; do mv ocaml-qtest/$f .recipe-files/; done
      rmdir ocaml-qtest 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/vincent-hugot/qtest
      tag: v${{package.version}}
      expected-commit: aa9c27211e05ebff1a259750f092caef8e7fbe12
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p qtest -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" qtest
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/qtest.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-qtest
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libqtest-ocaml
    description: Inline (Unit) Tests for OCaml (Runtime library)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/qtest"
          mv "${{targets.destdir}}/usr/lib/ocaml/qtest/META" "${{targets.contextdir}}/usr/lib/ocaml/qtest/"
          mv "${{targets.destdir}}/usr/lib/ocaml/qtest/opam" "${{targets.contextdir}}/usr/lib/ocaml/qtest/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          mkdir -p "${{targets.contextdir}}/usr/share/doc/qtest"
          mv "${{targets.destdir}}/usr/doc/qtest/README.adoc" "${{targets.contextdir}}/usr/share/doc/qtest/"
  - name: libqtest-ocaml-dev
    description: Inline (Unit) Tests for OCaml (Development package)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/qtest"
          mv "${{targets.destdir}}/usr/lib/ocaml/qtest/dune-package" "${{targets.contextdir}}/usr/lib/ocaml/qtest/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cmi; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cmt; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.ml; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.a; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cmxa; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/qtest/lib/*.cmx; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/qtest/lib/"
          done
          true
    dependencies:
      runtime:
        - libqtest-ocaml  # Debian: ${ocaml:Depends}
        - libounit-ocaml-dev  # Debian: ${ocaml:Depends}
        - libqcheck-ocaml-dev  # Debian: ${ocaml:Depends}
  - name: libqtest-ocaml-doc
    description: Documentation for ocaml-qtest
    pipeline:
      - uses: split/manpages
update:
  enabled: true
  github:
    identifier: vincent-hugot/qtest
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - zstd-dev  # Debian: ocaml
        - ocamlbuild
        - ocaml-findlib  # Debian: ocaml-findlib
        - ocamlfind  # Debian: ocaml-findlib
        - libounit-ocaml-dev  # Wolfi Community Packages
        - libqcheck-ocaml-dev  # Wolfi Community Packages
        - ocaml-qtest
        - cppo  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        qtest --version || (qtest --help 2>&1 || true) | grep -qi -e usage -e qtest
        test -f /usr/share/licenses/ocaml-qtest/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/vincent-hugot/qtest
        tag: v${{package.version}}
        expected-commit: aa9c27211e05ebff1a259750f092caef8e7fbe12
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-qtest/ocaml-qtest_2.11.2-4.debian.tar.xz
        strip-components: 0
        expected-sha256: 298443b765029257df94162e948f9834af0dfd26dc1bc94de078757e22c0de7d
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/ocaml-qtest.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/ocaml-qtest.templates" && break
        done
    - name: 'autopkgtest: testdirectives'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        mkdir -p debian/tests
        cat > "debian/tests/testdirectives" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/bash
        set -e

        cd "$(dirname "$0")/../../tests"

        ./testdirectives.sh

        echo ok
        AUTOPKGTEST_SCRIPT
        chmod +x "debian/tests/testdirectives"
        "$PWD/debian/tests/testdirectives"
