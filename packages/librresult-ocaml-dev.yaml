# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-rresult 0.7.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-rresult
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-rresult
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocaml-rresult/ocaml-rresult_0.7.0.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: librresult-ocaml-dev
  version: '0.7.0'
  epoch: 0
  description: Result value combinators for OCaml (dev)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - opam  # Debian: opam-installer
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-rresult/ocaml-rresult_${{package.version}}.orig.tar.bz2
      expected-sha256: 11aa7f5b83460e60431e3154e3e32c071d46e151ea5760cf24377805bf975540
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      opam-installer --prefix=${{targets.destdir}}/usr --libdir=../usr/lib/ocaml rresult.install
      rm -f ${{targets.destdir}}/usr/doc/rresult/LICENSE.md
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/librresult-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/rresult/* "${{targets.destdir}}/usr/share/doc/librresult-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/rresult" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/librresult-ocaml-dev
subpackages:
  - name: librresult-ocaml
    description: Result value combinators for OCaml (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/rresult"
          mv "${{targets.destdir}}/usr/lib/ocaml/rresult/META" "${{targets.contextdir}}/usr/lib/ocaml/rresult/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/rresult/*.cma "${{targets.contextdir}}/usr/lib/ocaml/rresult/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/rresult/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/rresult/"
update:
  enabled: true
  release-monitor:
    identifier: 241666
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/librresult-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
