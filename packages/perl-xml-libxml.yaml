package:
  name: perl-xml-libxml
  version: '2.0213'
  epoch: 0
  description: Interface to Gnome libxml2 xml parsing and DOM library
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-xml-sax
      - perl-xml-sax-base
      - perl-xml-namespacesupport
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-dev
      - perl-alien-libxml2  # TODO(alpine-to-melange): not in Wolfi
      - perl-alien-build  # TODO(alpine-to-melange): not in Wolfi
      - libxml2-dev
      - perl
      - perl-xml-sax
      - perl-xml-sax-base
      - perl-xml-namespacesupport
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-LibXML-${{package.version}}.tar.gz
      expected-sha512: 669446176a90f784017576436bee4952c110953b5198e8ad043af9507e97e93bacfc0b29c201bff03322dba77336e4680156052d356c7026c1b804c3f310d8ce
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: perl-xml-libxml-doc
    description: Interface to Gnome libxml2 xml parsing and DOM library (doc)
    pipeline:
