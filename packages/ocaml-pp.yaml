package:
  name: libpp-ocaml
  version: '2.0.0'
  epoch: 0
  description: Pretty printing for OCaml applications (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): libjane-street-headers-ocaml-dev is not in Wolfi (Debian: libjane-street-headers-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-enumerate-ocaml-dev is not in Wolfi (Debian: libppx-enumerate-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-expect-ocaml-dev is not in Wolfi (Debian: libppx-expect-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-hash-ocaml-dev is not in Wolfi (Debian: libppx-hash-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-sexp-conv-ocaml-dev is not in Wolfi (Debian: libppx-sexp-conv-ocaml-dev); left out
      # TODO(debian-to-melange): libtime-now-ocaml-dev is not in Wolfi (Debian: libtime-now-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-expect-ocaml-dev is not in Wolfi (Debian: libppx-expect-ocaml-dev); left out
      - ocaml-dune
      - ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-dune/pp
      tag: ${{package.version}}
      expected-commit: b6741dd41ef5fc5bda8b3640097ac29818a43577
  - name: Prepare the build system (from debian/rules override_dh_autoreconf)
    runs: |
      if ! test -f pp.opam.bak; then  	  cp pp.opam pp.opam.bak ;  	fi
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-pp
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libpp-ocaml-dev
    description: Pretty printing for OCaml applications (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libpp-ocaml-dev"
          cp -a usr/doc/pp/* "${{targets.contextdir}}/usr/share/doc/libpp-ocaml-dev/"
update:
  enabled: true
  github:
    identifier: ocaml-dune/pp
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-pp/LICENSE.md
    - uses: test/tw/ldd-check
