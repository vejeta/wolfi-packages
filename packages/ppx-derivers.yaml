package:
  name: libppx-derivers-ocaml-dev
  version: '1.2.1'
  epoch: 0
  description: Interoperability of ppx-deriving and ppx-type-conv
  copyright:
    - license: BSD-3-Clause
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-ppx/ppx_derivers
      tag: ${{package.version}}
      expected-commit: d6655353f647d33de12d215aaa477ba936febef3
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-derivers-ocaml-dev"
      cp -a usr/doc/*/* "${{targets.destdir}}/usr/share/doc/libppx-derivers-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-derivers
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml-ppx/ppx_derivers
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-derivers/LICENSE.md
    - uses: test/tw/ldd-check
