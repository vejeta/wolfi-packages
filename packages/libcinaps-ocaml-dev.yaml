#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libcinaps-ocaml-dev
  version: '0.15.1'
  epoch: 0
  description: Trivial metaprogramming tool (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libre-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Remove-dependency-on-ppx_jane.patch; do mv libcinaps-ocaml-dev/$f .recipe-files/; done
      rmdir libcinaps-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-ppx/cinaps
      tag: v${{package.version}}
      expected-commit: 86f2f05c4605572022cdb794c5542d220fb14be5
  - uses: patch
    with:
      patches: .recipe-files/0001-Remove-dependency-on-ppx_jane.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p cinaps -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" cinaps
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcinaps-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/cinaps/* "${{targets.destdir}}/usr/share/doc/libcinaps-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/cinaps" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libcinaps-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcinaps-ocaml
    description: Trivial metaprogramming tool (runtime files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/cinaps"
          mv "${{targets.destdir}}/usr/lib/ocaml/cinaps/META" "${{targets.contextdir}}/usr/lib/ocaml/cinaps/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/cinaps/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/cinaps/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: ocaml-ppx/cinaps
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        cinaps --version || (cinaps --help 2>&1 || true) | grep -qi -e usage -e cinaps
        test -f /usr/share/licenses/libcinaps-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
