# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: catch
  version: '1.12.2'
  epoch: 0
  description: C++ Automated Test Cases in Headers
  copyright:
    - license: BSL-1.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - python3
      - py3-supported-urllib3  # Debian: python3-urllib3
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in cmake4.patch glib2.34.patch python3.patch; do mv catch/$f .recipe-files/; done
      rmdir catch 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/catchorg/Catch2
      tag: v${{package.version}}
      expected-commit: 6860c8def0ba7559bf077515b7a7ff63ad3444f8
  - uses: patch
    with:
      patches: .recipe-files/python3.patch .recipe-files/glib2.34.patch .recipe-files/cmake4.patch
  - uses: cmake/configure
  - uses: cmake/build
  - uses: cmake/install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/catch"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/catch/"
      cp -a docs "${{targets.destdir}}/usr/share/doc/catch/"
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/catch
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  github:
    identifier: catchorg/Catch2
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/catch/LICENSE.txt
