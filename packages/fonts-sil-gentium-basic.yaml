# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-sil-gentium-basic/fonts-sil-gentium-basic_1.102.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-sil-gentium-basic
  version: '1.102'
  epoch: 0
  description: Smart Unicode font families (Basic and Book Basic) based on Gentium
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): fonts-sil-gentium
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-gentium-basic/$f .recipe-files/; done
      rmdir fonts-sil-gentium-basic 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-sil-gentium-basic/fonts-sil-gentium-basic_${{package.version}}.orig.tar.xz
      expected-sha256: a7c89371d71ee45a7c12072df75c0ef790674e39fdde747b46d6e4cfb2219f7d
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium-basic"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium-basic/"
      cp -a GENTIUM-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium-basic/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-gentium-basic/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-gentium-basic/copyright
