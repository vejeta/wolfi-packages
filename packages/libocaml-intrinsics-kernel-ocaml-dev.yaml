package:
  name: libocaml-intrinsics-kernel-ocaml-dev
  version: '0.17.2'
  epoch: 0
  description: Library of intrinsics for OCaml (dev)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libocaml-intrinsics-kernel-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ocaml_intrinsics_kernel
      tag: v${{package.version}}
      expected-commit: 3bc35a26185b1f5742543a25d08b4df286a754ec
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ocaml_intrinsics_kernel -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ocaml_intrinsics_kernel
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocaml-intrinsics-kernel-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ocaml_intrinsics_kernel/* "${{targets.destdir}}/usr/share/doc/libocaml-intrinsics-kernel-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ocaml_intrinsics_kernel" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libocaml-intrinsics-kernel-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libocaml-intrinsics-kernel-ocaml
    description: Library of intrinsics for OCaml (runtime)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/ocaml_intrinsics_kernel/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
update:
  enabled: true
  github:
    identifier: janestreet/ocaml_intrinsics_kernel
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libocaml-intrinsics-kernel-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
