#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libocplib-endian-ocaml-dev
  version: '1.2'
  epoch: 0
  description: Optimised functions to read and write int16/32/64 (development)
  copyright:
    - license: LGPL-2.2+-with-linking-exception
  dependencies:
    runtime:
      - libocplib-endian-ocaml  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - cppo  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv libocplib-endian-ocaml-dev/$f .recipe-files/; done
      rmdir libocplib-endian-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/OCamlPro/ocplib-endian
      tag: ${{package.version}}
      expected-commit: 10292cd3ffa4d23d737e3f855ad04f22d3d95460
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ocplib-endian -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ocplib-endian
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocplib-endian-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ocplib-endian/* "${{targets.destdir}}/usr/share/doc/libocplib-endian-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ocplib-endian" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/libocplib-endian-ocaml-dev/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libocplib-endian-ocaml
    description: Optimised functions to read and write int16/32/64 (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ocplib-endian"
          mv "${{targets.destdir}}/usr/lib/ocaml/ocplib-endian/META" "${{targets.contextdir}}/usr/lib/ocaml/ocplib-endian/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ocplib-endian/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ocplib-endian/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ocplib-endian/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ocplib-endian/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ocplib-endian/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ocplib-endian/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
    dependencies:
      runtime:
        - ocaml-findlib  # Debian: libfindlib-ocaml
        - ocamlfind  # Debian: libfindlib-ocaml
        - ocaml-findlib-compat  # Debian: libfindlib-ocaml
update:
  enabled: true
  github:
    identifier: OCamlPro/ocplib-endian
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/libocplib-endian-ocaml-dev/copyright
    - uses: test/tw/ldd-check
