#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/d/distro-info-data/distro-info-data_2026.10.12.orig.tar.xz), which disappears from the pool when Debian updates
# - dh --with single-binary has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: distro-info-data
  version: '2026.10.12'
  epoch: 0
  description: 'Information about the distributions'' releases (data files)'
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv distro-info-data/$f .recipe-files/; done
      rmdir distro-info-data 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/distro-info-data/distro-info-data_${{package.version}}.orig.tar.xz
      expected-sha256: 52b84d86fadae6483f5b72adcd93dc87a95ad9bba820c5b4cd65442cb252e9d0
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/distro-info-data/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 21562
test:
  environment:
    contents:
      packages:
        - busybox
        - distro-info-data
        - make
        - python3
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/doc/distro-info-data/copyright
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/d/distro-info-data/distro-info-data_${{package.version}}.orig.tar.xz
        expected-sha256: 52b84d86fadae6483f5b72adcd93dc87a95ad9bba820c5b4cd65442cb252e9d0
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/distro-info-data.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/distro-info-data.templates" && break
        done
    - name: 'autopkgtest: make up-to-date DATADIR=/usr/share/distro-info/'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        make up-to-date DATADIR=/usr/share/distro-info/
