#
# Generated by debian-to-melange 0.1.0 from Debian source package
# sombok 2.4.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/sombok
# Debian packaging: https://salsa.debian.org/kolter/sombok
#
# Conversion notes:
# - runtime dependency 'libjs-jquery': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - set expected-commit for tag v2.4.0 (re-run with --download, or git ls-remote)
package:
  name: libsombok-dev
  version: '2.4.0'
  epoch: 0
  description: Unicode Text Segmentation library (development files)
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
      paths:
        - '*'
        - debian/patches/add_tests_suite_data
  dependencies:
    runtime:
      - glibc-dev  # Debian: libc6-dev
      - libsombok3
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - libthai-dev  # Wolfi Community Packages
      - pkgconf-dev  # Debian: pkg-config
      - doxygen
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in add_tests_suite_data disable_doxygen_search_engine fix_FTCBFS fix_ftbfs_kfreebsd_strepipe fix_tests_suite; do mv libsombok-dev/$f .recipe-files/; done
      rmdir libsombok-dev 2>/dev/null || true
  # TODO(debian-to-melange): set expected-commit for tag v2.4.0 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://github.com/hatukanezumi/sombok
      tag: v${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - uses: patch
    with:
      patches: .recipe-files/fix_ftbfs_kfreebsd_strepipe .recipe-files/disable_doxygen_search_engine .recipe-files/fix_tests_suite .recipe-files/add_tests_suite_data .recipe-files/fix_FTCBFS
  - name: Prepare the build system (from debian/rules override_dh_autoreconf)
    runs: |
      if [ -f INSTALL ]; then  		mv INSTALL INSTALL.bak ;  	fi
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  - name: From debian/rules override_dh_install
    runs: |
      rm -f ${{targets.destdir}}/usr/share/doc/sombok/jquery.js
      find ${{targets.destdir}}/usr/share/doc/sombok -iname '*.md5' -delete
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib"
      mkdir -p "${{targets.destdir}}/usr/include"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libsombok-dev/html"
      ln -sf /usr/share/javascript/jquery/jquery.min.js "${{targets.destdir}}/usr/share/doc/libsombok-dev/html/jquery.js"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libsombok-dev"
      cp -a README "${{targets.destdir}}/usr/share/doc/libsombok-dev/"
      cp -a README.ja_JP "${{targets.destdir}}/usr/share/doc/libsombok-dev/"
      cp -a ChangeLog.REL1 "${{targets.destdir}}/usr/share/doc/libsombok-dev/"
      cp -a NEWS "${{targets.destdir}}/usr/share/doc/libsombok-dev/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libsombok-dev
  - name: From debian/rules override_dh_autoreconf_clean
    runs: |
      if [ -f INSTALL.bak ]; then  		mv INSTALL.bak INSTALL ;  	fi
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libsombok3
    description: Unicode Text Segmentation library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/lib*.so.* "${{targets.contextdir}}/usr/lib/"
    dependencies:
      runtime:
        - libthai  # Wolfi Community Packages (Debian: libthai0)
update:
  enabled: true
  github:
    identifier: hatukanezumi/sombok
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libsombok-dev/COPYING
    - uses: test/tw/ldd-check
