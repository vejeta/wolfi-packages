package:
  name: sfnt2woff-zopfli
  version: '1.3.1'
  epoch: 0
  description: Create WOFF files with Zopfli compression
  copyright:
    - license: MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later
    - license: Apache-2.0
      paths:
        - 'zopfli/*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - zlib-dev  # Debian: zlib1g-dev
      - zopfli-dev  # Debian: libzopfli-dev
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 20.patch Conform-to-the-tpyes-of-ZopfliCompress-API.patch; do mv sfnt2woff-zopfli/$f .recipe-files/; done
      rmdir sfnt2woff-zopfli 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/bramstein/sfnt2woff-zopfli
      tag: v${{package.version}}
      expected-commit: a43acb00bc0bec0a16885046bf16f3facb99d2e2
  - uses: patch
    with:
      patches: .recipe-files/20.patch .recipe-files/Conform-to-the-tpyes-of-ZopfliCompress-API.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) ZOPFLI_LIBS=-lzopfli ZOPFLI_CFLAGS=-I/usr/include/zopfli
  - name: Install files
    runs: |
      install -Dm644 sfnt2woff-zopfli.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 woff2sfnt-zopfli.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf /usr/bin/sfnt2woff-zopfli "${{targets.destdir}}/usr/bin/sfnt2woff"
      ln -sf /usr/bin/woff2sfnt-zopfli "${{targets.destdir}}/usr/bin/woff2sfnt"
      mkdir -p "${{targets.destdir}}/usr/share/man/man1"
      ln -sf /usr/share/man/man1/sfnt2woff-zopfli.1 "${{targets.destdir}}/usr/share/man/man1/sfnt2woff.1"
      ln -sf /usr/share/man/man1/woff2sfnt-zopfli.1 "${{targets.destdir}}/usr/share/man/man1/woff2sfnt.1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/sfnt2woff-zopfli"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/sfnt2woff-zopfli/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/sfnt2woff-zopfli
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  github:
    identifier: bramstein/sfnt2woff-zopfli
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        sfnt2woff-zopfli --version || (sfnt2woff-zopfli --help 2>&1 || true) | grep -qi -e usage -e sfnt2woff-zopfli
        woff2sfnt-zopfli --version || (woff2sfnt-zopfli --help 2>&1 || true) | grep -qi -e usage -e woff2sfnt-zopfli
        test -f /usr/share/licenses/sfnt2woff-zopfli/COPYING
    - uses: test/tw/ldd-check
