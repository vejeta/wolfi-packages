# https://tracker.debian.org/pkg/fonts-gfs-didot
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-gfs-didot
#
# Conversion notes:
# - license MIT read from the notice in debian/copyright (not DEP-5); check it
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-gfs-didot/fonts-gfs-didot_1.1.orig.tar.bz2), which disappears from the pool when Debian updates
package:
  name: fonts-gfs-didot
  version: '1.1'
  epoch: 0
  description: Greek font family (Didot revival)
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-gfs-didot/$f .recipe-files/; done
      rmdir fonts-gfs-didot 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-gfs-didot/fonts-gfs-didot_${{package.version}}.orig.tar.bz2
      expected-sha256: 4560b5e72891ddc4d729a942ad6fdd980c06fe5b5376fd0602d510cc45e1e278
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/didot"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-gfs-didot"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-gfs-didot/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-gfs-didot/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-gfs-didot/copyright
