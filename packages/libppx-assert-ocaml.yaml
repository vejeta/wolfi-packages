# ppx-assert 0.17.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ppx-assert
# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-assert
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-assert-ocaml
  version: '0.17.0'
  epoch: 0
  description: Provide assertions in OCaml (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppx-cold-ocaml-dev  # Wolfi Community Packages
      - libppx-compare-ocaml-dev  # Wolfi Community Packages
      - libppx-here-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_assert
      tag: v${{package.version}}
      expected-commit: ba83d249d4b1cd7b3fe8eb20e73fae39d48f2ffa
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_assert -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_assert
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-assert-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-assert-ocaml-dev
    description: Provide assertions in OCaml (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*opam* "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*dune* "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_assert/ppx.exe" "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.ml "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.mli "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.cmt* "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.ml "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.mli "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.a "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.a "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_assert/runtime-lib/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/ppx_assert/runtime-lib/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-assert-ocaml-dev"
          mv "${{targets.destdir}}"/usr/doc/ppx_assert/* "${{targets.contextdir}}/usr/share/doc/libppx-assert-ocaml-dev/"
          rmdir "${{targets.destdir}}/usr/doc/ppx_assert" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libppx-assert-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: janestreet/ppx_assert
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-assert-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
