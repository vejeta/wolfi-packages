package:
  name: libxmlb
  version: '0.3.29'
  epoch: 0
  description: Library to help create and query binary XML blobs
  copyright:
    - license: LGPL-2.1-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - meson
      - glib-dev
      - gobject-introspection-dev
      - glib-gir  # GLib .gir files (part of glib-dev on Alpine)
      - xz-dev
      - zstd-dev
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hughsie/libxmlb
      tag: ${{package.version}}
      expected-commit: d942cd68a7d78e35b312b9299e69f68f9cd2e503
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      abuild_meson \
      	-Dgtkdoc=false \
      	-Dtests=false \
      	-Dstemmer=false \
      	-Dintrospection=true \
      	output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output
      rm -rf "$pkgdir"/usr/share/installed-tests
      rm -rf "$pkgdir"/usr/libexec/installed-tests
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libxmlb-dev
    description: Library to help create and query binary XML blobs (dev)
    pipeline:
      - uses: split/dev
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/bin/xb-tool
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: libxmlb-doc
    description: Library to help create and query binary XML blobs (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: hughsie/libxmlb
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
