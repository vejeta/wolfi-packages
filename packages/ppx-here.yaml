# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-here
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-here-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: OCaml extension node whose value is its source position (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocaml-compiler-libs  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_here
      tag: v${{package.version}}
      expected-commit: d880106933ac9e8cb6f85a5fc3488ab167fcdf89
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_here -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_here
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-here-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ppx_here/* "${{targets.destdir}}/usr/share/doc/libppx-here-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ppx_here" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-here
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-here-ocaml
    description: OCaml extension node whose value is its source position (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_here"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_here/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_here/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_here/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppx_here/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_here/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppx_here/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_here/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_here/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: janestreet/ppx_here
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-here/LICENSE.md
    - uses: test/tw/ldd-check
