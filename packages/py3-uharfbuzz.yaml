package:
  name: py3-uharfbuzz
  version: '0.53.3'
  epoch: 0
  description: Streamlined Cython bindings for the HarfBuzz shaping engine
  copyright:
    - license: Apache-2.0
    - license: SIL-1.1
      paths:
        - tests/data/AdobeBlank.subset.ttf
    - license: MIT
      paths:
        - tests/data/MutatorSans-VF.subset.ttf
    - license: SIL-1.1
      paths:
        - tests/data/STIXTwoMath-Regular.ttf
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3.13-cython-bin  # Debian: cython3
      - harfbuzz-dev  # Debian: libharfbuzz-dev
      - python3-dev
      - py3-supported-pkgconfig  # Debian: python3-pkgconfig
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    USE_SYSTEM_LIBS: '1'
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Fix-test_set_axis_range-passing-int-where-Cython-exp.patch; do mv py3-uharfbuzz/$f .recipe-files/; done
      rmdir py3-uharfbuzz 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/harfbuzz/uharfbuzz
      tag: v${{package.version}}
      expected-commit: 8ce647eea636793442d11080f5b8ba8b516f0117
  - uses: patch
    with:
      patches: .recipe-files/0001-Fix-test_set_axis_range-passing-int-where-Cython-exp.patch
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-uharfbuzz
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: harfbuzz/uharfbuzz
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-uharfbuzz/LICENSE
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import uharfbuzz
