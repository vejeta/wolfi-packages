# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-uharfbuzz for Python 3.10, 3.11, 3.12, 3.13
package:
  name: py3-uharfbuzz
  version: '0.55.0'
  epoch: 0
  description: Streamlined Cython bindings for the HarfBuzz shaping engine
  copyright:
    - license: Apache-2.0
    - license: SIL-1.1
      paths:
        - tests/data/AdobeBlank.subset.ttf
    - license: MIT
      paths:
        - tests/data/MutatorSans-VF.subset.ttf
    - license: SIL-1.1
      paths:
        - tests/data/STIXTwoMath-Regular.ttf
  dependencies:
    provider-priority: 0
vars:
  pypi-package: uharfbuzz
  import: uharfbuzz
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base-dev
      - python3
      - py3-supported-cython  # Debian: cython3
      - harfbuzz-dev  # Debian: libharfbuzz-dev
      - py3-supported-pkgconfig  # Debian: python3-pkgconfig
      - py3-supported-setuptools-scm  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    USE_SYSTEM_LIBS: '1'
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/harfbuzz/uharfbuzz
      tag: v${{package.version}}
      expected-commit: deca31853d912dd3dec89777a3f349175c19b7f6
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: harfbuzz/uharfbuzz
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-uharfbuzz
  pipeline:
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
