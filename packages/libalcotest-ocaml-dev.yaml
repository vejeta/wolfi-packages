package:
  name: libalcotest-ocaml-dev
  version: '1.9.1'
  epoch: 0
  description: Lightweight and colourful test framework for OCaml
  copyright:
    - license: ISC
    - license: Unlicense
      paths:
        - 'examples/*'
  dependencies:
    runtime:
      - libfmt-ocaml-dev  # Debian: ${ocaml:Depends}
      - libastring-ocaml-dev  # Debian: ${ocaml:Depends}
      - libcmdliner-ocaml-dev  # Debian: ${ocaml:Depends}
      - libre-ocaml-dev  # Debian: ${ocaml:Depends}
      - libuutf-ocaml-dev  # Debian: ${ocaml:Depends}
      - liblwt-ocaml-dev  # Debian: ${ocaml:Depends}
      - liblogs-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - libfmt-ocaml-dev  # Wolfi Community Packages
      - libastring-ocaml-dev  # Wolfi Community Packages
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - libuutf-ocaml-dev  # Wolfi Community Packages
      - liblwt-ocaml-dev  # Wolfi Community Packages
      - liblogs-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Do-not-call-Unix.create_process-with-empty-args.patch; do mv libalcotest-ocaml-dev/$f .recipe-files/; done
      rmdir libalcotest-ocaml-dev 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/alcotest
      tag: ${{package.version}}
      expected-commit: 7db64e91b159ce60937d2ff647208eb25fe37610
  - uses: patch
    with:
      patches: .recipe-files/0001-Do-not-call-Unix.create_process-with-empty-args.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p alcotest,alcotest-lwt -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" alcotest alcotest-lwt
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libalcotest-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libalcotest-ocaml-dev/examples/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libalcotest-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: mirage/alcotest
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libalcotest-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
