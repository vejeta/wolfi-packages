package:
  name: black
  version: '26.3.0'
  epoch: 0
  description: The uncompromising Python code formatter
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3-aiohttp
      - py3-click
      - py3-mypy-extensions
      - py3-packaging
      - py3-pathspec
      - py3-platformdirs
      - py3-pytokens
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - py3-gpep517
      - py3.13-gpep517-bin  # commands of Alpine's py3-gpep517
      - py3-hatch-fancy-pypi-readme
      - py3.13-hatch-fancy-pypi-readme-bin  # commands of Alpine's py3-hatch-fancy-pypi-readme
      - py3-hatchling
      - py3.13-hatchling-bin  # commands of Alpine's py3-hatchling
      - py3-hatch-vcs
      - py3-wheel
      - py3.13-wheel-bin  # commands of Alpine's py3-wheel
      - py3-aiohttp
      - py3-click
      - py3-mypy-extensions
      - py3-packaging
      - py3-pathspec
      - py3-platformdirs
      - py3-pytokens
      - python3
pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/b/black/black-${{package.version}}.tar.gz
      expected-sha512: e9819e97542d51d5eeac28cf1a09c94042e8a0150de61fe49e325cf49fc6d511b40ab84d9cd80d33f09f5c64ca94a44d4c9d9d4f2e6206f63d842c6475a578e4
  - name: Build
    runs: |
      pkgver="${{package.version}}"

      gpep517 build-wheel \
      	--wheel-dir .dist \
      	--output-fd 3 3>&1 >&2

      python3 -m venv --clear --without-pip --system-site-packages venv
      ./venv/bin/python3 -m installer \
      	.dist/black-$pkgver-py3-none-any.whl

      for cmd in black blackd; do
      	_BLACK_COMPLETE=bash_source ./venv/bin/black >$cmd.bash
      	_BLACK_COMPLETE=fish_source ./venv/bin/black >$cmd.fish
      	_BLACK_COMPLETE=zsh_source ./venv/bin/black >$cmd.zsh
      done
  - name: Install
    runs: |
      pkgver="${{package.version}}"
      pkgdir="${{targets.destdir}}"

      python3 -m installer -d "$pkgdir" \
      	.dist/black-$pkgver-py3-none-any.whl

      for cmd in black blackd; do
      	install -Dm644 $cmd.bash "$pkgdir"/usr/share/bash-completion/completions/$cmd
      	install -Dm644 $cmd.fish "$pkgdir"/usr/share/fish/vendor_completions.d/$cmd.fish
      	install -Dm644 $cmd.zsh "$pkgdir"/usr/share/zsh/site-functions/_$cmd
      done
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: black-bash-completion
    description: The uncompromising Python code formatter (bash-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/bash-completion/completions
  - name: black-fish-completion
    description: The uncompromising Python code formatter (fish-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/fish/vendor_completions.d
  - name: black-zsh-completion
    description: The uncompromising Python code formatter (zsh-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/zsh/site-functions
