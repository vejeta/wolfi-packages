#
# Conversion notes:
# - udeb package(s) left out: fonts-noto-hinted-udeb, fonts-noto-unhinted-udeb
# - build dependency 'lcdf-typetools' (Debian 'lcdf-typetools') not found in Wolfi; left out
# - set expected-commit for tag v20201225 (re-run with --download, or git ls-remote)
# - port debian/rules override_dh_install: find . -path ./debian -prune -o \(  	-name "NotoSansSinhala-Regular.ttf" -o  	-name "NotoSansSinhala-Bold.ttf" -o  	-name "NotoSerifGujarati-Regular.ttf" -o  	-name "NotoSerifGujarati-Bold.ttf"  	\) -
# - no debian/fonts-noto-unhinted.install; define which files go to this subpackage
# - no debian/fonts-noto-hinted.install; define which files go to this subpackage
package:
  name: fonts-noto
  version: '20201225'
  epoch: 0
  description: Metapackage to pull in all Noto fonts
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - fonts-noto-core
      # Debian Recommends (not supported by apk): fonts-noto-cjk, fonts-noto-cjk-extra, fonts-noto-color-emoji, fonts-noto-extra, fonts-noto-mono, fonts-noto-ui-core, fonts-noto-ui-extra, fonts-noto-unhinted
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      # TODO(debian-to-melange): lcdf-typetools is not in Wolfi (Debian: lcdf-typetools); left out
      - woff2
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 30-droid-noto-mono.conf 30-droid-noto.conf NotoMono-Regular.ttf; do mv fonts-noto/$f .recipe-files/; done
      rmdir fonts-noto 2>/dev/null || true
  # TODO(debian-to-melange): set expected-commit for tag v20201225 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://github.com/googlei18n/noto-fonts
      tag: v${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  # TODO(debian-to-melange): port debian/rules override_dh_install: find . -path ./debian -prune -o \(  	-name "NotoSansSinhala-Regular.ttf" -o  	-name "NotoSansSinhala-Bold.ttf" -o  	-name "NotoSerifGujarati-Regular.ttf" -o  	-name "NotoSerifGujarati-Bold.ttf"  	\) -
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-noto"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/fonts-noto/"
      cp -a FAQ.md "${{targets.destdir}}/usr/share/doc/fonts-noto/"
      cp -a FAQ-KR.md "${{targets.destdir}}/usr/share/doc/fonts-noto/"
      cp -a NEWS.md "${{targets.destdir}}/usr/share/doc/fonts-noto/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/fonts-noto
subpackages:
  - name: fonts-noto-core
    description: '"No Tofu" font families with large Unicode coverage (core)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/noto"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.avail"
          mv "${{targets.destdir}}/fonts-noto/30-droid-noto.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
    dependencies:
      runtime:
        - fonts-noto-mono
  - name: fonts-noto-extra
    description: '"No Tofu" font families with large Unicode coverage (extra)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/noto"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-Black*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-ExtraBold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-Extrabold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-SemiBold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-Medium*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-Light*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-ExtraLight*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-Thin*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*-*Condensed*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
  - name: fonts-noto-ui-core
    description: '"No Tofu" font families with large Unicode coverage (UI core)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/noto"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
  - name: fonts-noto-ui-extra
    description: '"No Tofu" font families with large Unicode coverage (UI extra)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/noto"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-Black*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-ExtraBold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-Extrabold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-SemiBold*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-Medium*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-Light*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-ExtraLight*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-Thin*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}"/hinted/ttf/*/Noto*UI-*Condensed*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
  - name: fonts-noto-unhinted
    description: '"No Tofu" font families with large Unicode coverage (unhinted)'
    pipeline:
      # TODO(debian-to-melange): no debian/fonts-noto-unhinted.install; define which files go to this subpackage
      - runs: |
          true
  - name: fonts-noto-mono
    description: '"No Tofu" monospaced font family with large Unicode coverage'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/noto"
          mv "${{targets.destdir}}/fonts-noto/NotoMono-Regular.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}/hinted/ttf/NotoSansMono/NotoSansMono-Regular.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mv "${{targets.destdir}}/hinted/ttf/NotoSansMono/NotoSansMono-Bold.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/noto/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.avail"
          mv "${{targets.destdir}}/fonts-noto/30-droid-noto-mono.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
  - name: fonts-croscore
    description: Width-compatible fonts for improved on-screen readability
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/croscore"
          mv "${{targets.destdir}}"/hinted/ttf/Arimo/Arimo*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/croscore/"
          mv "${{targets.destdir}}"/hinted/ttf/Cousine/Cousine*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/croscore/"
          mv "${{targets.destdir}}"/hinted/ttf/Tinos/Tinos*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/croscore/"
  - name: fonts-noto-hinted
    description: Obsolete metapackage to pull in a subset of Noto fonts
    pipeline:
      # TODO(debian-to-melange): no debian/fonts-noto-hinted.install; define which files go to this subpackage
      - runs: |
          true
    dependencies:
      runtime:
        - fonts-noto-core
        - fonts-noto-ui-core
update:
  enabled: true
  github:
    identifier: googlei18n/noto-fonts
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-noto/LICENSE
