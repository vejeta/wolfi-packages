package:
  name: fonts-adf-accanthis
  version: '0.20190904'
  epoch: 0
  description: Accanthis font of the Arkandis Digital Foundry
  copyright:
    - license: GPL-2+FE
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-adf-accanthis/$f .recipe-files/; done
      rmdir fonts-adf-accanthis 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-adf/fonts-adf_${{package.version}}.orig.tar.xz
      expected-sha256: 0a5522b3be6fdd63bcef39958e36f6f59ade367adc49ad41230b6abdd4a6281c
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: # AurelisNo2-Std && install -D -m 0644 -t $(CURDIR)/debian/fonts-adf-baskervald/usr/share/fonts/truetype/adf $(shell find . -name "*askervald*.otf") && install -D -m 0644 -t $(CURDIR)/debian/fonts-adf
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-adf-accanthis/copyright
