package:
  name: libcinaps-ocaml-dev
  version: '0.15.1'
  epoch: 0
  description: Trivial metaprogramming tool (dev files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - libre-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Remove-dependency-on-ppx_jane.patch; do mv ocaml-cinaps/$f .recipe-files/; done
      rmdir ocaml-cinaps 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-ppx/cinaps
      tag: v${{package.version}}
      expected-commit: 86f2f05c4605572022cdb794c5542d220fb14be5
  - uses: patch
    with:
      patches: .recipe-files/0001-Remove-dependency-on-ppx_jane.patch
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcinaps-ocaml-dev"
      cp -a usr/doc/cinaps/* "${{targets.destdir}}/usr/share/doc/libcinaps-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-cinaps
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcinaps-ocaml
    description: Trivial metaprogramming tool (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libcinaps-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: ocaml-ppx/cinaps
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-cinaps/LICENSE.md
    - uses: test/tw/ldd-check
