#
# Generated by debian-to-melange 0.1.0 from Debian source package
# pyflakes 3.4.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/pyflakes
# Debian packaging: https://salsa.debian.org/python-team/packages/pyflakes
#
# Conversion notes:
# - upstream tarball from debian/watch
# - autopkgtests converted to the test pipeline (3 steps)
# - Wolfi Python layout: py3.X-pyflakes for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-pyflakes
  version: '3.4.0'
  epoch: 0
  description: Passive checker of Python 3 programs - Python modules
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
vars:
  pypi-package: pyflakes
  import: pyflakes
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - py3-supported-pytest  # Debian: python3-pytest
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in pyflakes3.1; do mv py3-pyflakes/$f .recipe-files/; done
      rmdir py3-pyflakes 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pyflakes/pyflakes-${{package.version}}.tar.gz
      expected-sha256: b24f96fafb7d2ab0ec5075b7350b3d2d2218eab42003821c06344973d3ea2f58
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      mkdir -p ${{targets.outdir}}/pyflakes3/usr/bin
      mv ${{targets.destdir}}/usr/bin/pyflakes ${{targets.outdir}}/pyflakes3/usr/bin/pyflakes3
      sed -i '1s/3.*/3/' ./debian/pyflakes3/usr/bin/pyflakes3
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        # Debian Recommends (not supported by apk): pyflakes3
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - name: pyflakes3
    description: Passive checker of Python 3 programs
    pipeline:
      - runs: |
          install -Dm644 .recipe-files/pyflakes3.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    dependencies:
      runtime:
        - py3-pyflakes
update:
  enabled: true
  github:
    identifier: PyCQA/pyflakes
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - pyflakes3
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - py3-pyflakes
        - py3-supported-pyflakes
  pipeline:
    - uses: fetch
      with:
        uri: https://files.pythonhosted.org/packages/source/p/pyflakes/pyflakes-${{package.version}}.tar.gz
        expected-sha256: b24f96fafb7d2ab0ec5075b7350b3d2d2218eab42003821c06344973d3ea2f58
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-all=python3 python3-pyflakes=py3-pyflakes' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-pyflakes.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-pyflakes.templates" && break
        done
    - name: 'autopkgtest: pyflakes3 --help'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        pyflakes3 --help
    - name: 'autopkgtest: relative-import.sh'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        # LP: #1560134
    - name: 'autopkgtest: unittests'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set -e
        cp -a pyflakes/test/ "$AUTOPKGTEST_TMP"
        cd "$AUTOPKGTEST_TMP/test/"
        sed -i "s|return os.path.join(package_dir, '..', 'bin', 'pyflakes')|return '/usr/bin/pyflakes3'|" test_api.py
        for py in $(py3versions -s); do echo "[*] testing on $py:"; $py -m unittest discover 2>&1; done
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
