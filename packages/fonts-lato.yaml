#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-lato/fonts-lato_2.015.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-lato
  version: '2.015'
  epoch: 0
  description: Sans-serif typeface family font
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - dpkg
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-lato/$f .recipe-files/; done
      rmdir fonts-lato 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-lato/fonts-lato_${{package.version}}.orig.tar.xz
      expected-sha256: 789e1e664a7c369acd896398efa3defbb22e5e1c962837d5d4626cfd629bd703
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-lato/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-lato/copyright
