#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libcsexp-ocaml-dev
  version: '1.5.2'
  epoch: 0
  description: Parsing and printing of S-expressions in Canonical form (dev)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - libcsexp-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-dune/csexp
      tag: ${{package.version}}
      expected-commit: e6c4768e10c61bcb04d09748744dad55602149c6
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p csexp -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" csexp
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcsexp-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/csexp/* "${{targets.destdir}}/usr/share/doc/libcsexp-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/csexp" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libcsexp-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcsexp-ocaml
    description: Parsing and printing of S-expressions in Canonical form (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/csexp"
          mv "${{targets.destdir}}/usr/lib/ocaml/csexp/META" "${{targets.contextdir}}/usr/lib/ocaml/csexp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/csexp/*.cma "${{targets.contextdir}}/usr/lib/ocaml/csexp/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/csexp/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/csexp/"
update:
  enabled: true
  github:
    identifier: ocaml-dune/csexp
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcsexp-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
