package:
  name: py3-pyte
  version: '0.8.0'
  epoch: 0
  description: Simple VTXXX-compatible terminal emulator (Python 3)
  copyright:
    - license: LGPL-3.0-only
    - license: BSD-2-Clause
      paths:
        - docs/_static/rtd.css
  dependencies:
    provider-priority: 0
vars:
  pypi-package: pyte
  import: pyte
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-pytest  # Debian: python3-pytest
      # TODO(debian-to-melange): py3-pytest-runner is not in Wolfi (Debian: python3-pytest-runner); left out
      - py3-supported-sphinx  # Debian: python3-sphinx
pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pyte/pyte-${{package.version}}.tar.gz
      expected-sha256: 7e71d03e972d6f262cbe8704ff70039855f05ee6f7ad9d7129df9c977b5a88c5
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Revert-Link-to-GitHub-in-the-docs.patch 0002-Fix-intersphinx_mapping.patch; do mv py3-pyte/$f .recipe-files/; done
      rmdir py3-pyte 2>/dev/null || true
  - uses: patch
    with:
      patches: .recipe-files/0001-Revert-Link-to-GitHub-in-the-docs.patch .recipe-files/0002-Fix-intersphinx_mapping.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      python3 -m sphinx -b html -d docs/build/doctrees docs docs/build/html
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-wcwidth
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - name: py3-pyte-doc
    description: Simple VTXXX-compatible terminal emulator (documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/py3-pyte-doc"
          cp -a docs/build/html "${{targets.contextdir}}/usr/share/doc/py3-pyte-doc/"
update:
  enabled: true
  github:
    identifier: selectel/pyte
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-pyte
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
