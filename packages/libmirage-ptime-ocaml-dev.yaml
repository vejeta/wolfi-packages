package:
  name: libmirage-ptime-ocaml-dev
  version: '5.2.0'
  epoch: 0
  description: Libraries and module types for portable clocks (development)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libmirage-ptime-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libptime-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/mirage-ptime
      tag: v${{package.version}}
      expected-commit: 3ad2d158a287f1d5721a8951d0f6d1dea30446ac
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p mirage-ptime -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" mirage-ptime
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libmirage-ptime-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/*/* "${{targets.destdir}}/usr/share/doc/libmirage-ptime-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/*" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libmirage-ptime-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libmirage-ptime-ocaml
    description: Libraries and module types for portable clocks (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml"
          mv "${{targets.destdir}}/usr/lib/ocaml/stublibs" "${{targets.contextdir}}/usr/lib/ocaml/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/META; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: mirage/mirage-ptime
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libmirage-ptime-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
