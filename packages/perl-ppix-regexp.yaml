package:
  name: perl-ppix-regexp
  version: '0.092'
  epoch: 0
  description: Module to parse regular expressions
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl-ppi  # Debian: libppi-perl
      - perl-task-weaken  # Debian: libtask-weaken-perl
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-module-build  # Debian: libmodule-build-perl
      # TODO(debian-to-melange): perl-list-moreutils is not in Wolfi (Debian: liblist-moreutils-perl); left out
      - perl-ppi  # Debian: libppi-perl
      - perl-task-weaken  # Debian: libtask-weaken-perl
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv perl-ppix-regexp/$f .recipe-files/; done
      rmdir perl-ppix-regexp 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/W/WY/WYANT/PPIx-Regexp-${{package.version}}.tar.gz
      expected-sha256: e9c669c01d7c951f9bfee899c147fc8c8ddd98d3f32329f94000c7b02f53366b
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-ppix-regexp/examples"
      cp -a eg/* "${{targets.destdir}}/usr/share/doc/perl-ppix-regexp/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-ppix-regexp"
      cp -a CONTRIBUTING "${{targets.destdir}}/usr/share/doc/perl-ppix-regexp/"
      cp -a SECURITY "${{targets.destdir}}/usr/share/doc/perl-ppix-regexp/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-ppix-regexp/copyright
  - name: From debian/rules override_dh_installexamples
    runs: |
      sed -i -e '1s|^#!/usr/local/bin/perl|#!/usr/bin/perl|' -e '1s|^#!/usr/bin/env perl|#!/usr/bin/perl|'  		${{targets.destdir}}/usr/share/doc/perl-ppix-regexp/examples/*
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 3288
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-ppix-regexp/copyright
    - name: Load the module
      runs: |
        perl -MPPIx::Regexp -e1
