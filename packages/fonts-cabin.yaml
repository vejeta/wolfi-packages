    runs: |
      fontmake -g sources/CabinItalic_v3001.glyphs -o otf
      fontmake -g sources/CabinRegular_v30001.glyphs -o otf
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-cabin/copyright
