package:
  name: libmmap-ocaml-dev
  version: '1.2.0'
  epoch: 0
  description: File mapping functionality in OCaml (development)
  copyright:
    - license: LGPL-2.1-with-linking-exception
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      # TODO(debian-to-melange): libbigarray-compat-ocaml-dev is not in Wolfi (Debian: libbigarray-compat-ocaml-dev); left out
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/mmap
      tag: v${{package.version}}
      expected-commit: b5efb79871d290072a17f755566c8288cf069e4f
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libmmap-ocaml-dev"
      cp -a usr/doc/mmap/* "${{targets.destdir}}/usr/share/doc/libmmap-ocaml-dev/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-mmap
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libmmap-ocaml
    description: File mapping functionality in OCaml (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libmmap-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: mirage/mmap
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-mmap/LICENSE
    - uses: test/tw/ldd-check
