#
# Generated by debian-to-melange 0.1.0 from Debian source package
# psautohint 2.4.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/psautohint
# Debian packaging: https://salsa.debian.org/fonts-team/psautohint
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-psautohint for Python 3.11, 3.12, 3.13
package:
  name: py3-psautohint
  version: '2.4.0'
  epoch: 0
  description: Python library for psautohint font hinter from AFDKO
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
vars:
  pypi-package: psautohint
  import: psautohint
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base-dev
      - python3
      - py3-supported-fonttools  # commands of Debian's python3-fonttools
      - py3-supported-setuptools-scm  # commands of Debian's python3-setuptools-scm
      - bash  # the source has bash scripts; Essential in Debian
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adobe-type-tools/psautohint
      tag: v${{package.version}}
      expected-commit: 5b7bf35299b0b38de03eb56ca7fe7048bd5c52c2
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          if [ -d "${{targets.contextdir}}"/usr/bin ]; then
            mkdir -p "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr"
            cp -a "${{targets.contextdir}}"/usr/bin "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr/"
          fi
      - uses: strip
      - runs: |
          install -Dm644 COPYING LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
      - runs: |
          rm -rf "${{targets.contextdir}}"/usr/bin
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: ${{vars.pypi-package}} commands for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}-bin
    pipeline:
      - runs: |
          true
  - name: psautohint
    description: Font autohinter from AFDKO
    pipeline:
      - runs: |
          true
    dependencies:
      runtime:
        - py3.13-${{vars.pypi-package}}-bin
update:
  enabled: true
  github:
    identifier: adobe-type-tools/psautohint
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-psautohint
  pipeline:
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
