# Generated by debian-to-melange 0.1.0 from Debian source package
# psautohint 2.4.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/psautohint
# Debian packaging: https://salsa.debian.org/fonts-team/psautohint
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: py3-psautohint
  version: '2.4.0'
  epoch: 0
  description: Python library for psautohint font hinter from AFDKO
  copyright:
    - license: Apache-2.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - python3-dev
      - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - bash  # the source has bash scripts; Essential in Debian
      - coreutils
      - findutils
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adobe-type-tools/psautohint
      tag: v${{package.version}}
      expected-commit: 5b7bf35299b0b38de03eb56ca7fe7048bd5c52c2
      recurse-submodules: true
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 COPYING LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-psautohint
  - name: From debian/rules execute_after_dh_auto_clean
    runs: |
      rm libpsautohint/src/version.h
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: psautohint
    description: Font autohinter from AFDKO
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr"
          mv "${{targets.destdir}}/usr/bin" "${{targets.contextdir}}/usr/"
    dependencies:
      runtime:
        - py3-psautohint
update:
  enabled: true
  github:
    identifier: adobe-type-tools/psautohint
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-psautohint/COPYING
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import psautohint
