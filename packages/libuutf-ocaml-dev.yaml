# Generated by debian-to-melange 0.1.0 from Debian source package
# uutf 1.0.4-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/uutf
# Debian packaging: https://salsa.debian.org/ocaml-team/uutf
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/u/uutf/uutf_1.0.4.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libuutf-ocaml-dev
  version: '1.0.4'
  epoch: 0
  description: Non-blocking streaming Unicode codec for OCaml (development files)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libuutf-ocaml  # Debian: ${ocaml:Depends}
      - libtopkg-ocaml-dev  # Debian: ${ocaml:Depends}
      - ocaml-findlib-compat  # Debian: ${ocaml:Depends}
      - libcmdliner-ocaml-dev  # Debian: ${ocaml:Depends}
      - libopam-file-format-ocaml-dev  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - libopam-file-format-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in install_bytecode.sh install_native.sh rules; do mv libuutf-ocaml-dev/$f .recipe-files/; done
      rmdir libuutf-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/u/uutf/uutf_${{package.version}}.orig.tar.bz2
      expected-sha256: a7a578e6af9149a8894e18e3b4759c8565937a69c6c9ace7a30bbf0484619ca8
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --with-cmdliner true --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      for a in bytecode native; do  	  mv debian/install_$a.sh debian/install_$a.sh.old;  	done
      .recipe-files/rules .recipe-files/install_bytecode.sh
      diff -u debian/install_bytecode.sh.old .recipe-files/install_bytecode.sh
      diff -u debian/install_native.sh.old .recipe-files/install_native.sh
      mv debian/install_bytecode.sh.old .recipe-files/install_bytecode.sh
      mv debian/install_native.sh.old .recipe-files/install_native.sh
      OCAML_STDLIB_DIR=/usr/lib/ocaml .recipe-files/install_bytecode.sh
      OCAML_STDLIB_DIR=/usr/lib/ocaml .recipe-files/install_native.sh
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr"
      cp -a usr/bin "${{targets.destdir}}/usr/"
      mkdir -p "${{targets.destdir}}/usr/lib/ocaml/uutf"
      cp -a usr/lib/ocaml/uutf/*opam* "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.ml* "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.cmi "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.cmt* "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.a "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.cmx "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      cp -a usr/lib/ocaml/uutf/*.cmxa "${{targets.destdir}}/usr/lib/ocaml/uutf/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libuutf-ocaml-dev"
      cp -a usr/doc/uutf/* "${{targets.destdir}}/usr/share/doc/libuutf-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libuutf-ocaml-dev
subpackages:
  - name: libuutf-ocaml
    description: Non-blocking streaming Unicode codec for OCaml (plugins)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/uutf"
          cp -a usr/lib/ocaml/uutf/META "${{targets.contextdir}}/usr/lib/ocaml/uutf/"
          cp -a usr/lib/ocaml/uutf/uutf.cma "${{targets.contextdir}}/usr/lib/ocaml/uutf/"
          cp -a usr/lib/ocaml/uutf/uutf.cmxs "${{targets.contextdir}}/usr/lib/ocaml/uutf/"
  - name: libuutf-ocaml-doc
    description: Non-blocking streaming Unicode codec for OCaml (documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libuutf-ocaml-doc"
          cp -a README.md "${{targets.contextdir}}/usr/share/doc/libuutf-ocaml-doc/"
          cp -a CHANGES.md "${{targets.contextdir}}/usr/share/doc/libuutf-ocaml-doc/"
update:
  enabled: true
  release-monitor:
    identifier: 63829
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libuutf-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
