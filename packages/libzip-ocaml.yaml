# camlzip 1.14-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/camlzip
# Debian packaging: https://salsa.debian.org/ocaml-team/camlzip
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/c/camlzip/camlzip_1.14.orig.tar.gz), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libzip-ocaml
  version: '1.14'
  epoch: 0
  description: OCaml compression libraries (runtime libraries)
  copyright:
    - license: LGPL-2.1-with-linking-exception
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - zlib-dev  # Debian: zlib1g-dev
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0003-Add-plain_uncompress.patch; do mv libzip-ocaml/$f .recipe-files/; done
      rmdir libzip-ocaml 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/camlzip/camlzip_${{package.version}}.orig.tar.gz
      expected-sha256: 1f0e1d4c42d53ee30b76d0226677483f06d52861ccc8913dab5b3b12ca4889b8
  - uses: patch
    with:
      patches: .recipe-files/0003-Add-plain_uncompress.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make
      make allopt
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      mkdir -p ${{targets.destdir}}/usr/lib/ocaml
      OCAMLFIND_DESTDIR=${{targets.destdir}}/usr/lib/ocaml OCAMLFIND_LDCONF=ignore  		make install-findlib
      mkdir -p ${{targets.destdir}}/usr/lib/ocaml/stublibs
      mv ${{targets.destdir}}/usr/lib/ocaml/zip/dll*.so ${{targets.destdir}}/usr/lib/ocaml/stublibs
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libzip-ocaml"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/libzip-ocaml/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libzip-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libzip-ocaml-dev
    description: OCaml compression libraries (development files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/zip"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/lib*.a "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/*.ml* "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/*.cmt "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/*.cmti "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/zip/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}/usr/lib/ocaml/zip/zip.cmxa" "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mv "${{targets.destdir}}/usr/lib/ocaml/zip/zip.a" "${{targets.contextdir}}/usr/lib/ocaml/zip/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libzip-ocaml-dev/examples"
          cp -a test/* "${{targets.contextdir}}/usr/share/doc/libzip-ocaml-dev/examples/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libzip-ocaml-dev"
          cp -a README.md "${{targets.contextdir}}/usr/share/doc/libzip-ocaml-dev/"
    dependencies:
      runtime:
        - zlib-dev  # Debian: zlib1g-dev
update:
  enabled: true
  github:
    identifier: xavierleroy/camlzip
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - libzip-ocaml-dev
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libzip-ocaml/LICENSE
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/c/camlzip/camlzip_${{package.version}}.orig.tar.gz
        expected-sha256: 1f0e1d4c42d53ee30b76d0226677483f06d52861ccc8913dab5b3b12ca4889b8
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libzip-ocaml.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libzip-ocaml.templates" && break
        done
    - name: 'autopkgtest: upstream'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        testdir=${AUTOPKGTEST_TMP:-/tmp}
        cp test/*.ml ${testdir}
        cd ${testdir}
        ocamlc -ccopt -g -g -I +zip -o minigzip zip.cma minigzip.ml
        ocamlc -ccopt -g -g -I +unix -I +zip -o minizip unix.cma zip.cma minizip.ml
        ocamlc -g -I +zip -o testzlib zip.cma testzlib.ml
        if [ -x /usr/bin/ocamlopt ]; then
            ocamlopt -ccopt -g -g -I +zip -o minigzip zip.cmxa minigzip.ml 
            ocamlopt -ccopt -g -g -I +unix -I +zip -o minizip unix.cmxa zip.cmxa minizip.ml
            ocamlopt -g -I +zip -o testzlib zip.cmxa testzlib.ml
        fi
