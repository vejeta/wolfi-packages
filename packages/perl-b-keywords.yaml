package:
  name: perl-b-keywords
  version: '1.29'
  epoch: 0
  description: Lists of internal perl keywords
  copyright:
    - license: GPL-2.0-only OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/R/RU/RURBAN/B-Keywords-${{package.version}}.tar.gz
      expected-sha256: e0aa19d3390409f0ece7342ab041c5b432c31d7cf1abf182c134b6aab78784b0
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-b-keywords
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 2662
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-b-keywords/LICENSE
    - name: Load the module
      runs: |
        perl -MB::Keywords -e1
