# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-stdio 0.17.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-stdio
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-stdio
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libstdio-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: Standard IO library for OCaml (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libbase-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/stdio
      tag: v${{package.version}}
      expected-commit: 962c110ab13a2d511aa059738ee3a28fb256869c
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p stdio -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" stdio
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libstdio-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/stdio/* "${{targets.destdir}}/usr/share/doc/libstdio-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/stdio" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libstdio-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libstdio-ocaml
    description: Standard IO library for OCaml (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/stdio"
          mv "${{targets.destdir}}/usr/lib/ocaml/stdio/META" "${{targets.contextdir}}/usr/lib/ocaml/stdio/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/stdio/*.cma "${{targets.contextdir}}/usr/lib/ocaml/stdio/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/stdio/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/stdio/"
update:
  enabled: true
  github:
    identifier: janestreet/stdio
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libstdio-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
