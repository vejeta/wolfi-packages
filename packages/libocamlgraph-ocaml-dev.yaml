#
# Generated by debian-to-melange 0.1.0 from Debian source package
# ocamlgraph 2.2.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocamlgraph
# Debian packaging: https://salsa.debian.org/ocaml-team/ocamlgraph
#
# Conversion notes:
# - build dependency 'libjs-highlight.js': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocamlgraph/ocamlgraph_2.2.0.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libocamlgraph-ocaml-dev
  version: '2.2.0'
  epoch: 0
  description: Graph library for OCaml
  copyright:
    - license: LGPL-2.1-only
    - license: LGPL-2.1-only WITH linking exception
      paths:
        - 'view_graph/*'
    - license: LGPL-2.1-only WITH linking exception
      paths:
        - src/graphml.ml
        - src/graphml.mli
        - tests/testgraphml.ml
    - license: LGPL-2.1-only WITH linking exception
      paths:
        - src/clique.ml
        - src/clique.mli
    - license: LGPL-2.1-only WITH linking exception
      paths:
        - src/mincut.ml
        - src/mincut.mli
    - license: MIT
      paths:
        - src/dominator.ml
        - src/dominator.mli
  dependencies:
    runtime:
      - libgraphics-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libgraphics-ocaml-dev  # Wolfi Community Packages
      - libx11-dev
      - docbook-xml
      - libxml2-utils
      - libxslt  # Debian: xsltproc
      - po4a  # Wolfi Community Packages
      - ocaml-odoc  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0002-avoid-referencing-non-existent-icon-ed_icon.xpm.patch; do mv libocamlgraph-ocaml-dev/$f .recipe-files/; done
      rmdir libocamlgraph-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocamlgraph/ocamlgraph_${{package.version}}.orig.tar.bz2
      expected-sha256: d12e1a9761d51ca84726598b8c48c4186f8b7cba6754f2db8cff43e36b0ecb12
  - uses: patch
    with:
      patches: .recipe-files/0002-avoid-referencing-non-existent-icon-ed_icon.xpm.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ocamlgraph -j $(nproc) @install
  - name: From debian/rules execute_after_dh_auto_build
    runs: |
      dune build -pocamlgraph @doc
      find _build/default/_doc/_html -name "*.dune-keep" -delete
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ocamlgraph
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/ocaml"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev"
      cp -a CREDITS "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev/"
      for f in "${{targets.destdir}}/usr/doc/ocamlgraph/CHANGES.md"; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}/usr/doc/ocamlgraph/CHANGES.md"
      rmdir "${{targets.destdir}}/usr/doc/ocamlgraph" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      for f in "${{targets.destdir}}/usr/doc/ocamlgraph/README.md"; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libocamlgraph-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}/usr/doc/ocamlgraph/README.md"
      rmdir "${{targets.destdir}}/usr/doc/ocamlgraph" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 COPYING LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libocamlgraph-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libocamlgraph-ocaml-doc
    description: Documentation for the OCamlgraph library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libocamlgraph-ocaml-doc/html"
          cp -a _build/default/_doc/_html/* "${{targets.contextdir}}/usr/share/doc/libocamlgraph-ocaml-doc/html/"
update:
  enabled: true
  release-monitor:
    identifier: 7738
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libocamlgraph-ocaml-dev/COPYING
    - uses: test/tw/ldd-check
