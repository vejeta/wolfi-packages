# Debian packaging: https://salsa.debian.org/fonts-team/fonts-linuxlibertine
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-linuxlibertine/fonts-linuxlibertine_5.3.0.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-linuxlibertine
  version: '5.3.0'
  epoch: 0
  description: Linux Libertine family of fonts
  copyright:
    - license: GPL-2.0-or-later WITH Font exception OR OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - fontforge
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-linuxlibertine/$f .recipe-files/; done
      rmdir fonts-linuxlibertine 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-linuxlibertine/fonts-linuxlibertine_${{package.version}}.orig.tar.xz
      expected-sha256: 9226823829273175c38ab84c4991d61ceaeded7c6ce50a2bab061d14e441a2a7
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      set -e; for f in *.sfd; do fontforge -lang=ff -c 'Open($1); SetFontOrder(3); SelectAll(); Simplify(128+32+8,1.5); ScaleToEm(1000); Generate($2);' "$f" "${f%.sfd}.otf"; done
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/etc/fonts/conf.d"
      ln -sf /usr/share/fontconfig/conf.avail/90-fonts-linux-libertine.conf "${{targets.destdir}}/etc/fonts/conf.d/90-fonts-linux-libertine.conf"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-linuxlibertine/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-linuxlibertine/copyright
