# - build dependency 'haskell-devscripts' (Debian 'haskell-devscripts') not found in Wolfi; left out
# - build dependency 'ghc' (Debian 'ghc') not found in Wolfi; left out
# - build dependency 'happy' (Debian 'happy') not found in Wolfi; left out
# - build dependency 'libghc-quickcheck2-dev' (Debian 'libghc-quickcheck2-dev') not found in Wolfi; left out
