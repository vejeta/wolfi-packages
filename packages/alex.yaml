# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/a/alex/alex_3.5.4.0.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: alex
  version: '3.5.4.0'
  epoch: 0
  description: Lexical analyser generator for Haskell
  copyright:
    - license: BSD3
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - alex
      # TODO(debian-to-melange): haskell-devscripts is not in Wolfi (Debian: haskell-devscripts); left out
      # TODO(debian-to-melange): ghc is not in Wolfi (Debian: ghc); left out
      # TODO(debian-to-melange): happy is not in Wolfi (Debian: happy); left out
      # TODO(debian-to-melange): libghc-quickcheck2-dev is not in Wolfi (Debian: libghc-quickcheck2-dev); left out
      - coreutils
      - findutils
  environment:
    ALEX: ../dist-ghc/build/alex/alex
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in get_version.hs; do mv alex/$f .recipe-files/; done
      rmdir alex 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/alex/alex_${{package.version}}.orig.tar.gz
      expected-sha256: a9ea70f2c4900e685312cf330d1fe955a3e8f00acd1328d463ae150481d28ade
  - name: From debian/rules execute_after_dh_auto_build
    runs: |
      ghc --make .recipe-files/get_version.hs -o debian/get_version
  - name: Install files
    runs: |
      install -Dm644 debian/alex.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/alex/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/alex/examples/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/alex
update:
  enabled: true
  release-monitor:
    identifier: 33
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        alex --version || (alex --help 2>&1 || true) | grep -qi -e usage -e alex
        test -f /usr/share/licenses/alex/LICENSE
    - uses: test/tw/ldd-check
