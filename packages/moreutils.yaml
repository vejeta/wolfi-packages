#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/m/moreutils/moreutils_0.70.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: moreutils
  version: '0.70'
  epoch: 0
  description: Additional Unix utilities
  copyright:
    - license: GPL-2.0-or-later
    - license: BSD-2-Clause
      paths:
        - 'is_utf8/*'
    - license: GPL-2.0-only
      paths:
        - sponge.c
        - sponge.docbook
    - license: GPL-2.0-or-later OR MIT
      paths:
        - mispipe.c
    - license: other
      paths:
        - lckdo.c
        - lckdo.docbook
    - license: GPL-2.0-only
      paths:
        - parallel.c
  dependencies:
    runtime:
      - perl-ipc-run  # Wolfi Community Packages (Debian: libipc-run-perl)
      - perl-time-duration  # Wolfi Community Packages (Debian: libtime-duration-perl)
      - perl-timedate  # Debian: libtimedate-perl
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - docbook-xml
      - docbook-xsl  # Wolfi Community Packages
      - libxml2-utils
      - libxslt  # Debian: xsltproc
      - perl  # pod2man in the makefiles; Debian's dpkg-dev brings perl
      - bash  # the source has bash scripts; Essential in Debian
  environment:
    INSTALL_BIN: install
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-ts-Use-the-last-provided-switch-if-both-i-and-s-are-.patch 0002-Makefile-Fix-shell-syntax-error-on-non-pkgx.dev-buil.patch; do mv moreutils/$f .recipe-files/; done
      rmdir moreutils 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/m/moreutils/moreutils_${{package.version}}.orig.tar.xz
      expected-sha256: a844c5e3360a73d12c0a5624750ecc1969d64afea2e84925328f137576e2eb55
  - uses: patch
    with:
      patches: .recipe-files/0001-ts-Use-the-last-provided-switch-if-both-i-and-s-are-.patch .recipe-files/0002-Makefile-Fix-shell-syntax-error-on-non-pkgx.dev-buil.patch
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/moreutils"
      cp -a README "${{targets.destdir}}/usr/share/doc/moreutils/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/moreutils
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 13825
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/moreutils/COPYING
    - uses: test/tw/ldd-check
