package:
  name: moreutils
  version: '0.70'
  epoch: 0
  description: A growing collection of the unix tools that nobody thought to write thirty years ago
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - perl
      - perl-timedate
      - perl-ipc-run  # TODO(alpine-to-melange): not in Wolfi
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl-dev
      - docbook-xml  # Alpine: docbook-xsl
      - libxml2-utils  # Alpine: docbook-xsl
      - libxslt  # Alpine: docbook-xsl
      - perl-xml-sax  # TODO(alpine-to-melange): not in Wolfi
      - libxslt-dev
      - linux-headers
      - perl
      - perl-timedate
      - perl-ipc-run  # TODO(alpine-to-melange): not in Wolfi
pipeline:
  - uses: fetch
    with:
      uri: https://git.joeyh.name/index.cgi/moreutils.git/snapshot/moreutils-${{package.version}}.tar.gz
      expected-sha512: 7e6623d4ecf50a79d1301f0c63b991f5eb32e4edccb46a99df5c39a7d5cb4d5965fb7d00214afd094f7ac4db311fe49b2a785e7429da99b4324214f0ace5c7d4
  - name: Build
    runs: |
      _docbookpath="$(echo /usr/share/xml/docbook/xsl-stylesheets-* | \
      	awk '{print $1}')"
      if [ -z "$_docbookpath" ]; then
      	error "Couldn't get $_docbookpath, you need docbook-xsl installed"
      fi
      make DOCBOOKXSL=$_docbookpath
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make PREFIX=$pkgdir/usr install
      chmod 0644 $pkgdir/usr/share/man/man1/*
      mv $pkgdir/usr/share/man/man1/ts.1 $pkgdir/usr/share/man/man1/ts-moreutils.1
      mv $pkgdir/usr/share/man/man1/parallel.1 $pkgdir/usr/share/man/man1/parallel-moreutils.1
      mv $pkgdir/usr/bin/parallel $pkgdir/usr/bin/parallel-moreutils
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: moreutils-doc
    description: A growing collection of the unix tools that nobody thought to write thirty years ago (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 13825
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
