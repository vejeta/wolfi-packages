package:
  name: font-schumacher-misc
  version: '1.1.3'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: NTP
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-schumacher-misc-${{package.version}}.tar.xz
      expected-sha512: 83b25495535176a5e348269358ac34af8223023a55e2c5c599725ee90ec9ff3ea9ff19cca46b93eeae7ef985da325f9065c83d829a4a8c72d0c3c197242a1b64
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-mapfiles=/usr/share/fonts/util \
      	--with-fontdir=/usr/share/fonts/misc
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: true
  release-monitor:
    identifier: 17216
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
