package:
  name: perl-list-someutils
  version: '0.59'
  epoch: 0
  description: Module that provides the stuff missing in List::Util
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl-module-implementation  # Debian: libmodule-implementation-perl
      - perl  # Debian: ${perl:Depends}
      # Debian Recommends (not supported by apk): liblist-someutils-xs-perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-module-implementation  # Debian: libmodule-implementation-perl
      # TODO(debian-to-melange): perl-test-leaktrace is not in Wolfi (Debian: libtest-leaktrace-perl); left out
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/List-SomeUtils-${{package.version}}.tar.gz
      expected-sha256: fab30372e4c67bf5a46062da38d1d0c8756279feada866eb439fa29571a2dc7b
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-list-someutils"
      cp -a CODE_OF_CONDUCT.md "${{targets.destdir}}/usr/share/doc/perl-list-someutils/"
      cp -a CONTRIBUTING.md "${{targets.destdir}}/usr/share/doc/perl-list-someutils/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-list-someutils
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 9964
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-list-someutils/LICENSE
    - name: Load the module
      runs: |
        perl -MList::SomeUtils -e1
