# cudf 0.10-6 (3.0 (quilt)).
# https://tracker.debian.org/pkg/cudf
# Debian packaging: https://salsa.debian.org/ocaml-team/cudf
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/c/cudf/cudf_0.10.orig.tar.gz), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (2 steps)
package:
  name: libcudf-ocaml-dev
  version: '0.10'
  epoch: 0
  description: OCaml library to access descriptions of package upgrade problems
  copyright:
    - license: LGPL-3+-linking-exception
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocaml-findlib-compat  # Debian: ocaml-findlib
      - libextlib-ocaml-dev  # Wolfi Community Packages
      - libounit-ocaml-dev  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - ocamlbuild
      - libextlib-ocaml-dev  # Wolfi Community Packages
      - libounit-ocaml-dev  # Wolfi Community Packages
      - glib-dev  # Debian: libglib2.0-dev
      - perl
      - coreutils
      - findutils
  environment:
    DESTDIR: /home/build/melange-out/libcudf-ocaml-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Fix-build-with-OCaml-5.2.0.patch; do mv libcudf-ocaml-dev/$f .recipe-files/; done
      rmdir libcudf-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/cudf/cudf_${{package.version}}.orig.tar.gz
      expected-sha256: 7b9d7390fca822afd8b35197814616088edfb3fa3cb44903dfa49399e9fefb50
  - uses: patch
    with:
      patches: .recipe-files/0001-Fix-build-with-OCaml-5.2.0.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p cudf -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" cudf
  - name: From debian/rules execute_after_dh_auto_build
    runs: |
      make doc/cudf-check.1 c-lib
      make c-lib-opt
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      make -C c-lib/ -e install LIBDIR=/usr/lib INCDIR=/usr/include
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcudf-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libcudf-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcudf-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/cudf/* "${{targets.destdir}}/usr/share/doc/libcudf-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/cudf" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libcudf-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcudf-dev
    description: C library to access descriptions of package upgrade problems
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/*.a "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr"
          mv "${{targets.destdir}}/usr/include" "${{targets.contextdir}}/usr/"
          mv "${{targets.destdir}}/usr/lib/pkgconfig" "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libcudf-dev/examples"
          cp -a c-lib/c-test.c "${{targets.contextdir}}/usr/share/doc/libcudf-dev/examples/"
    dependencies:
      runtime:
        - glibc-dev  # Debian: libc6-dev
        - glib-dev  # Debian: libglib2.0-dev
        - ncurses-dev  # Debian: libncurses-dev
  - name: cudf-tools
    description: Command line tools for package upgrade problem descriptions
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr"
          mv "${{targets.destdir}}/usr/bin" "${{targets.contextdir}}/usr/"
          install -Dm644 doc/cudf-check.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/cudf-tools/examples"
          cp -a examples/*.cudf "${{targets.contextdir}}/usr/share/doc/cudf-tools/examples/"
    dependencies:
      runtime:
        - ocaml  # Debian: ocaml-base
update:
  enabled: true
  release-monitor:
    identifier: 382840
test:
  environment:
    contents:
      packages:
        - busybox
        - cudf-tools
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - libcudf-ocaml-dev
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - zstd-dev  # Debian: ocaml
        - ocaml-findlib  # Debian: ocaml-findlib
        - ocamlfind  # Debian: ocaml-findlib
        - ocamlbuild
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcudf-ocaml-dev/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/c/cudf/cudf_${{package.version}}.orig.tar.gz
        expected-sha256: 7b9d7390fca822afd8b35197814616088edfb3fa3cb44903dfa49399e9fefb50
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libcudf-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libcudf-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: cudf-check-universe'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e

        cudf-check -univ examples/universe.cudf 2> /dev/null
    - name: 'autopkgtest: api-ocaml'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        cat > "$AUTOPKGTEST_TMP/api-ocaml" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/sh -e
        indir=${PWD}/debian/tests/
        exdir=${PWD}/examples
        outdir=${AUTOPKGTEST_ARTIFACTS-/tmp/cudf-package-test}/ocaml-api
        mkdir -p ${outdir}
        cd ${outdir}
        cp ${indir}/parse.ml ${indir}/_tags .

        echo "* Compile to bytecode"
        ocamlbuild -use-ocamlfind parse.byte
        echo "* Run the bytecode"
        ./parse.byte ${exdir}/universe.cudf

        if [ -x /usr/bin/ocamlopt ]; then
            echo "* Compile to native code"
            ocamlbuild -use-ocamlfind parse.native
            echo "* Run the native code"
            ./parse.native ${exdir}/universe.cudf
        fi
        AUTOPKGTEST_SCRIPT
        chmod +x "$AUTOPKGTEST_TMP/api-ocaml"
        "$AUTOPKGTEST_TMP/api-ocaml"
