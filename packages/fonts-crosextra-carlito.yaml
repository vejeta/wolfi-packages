package:
  name: fonts-crosextra-carlito
  version: '20230309'
  epoch: 0
  description: Sans-serif font metric-compatible with Calibri font
  copyright:
    - license: OFL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-crosextra-carlito/$f .recipe-files/; done
      rmdir fonts-crosextra-carlito 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-crosextra-carlito/fonts-crosextra-carlito_${{package.version}}.orig.tar.gz
      expected-sha256: 72f4f92c4e71c82ba261230ae7aa2e7a3f5fa85a3e8e820288d7eeb1ae55f6dc
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-crosextra-carlito/copyright
update:
  enabled: true
  github:
    identifier: googlefonts/carlito
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-crosextra-carlito/copyright
