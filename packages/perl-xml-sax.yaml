package:
  name: perl-xml-sax
  version: '1.02'
  epoch: 0
  description: Simple API for XML
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-xml-sax-base  # TODO(alpine-to-melange): not in Wolfi
      - perl-xml-namespacesupport  # TODO(alpine-to-melange): not in Wolfi
  scriptlets:
    post-install: |
      #!/bin/sh
      # Registers the SAX parser into the registry.

      LC_ALL=C perl -MXML::SAX -e \
      	"XML::SAX->add_parser(q(XML::SAX::PurePerl))->save_parsers()" 2>&1 >/dev/null
    post-upgrade: |
      #!/bin/sh
      # Registers the SAX parser into the registry.

      LC_ALL=C perl -MXML::SAX -e \
      	"XML::SAX->add_parser(q(XML::SAX::PurePerl))->save_parsers()" 2>&1 >/dev/null
    pre-deinstall: |
      #!/bin/sh
      # Unregisters the SAX parser from the registry.

      LC_ALL=C perl -MXML::SAX -e \
      	"XML::SAX->remove_parser(q(XML::SAX::PurePerl))->save_parsers()" 2>&1 >/dev/null
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-xml-sax-base  # TODO(alpine-to-melange): not in Wolfi
      - perl-xml-namespacesupport  # TODO(alpine-to-melange): not in Wolfi
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-${{package.version}}.tar.gz
      expected-sha512: bb30ddbbcf27803825d2f0936257e102999a197cb14bd77fa8b7a469f3a24fb7d861ef4eb03230e5581e4ed88beb8676cbb907b2cb63e9ef1a64b2c211ebdc5a
  - name: Build
    runs: |
      PERL_MM_USE_DEFAULT=1 perl Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      PERLLIB=blib/lib make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
