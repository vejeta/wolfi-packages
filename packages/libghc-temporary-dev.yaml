package:
  name: libghc-temporary-dev
  version: '1.3'
  epoch: 0
  description: Temporary files and directories${haskell:ShortBlurb}
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ${haskell:Recommends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ghc  # Wolfi Community Packages
      - ghc-prof  # Wolfi Community Packages
      - haskell-devscripts  # Wolfi Community Packages
      # TODO(debian-to-melange): libghc-exceptions-dev is not in Wolfi (Debian: libghc-exceptions-dev); left out
      # TODO(debian-to-melange): libghc-exceptions-prof is not in Wolfi (Debian: libghc-exceptions-prof); left out
      # TODO(debian-to-melange): libghc-random-dev is not in Wolfi (Debian: libghc-random-dev); left out
      # TODO(debian-to-melange): libghc-random-prof is not in Wolfi (Debian: libghc-random-prof); left out
      - ghc-doc  # Wolfi Community Packages
      # TODO(debian-to-melange): libghc-exceptions-doc is not in Wolfi (Debian: libghc-exceptions-doc); left out
      # TODO(debian-to-melange): libghc-random-doc is not in Wolfi (Debian: libghc-random-doc); left out
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/haskell-temporary/haskell-temporary_${{package.version}}.orig.tar.gz
      expected-sha256: 8c442993694b5ffca823ce864af95bd2841fb5264ee511c61cf48cc71d879890
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libghc-temporary-dev
subpackages:
  - name: libghc-temporary-prof
    description: Temporary files and directories${haskell:ShortBlurb}
    pipeline:
      # TODO(debian-to-melange): no debian/libghc-temporary-prof.install; define which files go to this subpackage
      - runs: |
          true
  - name: libghc-temporary-doc
    description: Temporary files and directories${haskell:ShortBlurb}
    pipeline:
      - uses: split/manpages
update:
  enabled: true
  github:
    identifier: feuerbach/temporary
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libghc-temporary-dev/LICENSE
    - uses: test/tw/ldd-check
