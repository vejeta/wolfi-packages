# Debian packaging: https://salsa.debian.org/cwidget-team/cwidget
#
# Conversion notes:
# - build dependency 'ikiwiki' (Debian 'ikiwiki') not found in Wolfi; left out
# - build dependency 'perl-html-scrubber' (Debian 'libhtml-scrubber-perl') not found in Wolfi; left out
# - build dependency 'perl-image-magick' (Debian 'libimage-magick-perl') not found in Wolfi; left out
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/c/cwidget/cwidget_0.5.18.orig.tar.xz), which disappears from the pool when Debian updates
# - runtime dependency 'libjs-jquery': Debian ships JavaScript libraries separately; Wolfi does not, keep the copy bundled upstream
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libcwidget4
  version: '0.5.18'
  epoch: 0
  description: High-level terminal interface library for C++ (runtime files)
  copyright:
    - license: GPL-2.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - gettext
      - cppunit-dev  # Debian: libcppunit-dev
      - ncurses-dev  # Debian: libncurses-dev
      - libsigc++-dev  # Wolfi Community Packages (Debian: libsigc++-2.0-dev)
      - doxygen
      # TODO(debian-to-melange): ikiwiki is not in Wolfi (Debian: ikiwiki); left out
      # TODO(debian-to-melange): perl-html-scrubber is not in Wolfi (Debian: libhtml-scrubber-perl); left out
      # TODO(debian-to-melange): perl-image-magick is not in Wolfi (Debian: libimage-magick-perl); left out
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Change-gettext-domainname-to-libcwidget4-1.patch 0002-Fix-cwidget-and-aptitude-FTBFS.patch; do mv libcwidget4/$f .recipe-files/; done
      rmdir libcwidget4 2>/dev/null || true
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/c/cwidget/cwidget_${{package.version}}.orig.tar.xz
      expected-sha256: a2fb48ff86e41fe15072e6d87b9467ff3af57329586f4548d9f25cf50491c9fc
  - uses: patch
    with:
      patches: .recipe-files/0001-Change-gettext-domainname-to-libcwidget4-1.patch .recipe-files/0002-Fix-cwidget-and-aptitude-FTBFS.patch
  - uses: autoconf/configure
    with:
      opts: --disable-werror $(CROSS_CONFIGURE_OPTIONS)
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc)
      make -C doc doc
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make install DESTDIR="${{targets.destdir}}"
      make -C doc install
  - name: Install files
    runs: |
      find "${{targets.destdir}}" -path "*jquery.min.js*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*jquery.js*" -prune -exec rm -rf {} +
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libcwidget4
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcwidget-dev
    description: High-level terminal interface library for C++ (development files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/include"
          mv "${{targets.destdir}}/usr/include/cwidget" "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}/usr/lib/libcwidget.so" "${{targets.contextdir}}/usr/lib/"
          mv "${{targets.destdir}}/usr/lib/libcwidget.a" "${{targets.contextdir}}/usr/lib/"
          mv "${{targets.destdir}}/usr/lib/pkgconfig" "${{targets.contextdir}}/usr/lib/"
          mv "${{targets.destdir}}/usr/lib/cwidget" "${{targets.contextdir}}/usr/lib/"
          (cd "${{targets.contextdir}}" && find . -path "*jquery.min.js*" -prune | while read -r f; do
            mkdir -p "$(dirname "${{targets.destdir}}/$f")" && mv "$f" "${{targets.destdir}}/$f"
          done)
          (cd "${{targets.contextdir}}" && find . -path "*jquery.js*" -prune | while read -r f; do
            mkdir -p "$(dirname "${{targets.destdir}}/$f")" && mv "$f" "${{targets.destdir}}/$f"
          done)
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libcwidget-dev"
          cp -a README "${{targets.contextdir}}/usr/share/doc/libcwidget-dev/"
    dependencies:
      runtime:
        - libcwidget4
        - libsigc++-dev  # Wolfi Community Packages (Debian: libsigc++-2.0-dev)
        - ncurses-dev  # Debian: libncursesw5-dev
        - pkgconf-dev  # Debian: pkg-config
  - name: libcwidget-doc
    description: High-level terminal interface library for C++ (documentation)
    pipeline:
      - runs: |
          (cd "${{targets.contextdir}}" && find . -path "*jquery.min.js*" -prune | while read -r f; do
            mkdir -p "$(dirname "${{targets.destdir}}/$f")" && mv "$f" "${{targets.destdir}}/$f"
          done)
          (cd "${{targets.contextdir}}" && find . -path "*jquery.js*" -prune | while read -r f; do
            mkdir -p "$(dirname "${{targets.destdir}}/$f")" && mv "$f" "${{targets.destdir}}/$f"
          done)
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libcwidget-doc/html/ikiwiki"
          ln -sf /usr/share/javascript/jquery/jquery.min.js "${{targets.contextdir}}/usr/share/doc/libcwidget-doc/html/ikiwiki/jquery.min.js"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libcwidget-doc/html/documentation/api"
          ln -sf /usr/share/javascript/jquery/jquery.js "${{targets.contextdir}}/usr/share/doc/libcwidget-doc/html/documentation/api/jquery.js"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libcwidget-doc"
          cp -a doc/html "${{targets.contextdir}}/usr/share/doc/libcwidget-doc/"
update:
  enabled: true
  release-monitor:
    identifier: 229372
test:
  environment:
    contents:
      packages:
        - busybox
        - libcwidget-dev
        - build-base  # Debian: build-essential
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libcwidget4/COPYING
    - uses: test/tw/ldd-check
    - name: 'Debian''s include/ncursesw'
      runs: |
        mkdir -p /usr/include/ncursesw
        for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
                 panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
          [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
        done
        true
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/c/cwidget/cwidget_${{package.version}}.orig.tar.xz
        expected-sha256: a2fb48ff86e41fe15072e6d87b9467ff3af57329586f4548d9f25cf50491c9fc
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libcwidget4.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libcwidget4.templates" && break
        done
    - name: 'autopkgtest: compile-example-testcwidget'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # Author: Manuel A. Fernandez Montecelo <mafm@debian.org>
        #
        # autopkgtest check: Build and run a program against the library, to verify that
        # the headers and pkg-config file are installed correctly


        set -e

        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" 0 INT QUIT ABRT PIPE TERM
        cd $WORKDIR

        SRCFILE=testcwidget.cc
        BINFILE=testcwidget

        cp /usr/share/doc/libcwidget-dev/examples/$SRCFILE .

        g++ -o $BINFILE $SRCFILE `pkg-config --cflags --libs cwidget` -I /usr/include/cwidget
        echo "build: OK"

        [ -x $BINFILE ]
        # interactive, cannot invoke and close from command line
        #./$BINFILE
        echo "run: OK"
