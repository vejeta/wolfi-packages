pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 02-ignore-modules.patch fix-unicodedata.st.patch icu4j-compatibility.patch scripts_antlr4 scripts_antlr4.1 scripts_completion_antlr4 scripts_grun; do mv antlr4/$f .recipe-files/; done
      rmdir antlr4 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/antlr/antlr4
      tag: ${{package.version}}
      expected-commit: 5e5b6d35b4183fd330102c40947b95c4b5c6abb5
  - uses: patch
    with:
      patches: .recipe-files/02-ignore-modules.patch .recipe-files/fix-unicodedata.st.patch .recipe-files/icu4j-compatibility.patch
  - name: From debian/rules execute_before_dh_auto_build
    runs: |
      cp -r debian/generated-sources/antlr4/* runtime/Java/src/
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a .recipe-files/scripts_antlr4 "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share/bash-completion/completions"
      cp -a .recipe-files/scripts_completion_antlr4 "${{targets.destdir}}/usr/share/bash-completion/completions/"
      mkdir -p "${{targets.destdir}}/usr/share/antlr4"
      cp -a .recipe-files/scripts_grun "${{targets.destdir}}/usr/share/antlr4/"
      install -Dm644 .recipe-files/scripts_antlr4.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/antlr4
  - name: Commands are executable (dh_fixperms)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        [ -d "$d/usr/bin" ] && find "$d/usr/bin" -type f -exec chmod 755 {} +
      done
      true
