environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
      - perl-module-build
      - perl-b-keywords  # Wolfi Community Packages (Debian: libb-keywords-perl)
      - perl-list-someutils  # Wolfi Community Packages (Debian: liblist-someutils-perl)
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PE/PETDANCE/Perl-Critic-${{package.version}}.tar.gz
      expected-sha256: 572a7c8758ba1c0ab6daf0bd40297c4f0dcf1516f084522df2c2bf04d525e232
  - name: Build and install (Build.PL)
    runs: |
      perl Build.PL installdirs=vendor create_packlist=0
      ./Build
      ./Build install destdir="${{targets.destdir}}"
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-perl-critic/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/perl-perl-critic/examples/"
      cp -a tools/ppidump "${{targets.destdir}}/usr/share/doc/perl-perl-critic/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-perl-critic"
      cp -a CONTRIBUTING.md "${{targets.destdir}}/usr/share/doc/perl-perl-critic/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-perl-critic
  - name: From debian/rules override_dh_installexamples
    runs: |
      sed -i '1s|^#!/usr/bin/env perl|#!/usr/bin/perl|' ${{targets.destdir}}/usr/share/doc/perl-perl-critic/examples/ppidump
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 3209
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-perl-critic/LICENSE
    - name: Load the module
      runs: |
        perl -MPerl::Critic -e1
