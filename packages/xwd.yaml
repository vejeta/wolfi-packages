package:
  name: xwd
  version: '1.0.9'
  epoch: 0
  description: Utility to dump an image of an X window in XWD format
  copyright:
    - license: MIT-open-group
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libxkbfile-dev
      - util-macros
pipeline:
  - uses: fetch
    with:
      uri: https://xorg.freedesktop.org/archive/individual/app/xwd-${{package.version}}.tar.xz
      expected-sha512: ae59661b05160f5658920fd79031b6b8548cb7bbfc734194edb0acef5c95f76b210ca4443e9506fc1a0cb9df47ee7c22948502971afe578b44c75aa2a1138d56
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"
      CTARGET="${{host.triplet.gnu}}"

      ./configure \
      	--target="$CTARGET" \
      	--build="$CBUILD" \
      	--host="$CHOST" \
      	--prefix=/usr
      make
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      install -Dm644 COPYING -t "$pkgdir"/usr/share/licenses/"$pkgname"
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: xwd-doc
    description: Utility to dump an image of an X window in XWD format (doc)
    pipeline:
      - uses: split/alldocs
update:
