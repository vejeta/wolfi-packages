# Generated by debian-to-melange 0.1.0 from Debian source package
# pycodestyle 2.14.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/pycodestyle
# Debian packaging: https://salsa.debian.org/python-team/packages/pycodestyle
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_2.14.0.orig.tar.gz), which disappears from the pool when Debian updates
# - autopkgtests converted to the test pipeline (3 steps)
# - Wolfi Python layout: py3.X-pycodestyle for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-pycodestyle
  version: '2.14.0'
  epoch: 0
  description: Python style guide checker (formerly called pep8) - Python 3.x
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
vars:
  pypi-package: pycodestyle
  import: pycodestyle
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - py3-supported-pytest  # Debian: python3-pytest
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in pycodestyle.1 test-support-running-tests-out-of-tree.patch; do mv py3-pycodestyle/$f .recipe-files/; done
      rmdir py3-pycodestyle 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_${{package.version}}.orig.tar.gz
      expected-sha256: ef1b128ca60d19a255a75e64294ca941ddca7aa79784a4a9d9bc08a923b94f56
  - uses: patch
    with:
      patches: .recipe-files/test-support-running-tests-out-of-tree.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-pycodestyle"
      cp -a README.rst "${{targets.destdir}}/usr/share/doc/py3-pycodestyle/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          if [ -d "${{targets.contextdir}}"/usr/bin ]; then
            mkdir -p "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr"
            cp -a "${{targets.contextdir}}"/usr/bin "${{targets.outdir}}/py${{range.key}}-${{vars.pypi-package}}-bin/usr/"
          fi
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
      - runs: |
          rm -rf "${{targets.contextdir}}"/usr/bin
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: ${{vars.pypi-package}} commands for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}-bin
    pipeline:
      - runs: |
          true
  - name: pycodestyle
    description: Python style guide checker (formerly called pep8)
    pipeline:
      - runs: |
          true
    dependencies:
      runtime:
        - py3.13-${{vars.pypi-package}}-bin
update:
  enabled: true
  github:
    identifier: PyCQA/pycodestyle
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - py3-pycodestyle
        - pycodestyle
        - py3-supported-pycodestyle
  pipeline:
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/p/pycodestyle/pycodestyle_${{package.version}}.orig.tar.gz
        expected-sha256: ef1b128ca60d19a255a75e64294ca941ddca7aa79784a4a9d9bc08a923b94f56
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-pycodestyle=py3-pycodestyle' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-pycodestyle.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-pycodestyle.templates" && break
        done
    - name: 'autopkgtest: cd "$AUTOPKGTEST_TMP" ; python3 -c "import pycodestyle; prin'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        cd "$AUTOPKGTEST_TMP" ; python3 -c "import pycodestyle; print(pycodestyle.__version__)"
    - name: 'autopkgtest: python3'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        cd "$AUTOPKGTEST_TMP"

        cat > E40.py <<EOF
        import os, sys
        EOF

        python3 -m pycodestyle E40.py | grep E401
    - name: 'autopkgtest: cli'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        cd "$AUTOPKGTEST_TMP"

        cat > E40.py <<EOF
        import os, sys
        EOF

        pycodestyle E40.py | grep E401
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
