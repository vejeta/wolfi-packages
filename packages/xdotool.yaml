package:
  name: xdotool
  version: '3.20160805.1'
  epoch: 0
  description: Simulate (generate) X11 keyboard/mouse input events
  copyright:
    - license: BSD-3-Clause
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
