      - xkeyboard-config  # Debian: xkb-data
      - xterm
      - xvfb-run  # Debian: xvfb
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-preserve-xdo_t-abi.patch 0002-record-upstream-version-info-Closes-795809.patch 0003-Fix-Minitest-case.patch copyright; do mv xdotool/$f .recipe-files/; done
      rmdir xdotool 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/jordansissel/xdotool
      tag: v${{package.version}}
      expected-commit: f11c44edd4d426d69bcff479b0d643a4da8bc99b
  - uses: patch
    with:
      patches: .recipe-files/0001-preserve-xdo_t-abi.patch .recipe-files/0002-record-upstream-version-info-Closes-795809.patch .recipe-files/0003-Fix-Minitest-case.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) WITHOUT_RPATH_FIX=1
      make docs
      rm -f docs/html/jquery.js
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make install PREFIX=${{targets.destdir}}/usr INSTALLMAN=${{targets.destdir}}/usr/share/man
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr"
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share"
      mkdir -p "${{targets.destdir}}/usr/share/man"
      mkdir -p "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/xdotool/examples"
      cp -a examples/ffsp.sh "${{targets.destdir}}/usr/share/doc/xdotool/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/xdotool"
      cp -a README "${{targets.destdir}}/usr/share/doc/xdotool/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/xdotool/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libxdo3
    description: Library for simulating (generating) X11 keyboard/mouse input events
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}/usr/lib/libxdo.so.3" "${{targets.contextdir}}/usr/lib/"
  - name: libxdo-dev
    description: Library for simulating X11 keyboard/mouse input
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}/usr/lib/libxdo.so" "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/include"
          mv "${{targets.destdir}}/usr/include/xdo.h" "${{targets.contextdir}}/usr/include/"
          mkdir -p "${{targets.contextdir}}/usr"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libxdo-dev"
          cp -a docs/* "${{targets.contextdir}}/usr/share/doc/libxdo-dev/"
    dependencies:
      runtime:
        - libx11-dev
        - libxdo3
update:
  enabled: true
  github:
    identifier: jordansissel/xdotool
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        xdotool --version || (xdotool --help 2>&1 || true) | grep -qi -e usage -e xdotool
        test -f /usr/share/doc/xdotool/copyright
    - uses: test/tw/ldd-check
