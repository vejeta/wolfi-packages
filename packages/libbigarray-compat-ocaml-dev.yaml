# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libbigarray-compat-ocaml-dev
  version: '1.1.0'
  epoch: 0
  description: Compatibility library for Stdlib.Bigarray (dev)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libbigarray-compat-ocaml  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/bigarray-compat
      tag: v${{package.version}}
      expected-commit: 2ea842ba4ab2cfee7b711f7ad927917f3179a6f9
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p bigarray-compat -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" bigarray-compat
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbigarray-compat-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/bigarray-compat/* "${{targets.destdir}}/usr/share/doc/libbigarray-compat-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/bigarray-compat" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libbigarray-compat-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libbigarray-compat-ocaml
    description: Compatibility library for Stdlib.Bigarray (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/bigarray-compat"
          mv "${{targets.destdir}}/usr/lib/ocaml/bigarray-compat/META" "${{targets.contextdir}}/usr/lib/ocaml/bigarray-compat/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/bigarray-compat/*.cma; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/bigarray-compat/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/bigarray-compat/*.cmxs; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/bigarray-compat/"
          done
          true
update:
  enabled: true
  github:
    identifier: mirage/bigarray-compat
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libbigarray-compat-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
