package:
  name: fonts-oflb-asana-math
  version: '000.962'
  epoch: 0
  description: Extended smart Unicode Math font
  copyright:
    - license: OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-oflb-asana-math/$f .recipe-files/; done
      rmdir fonts-oflb-asana-math 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-oflb-asana-math/fonts-oflb-asana-math_${{package.version}}.orig.tar.xz
      expected-sha256: 6641fc68af7e145ea5d1d7b691836f6ac765ab105109433be9844ab7bfae85a8
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/asana-math"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-oflb-asana-math/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-oflb-asana-math/copyright
