# dwz 0.17-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/dwz
# Debian packaging: https://salsa.debian.org/toolchain-team/dwz
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/d/dwz/dwz_0.17.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: dwz
  version: '0.17'
  epoch: 0
  description: DWARF compression tool
  copyright:
    - license: GPL-2.0-or-later
    - license: GPL-3.0-or-later
      paths:
        - 'dwarf2.*'
    - license: LGPL-2.0-or-later
      paths:
        - 'hashtab.*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - elfutils-dev  # Debian: libelf-dev
      - xxhash-dev  # Debian: libxxhash-dev
      - bash  # the source has bash scripts; Essential in Debian
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/dwz/dwz_${{package.version}}.orig.tar.xz
      expected-sha256: 25be0529a34c251eca2675be7f242380c33add53f52a0d6cbc5e02a109e01f59
  - name: Configure (from debian/rules override_dh_auto_configure)
    runs: |
      rm -rf build
      mkdir build
      (cd build && ../configure)
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make -j$(nproc) CFLAGS="$(shell dpkg-buildflags --get CPPFLAGS; dpkg-buildflags --get CFLAGS)" LDFLAGS="$(shell dpkg-buildflags --get LDFLAGS)"
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/dwz
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 375636
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/dwz/COPYING
    - uses: test/tw/ldd-check
