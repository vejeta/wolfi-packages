pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in a5toa4.1 arara.1.diff copyright debian_1085685 debian_1130442 fix-scripts fix-tabu-920459 fix-tabu-920459-reopened latex2man-mktemp pax-build python3-shebang ulqda-use-digest-sha webquiz-javascript-min; do mv texlive-bibtex-extra/$f .recipe-files/; done
      rmdir texlive-bibtex-extra 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/t/texlive-extra/texlive-extra_${{package.version}}.orig.tar.xz
      expected-sha256: 2f8193ca6496b6a611bec4f185f806cc7153e1b7251f43559850151d10ae9299
  - uses: patch
    with:
      patches: .recipe-files/fix-scripts .recipe-files/ulqda-use-digest-sha .recipe-files/latex2man-mktemp .recipe-files/fix-tabu-920459 .recipe-files/fix-tabu-920459-reopened .recipe-files/webquiz-javascript-min .recipe-files/python3-shebang .recipe-files/pax-build .recipe-files/debian_1085685 .recipe-files/debian_1130442 .recipe-files/arara.1.diff
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/texlive-bibtex-extra/copyright
