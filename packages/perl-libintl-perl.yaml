# Conversion notes:
# - upstream tarball from CPAN (libintl-perl)
package:
  name: perl-libintl-perl
  version: '1.37'
  epoch: 0
  description: Uniforum message translations system compatible i18n library
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
      # Debian Recommends (not supported by apk): libintl-xs-perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - glibc-locale-en  # Debian: locales-all
      - perl-dev  # Debian: perl-xs-dev
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in NEWS.Developer auto-gitignore spelling.patch spelling2.patch; do mv perl-libintl-perl/$f .recipe-files/; done
      rmdir perl-libintl-perl 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/G/GU/GUIDO/libintl-perl-${{package.version}}.tar.gz
      expected-sha256: a49b08d56813789e5f03289a3f949459eafe9e40a1a9fc066c42c90009a322cf
  - uses: patch
    with:
      patches: .recipe-files/spelling2.patch .recipe-files/spelling.patch .recipe-files/auto-gitignore
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/examples"
      cp -a sample/README "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/examples/"
      cp -a sample/simplecal "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-libintl-perl"
      cp -a FAQ "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/"
      cp -a README "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/"
      cp -a THANKS "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/"
      cp -a TODO "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/"
      cp -a .recipe-files/NEWS.Developer "${{targets.destdir}}/usr/share/doc/perl-libintl-perl/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/perl-libintl-perl
  - name: From debian/rules override_dh_installexamples
    runs: |
      find ${{targets.destdir}}/usr/share/doc/perl-libintl-perl/examples -type f -print0 |  		xargs -r0 sed -E -i -e '1s|^#!\s*/usr/local/bin/perl|#!/usr/bin/perl|'
      rm -f --verbose ${{targets.destdir}}/usr/share/doc/perl-libintl-perl/examples/simplecal/.gitignore
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: perl-intl-xs
    description: XS Uniforum message translations system compatible i18n library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv "${{targets.destdir}}"/usr/lib/* "${{targets.contextdir}}/usr/lib/"
          mkdir -p "${{targets.contextdir}}/usr/share/perl5/vendor_perl/Locale"
          mv "${{targets.destdir}}/usr/share/perl5/vendor_perl/Locale/gettext_xs.pm" "${{targets.contextdir}}/usr/share/perl5/vendor_perl/Locale/"
          if [ -e "${{targets.destdir}}/usr/share/man/man3/Locale::gettext_xs.3" ]; then
            mkdir -p "${{targets.contextdir}}/usr/share/man/man3"
            mv "${{targets.destdir}}/usr/share/man/man3/Locale::gettext_xs.3" "${{targets.contextdir}}/usr/share/man/man3/"
          fi
    dependencies:
      runtime:
        - perl-libintl-perl
        - perl  # Debian: ${perl:Depends}
update:
  enabled: true
  release-monitor:
    identifier: 5950
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-libintl-perl/COPYING
    - name: Load the module
      runs: |
        perl -MLocale::Recode -e1
