# https://tracker.debian.org/pkg/hevea
# Debian packaging: https://salsa.debian.org/ocaml-team/hevea
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/h/hevea/hevea_2.38.orig.tar.gz), which disappears from the pool when Debian updates
# - dh --with ocaml,tex has no direct melange equivalent; review
# - test dependency 'texmf-dist-latexbase' (Debian 'texlive-latex-base') not found in Wolfi; left out
# - autopkgtest 'examples source-date-epoch' left out: it needs packages that are not in Wolfi
package:
  name: hevea
  version: '2.38'
  epoch: 0
  description: Translates from LaTeX to HTML, info, or text
  copyright:
    - license: QPL-1.0-with-linking-exception
  dependencies:
    runtime:
      - ghostscript
      - netpbm  # Wolfi Community Packages
      - texlive  # Wolfi Community Packages (Debian: texlive-base)
      - imagemagick-7  # Debian: imagemagick
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - tex-common  # Wolfi Community Packages
      - ocaml
      - ocamlbuild
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in source_date_epoch; do mv hevea/$f .recipe-files/; done
      rmdir hevea 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/hevea/hevea_${{package.version}}.orig.tar.gz
      expected-sha256: 722038065007226f0fa3de4629127294d2e29bfbbc41042c83a570fa0c455a47
  - uses: patch
    with:
      patches: .recipe-files/source_date_epoch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make byte
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      make install TARGET=byte DESTDIR=${{targets.destdir}}
      rm ${{targets.destdir}}/usr/share/hevea/imagen
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share/hevea"
      mkdir -p "${{targets.destdir}}/usr/share/texmf/tex/latex/misc"
      mkdir -p "${{targets.destdir}}/usr/share/doc/hevea"
      ln -sf /usr/bin/imagen "${{targets.destdir}}/usr/share/hevea/imagen"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/hevea
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 7850
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/hevea/LICENSE
    - uses: test/tw/ldd-check
    # TODO(debian-to-melange): autopkgtest 'examples source-date-epoch' left out; it needs packages that are not in Wolfi
