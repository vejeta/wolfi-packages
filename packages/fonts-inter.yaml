# Debian packaging: https://salsa.debian.org/fonts-team/fonts-inter
#
# Conversion notes:
# - build dependency 'glyphspkg' (Debian 'glyphspkg') not found in Wolfi; left out
# - build dependency 'psautohint' (Debian 'psautohint') not found in Wolfi; left out
# - build dependency 'py3-skia-pathops' (Debian 'python3-skia-pathops') not found in Wolfi; left out
# - build dependency 'py3-ttfautohint-py' (Debian 'python3-ttfautohint-py') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-inter
  version: '4.1'
  epoch: 0
  description: Inter font family
  copyright:
    - license: OFL-1.1-no-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - fontmake
      # TODO(debian-to-melange): glyphspkg is not in Wolfi (Debian: glyphspkg); left out
      # TODO(debian-to-melange): psautohint is not in Wolfi (Debian: psautohint); left out
      # TODO(debian-to-melange): py3-skia-pathops is not in Wolfi (Debian: python3-skia-pathops); left out
      # TODO(debian-to-melange): py3-ttfautohint-py is not in Wolfi (Debian: python3-ttfautohint-py); left out
      - bash  # the source has bash scripts; Essential in Debian
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in source_date_epoch.patch; do mv fonts-inter/$f .recipe-files/; done
      rmdir fonts-inter 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/rsms/inter
      tag: v${{package.version}}
      expected-commit: e3a3d4c57d5ecc01453a575621882a384c1995a3
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf docs/font-files/*.woff* docs/lab docs/samples docs/res misc/ttf2woff misc/UnicodeData.txt
  - uses: patch
    with:
      patches: .recipe-files/source_date_epoch.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      mkdir -p build/venv/bin
      ln -s /usr/bin/glyphspkg build/venv/bin/glyphspkg
      ln -s /usr/bin/python3 build/venv/bin/python
      touch build/venv/config2.stamp
      touch build/venv/bin/activate
      chmod +x build/venv/bin/activate
      make -j$(nproc) var static_otf
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      echo skipping install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/inter"
      cp -a build/fonts/static/*.otf "${{targets.destdir}}/usr/share/fonts/opentype/inter/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-inter"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/fonts-inter/"
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/fonts-inter
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: fonts-inter-variable
    description: Inter font family (VF)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/inter-vf"
          cp -a build/fonts/var/*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/inter-vf/"
update:
  enabled: true
  github:
    identifier: rsms/inter
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-inter/LICENSE.txt
