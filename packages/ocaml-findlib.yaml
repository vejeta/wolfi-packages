package:
  name: ocaml-findlib
  version: '1.9.8'
  epoch: 0
  description: Management tool for OCaml libraries
  copyright:
    - license: findlib
    - license: ocaml
      paths:
        - tools/make-package-macosx
  dependencies:
    runtime:
      - libfindlib-ocaml
      # Debian Recommends (not supported by apk): libfindlib-ocaml-dev
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash-completion
      - ocaml
      - gawk
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Change-standard-directories-to-conform-our-own-polic.patch 0002-Extra-configuration-search-path.patch; do mv ocaml-findlib/$f .recipe-files/; done
      rmdir ocaml-findlib 2>/dev/null || true
  - uses: fetch
    with:
      uri: http://download.camlcity.org/download/findlib-${{package.version}}.tar.gz
      expected-sha256: 662c910f774e9fee3a19c4e057f380581ab2fc4ee52da4761304ac9c31b8869d
  - uses: patch
    with:
      patches: .recipe-files/0001-Change-standard-directories-to-conform-our-own-polic.patch .recipe-files/0002-Extra-configuration-search-path.patch
  - uses: autoconf/configure
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      make
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: $(MAKE) install prefix=$(CURDIR)/debian/tmp && grep -v \\.opt debian/tmp/etc/ocamlfind.conf > debian/ocamlfind.conf.new && sed -i -e 's/@OCamlABI@/$(OCAML_ABI)/g' debian/ocamlfind.conf.new && mv debia
  # TODO(debian-to-melange): port debian/rules execute_after_dh_install: for p in bytes; do  	  if [ -d $(OCAML_STDLIB_DIR)/$$p ]; then  	    rm -rf $(CURDIR)/debian/libfindlib-ocaml$(OCAML_STDLIB_DIR)/$$p;  	  fi;  	done
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a usr/bin/ocamlfind "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share"
      cp -a usr/share/man "${{targets.destdir}}/usr/share/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/ocaml-findlib"
      cp -a doc/QUICKSTART "${{targets.destdir}}/usr/share/doc/ocaml-findlib/"
      cp -a doc/README "${{targets.destdir}}/usr/share/doc/ocaml-findlib/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-findlib
  - uses: strip
subpackages:
  - name: libfindlib-ocaml-dev
    description: Library for managing OCaml libraries (development files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/ocaml-findlib"
          ln -sf /usr/share/doc/libfindlib-ocaml-dev/ref-html "${{targets.contextdir}}/usr/share/doc/ocaml-findlib/ref-html"
          ln -sf /usr/share/doc/libfindlib-ocaml-dev/guide-html "${{targets.contextdir}}/usr/share/doc/ocaml-findlib/guide-html"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libfindlib-ocaml-dev"
          cp -a doc/guide-html "${{targets.contextdir}}/usr/share/doc/libfindlib-ocaml-dev/"
          cp -a doc/ref-html "${{targets.contextdir}}/usr/share/doc/libfindlib-ocaml-dev/"
  - name: libfindlib-ocaml
    description: Library for managing OCaml libraries (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libfindlib-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  release-monitor:
    identifier: 16991
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        ocamlfind --version || (ocamlfind --help 2>&1 || true) | grep -qi -e usage -e ocamlfind
        test -f /usr/share/licenses/ocaml-findlib/LICENSE
    - uses: test/tw/ldd-check
