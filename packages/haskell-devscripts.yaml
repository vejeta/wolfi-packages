package:
  name: haskell-devscripts
  version: '0.16.49'
  epoch: 0
  description: Debian tools to build Haskell packages (with hscolour)
  copyright:
    - license: GPL-2.0-only
    - license: GPL-2.0-or-later
      paths:
        - hlibrary.mk
    - license: GPL-3.0-or-later
      paths:
        - 'dh_*'
        - 'lib/*'
        - Dh_Haskell.sh
  dependencies:
    runtime:
      - ghc  # Wolfi Community Packages
      - haskell-devscripts-minimal
      # TODO(debian-to-melange): hscolour is not in Wolfi (Debian: hscolour); left out
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - perl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in manpages; do mv haskell-devscripts/$f .recipe-files/; done
      rmdir haskell-devscripts 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/h/haskell-devscripts/haskell-devscripts_${{package.version}}.tar.xz
      expected-sha256: c18d5530b570787fa0f6251477b379270bd7d5b77c492936837d1917d10e057f
  # TODO(debian-to-melange): port debian/rules execute_after_dh_auto_build: -mkdir -p $(manual_dir) && set -e ; for MANUAL_PAGE in $(manual_pages) ; do  		BASENAME=$$(basename "$$MANUAL_PAGE" .1) ;  		$(pod2man) "$$BASENAME" > "$$MANUAL_PAGE" ;  	done
  # TODO(debian-to-melange): port debian/rules execute_after_dh_auto_clean: rm -f $(manual_pages) && -rmdir $(manual_dir)
  - name: Install files
    runs: |
      install -Dm644 manual/dh_haskell_blurbs.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_compiler.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_depends_cabal.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_depends_haddock.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_depends_hugs.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_description.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_extra_depends_ghc.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_install_development_libs.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_install_ghc_registration.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_install_haddock.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_install_htmldocs.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_install_profiling_libs.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_provides_ghc.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_recommends_documentation_references.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_shlibdeps.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 manual/dh_haskell_suggests.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share/haskell-devscripts"
      mkdir -p "${{targets.destdir}}/usr/share/cdbs/1/class"
      mkdir -p "${{targets.destdir}}/usr/share/doc/haskell-devscripts"
      cp -a README "${{targets.destdir}}/usr/share/doc/haskell-devscripts/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/haskell-devscripts
subpackages:
  - name: haskell-devscripts-minimal
    description: Tools to help Debian developers build Haskell packages
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a dh_* "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/share/haskell-devscripts"
          cp -a Dh_Haskell.sh "${{targets.contextdir}}/usr/share/haskell-devscripts/"
          mkdir -p "${{targets.contextdir}}/usr/share/cdbs/1/class"
          cp -a hlibrary.mk "${{targets.contextdir}}/usr/share/cdbs/1/class/"
          mkdir -p "${{targets.contextdir}}/usr/share/perl5/vendor_perl"
          mv "${{targets.destdir}}"/lib/* "${{targets.contextdir}}/usr/share/perl5/vendor_perl/"
          cp -a *.hs "${{targets.contextdir}}/usr/share/haskell-devscripts/"
    dependencies:
      runtime:
        - dctrl-tools  # Wolfi Community Packages
        - ghc  # Wolfi Community Packages
        # TODO(debian-to-melange): html-xml-utils is not in Wolfi (Debian: html-xml-utils); left out
        # TODO(debian-to-melange): perl-const-fast is not in Wolfi (Debian: libconst-fast-perl); left out
        # TODO(debian-to-melange): perl-devel-confess is not in Wolfi (Debian: libdevel-confess-perl); left out
        - perl-ipc-run3  # Debian: libipc-run3-perl
        - perl-list-someutils  # Wolfi Community Packages (Debian: liblist-someutils-perl)
        - perl-path-tiny  # Debian: libpath-tiny-perl
        - perl-timedate  # Debian: libtimedate-perl
        # TODO(debian-to-melange): perl-unicode-utf8 is not in Wolfi (Debian: libunicode-utf8-perl); left out
        - perl
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            ls /usr/bin/dh_* >/dev/null
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/haskell-devscripts/COPYING
