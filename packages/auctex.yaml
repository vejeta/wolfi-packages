package:
  name: auctex
  version: '13.2'
  epoch: 0
  description: Integrated document editing environment for TeX etc.
  copyright:
    - license: GPL-3.0-or-later
    - license: GFDL-NIV-1.3
      paths:
        - doc/auctex.texi
        - doc/changes.texi
        - doc/copying.texi
        - doc/faq.texi
        - doc/fdl.texi
        - doc/history.texi
        - doc/install.texi
        - doc/macros.texi
        - doc/preview-faq.texi
        - doc/preview-latex.texi
        - doc/preview-problems.texi
        - doc/preview-readme.texi
        - doc/preview-todo.texi
        - doc/quickstart.texi
        - doc/todo.texi
        - doc/wininstall.texi
    - license: permissive
      paths:
        - doc/intro.texi
    - license: preserve-notice
      paths:
        - doc/tex-ref.tex
    - license: MIT
      paths:
        - install-sh
    - license: publicdomain
      paths:
        - mkinstalldirs
    - license: tobeclarified
      paths:
        - style/j-article.el
        - style/j-book.el
        - style/j-report.el
        - style/jarticle.el
        - style/jbook.el
        - style/jreport.el
        - style/jsarticle.el
        - style/jsbook.el
        - style/report.el
    - license: tobeclarified
      paths:
        - style/amsbsy.el
        - style/amstext.el
    - license: tobeclarified
      paths:
        - style/amsbook.el
        - style/article.el
        - style/book.el
        - style/czech.el
        - style/danish.el
        - style/english.el
        - style/german.el
        - style/graphics.el
        - style/ngerman.el
        - style/slovak.el
        - style/swedish.el
    - license: tobeclarified
      paths:
        - style/dk.el
        - style/dutch.el
        - style/plfonts.el
        - style/plhb.el
        - style/virtex.el
  dependencies:
    runtime:
      - emacs
      # TODO(debian-to-melange): emacsen-common is not in Wolfi (Debian: emacsen-common); left out
      - preview-latex-style
      - procps
      # Debian Recommends (not supported by apk): ghostscript, texlive-latex-recommended, xpdf
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - emacs
      # TODO(debian-to-melange): eperl is not in Wolfi (Debian: eperl); left out
      - ghostscript
      # TODO(debian-to-melange): tex-common is not in Wolfi (Debian: tex-common); left out
      # TODO(debian-to-melange): texlive-latex-base is not in Wolfi (Debian: texlive-latex-base); left out
      # TODO(debian-to-melange): texlive-latex-recommended is not in Wolfi (Debian: texlive-latex-recommended); left out
      - texlive-extra-utils  # Wolfi Community Packages
      - texinfo
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-doc-Makefile.in-Rationalize-HTML-documentation-targe.patch 0002-doc-Makefile.in-Rationalize-dist-target.patch 0003-TeX-view-program-selection-Customize-for-Debian.patch 0004-TeX-auto-global-Customize-for-Debian.patch 0005-preview-image-type-Customize-for-Debian.patch 0006-Use-UTF-8.patch 0007-Set-timestamp-on-generated-preview-latex.el-file.patch; do mv auctex/$f .recipe-files/; done
      rmdir auctex 2>/dev/null || true
  # TODO(debian-to-melange): set expected-commit for tag release_13.2 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/@PACKAGE@.git
      tag: release_${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - uses: patch
    with:
      patches: .recipe-files/0001-doc-Makefile.in-Rationalize-HTML-documentation-targe.patch .recipe-files/0002-doc-Makefile.in-Rationalize-dist-target.patch .recipe-files/0003-TeX-view-program-selection-Customize-for-Debian.patch .recipe-files/0004-TeX-auto-global-Customize-for-Debian.patch .recipe-files/0005-preview-image-type-Customize-for-Debian.patch .recipe-files/0006-Use-UTF-8.patch .recipe-files/0007-Set-timestamp-on-generated-preview-latex.el-file.patch
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  # TODO(debian-to-melange): port debian/rules override_dh_auto_build: chmod -R a+rX debian/ && chmod a+x debian/elcc && $(MAKE) ELCC=$(ELCC) && rm --force auto-loads.el && touch --reference debian/changelog tex.el tex-site.el && $(MAKE) auto-loads.el && $(MAKE) tex-site
  - name: From debian/rules override_dh_install
    runs: |
      find ${{targets.destdir}}/usr/share/emacs/site-lisp -type f -name \*.elc  		-print0 | xargs --null --no-run-if-empty rm -f
      mv --verbose ${{targets.destdir}}/usr/share/emacs/site-lisp/auctex  		${{targets.destdir}}/usr/share/
  - name: Install files
    runs: |
      install -Dm644 debian/update-auctex-elisp.8 -t "${{targets.destdir}}/usr/share/man/man8"
      mkdir -p "${{targets.destdir}}/var/lib/auctex"
      mkdir -p "${{targets.destdir}}/usr/share/auctex"
      mkdir -p "${{targets.destdir}}/usr/share/doc/auctex"
      cp -a CHANGES "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a FAQ "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a README "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a RELEASE "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a PROBLEMS.preview "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a TODO "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a ChangeLog-preview* "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a circ.tex "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a usr/share/doc/auctex/tex-ref.pdf "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a debian/tmp/usr/doc/auctex/* "${{targets.destdir}}/usr/share/doc/auctex/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/auctex
  - name: From debian/rules override_dh_installdocs
    runs: |
      install -m 755 -d ${{targets.destdir}}/usr/doc/auctex/src
      mkdir -p ${{targets.destdir}}/usr/doc/auctex
      install -m 644 doc/*.tex{,i} ${{targets.destdir}}/usr/doc/auctex/src
      install -m 644 etc/auctex-logo.tex ${{targets.destdir}}/usr/doc/auctex/src
      install -m 755 -d  		${{targets.destdir}}/usr/doc/auctex/HTML/{auctex,preview-latex}
      mkdir -p ${{targets.destdir}}/usr/doc/auctex/HTML
      install -m 644 doc/auctex.htmls/*  		${{targets.destdir}}/usr/doc/auctex/HTML/auctex
      install -m 644 doc/preview-latex.htmls/*  		${{targets.destdir}}/usr/doc/auctex/HTML/preview-latex
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: preview-latex-style
    description: Extraction of elements from LaTeX documents as graphics
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/texmf/tex/latex"
          mv "${{targets.destdir}}/usr/share/texmf/tex/latex/preview" "${{targets.contextdir}}/usr/share/texmf/tex/latex/"
          mkdir -p "${{targets.contextdir}}/usr/share/texmf/doc/latex/preview"
          ln -sf /usr/share/doc/preview-latex-style/preview.pdf "${{targets.contextdir}}/usr/share/texmf/doc/latex/preview/preview.pdf"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/preview-latex-style"
          cp -a latex/README "${{targets.contextdir}}/usr/share/doc/preview-latex-style/"
          cp -a usr/share/texmf/doc/latex/styles/preview.pdf "${{targets.contextdir}}/usr/share/doc/preview-latex-style/"
update:
  enabled: true
  git:
    strip-prefix: release_
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -x /usr/bin/update-auctex-elisp
        test -f /usr/share/licenses/auctex/COPYING
