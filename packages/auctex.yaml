# auctex 13.2-1.1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/auctex
# Debian packaging: https://salsa.debian.org/salve/auctex
#
# Conversion notes:
# - runtime dependency 'emacsen-common' (Debian 'emacsen-common') not found in Wolfi; left out
# - build dependency 'eperl' (Debian 'eperl') not found in Wolfi; left out
# - no tag of 13.2 in https://git.savannah.gnu.org/git/@PACKAGE@.git
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/a/auctex/auctex_13.2.orig.tar.xz), which disappears from the pool when Debian updates
# - dh --with tex has no direct melange equivalent; review
package:
  name: auctex
  version: '13.2'
  epoch: 0
  description: Integrated document editing environment for TeX etc.
  copyright:
    - license: GPL-3.0-or-later
    - license: GFDL-NIV-1.3
      paths:
        - doc/auctex.texi
        - doc/changes.texi
        - doc/copying.texi
        - doc/faq.texi
        - doc/fdl.texi
        - doc/history.texi
        - doc/install.texi
        - doc/macros.texi
        - doc/preview-faq.texi
        - doc/preview-latex.texi
        - doc/preview-problems.texi
        - doc/preview-readme.texi
        - doc/preview-todo.texi
        - doc/quickstart.texi
        - doc/todo.texi
        - doc/wininstall.texi
    - license: permissive
      paths:
        - doc/intro.texi
    - license: preserve-notice
      paths:
        - doc/tex-ref.tex
    - license: MIT
      paths:
        - install-sh
    - license: publicdomain
      paths:
        - mkinstalldirs
    - license: tobeclarified
      paths:
        - style/j-article.el
        - style/j-book.el
        - style/j-report.el
        - style/jarticle.el
        - style/jbook.el
        - style/jreport.el
        - style/jsarticle.el
        - style/jsbook.el
        - style/report.el
    - license: tobeclarified
      paths:
        - style/amsbsy.el
        - style/amstext.el
    - license: tobeclarified
      paths:
        - style/amsbook.el
        - style/article.el
        - style/book.el
        - style/czech.el
        - style/danish.el
        - style/english.el
        - style/german.el
        - style/graphics.el
        - style/ngerman.el
        - style/slovak.el
        - style/swedish.el
    - license: tobeclarified
      paths:
        - style/dk.el
        - style/dutch.el
        - style/plfonts.el
        - style/plhb.el
        - style/virtex.el
  dependencies:
    runtime:
      - emacs
      # TODO(debian-to-melange): emacsen-common is not in Wolfi (Debian: emacsen-common); left out
      - preview-latex-style
      - procps
      # Debian Recommends (not supported by apk): ghostscript, texlive-latex-recommended, xpdf
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - emacs
      # TODO(debian-to-melange): eperl is not in Wolfi (Debian: eperl); left out
      - ghostscript
      - tex-common  # Wolfi Community Packages
      - texlive  # the TeX programs, which Debian's texlive-latex-base brings
      - texmf-dist-latex  # Wolfi Community Packages (Debian: texlive-latex-base)
      - texmf-dist-latexrecommended  # Wolfi Community Packages (Debian: texlive-latex-recommended)
      - texmf-dist-binextra  # Wolfi Community Packages (Debian: texlive-extra-utils)
      - texinfo
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-doc-Makefile.in-Rationalize-HTML-documentation-targe.patch 0002-doc-Makefile.in-Rationalize-dist-target.patch 0003-TeX-view-program-selection-Customize-for-Debian.patch 0004-TeX-auto-global-Customize-for-Debian.patch 0005-preview-image-type-Customize-for-Debian.patch 0006-Use-UTF-8.patch 0007-Set-timestamp-on-generated-preview-latex.el-file.patch changelog; do mv auctex/$f .recipe-files/; done
      rmdir auctex 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/a/auctex/auctex_${{package.version}}.orig.tar.xz
      expected-sha256: 0332fd9084329c0c5f8b4853b7f870a11bd853fd6d615726f1c90d06175519bf
  - name: TeX Live set up (the install triggers of texmf-dist and texlive)
    runs: |
      d=/usr/share/texmf-dist/tex/generic/config
      if [ -d $d/lang.d ]; then
        for ext in def dat dat.lua; do cat $(find $d/lang.d -name "*.$ext" | sort) > $d/language.$ext; done
      fi
      mktexlsr >/dev/null 2>&1 || true
      # updmap.cfg lists the maps of every collection: leave out those not installed
      yes 2>/dev/null | updmap-sys --syncwithtrees >/dev/null 2>&1 || true
      updmap-sys >/dev/null 2>&1 || true
      fmtutil-sys --all >/dev/null 2>&1 || true
  - uses: patch
    with:
      patches: .recipe-files/0001-doc-Makefile.in-Rationalize-HTML-documentation-targe.patch .recipe-files/0002-doc-Makefile.in-Rationalize-dist-target.patch .recipe-files/0003-TeX-view-program-selection-Customize-for-Debian.patch .recipe-files/0004-TeX-auto-global-Customize-for-Debian.patch .recipe-files/0005-preview-image-type-Customize-for-Debian.patch .recipe-files/0006-Use-UTF-8.patch .recipe-files/0007-Set-timestamp-on-generated-preview-latex.el-file.patch
  - runs: |
      autoreconf -fi
  - uses: autoconf/configure
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      chmod -R a+rX debian/
      chmod a+x debian/elcc
      make ELCC=$(pwd)/debian/elcc
      rm --force auto-loads.el
      touch --reference .recipe-files/changelog tex.el tex-site.el
      make auto-loads.el
      make tex-site.el
      (cd doc && make auctex.htmls/index.html)
      (cd doc && make preview-latex.htmls/index.html)
  - name: From debian/rules override_dh_install
    runs: |
      find ${{targets.destdir}}/usr/share/emacs/site-lisp -type f -name \*.elc  		-print0 | xargs --null --no-run-if-empty rm -f
      mv --verbose ${{targets.destdir}}/usr/share/emacs/site-lisp/auctex  		${{targets.destdir}}/usr/share/
  - name: Install files
    runs: |
      install -Dm644 debian/update-auctex-elisp.8 -t "${{targets.destdir}}/usr/share/man/man8"
      mkdir -p "${{targets.destdir}}/var/lib/auctex"
      mkdir -p "${{targets.destdir}}/usr/share/auctex"
      mkdir -p "${{targets.destdir}}/usr/share/doc/auctex"
      cp -a CHANGES "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a FAQ "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a README "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a RELEASE "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a PROBLEMS.preview "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a TODO "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a ChangeLog-preview* "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a circ.tex "${{targets.destdir}}/usr/share/doc/auctex/"
      cp -a "${{targets.destdir}}/usr/share/doc/auctex/tex-ref.pdf" "${{targets.destdir}}/usr/share/doc/auctex/"
      for f in "${{targets.destdir}}"/usr/doc/auctex/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/auctex/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/auctex/*
      rmdir "${{targets.destdir}}/usr/doc/auctex" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/auctex
  - name: From debian/rules override_dh_installdocs
    runs: |
      install -m 755 -d ${{targets.destdir}}/usr/doc/auctex/src
      mkdir -p ${{targets.destdir}}/usr/doc/auctex
      install -m 644 doc/*.tex{,i} ${{targets.destdir}}/usr/doc/auctex/src
      install -m 644 etc/auctex-logo.tex ${{targets.destdir}}/usr/doc/auctex/src
      install -m 755 -d  		${{targets.destdir}}/usr/doc/auctex/HTML/{auctex,preview-latex}
      mkdir -p ${{targets.destdir}}/usr/doc/auctex/HTML
      install -m 644 doc/auctex.htmls/*  		${{targets.destdir}}/usr/doc/auctex/HTML/auctex
      install -m 644 doc/preview-latex.htmls/*  		${{targets.destdir}}/usr/doc/auctex/HTML/preview-latex
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: preview-latex-style
    description: Extraction of elements from LaTeX documents as graphics
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/texmf/tex/latex"
          mv "${{targets.destdir}}/usr/share/texmf/tex/latex/preview" "${{targets.contextdir}}/usr/share/texmf/tex/latex/"
          mkdir -p "${{targets.contextdir}}/usr/share/texmf/doc/latex/preview"
          ln -sf /usr/share/doc/preview-latex-style/preview.pdf "${{targets.contextdir}}/usr/share/texmf/doc/latex/preview/preview.pdf"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/preview-latex-style"
          cp -a latex/README "${{targets.contextdir}}/usr/share/doc/preview-latex-style/"
          cp -a "${{targets.destdir}}/usr/share/texmf/doc/latex/styles/preview.pdf" "${{targets.contextdir}}/usr/share/doc/preview-latex-style/"
update:
  enabled: true
  release-monitor:
    identifier: 676
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -x /usr/bin/update-auctex-elisp
        test -f /usr/share/licenses/auctex/COPYING
