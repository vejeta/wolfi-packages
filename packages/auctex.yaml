#
# Conversion notes:
# - runtime dependency 'emacsen-common' (Debian 'emacsen-common') not found in Wolfi; left out
# - build dependency 'eperl' (Debian 'eperl') not found in Wolfi; left out
# - build dependency 'tex-common' (Debian 'tex-common') not found in Wolfi; left out
# - build dependency 'texlive-latex-base' (Debian 'texlive-latex-base') not found in Wolfi; left out
# - build dependency 'texlive-latex-recommended' (Debian 'texlive-latex-recommended') not found in Wolfi; left out
