package:
  name: xapian-core
  version: '2.0.0'
  epoch: 0
  description: Open source search engine library
  copyright:
    - license: GPL-2.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - zlib-dev
      - util-linux-dev
      - libtool
      - zlib
      - util-linux
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv xapian-core/* .recipe-files/
      rmdir xapian-core
  - uses: fetch
    with:
      uri: https://oligarchy.co.uk/xapian/${{package.version}}/xapian-core-${{package.version}}.tar.xz
      expected-sha512: b9205997ca05748b3dae1b669f428bc04c6a5bda41dcae1443869741e1bd6c245e0e433c8c4afef021299a699fc4e4ed6ae82aae8541db613aa570a003afea43
  - uses: patch
    with:
      patches: .recipe-files/timeval-t.patch
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--localstatedir=/var
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: xapian-core-dev
    description: Open source search engine library (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: xapian-core-doc
    description: Open source search engine library (doc)
    pipeline:
      - uses: split/alldocs
  - name: libxapian
    description: Xapian search engine library
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"

          install -d "$subpkgdir"/usr/lib
          mv "$pkgdir"/usr/lib/$subpkgname* "$subpkgdir"/usr/lib
update:
  enabled: true
  release-monitor:
    identifier: 15919
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
