package:
  name: perl-ipc-run
  version: '20260402.0'
  epoch: 0
  description: System() and background procs w/ piping, redirs, ptys (Unix, Win32)
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-io-tty  # TODO(alpine-to-melange): not in Wolfi
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-io-tty  # TODO(alpine-to-melange): not in Wolfi
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/T/TO/TODDR/IPC-Run-${{package.version}}.tar.gz
      expected-sha512: 0954ac1c6fc8cc51647e01518d7bc87d4060de352b86d915a63036494088bb5558775d79e2093dd2809c2e8b43a74d5e253c88b4d1ae9820766abcf74ad17d55
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
