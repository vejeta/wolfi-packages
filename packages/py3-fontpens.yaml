# Generated by debian-to-melange 0.1.0 from Debian source package
# fontpens 0.4.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fontpens
# Debian packaging: https://salsa.debian.org/fonts-team/fontpens
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: fonttools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-fontpens for Python 3.11, 3.12, 3.13
package:
  name: py3-fontpens
  version: '0.4.0'
  epoch: 0
  description: Classes implementing Pen protocol for manipulating UFO glyphs
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
vars:
  pypi-package: fontpens
  import: fontPens
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-hatch-vcs  # Debian: python3-hatch-vcs
      - py3-supported-hatchling  # Debian: python3-hatchling
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: '0.4.0'
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in Circumvent-doctest-failure-due-to-float-digits.patch; do mv py3-fontpens/$f .recipe-files/; done
      rmdir py3-fontpens 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/robotools/fontPens
      tag: v${{package.version}}
      expected-commit: 0d41a72d59965f89919053425d8fbe096f465f52
  - uses: patch
    with:
      patches: .recipe-files/Circumvent-doctest-failure-due-to-float-digits.patch
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-fonttools
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE.txt -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: robotools/fontPens
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-fontpens
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
