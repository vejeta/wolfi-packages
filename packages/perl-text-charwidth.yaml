package:
  name: perl-text-charwidth
  version: '0.04'
  epoch: 0
  description: Get display widths of characters on the terminal
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev  # Debian: perl-xs-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv perl-text-charwidth/$f .recipe-files/; done
      rmdir perl-text-charwidth 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/K/KU/KUBOTA/Text-CharWidth-${{package.version}}.tar.gz
      expected-sha256: abded5f4fdd9338e89fd2f1d8271c44989dae5bf50aece41b6179d8e230704f8
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-text-charwidth"
      cp -a README "${{targets.destdir}}/usr/share/doc/perl-text-charwidth/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-text-charwidth/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 14380
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-text-charwidth/copyright
    - uses: test/tw/ldd-check
    - name: Load the module
      runs: |
        perl -MText::CharWidth -e1
