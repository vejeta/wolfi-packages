# Debian packaging: https://salsa.debian.org/ocaml-team/tyxml
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
# - no debian/libtyxml-ocaml.install; define which files go to this subpackage
package:
  name: libtyxml-ocaml-dev
  version: '4.6.0'
  epoch: 0
  description: Typed XML in OCaml (development files)
  copyright:
    - license: LGPL-2.1+-exc
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libstdlib-ocaml-dev  # Wolfi Community Packages (Debian: libuchar-ocaml-dev)
      - libuutf-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - ocaml
      - ocaml-dune
      - libalcotest-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocsigen/tyxml
      tag: ${{package.version}}
      expected-commit: d2916535536f2134bad7793a598ba5b7327cae41
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libtyxml-ocaml-dev"
      cp -a usr/doc/tyxml/* "${{targets.destdir}}/usr/share/doc/libtyxml-ocaml-dev/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/tyxml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libtyxml-ocaml
    description: Typed XML in OCaml (plugins)
    pipeline:
      # TODO(debian-to-melange): no debian/libtyxml-ocaml.install; define which files go to this subpackage
      - runs: |
          true
  - name: libtyxml-ocaml-doc
    description: Typed XML in OCaml (documentation)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc"
          ln -sf /usr/share/doc/libtyxml-ocaml-dev/api "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/api"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/examples"
          cp -a examples/* "${{targets.contextdir}}/usr/share/doc/libtyxml-ocaml-doc/examples/"
update:
  enabled: true
  github:
    identifier: ocsigen/tyxml
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/tyxml/LICENSE
    - uses: test/tw/ldd-check
