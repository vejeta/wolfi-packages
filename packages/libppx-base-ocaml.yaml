# Generated by debian-to-melange 0.1.0 from Debian source package
# ppx-base 0.17.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ppx-base
# Debian packaging: https://salsa.debian.org/ocaml-team/ppx-base
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-base-ocaml
  version: '0.17.0'
  epoch: 0
  description: Base set of ppx rewriters (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - help2man
      - libppx-cold-ocaml-dev  # Wolfi Community Packages
      - libppx-compare-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      - libppx-globalize-ocaml-dev  # Wolfi Community Packages
      - libppx-hash-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_base
      tag: v${{package.version}}
      expected-commit: 386bd84d7363895ea27ed3b92e6f497fa77c7af2
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_base -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_base
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-base-ocaml
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      find ${{targets.destdir}}/ -name LICENSE.md -delete
      mkdir -p debian
      help2man ${{targets.destdir}}/usr/bin/ppx-base --no-discard-stderr > debian/ppx-base.1
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-base-ocaml-dev
    description: Base set of ppx rewriters (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/ppx-base" "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_base"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*opam*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*dune*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_base/ppx.exe" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.cmi; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.cmt*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.ml; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.a; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.cmx; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/ppx_base/*.cmxa; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/ppx_base/"
          done
          true
          install -Dm644 debian/ppx-base.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    dependencies:
      runtime:
        - libppxlib-ocaml-dev  # Wolfi Community Packages
        - libppx-cold-ocaml-dev  # Wolfi Community Packages
        - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
        - libppx-compare-ocaml-dev  # Wolfi Community Packages
        - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
        - libppx-globalize-ocaml-dev  # Wolfi Community Packages
        - libppx-hash-ocaml-dev  # Wolfi Community Packages
        - libppx-base-ocaml  # Debian: ${ocaml:Depends}
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            ppx-base --version || (ppx-base --help 2>&1 || true) | grep -qi -e usage -e ppx-base
        - uses: test/tw/ldd-check
update:
  enabled: true
  github:
    identifier: janestreet/ppx_base
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-base-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
