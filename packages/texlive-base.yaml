package:
  name: texlive-base
  version: '2026.20260911'
  epoch: 0
  description: 'TeX Live: Essential programs and files'
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - libpaper  # Debian: libpaper-utils
      - tex-common  # Wolfi Community Packages
      - texlive  # Debian: texlive-binaries
      - xdg-utils
      # Debian Recommends (not supported by apk): lmodern
      - util-linux-misc  # used by the shell scripts; Essential in Debian
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - sharutils  # Wolfi Community Packages
      - tex-common  # Wolfi Community Packages
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright debian-fix-quote-in-quote debian-tlmgr-usermode_1 debian-tlmgr-usermode_2 debian-updmap-man debian_updmap-search-path dvipdfmx-config-paper-factorization dvips-config-paper-factorization fix-info-dir-sections fix-natbib-add-spaces fix-pgf2pdf-script fix-scripts fmtutil.1.diff mptopdf-manpage-fixes python3-shebang texdoc-see-and-zip texdoctk-colors texmf.cnf-debian xdvi-config-paper-factorization xypic-no-privacy-breach; do mv texlive-base/$f .recipe-files/; done
      rmdir texlive-base 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/t/texlive-base/texlive-base_${{package.version}}.orig.tar.xz
      expected-sha256: 13498bbba54946448bb5e6cd1994d42ecce8b9bbc40f6edbecda343d05d2262b
  - uses: patch
    with:
      patches: .recipe-files/fix-info-dir-sections .recipe-files/fix-pgf2pdf-script .recipe-files/texmf.cnf-debian .recipe-files/fix-scripts .recipe-files/dvips-config-paper-factorization .recipe-files/dvipdfmx-config-paper-factorization .recipe-files/xdvi-config-paper-factorization .recipe-files/debian_updmap-search-path .recipe-files/debian-updmap-man .recipe-files/texdoc-see-and-zip .recipe-files/fix-natbib-add-spaces .recipe-files/debian-tlmgr-usermode_1 .recipe-files/debian-tlmgr-usermode_2 .recipe-files/mptopdf-manpage-fixes .recipe-files/texdoctk-colors .recipe-files/xypic-no-privacy-breach .recipe-files/python3-shebang .recipe-files/debian-fix-quote-in-quote .recipe-files/fmtutil.1.diff
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/etc/texmf/dvips/config"
      mkdir -p "${{targets.destdir}}/etc/texmf/tex/generic/config"
      mkdir -p "${{targets.destdir}}/etc/texmf/dvipdfmx"
      mkdir -p "${{targets.destdir}}/etc/libpaper.d"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/texlive-base/copyright
