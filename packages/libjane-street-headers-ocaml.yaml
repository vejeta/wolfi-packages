# Debian packaging: https://salsa.debian.org/ocaml-team/jane-street-headers
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libjane-street-headers-ocaml
  version: '0.17.0'
  epoch: 0
  description: Common header files for Jane Street packages (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/jane-street-headers
      tag: v${{package.version}}
      expected-commit: 7c166660dd6470e28a64cb4c453fd8b791c02724
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p jane-street-headers -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" jane-street-headers
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libjane-street-headers-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libjane-street-headers-ocaml-dev
    description: Common header files for Jane Street projects (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers"
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*opam*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*dune*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.cmi; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.cmt*; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.ml; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.h; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.a; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.cmx; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          for f in "${{targets.destdir}}"/usr/lib/ocaml/jane-street-headers/*.cmxa; do
            [ -e "$f" ] && mv "$f" "${{targets.contextdir}}/usr/lib/ocaml/jane-street-headers/"
          done
          true
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libjane-street-headers-ocaml-dev"
          for f in "${{targets.destdir}}"/usr/doc/jane-street-headers/*; do cp -a "$f" "${{targets.contextdir}}/usr/share/doc/libjane-street-headers-ocaml-dev/"; done
          rm -rf "${{targets.destdir}}"/usr/doc/jane-street-headers/*
          rmdir "${{targets.destdir}}/usr/doc/jane-street-headers" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
    dependencies:
      runtime:
        - libjane-street-headers-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: janestreet/jane-street-headers
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libjane-street-headers-ocaml/LICENSE.md
    - uses: test/tw/ldd-check
