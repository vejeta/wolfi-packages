package:
  name: perl-text-iconv
  version: '1.7'
  epoch: 0
  description: Module to convert between character sets in Perl
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev  # Debian: perl-xs-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright hurd; do mv perl-text-iconv/$f .recipe-files/; done
      rmdir perl-text-iconv 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/M/MP/MPIOTR/Text-Iconv-${{package.version}}.tar.gz
      expected-sha256: 5b80b7d5e709d34393bcba88971864a17b44a5bf0f9e4bcee383d029e7d2d5c3
  - uses: patch
    with:
      patches: .recipe-files/hurd
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-text-iconv/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 3439
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-text-iconv/copyright
    - uses: test/tw/ldd-check
    - name: Load the module
      runs: |
        perl -MText::Iconv -e1
