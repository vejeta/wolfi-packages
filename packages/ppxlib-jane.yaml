package:
  name: libppxlib-jane-ocaml-dev
  version: '0.17.4'
  epoch: 0
  description: Utilities to work on AST of the Jane Street OCaml compiler (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppxlib_jane
      tag: v${{package.version}}
      expected-commit: 7614fc7d9bef1b69a74c417c3df5eb3a9ed61719
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppxlib-jane-ocaml-dev"
      cp -a usr/doc/ppxlib_jane/* "${{targets.destdir}}/usr/share/doc/libppxlib-jane-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppxlib-jane
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppxlib-jane-ocaml
    description: Utilities to work on AST of the Jane Street OCaml compiler (runtime)
    pipeline:
      # TODO(debian-to-melange): no debian/libppxlib-jane-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: janestreet/ppxlib_jane
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppxlib-jane/LICENSE.md
    - uses: test/tw/ldd-check
