# fonts-sil-charis 7.000-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-sil-charis
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-sil-charis
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-sil-charis
  version: '7.000'
  epoch: 0
  description: Font family for wide range of languages that use the Latin and Cyrillic scripts
  copyright:
    - license: OFL-1.1-RFN
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-charis/$f .recipe-files/; done
      rmdir fonts-sil-charis 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/silnrsi/font-charis
      tag: v${{package.version}}
      expected-commit: 5382abf45c42bc51d338ac8e9c30d080bc46831a
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/web"
      ln -sf /usr/share/fonts-sil-charis/woff2/CharisSIL-Regular.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/web/CharisSIL-Regular.woff2"
      ln -sf /usr/share/fonts-sil-charis/woff2/CharisSIL-Italic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/web/CharisSIL-Italic.woff2"
      ln -sf /usr/share/fonts-sil-charis/woff2/CharisSIL-Bold.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/web/CharisSIL-Bold.woff2"
      ln -sf /usr/share/fonts-sil-charis/woff2/CharisSIL-BoldItalic.woff2 "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/web/CharisSIL-BoldItalic.woff2"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-charis"
      cp -a README.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/"
      cp -a documentation/ "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/"
      cp -a web/ "${{targets.destdir}}/usr/share/doc/fonts-sil-charis/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-charis/copyright
update:
  enabled: true
  github:
    identifier: silnrsi/font-charis
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-charis/copyright
