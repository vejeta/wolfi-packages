package:
  name: libbase64-ocaml-dev
  version: '3.5.2'
  epoch: 0
  description: Base64 encoding and decoding OCaml library (dev files)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      # TODO(debian-to-melange): libdune-ocaml-dev is not in Wolfi (Debian: libdune-ocaml-dev); left out
      # TODO(debian-to-melange): libbos-ocaml-dev is not in Wolfi (Debian: libbos-ocaml-dev); left out
      # TODO(debian-to-melange): libalcotest-ocaml-dev is not in Wolfi (Debian: libalcotest-ocaml-dev); left out
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/ocaml-base64
      tag: v${{package.version}}
      expected-commit: edc588cb89f699e17ea13494898cca4bd7d46b8b
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libbase64-ocaml-dev"
      cp -a usr/doc/base64/* "${{targets.destdir}}/usr/share/doc/libbase64-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-base64
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libbase64-ocaml
    description: Base64 encoding and decoding OCaml library (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libbase64-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: mirage/ocaml-base64
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-base64/LICENSE.md
    - uses: test/tw/ldd-check
