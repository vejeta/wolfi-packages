#
# Conversion notes:
# - license GPL-2.0-or-later read from the notice in debian/copyright (not DEP-5); check it
# - maintainer scripts converted; note that apko does not run install scripts
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/d/docbook5-xml/docbook5-xml_5.0.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: docbook5-xml
  version: '5.0'
  epoch: 0
  description: Standard XML documentation system for software and systems
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - libxml2-utils  # used by the maintainer scripts
  scriptlets:
    post-install: |
      #!/bin/sh
      # debian/docbook5-xml.xmlcatalogs (dh_installxmlcatalogs)
      [ -f /etc/xml/catalog ] || xmlcatalog --noout --create /etc/xml/catalog
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5.0//EN' /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5//EN' /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://docbook.org/xml/5.0/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://www.oasis-open.org/docbook/xml/5.0/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --add delegateSystem http://www.oasis-open.org/docbook/xml/5.0/ file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://docbook.org/xml/5.0/ file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegatePublic '-//OASIS//DTD DocBook XML 5//EN' file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegatePublic '-//OASIS//DTD DocBook XML 5.0//EN' file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      true
    post-upgrade: |
      #!/bin/sh
      # debian/docbook5-xml.xmlcatalogs (dh_installxmlcatalogs)
      [ -f /etc/xml/catalog ] || xmlcatalog --noout --create /etc/xml/catalog
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5.0//EN' /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5//EN' /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://docbook.org/xml/5.0/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://www.oasis-open.org/docbook/xml/5.0/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --add delegateSystem http://www.oasis-open.org/docbook/xml/5.0/ file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://docbook.org/xml/5.0/ file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegatePublic '-//OASIS//DTD DocBook XML 5//EN' file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      xmlcatalog --noout --add delegatePublic '-//OASIS//DTD DocBook XML 5.0//EN' file:///usr/share/xml/docbook/schema/catalog-docbook5.xml /etc/xml/catalog
      true
    pre-deinstall: |
      #!/bin/sh
      # debian/docbook5-xml.xmlcatalogs (dh_installxmlcatalogs)
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5.0//EN' /etc/xml/catalog 2>/dev/null || true
      xmlcatalog --noout --del '-//OASIS//DTD DocBook XML 5//EN' /etc/xml/catalog 2>/dev/null || true
      xmlcatalog --noout --del http://docbook.org/xml/5.0/ /etc/xml/catalog 2>/dev/null || true
      xmlcatalog --noout --del http://www.oasis-open.org/docbook/xml/5.0/ /etc/xml/catalog 2>/dev/null || true
      true
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - libxml2-utils  # Debian: xml-core
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright debian-catalog.xml; do mv docbook5-xml/$f .recipe-files/; done
      rmdir docbook5-xml 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/docbook5-xml/docbook5-xml_${{package.version}}.orig.tar.gz
      expected-sha256: 65b59448bb319ad39535b82856bb08959ea5d52588ac21fd0f45b7d45c5491a6
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/schema/dtd/5.0"
      cp -a docbook-5.0/dtd/* "${{targets.destdir}}/usr/share/xml/docbook/schema/dtd/5.0/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/schema/rng/5.0"
      cp -a docbook-5.0/rng/* "${{targets.destdir}}/usr/share/xml/docbook/schema/rng/5.0/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/schema/schematron/5.0"
      cp -a docbook-5.0/sch/* "${{targets.destdir}}/usr/share/xml/docbook/schema/schematron/5.0/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/schema/xsd/5.0"
      cp -a docbook-5.0/xsd/* "${{targets.destdir}}/usr/share/xml/docbook/schema/xsd/5.0/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook5"
      cp -a docbook-5.0/tools/db4-upgrade.xsl "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook5/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/docbook5-xml/examples"
      cp -a docbook-5.0/docbook.nvdl "${{targets.destdir}}/usr/share/doc/docbook5-xml/examples/"
      install -Dm644 .recipe-files/debian-catalog.xml "${{targets.destdir}}/usr/share/xml/docbook/schema/catalog-docbook5.xml"
      mkdir -p "${{targets.destdir}}/usr/share/doc/docbook5-xml"
      cp -a docbook-5.0/docs "${{targets.destdir}}/usr/share/doc/docbook5-xml/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/docbook5-xml/copyright
  - name: From debian/rules execute_after_dh_link
    runs: |
      find ${{targets.destdir}}/ -type l -follow >/dev/null # exits 1 on broken links
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/docbook5-xml/copyright
