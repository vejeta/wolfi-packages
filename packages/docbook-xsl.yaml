update:
  enabled: true
  release-monitor:
    identifier: 13115
test:
  environment:
    contents:
      packages:
        - busybox
        - docbook-xsl-ns  # Debian's @: the binary packages of the source
        - groff-base  # Debian: groff-base
        - groff  # Debian: groff-base
        - libxslt  # Debian: xsltproc
        - libxml2-utils
        - docbook-xml
        - docbook5-xml  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/doc/docbook-xsl/copyright
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/d/docbook-xsl/docbook-xsl_${{package.version}}+dfsg.orig.tar.bz2
        expected-sha256: f453bac2ab3dc1709226864db2fa0119b94622840dcefa9b3e543c5dca90173d
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/d/docbook-xsl/docbook-xsl_1.79.2+dfsg-8.debian.tar.xz
        strip-components: 0
        expected-sha256: 6e27e2530be177ee3cd5a88ec457273e0a4cd61f73e34fdf7efe6442babdda55
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl xsltproc=libxslt' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/docbook-xsl.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/docbook-xsl.templates" && break
        done
    - name: 'autopkgtest: test-manpage'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        testdir=""$PWD/debian/tests""
        cd "$testdir"

        xsltproc  \
            --output "$AUTOPKGTEST_TMP"/refentry.1 \
            /usr/share/xml/docbook/stylesheet/docbook-xsl/manpages/docbook.xsl \
            refentry.xml 2>&1

        nroff -man "$AUTOPKGTEST_TMP"/refentry.1  > "$AUTOPKGTEST_TMP"/refentry.txt
    - name: 'autopkgtest: test-book-fop'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        testdir=""$PWD/debian/tests""
        cd "$testdir"

        xsltproc  \
            --output "$AUTOPKGTEST_TMP"/book-fop.xml \
            /usr/share/xml/docbook/stylesheet/docbook-xsl/fo/docbook.xsl \
            book.xml 2>&1

        xmllint --format "$AUTOPKGTEST_TMP"/book-fop.xml > "$AUTOPKGTEST_TMP"/book-fop-pretty.xml
