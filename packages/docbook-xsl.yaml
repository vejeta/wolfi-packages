# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/d/docbook-xsl/docbook-xsl_1.79.2+dfsg.orig.tar.bz2), which disappears from the pool when Debian updates
# - autopkgtests converted to the test pipeline (2 steps)
package:
  name: docbook-xsl
  version: '1.79.2'
  epoch: 0
  description: Stylesheets for processing DocBook XML to various output formats
  copyright:
    - license: DMIT
    - license: Zlib
      paths:
        - 'docbook-xsl*/highlighting/*'
    - license: LicenseRef-public-domain
      paths:
        - 'docbook-xsl*/slides/s5/ui/default/slides.js'
    - license: MPL-1.1
      paths:
        - 'docbook-xsl*/params/xbLibrary.js.xml'
        - 'docbook-xsl*/params/xbStyle.js.xml'
        - 'docbook-xsl*/params/ua.js.xml'
        - 'docbook-xsl*/params/xbDOM.js.xml'
  dependencies:
    runtime:
      - libxml2-utils  # used by the maintainer scripts
      # Debian Recommends (not supported by apk): docbook-xml
  scriptlets:
    post-install: |
      #!/bin/sh
      # debian/docbook-xsl.xmlcatalogs (dh_installxmlcatalogs)
      [ -f /etc/xml/catalog ] || xmlcatalog --noout --create /etc/xml/catalog
      xmlcatalog --noout --del http://cdn.docbook.org/release/xsl-nons/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://docbook.sourceforge.net/release/xsl/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --add delegateURI http://cdn.docbook.org/release/xsl-nons/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://cdn.docbook.org/release/xsl-nons/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateURI http://docbook.sourceforge.net/release/xsl/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://docbook.sourceforge.net/release/xsl/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      true
    post-upgrade: |
      #!/bin/sh
      # debian/docbook-xsl.xmlcatalogs (dh_installxmlcatalogs)
      [ -f /etc/xml/catalog ] || xmlcatalog --noout --create /etc/xml/catalog
      xmlcatalog --noout --del http://cdn.docbook.org/release/xsl-nons/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --del http://docbook.sourceforge.net/release/xsl/ /etc/xml/catalog 2>/dev/null
      xmlcatalog --noout --add delegateURI http://cdn.docbook.org/release/xsl-nons/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://cdn.docbook.org/release/xsl-nons/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateURI http://docbook.sourceforge.net/release/xsl/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      xmlcatalog --noout --add delegateSystem http://docbook.sourceforge.net/release/xsl/ file:///usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml /etc/xml/catalog
      true
    pre-deinstall: |
      #!/bin/sh
      # debian/docbook-xsl.xmlcatalogs (dh_installxmlcatalogs)
      xmlcatalog --noout --del http://cdn.docbook.org/release/xsl-nons/ /etc/xml/catalog 2>/dev/null || true
      xmlcatalog --noout --del http://docbook.sourceforge.net/release/xsl/ /etc/xml/catalog 2>/dev/null || true
      true
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - docbook-xml
      - docbook5-xml  # Wolfi Community Packages
      - libxml2-utils
      - bash  # the source has bash scripts; Essential in Debian
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0005-catalog.xml-Compatibility-with-1.79.1-or-earlier.patch 1000-locale-nb-typos.patch 1010-no-exec-data.patch 638570_lang_russian.patch 681116_multiarch_manpage_template.patch 765567_non-recursive_string_subst.patch 831831_docbook-xsl-mandir.patch copyright examples_docbook-xsl-ns_foo.1.example_manpage.xml examples_docbook-xsl_foo.1.example_manpage.xml; do mv docbook-xsl/$f .recipe-files/; done
      rmdir docbook-xsl 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/docbook-xsl/docbook-xsl_${{package.version}}+dfsg.orig.tar.bz2
      expected-sha256: f453bac2ab3dc1709226864db2fa0119b94622840dcefa9b3e543c5dca90173d
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf docbook-xsl/tools/lib/*.jar docbook-xsl/tools/lib/xalan/*.jar docbook-xsl-ns/tools/lib/*.jar docbook-xsl-ns/tools/lib/xalan/*.jar
  - uses: patch
    with:
      patches: .recipe-files/638570_lang_russian.patch .recipe-files/681116_multiarch_manpage_template.patch .recipe-files/831831_docbook-xsl-mandir.patch .recipe-files/765567_non-recursive_string_subst.patch .recipe-files/0005-catalog.xml-Compatibility-with-1.79.1-or-earlier.patch .recipe-files/1000-locale-nb-typos.patch .recipe-files/1010-no-exec-data.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl"
      cp -a docbook-xsl/VERSION* "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/assembly "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/common "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/eclipse "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/epub"
      cp -a docbook-xsl/epub/*.xsl "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/epub/"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/epub3"
      cp -a docbook-xsl/epub3/*.* "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/epub3/"
      cp -a docbook-xsl/fo "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/highlighting "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/html "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/htmlhelp "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/images "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/javahelp "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/lib "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/manpages "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/profiling "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/roundtrip "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/slides "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/template "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/website "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      cp -a docbook-xsl/xhtml* "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/"
      find "${{targets.destdir}}" -path "*README*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*param.xml*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*pi.xml*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*table.xml*" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*ChangeLog**" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*.param.**" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*.lib.**" -prune -exec rm -rf {} +
      find "${{targets.destdir}}" -path "*.gitignore*" -prune -exec rm -rf {} +
      mkdir -p "${{targets.destdir}}/usr/share/sgml/docbook/stylesheet/xsl"
      mkdir -p "${{targets.destdir}}/usr/share/xml/docbook/stylesheet"
      ln -sf /usr/share/xml/docbook/stylesheet/docbook-xsl "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/nwalsh"
      ln -sf /usr/share/xml/docbook/stylesheet/docbook-xsl "${{targets.destdir}}/usr/share/sgml/docbook/stylesheet/xsl/nwalsh"
      ln -sf /usr/share/xml/docbook/stylesheet/docbook-xsl "${{targets.destdir}}/usr/share/sgml/docbook/stylesheet/xsl/docbook-xsl"
      ln -sf /usr/share/xml/docbook/stylesheet/docbook-xsl "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl-nons"
      install -Dm644 .recipe-files/examples_docbook-xsl_foo.1.example_manpage.xml "${{targets.destdir}}/usr/share/doc/docbook-xsl/examples/foo.1.example_manpage.xml"
      install -Dm644 docbook-xsl/catalog.xml "${{targets.destdir}}/usr/share/xml/docbook/stylesheet/docbook-xsl/catalog.xml"
      mkdir -p "${{targets.destdir}}/usr/share/doc/docbook-xsl"
      cp -a docbook-xsl/BUGS "${{targets.destdir}}/usr/share/doc/docbook-xsl/"
      cp -a docbook-xsl/README "${{targets.destdir}}/usr/share/doc/docbook-xsl/"
      cp -a docbook-xsl/TODO "${{targets.destdir}}/usr/share/doc/docbook-xsl/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/docbook-xsl/copyright
  - name: From debian/rules execute_after_dh_installdocs
    runs: |
      mkdir -p ${{targets.outdir}}/docbook-xsl/usr/share/doc/docbook-xsl
      mkdir -p ${{targets.outdir}}/docbook-xsl-ns/usr/share/doc/docbook-xsl-ns
      for i in docbook-xsl docbook-xsl-ns; do                  files=`find ${i} -mindepth 2 -name README`;                  for j in ${files}; do                          verz=`echo ${j} | sed -e 's#.*/\([^/]*\)/README#\1#g'`;                          gzip -n9 -c ${j} > ${{targets.outdir}}/${i}/usr/share/doc/${i}/README.${verz}.gz;                  done;          done
