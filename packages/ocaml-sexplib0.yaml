package:
  name: libsexplib0-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: S-expression library (development)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/sexplib0
      tag: v${{package.version}}
      expected-commit: 787368c6c76dcbc002f151e8f4c0752a78552cac
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p sexplib0 -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" sexplib0
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libsexplib0-ocaml-dev"
      mv "${{targets.destdir}}/usr/doc/sexplib0/README.md" "${{targets.destdir}}/usr/share/doc/libsexplib0-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/sexplib0" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ocaml-sexplib0
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libsexplib0-ocaml
    description: S-expression library (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/sexplib0"
          mv "${{targets.destdir}}/usr/lib/ocaml/sexplib0/META" "${{targets.contextdir}}/usr/lib/ocaml/sexplib0/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/sexplib0/*.cma "${{targets.contextdir}}/usr/lib/ocaml/sexplib0/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/sexplib0/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/sexplib0/"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libsexplib0-ocaml"
          mv "${{targets.destdir}}"/usr/doc/sexplib0/* "${{targets.contextdir}}/usr/share/doc/libsexplib0-ocaml/"
          rmdir "${{targets.destdir}}/usr/doc/sexplib0" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
update:
  enabled: true
  github:
    identifier: janestreet/sexplib0
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ocaml-sexplib0/LICENSE.md
    - uses: test/tw/ldd-check
