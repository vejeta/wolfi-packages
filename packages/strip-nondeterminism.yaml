# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/s/strip-nondeterminism/strip-nondeterminism_1.15.1.orig.tar.bz2), which disappears from the pool when Debian updates
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: strip-nondeterminism
  version: '1.15.1'
  epoch: 0
  description: 'File non-deterministic information stripper — stand-alone tool'
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - perl-file-stripnondeterminism
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
      - perl-archive-zip  # Wolfi Community Packages (Debian: libarchive-zip-perl)
      - perl-devel-cover  # Debian: libdevel-cover-perl
      - bash  # the source has bash scripts; Essential in Debian
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/s/strip-nondeterminism/strip-nondeterminism_${{package.version}}.orig.tar.bz2
      expected-sha256: b8046b0faf182aff8de68abf8318d2b913637f4c23961cf61c47402af132a237
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/strip-nondeterminism
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: perl-file-stripnondeterminism
    description: 'File non-deterministic information stripper — Perl module'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/perl5/vendor_perl"
          mv "${{targets.destdir}}"/usr/share/perl5/vendor_perl/* "${{targets.contextdir}}/usr/share/perl5/vendor_perl/"
    dependencies:
      runtime:
        - file
        - perl-archive-zip  # Wolfi Community Packages (Debian: libarchive-zip-perl)
        - perl  # Debian: ${perl:Depends}
  - name: dh-strip-nondeterminism
    description: 'File non-deterministic information stripper — Debhelper add-on'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/dh_strip_nondeterminism" "${{targets.contextdir}}/usr/bin/"
          for f in "${{targets.destdir}}"/usr/share/man/man*/dh_strip_nondeterminism.*; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
    dependencies:
      runtime:
        - perl-debhelper  # Wolfi Community Packages (Debian: libdebhelper-perl)
        - perl-file-stripnondeterminism
        - perl  # Debian: ${perl:Depends}
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            dh_strip_nondeterminism --version || (dh_strip_nondeterminism --help 2>&1 || true) | grep -qi -e usage -e dh_strip_nondeterminism
update:
  enabled: true
  release-monitor:
    identifier: 375682
test:
  environment:
    contents:
      packages:
        - busybox
        - dh-strip-nondeterminism  # Debian's @: the binary packages of the source
        - perl-file-stripnondeterminism  # Debian's @: the binary packages of the source
        - perl-archive-cpio  # Wolfi Community Packages (Debian: libarchive-cpio-perl)
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - perl
  pipeline:
    - runs: |
        strip-nondeterminism --version || (strip-nondeterminism --help 2>&1 || true) | grep -qi -e usage -e strip-nondeterminism
        test -f /usr/share/licenses/strip-nondeterminism/COPYING
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/s/strip-nondeterminism/strip-nondeterminism_${{package.version}}.orig.tar.bz2
        expected-sha256: b8046b0faf182aff8de68abf8318d2b913637f4c23961cf61c47402af132a237
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/s/strip-nondeterminism/strip-nondeterminism_1.15.1-1.debian.tar.xz
        strip-components: 0
        expected-sha256: 8784684207fb7f13984460ba84f310876694f2bb3edee2bbd0165e63285a4afb
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libarchive-cpio-perl=perl-archive-cpio libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/strip-nondeterminism.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/strip-nondeterminism.templates" && break
        done
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'autopkgtest: testsuite'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        mkdir -p debian/tests
        cat > "debian/tests/testsuite" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/bash
        set -eu

        tmp="${AUTOPKGTEST_TMP:-$(mktemp -d)}"

        mkdir -p "$tmp"
        cp -rv t/ bin/ "$tmp"
        cd "$tmp"

        set +e
        ret=0
        for X in t/*.t; do
            perl -MExtUtils::Command::MM -MTest::Harness "$X" || ret=$?
        done

        if [ "$ret" -eq 0 ]; then
            echo "Tests succeeded"
        else
            echo "Tests failed" >&2
        fi

        exit $ret
        AUTOPKGTEST_SCRIPT
        chmod +x "debian/tests/testsuite"
        "$PWD/debian/tests/testsuite"
