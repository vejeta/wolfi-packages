package:
  name: libppx-base-ocaml
  version: '0.17.0'
  epoch: 0
  description: Base set of ppx rewriters (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - help2man
      # TODO(debian-to-melange): libppx-cold-ocaml-dev is not in Wolfi (Debian: libppx-cold-ocaml-dev); left out
      - libppx-compare-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libppx-globalize-ocaml-dev is not in Wolfi (Debian: libppx-globalize-ocaml-dev); left out
      - libppx-hash-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - ocaml-dune
      - ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_base
      tag: v${{package.version}}
      expected-commit: 386bd84d7363895ea27ed3b92e6f497fa77c7af2
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-base
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      find ${{targets.destdir}}/ -name LICENSE.md -delete
      mkdir -p debian
      help2man ${{targets.destdir}}/usr/bin/ppx-base --no-discard-stderr > debian/ppx-base.1
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-base-ocaml-dev
    description: Base set of ppx rewriters (dev files)
    pipeline:
      - runs: |
          install -Dm644 debian/ppx-base.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    dependencies:
      runtime:
        - libppxlib-ocaml-dev  # Wolfi Community Packages
        # TODO(debian-to-melange): libppx-cold-ocaml-dev is not in Wolfi (Debian: libppx-cold-ocaml-dev); left out
        - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
        - libppx-compare-ocaml-dev  # Wolfi Community Packages
        - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
        # TODO(debian-to-melange): libppx-globalize-ocaml-dev is not in Wolfi (Debian: libppx-globalize-ocaml-dev); left out
        - libppx-hash-ocaml-dev  # Wolfi Community Packages
update:
  enabled: true
  github:
    identifier: janestreet/ppx_base
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-base/LICENSE.md
    - uses: test/tw/ldd-check
