package:
  name: libfyaml
  version: '0.9.6'
  epoch: 0
  description: Fully feature complete YAML parser and emitter
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - autoconf
      - automake
      - bash
      - libtool
      - linux-headers
      - m4
      - pkgconf-dev
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/pantoniou/libfyaml/releases/download/v${{package.version}}/libfyaml-${{package.version}}.tar.gz
      expected-sha512: 71f01fdbfa8a3675bdd6697929bb8ee85672befa5ed815ef30813987c2f75f8ef0959e70d1b17d02ccadabc967f1dfd5b7f46a10a83fca7b1a9ed7455c52e344
  - uses: patch
    with:
      patches: libfyaml/vlsize_fix_size_t.patch libfyaml/fix-c11-atomics.patch libfyaml/fix-pkgconfig.patch libfyaml/fix-stray-if.patch libfyaml/fix_32bit_build.patch
  - name: Prepare
    runs: |
      autoreconf -fiv
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--libdir=/usr/lib \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--infodir=/usr/share/info \
      	--disable-static
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libfyaml-dev
    description: Fully feature complete YAML parser and emitter (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: libfyaml-doc
    description: Fully feature complete YAML parser and emitter (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: pantoniou/libfyaml
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
