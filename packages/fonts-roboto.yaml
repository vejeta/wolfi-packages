#
# Generated by debian-to-melange 0.1.0 from Debian source package
# fonts-roboto 2:3.016-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-roboto
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-roboto
#
# Conversion notes:
# - build dependency 'py3-vttlib' (Debian 'python3-vttlib') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: fonts-roboto
  version: '3.016'
  epoch: 0
  description: Metapackage to pull in Roboto fonts
  copyright:
    - license: OFL-1.1-no-RFN
    - license: Apache-2.0
      paths:
        - 'scripts/subset*.py'
  dependencies:
    runtime:
      - fonts-roboto-unhinted
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - fontmake
      - py3-supported-notofonttools  # Debian: python3-nototools
      - py3-supported-setuptools  # Debian: python3-setuptools
      # TODO(debian-to-melange): py3-vttlib is not in Wolfi (Debian: python3-vttlib); left out
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-roboto/$f .recipe-files/; done
      rmdir fonts-roboto 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/roboto-3-classic
      tag: v${{package.version}}
      expected-commit: 5166f3d07889bf7d3732fb72e09623d7e52f862b
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      PYTHONPATH=. sh sources/build.sh
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-roboto/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: fonts-roboto-unhinted
    description: 'Google''s signature family of fonts (unhinted)'
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/roboto/unhinted"
          cp -a fonts/unhinted/static/RobotoCondensed-*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/roboto/unhinted/"
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF"
          cp -a fonts/unhinted/static/Roboto-*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/roboto/unhinted/RobotoTTF/"
update:
  enabled: true
  github:
    identifier: googlefonts/roboto-3-classic
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-roboto/copyright
    - uses: python/import
      with:
        python: python3
        imports: import fonts_roboto
