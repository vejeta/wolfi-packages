# Conversion notes:
# - build dependency 'py3-cattr' (Debian 'python3-cattr') not found in Wolfi; left out
# - set expected-commit for tag v2.002+20231012 (re-run with --download, or git ls-remote)
package:
  name: fonts-roboto-slab
  version: 2.002+20231012
  epoch: 0
  description: 'Google''s signature family of fonts (slab)'
  copyright:
    - license: Apache-2.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - py3.12-fonttools-bin  # Debian: fonttools
      - gftools
      # TODO(debian-to-melange): py3-cattr is not in Wolfi (Debian: python3-cattr); left out
      - py3-supported-orjson  # Debian: python3-orjson
      - coreutils
      - findutils
pipeline:
  # TODO(debian-to-melange): set expected-commit for tag v2.002+20231012 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/robotoslab
      tag: v${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf .github documentation fonts old scripts
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      mkdir -p venv/bin
      touch venv/bin/activate venv/touchfile
      chmod +x venv/bin/activate
      make -j$(nproc) build
  - name: Install files
    runs: |
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/fonts-roboto-slab
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  github:
    identifier: googlefonts/robotoslab
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-roboto-slab/LICENSE.txt
