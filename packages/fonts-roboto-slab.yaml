package:
  name: fonts-roboto-slab
  version: '2.002.20231012'
  epoch: 0
  description: 'Google''s signature family of fonts (slab)'
  copyright:
    - license: Apache-2.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - py3.12-fonttools-bin  # Debian: fonttools
      - gftools
      # TODO(debian-to-melange): py3-cattr is not in Wolfi (Debian: python3-cattr); left out
      - py3-supported-orjson  # Debian: python3-orjson
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-roboto-slab/fonts-roboto-slab_2.002+20231012+ds.orig.tar.xz
      expected-sha256: c303628a1027058186855ad0ae32a29fa8948184ff5433d8dad36a1e88206134
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf .github documentation fonts old scripts
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      mkdir -p venv/bin
      touch venv/bin/activate venv/touchfile
      chmod +x venv/bin/activate
      make -j$(nproc) build
  - name: Install files
    runs: |
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/fonts-roboto-slab
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-roboto-slab/LICENSE.txt
