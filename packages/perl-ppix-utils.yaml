package:
  name: perl-ppix-utils
  version: '0.003'
  epoch: 0
  description: Utility functions for PPI
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl-b-keywords  # Wolfi Community Packages (Debian: libb-keywords-perl)
      - perl-ppi  # Debian: libppi-perl
      - perl  # Debian: libscalar-list-utils-perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-b-keywords  # Wolfi Community Packages (Debian: libb-keywords-perl)
      - perl-ppi  # Debian: libppi-perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/D/DB/DBOOK/PPIx-Utils-${{package.version}}.tar.gz
      expected-sha256: 2a9bccfc8ead03be01b67248fe8e152522040f798286fa4ef4432b7f2efdba11
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-ppix-utils"
      cp -a CONTRIBUTING.md "${{targets.destdir}}/usr/share/doc/perl-ppix-utils/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-ppix-utils
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 200140
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-ppix-utils/LICENSE
    - name: Load the module
      runs: |
        perl -MPPIx::Utils -e1
