# Generated by debian-to-melange 0.1.0 from Debian source package
# debhelper 14.5 (3.0 (native)).
# https://tracker.debian.org/pkg/debhelper
# Debian packaging: https://salsa.debian.org/debian/debhelper
#
# Conversion notes:
# - Debian-native package: source from the Debian archive
# - dh --with build-stamp has no direct melange equivalent; review
package:
  name: debhelper
  version: '14.5'
  epoch: 0
  description: Helper programs for debian/rules
  copyright:
    - license: GPL-2.0-or-later
    - license: LicenseRef-public-domain
      paths:
        - 'examples/*'
        - 'autoscripts/*'
    - license: GPL-3.0-or-later
      paths:
        - dh_installinit
    - license: BSD-3-Clause
      paths:
        - dh_systemd_enable
        - dh_systemd_start
  dependencies:
    runtime:
      - dh-autoreconf  # Wolfi Community Packages
      - dh-strip-nondeterminism  # Wolfi Community Packages
      - automake  # Debian: autotools-dev
      - dpkg
      - dwz  # Wolfi Community Packages
      - file
      - perl-debhelper
      - dpkg-dev  # Debian: libdpkg-perl
      - man-db
      - po-debconf  # Wolfi Community Packages
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - dpkg-dev
      - po4a  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright gen-provides; do mv debhelper/$f .recipe-files/; done
      rmdir debhelper 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/debhelper/debhelper_${{package.version}}.tar.xz
      expected-sha256: a338279dd8f28754e9df70071efb45021fd1331bc42e9adc883fa8ec61949351
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  - name: From debian/rules execute_before_dh_install
    runs: |
      mkdir -p debian
      PERLLIBDIR=$(perl -MConfig -e 'print $Config{vendorlib}')/ ;  	    perl -I"${{targets.destdir}}/${PERLLIBDIR}" .recipe-files/gen-provides > debian/debhelper.substvars
  - name: Install files
    runs: |
      if ! ls -d "${{targets.destdir}}/usr/bin" >/dev/null 2>&1; then
        mkdir -p "${{targets.destdir}}/usr"
        cp -a usr/bin "${{targets.destdir}}/usr/"
      fi
      install -Dm644 *.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 *.7 -t "${{targets.destdir}}/usr/share/man/man7"
      mkdir -p "${{targets.destdir}}/usr/share/doc/debhelper/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/debhelper/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/debhelper"
      cp -a doc/* "${{targets.destdir}}/usr/share/doc/debhelper/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/debhelper/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: perl-debhelper
    description: Debhelper perl modules
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share"
          mv "${{targets.destdir}}/usr/share/debhelper" "${{targets.contextdir}}/usr/share/"
          mkdir -p "${{targets.contextdir}}/usr/share/perl5"
          mv "${{targets.destdir}}/usr/share/perl5/vendor_perl" "${{targets.contextdir}}/usr/share/perl5/"
          mkdir -p "${{targets.contextdir}}/usr/share/debputy/debputy/plugins"
          cp -a debhelper-documentation.json "${{targets.contextdir}}/usr/share/debputy/debputy/plugins/"
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/debhelper/copyright
