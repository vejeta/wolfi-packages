# Debian packaging: https://salsa.debian.org/fonts-team/compreffor
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: fonttools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
package:
  name: py3-compreffor
  version: '0.6.0'
  epoch: 0
  description: CFF table subroutinizer for FontTools
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
      - py3-supported-fonttools  # Debian: python3-fonttools
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3.13-cython-bin  # Debian: cython3
      - python3-dev  # Debian: python3-all-dev
      - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in prune-setuptools-git-ls.patch; do mv py3-compreffor/$f .recipe-files/; done
      rmdir py3-compreffor 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/compreffor
      tag: v${{package.version}}
      expected-commit: 140d0cde7a4d63fb8699ce20fb1e904ea2b95383
      recurse-submodules: true
  - uses: patch
    with:
      patches: .recipe-files/prune-setuptools-git-ls.patch
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-compreffor
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: googlefonts/compreffor
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-compreffor/LICENSE
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import compreffor
