# Generated by debian-to-melange 0.1.0 from Debian source package
# compreffor 0.6.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/compreffor
# Debian packaging: https://salsa.debian.org/fonts-team/compreffor
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: fonttools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-compreffor for Python 3.11, 3.12, 3.13
package:
  name: py3-compreffor
  version: '0.6.0'
  epoch: 0
  description: CFF table subroutinizer for FontTools
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
vars:
  pypi-package: compreffor
  import: compreffor
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base-dev
      - python3
      - py3-supported-fonttools  # Debian: python3-fonttools
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in prune-setuptools-git-ls.patch; do mv py3-compreffor/$f .recipe-files/; done
      rmdir py3-compreffor 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/googlefonts/compreffor
      tag: v${{package.version}}
      expected-commit: 140d0cde7a4d63fb8699ce20fb1e904ea2b95383
  - uses: patch
    with:
      patches: .recipe-files/prune-setuptools-git-ls.patch
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-fonttools
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: googlefonts/compreffor
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-compreffor
  pipeline:
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
