                      printf "Running updmap-sys. This may take some time... "
                      # call updmap with --nohash so that no ls-R files
                      # are created in /usr/local/share/texmf/
                      # see bug report #607857
                      # instead of that we call mktexlsr $TEXMFSYSVARDIR 
                      # afterwards. This can be done without checks as
                      # we know that dhit_texlive_binaries_configured and
                      # since mktexlsr and updmap are in the same package
                      # and we checked for updmap already
                      if updmap-sys --nohash > $tempfile 2>&1 ; then
                          rm -f $tempfile
                          echo "done."
                          tempfile=$(mktemp -p /tmp mktexlsr.XXXXXXXX)
                          printf "Running mktexlsr $TEXMFSYSVARDIR ... "
                          if mktexlsr $TEXMFSYSVARDIR > $tempfile 2>&1 ; then
                              rm -f $tempfile
                              echo "done."
                          else
                              exec >&2
                              echo
                              echo "mktexlsr $TEXMFSYSVARDIR failed. Output has been stored in"
                              echo "$tempfile"
                              echo "Please include this file if you report a bug."
                              echo
                              exit 1
                          fi
                      else
                          exec >&2
                          echo
                          echo "updmap-sys failed. Output has been stored in"
                          echo "$tempfile"
                          echo "Please include this file if you report a bug."
                          echo
                          echo "Sometimes, not accepting conffile updates in /etc/texmf/updmap.d"
                          echo "causes updmap-sys to fail.  Please check for files with extension"
                          echo ".dpkg-dist or .ucf-dist in this directory" 
                          echo
                          exit 1
      	            fi
                  fi
              fi
          fi
      }

      run_fmtutil()
      {
          # now call the equivalent of fmtutil-sys --all explicitely
          # we also have to check that texlive-base is installed
          # and configured, otherwise we cannot be sure that
          # all necessary basic files are present
          if dhit_texlive_binaries_configured; then
              # see above for information on dpkg-query usage
              stat=$(dpkg-query -W -f='${Status}' texlive-base  2>/dev/null || true)
              case "$stat" in
                  "install ok installed")
                      do_it=1
                      ;;
                  *)
                      do_it=0
                      ;;
              esac
              if [ "$do_it" = 0 ] ; then
                  echo "texlive-base is not ready, skipping fmtutil --all call" >&2
              else
                  dhit_build_format --all
              fi
          fi
      }

      run_mktexlsr()
      {
          trees=$*
          if dhit_texlive_binaries_configured; then
              # mktexlsr may not be present
              if command -v mktexlsr >/dev/null; then
                  tempfile=$(mktemp -p /tmp mktexlsr.XXXXXXXX)
                  printf "Running mktexlsr. This may take some time... "
                  if mktexlsr $trees > $tempfile 2>&1 ; then
                      rm -f $tempfile
                      echo "done."
                  else
                      exec >&2
                      echo
                      echo "mktexlsr $trees failed. Output has been stored in"
                      echo "$tempfile"
                      echo "Please include this file if you report a bug."
                      echo
                      exit 1
                  fi
              fi
          fi
      }

      run_hyphen()
      {
          if dhit_texlive_binaries_configured; then
              if command -v kpsewhich >/dev/null; then
                  if command -v fmtutil >/dev/null; then
                      # code from postinst.tex
                      v=$(kpsewhich -var-value TEXMFSYSVAR)
                      c=$(kpsewhich -var-value TEXMFSYSCONFIG)
                      TEXMFVAR="$v"
                      TEXMFCONFIG="$c"
                      export TEXMFVAR TEXMFCONFIG
                      tempfile=$(mktemp -p /tmp fmtutil.XXXXXXXX)
                      printf "Building latex-based formats --byhyphen language.dat.\n\tThis may take some time... "
                      LANGSAVE=$LANG
                      LANG=C
                      if $FMTUTIL --byhyphen language.dat > $tempfile 2>&1 ; then
                          rm -f $tempfile
                          LANG=$LANGSAVE
                          echo "done."
                      else
                          run_fmtutil_failed
                          exit 1
                      fi
                      tempfile=$(mktemp -p /tmp fmtutil.XXXXXXXX)
                      printf "Building e-tex based formats --byhyphen language.def.\n\tThis may take some time... "
                      if $FMTUTIL --byhyphen language.def > $tempfile 2>&1 ; then
                          rm -f $tempfile
                          echo "done."
                      else
                          run_fmtutil_failed
                          exit 1
                      fi
                  fi
              fi
          fi
      }

      do_triggers() 
      {
          DO_TEXMF=0
          DO_TEXMFDIST=0
          DO_UPDMAP=0
          DO_FMTUTIL=0
          DO_HYPHEN=0
          case " $trigger " in 
              *" /usr/share/texmf "*)                DO_TEXMF=1 ;; esac
          case " $trigger " in
              *" /usr/share/texlive/texmf-dist "*)   DO_TEXMFDIST=1 ;; esac
          case " $trigger " in
              *" texmf-map "*)                       DO_UPDMAP=1 ;; esac
          case " $trigger " in
              *" texmf-format "*)                    DO_FMTUTIL=1 ;; esac
          case " $trigger " in
              *" texmf-hyphen "*)                    DO_HYPHEN=1 ;; esac

          DO_MKTEXLSR=0
          #
          # ls-R updates
          trees="$TEXMFSYSVARDIR"
          if [ $DO_TEXMF = 1 ] ; then
              DO_MKTEXLSR=1
              trees="$trees /usr/share/texmf"
          fi
          if [ $DO_TEXMFDIST = 1 ] ; then
              DO_MKTEXLSR=1
              trees="$trees /usr/share/texlive/texmf-dist"
          fi
          if [ $DO_MKTEXLSR = 1 ] ; then
              run_mktexlsr $trees
              run_mtxrun_if_possible
          fi
          if [ $DO_UPDMAP = 1 ] ; then
              update-updmap --quiet
              run_updmap
          fi
          if [ $DO_FMTUTIL = 1 ] ; then
              update-language --quiet
              update-fmtutil --quiet
              run_fmtutil
              # reset hyphen, we already rebuilt all formats
              DO_HYPHEN=0
          fi
          if [ $DO_HYPHEN = 1 ] ; then
              update-language --quiet
              update-fmtutil --quiet
              run_hyphen
          fi
      }


      #################################################################
      # Here starts the real action
      #################################################################


      case $action in
          triggered)
              do_triggers
              ;;

          configure|reconfigure)

          # if we are upgrading from before 4, remove the preinst created
          # backup of the symlink
          if dpkg --compare-versions "$trigger" lt "4" ; then
            if [ -L /usr/share/texmf/doc.dpkg-remove ] ; then
              rm -f /usr/share/texmf/doc.dpkg-remove
            fi
          fi


          # remove outdated thailatex babel.sty
          if [ -f $TEXMFSYSVARDIR/tex/generic/babel/babel.sty ] ; then
              echo "Removing outdated babel.sty from thailatex."
              rm $TEXMFSYSVARDIR/tex/generic/babel/babel.sty
              rmdir --ignore-fail-on-non-empty $TEXMFSYSVARDIR/tex/generic/babel
              rmdir --ignore-fail-on-non-empty $TEXMFSYSVARDIR/tex/generic
              rmdir --ignore-fail-on-non-empty $TEXMFSYSVARDIR/tex
          fi

          update-texmf
          update-updmap --quiet
          update-fmtutil --quiet
          update-language --quiet
          trees="$TEXMFSYSVARDIR /usr/share/texmf"
          if [ -d /usr/share/texlive/texmf-dist ] ; then
              trees="$trees /usr/share/texlive/texmf-dist"
          fi
          run_mktexlsr $trees
          run_mtxrun_if_possible
          run_updmap
          run_fmtutil

          # remove out dated dir /etc/texmf/language.d
          if [ -d /etc/texmf/language.d ] ; then 
              rmdir --ignore-fail-on-non-empty /etc/texmf/language.d/
          fi


          ;;
        *)
          ;;
      esac



      ### Local Variables:
      ### perl-indent-level: 4
      ### tab-width: 4
      ### indent-tabs-mode: nil
      ### End:
      # vim:set tabstop=4 expandtab: #
      )
      debian_postinst configure "$2"
    post-deinstall: |
      #!/bin/sh
      # Converted from debian/postrm by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postrm() (
      # 
      # postrm maintainer script for the Debian tex-common package.
      #
      # Copyright (C) 2004 by Frank Küster <frank@kuesterei.ch>. 
      # Copyright (C) 2012 by Norbert Preining <preining@debian.org>.
      #
      # This file is free software; you can redistribute it and/or modify it
      # under the terms of the GNU General Public License as published by the
      # Free Software Foundation; either version 2 of the License, or (at your
      # option) any later version.
      #
      # This file is distributed in the hope that it will be useful, but
      # WITHOUT ANY WARRANTY; without even the implied warranty of
      # MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the GNU
      # General Public License for more details.
      #
      # You should have received a copy of the GNU General Public License along
      # with this program; if not, write to: The Free Software Foundation, Inc.,
      # 59 Temple Place, Suite 330, Boston, MA 02111-1307, USA.
      #
      # On Debian GNU/Linux System you can find a copy of the GNU General Public
      # License in "/usr/share/common-licenses/GPL".

      set -e

      # give commandline args a name
      action=$1 # remove, purge, upgrade, failed-upgrade, abort-install, abort-upgrade, disappear

      ## do the things we have to do always
      case $action in
        abort-install|abort-upgrade)
          syml=/usr/share/texmf/doc
          if [ -n "$2" ] && dpkg --compare-versions "$2" lt "4" ; then
            if [ -L $syml.dpkg-remove ] && [ ! -e $syml ] ; then
              echo "Reinstatiating $syml"
              mv $syml.dpkg-remove $syml
            fi
          fi
        ;;
        remove)
          # remove TEXMFSYSVARDIR: All files and dirs are created either by
          # us, or by packages depending on us.
          rm -rf /var/lib/texmf
          # same with obsolete /var/cache/fonts
          rm -rf /var/cache/fonts
          ;;
        purge)
          if [ -L /usr/share/texmf/doc.dpkg-remove ] ; then
            rm -f /usr/share/texmf/doc.dpkg-remove
          fi

          # TODO purge ucf files

          # remove texmf.cnf
          if [ -d /etc/texmf/web2c ] ; then
            rm -rf /etc/texmf/web2c/texmf.cnf
            rmdir --ignore-fail-on-non-empty /etc/texmf/web2c
          fi
          ;;
        *)
          ;;
      esac
      )
      debian_postrm remove
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - help2man
      - coreutils
      - findutils
      - perl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv tex-common/$f .recipe-files/; done
      rmdir tex-common 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/t/tex-common/tex-common_${{package.version}}.tar.xz
      expected-sha256: 08f24be2a32094d350153b7d9b2469f8898b31ad470f8df3c201461ce243e620
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      (cd scripts; pod2man dh_installtex > dh_installtex.1)
      (cd scripts; help2man -n "generate hyphenation configuration for TeX engines" -s 8 -S Debian  -N ./update-language > update-language.8)
  # TODO(debian-to-melange): port debian/rules execute_after_dh_auto_install: # debhelper stuff && # dh_installtex(.1) is already installed via the bin_scripts && grep -v '^[ \t]*# ' scripts/postrm-tex > $(INSTDIR)/usr/share/debhelper/autoscripts/postrm-tex && grep -v '^[ \t]*#
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/etc/texmf/web2c"
      cp -a texmf/web2c/mktex.cnf "${{targets.destdir}}/etc/texmf/web2c/"
      mkdir -p "${{targets.destdir}}/etc/texmf/texmf.d"
      cp -a conf/texmf.d/00debian.cnf "${{targets.destdir}}/etc/texmf/texmf.d/"
      mkdir -p "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/Debhelper/Sequence"
      cp -a scripts/tex.pm "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/Debhelper/Sequence/"
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a scripts/dh_installtex "${{targets.destdir}}/usr/bin/"
      cp -a scripts/update-language "${{targets.destdir}}/usr/bin/"
      cp -a scripts/update-texmf-config "${{targets.destdir}}/usr/bin/"
      cp -a scripts/update-tl-stacked-conffile "${{targets.destdir}}/usr/bin/"
      cp -a scripts/update-texmf "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share/tex-common"
      cp -a texmf/web2c/mktex.cnf "${{targets.destdir}}/usr/share/tex-common/"
      install -Dm644 scripts/dh_installtex.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 scripts/update-language.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 scripts/update-texmf-config.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 scripts/update-tl-stacked-conffile.8 -t "${{targets.destdir}}/usr/share/man/man8"
      install -Dm644 scripts/update-texmf.8 -t "${{targets.destdir}}/usr/share/man/man8"
      mkdir -p "${{targets.destdir}}/usr/share/debhelper/autoscripts"
      mkdir -p "${{targets.destdir}}/usr/share/texmf/web2c"
      mkdir -p "${{targets.destdir}}/usr/share/bug/tex-common"
      mkdir -p "${{targets.destdir}}/var/lib/texmf/web2c"
      mkdir -p "${{targets.destdir}}/var/lib/texmf/tex/generic/config"
      mkdir -p "${{targets.destdir}}/var/lib/tex-common/hyphen-cnf"
      mkdir -p "${{targets.destdir}}/var/lib/tex-common/fmtutil-cnf"
      mkdir -p "${{targets.destdir}}/var/lib/tex-common/fontmap-cfg"
      mkdir -p "${{targets.destdir}}/var/cache/fonts"
      mkdir -p "${{targets.destdir}}/usr/local/share/texmf"
      ln -sf /usr/bin/update-language "${{targets.destdir}}/usr/bin/update-language-def"
      ln -sf /usr/bin/update-language "${{targets.destdir}}/usr/bin/update-language-dat"
      ln -sf /usr/bin/update-language "${{targets.destdir}}/usr/bin/update-language-lua"
      mkdir -p "${{targets.destdir}}/usr/share/man/man8"
      ln -sf /usr/share/man/man8/update-language.8 "${{targets.destdir}}/usr/share/man/man8/update-language-def.8"
      ln -sf /usr/share/man/man8/update-language.8 "${{targets.destdir}}/usr/share/man/man8/update-language-dat.8"
      ln -sf /usr/share/man/man8/update-language.8 "${{targets.destdir}}/usr/share/man/man8/update-language-lua.8"
      ln -sf /usr/bin/update-tl-stacked-conffile "${{targets.destdir}}/usr/bin/update-fmtutil"
      ln -sf /usr/bin/update-tl-stacked-conffile "${{targets.destdir}}/usr/bin/update-updmap"
      ln -sf /usr/share/man/man8/update-tl-stacked-conffile.8 "${{targets.destdir}}/usr/share/man/man8/update-fmtutil.8"
      ln -sf /usr/share/man/man8/update-tl-stacked-conffile.8 "${{targets.destdir}}/usr/share/man/man8/update-updmap.8"
      mkdir -p "${{targets.destdir}}/usr/share/texmf"
      ln -sf /var/lib/texmf/ls-R-TEXMFMAIN "${{targets.destdir}}/usr/share/texmf/ls-R"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/tex-common/copyright
  - name: Commands are executable (dh_fixperms)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        [ -d "$d/usr/bin" ] && find "$d/usr/bin" -type f -exec chmod 755 {} +
      done
      true
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -x /usr/bin/dh_installtex
        test -x /usr/bin/update-language
        test -x /usr/bin/update-texmf-config
        test -x /usr/bin/update-tl-stacked-conffile
        test -x /usr/bin/update-texmf
        test -f /usr/share/doc/tex-common/copyright
