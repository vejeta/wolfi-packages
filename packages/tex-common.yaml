      #!/bin/sh
      # Converted from debian/postinst by debian-to-melange.
      # apk passes different arguments than dpkg, so the original script runs
      # in a subshell with the arguments dpkg would have used.
      debian_postinst() (
      # 
      # postinst maintainer script for the Debian tex-common package.
      #
      # Copyright (C) 2004 by Frank Küster <frank@kuesterei.ch>. 
      # Copyright (C) 2012-2022 by Norbert Preining <preining@debian.org>
