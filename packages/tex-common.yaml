                              echo "mktexlsr $TEXMFSYSVARDIR failed. Output has been stored in"
                              echo "$tempfile"
                              echo "Please include this file if you report a bug."
                              echo
                              exit 1
                          fi
                      else
                          exec >&2
                          echo
                          echo "updmap-sys failed. Output has been stored in"
                          echo "$tempfile"
                          echo "Please include this file if you report a bug."
                          echo
