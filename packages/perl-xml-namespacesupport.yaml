package:
  name: perl-xml-namespacesupport
  version: '1.12'
  epoch: 0
  description: Generic namespace helpers (ported from SAX2)
  copyright:
    - license: GPL-1.0-or-later
  dependencies:
    runtime:
      - perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PE/PERIGRIN/XML-NamespaceSupport-${{package.version}}.tar.gz
      expected-sha512: 8a29698acc152888b3abd53b277f89209252830cc3b57d587a5b66e5019445d7c1858a08fa548d42387c1143b726da1440e36eb0c69b0b59c3770b5f528f38b2
  - name: Build
    runs: |
      PERL_MM_USE_DEFAULT=1 perl Makefile.PL INSTALLDIRS=vendor
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
subpackages:
  - name: perl-xml-namespacesupport-doc
    description: Generic namespace helpers (ported from SAX2) (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
