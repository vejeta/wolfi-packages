package:
  name: perl-archive-zip
  version: '1.68'
  epoch: 0
  description: Perl module for manipulation of ZIP archives
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
    - license: Artistic-1.0-Perl AND Info-ZIP
      paths:
        - lib/Archive/Zip/Member.pm
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in bogus-error-message.patch copyright crc32.1 fix_example_shebangs.patch; do mv perl-archive-zip/$f .recipe-files/; done
      rmdir perl-archive-zip 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PH/PHRED/Archive-Zip-${{package.version}}.tar.gz
      expected-sha256: 984e185d785baf6129c6e75f8eb44411745ac00bf6122fb1c8e822a3861ec650
  - uses: patch
    with:
      patches: .recipe-files/fix_example_shebangs.patch .recipe-files/bogus-error-message.patch
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/crc32.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-archive-zip/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/perl-archive-zip/examples/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-archive-zip/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 2650
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-archive-zip/copyright
    - name: Load the module
      runs: |
        perl -MArchive::Zip -e1
