# Generated by debian-to-melange 0.1.0 from Debian source package
# jst-config 0.17.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/jst-config
# Debian packaging: https://salsa.debian.org/ocaml-team/jst-config
#
# Conversion notes:
# - build dependency 'libppx-assert-ocaml-dev' (Debian 'libppx-assert-ocaml-dev') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libjst-config-ocaml
  version: '0.17.0'
  epoch: 0
  description: Compile-time configuration for Jane Street packages (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libbase-ocaml-dev  # Wolfi Community Packages
      - libdune-configurator-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libppx-assert-ocaml-dev is not in Wolfi (Debian: libppx-assert-ocaml-dev); left out
      - ocaml-dune
      - ocaml
      - coreutils
      - findutils
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/jst-config
      tag: v${{package.version}}
      expected-commit: 2487727655bfb8d6a511eb7886fb65bba4cfbbc7
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/jst-config
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      find ${{targets.destdir}}/ -name LICENSE.md -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libjst-config-ocaml-dev
    description: Compile-time configuration for Jane Street packages (dev files)
    pipeline:
      - uses: split/dev
update:
  enabled: true
  github:
    identifier: janestreet/jst-config
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/jst-config/LICENSE.md
    - uses: test/tw/ldd-check
