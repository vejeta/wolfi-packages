package:
  name: libfpath-ocaml-dev
  version: '0.7.3'
  epoch: 0
  description: OCaml library for handling file system paths (development)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libfpath-ocaml  # Debian: ${ocaml:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - ocamlbuild
      - opam  # Debian: opam-installer
      - libtopkg-ocaml-dev  # Wolfi Community Packages
      - libastring-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-fpath/ocaml-fpath_${{package.version}}.orig.tar.xz
      expected-sha256: 48127addd3b6944fbd09083f0ace23ab1ae531e307d1e528711b6d71ffc62067
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ocaml pkg/pkg.ml build --tests true
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      opam-installer  		--prefix=${{targets.destdir}}/  		--libdir=./usr/lib/ocaml fpath.install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libfpath-ocaml-dev"
      cp -a doc/fpath/CHANGES.md "${{targets.destdir}}/usr/share/doc/libfpath-ocaml-dev/"
      cp -a doc/fpath/README.md "${{targets.destdir}}/usr/share/doc/libfpath-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libfpath-ocaml-dev
subpackages:
  - name: libfpath-ocaml
    description: OCaml library for handling file system paths (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/fpath"
          mv "${{targets.destdir}}/usr/lib/ocaml/fpath/META" "${{targets.contextdir}}/usr/lib/ocaml/fpath/"
          mv "${{targets.destdir}}/usr/lib/ocaml/fpath/fpath.cma" "${{targets.contextdir}}/usr/lib/ocaml/fpath/"
          mv "${{targets.destdir}}/usr/lib/ocaml/fpath/fpath.cmxs" "${{targets.contextdir}}/usr/lib/ocaml/fpath/"
update:
  enabled: true
  release-monitor:
    identifier: 63832
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - ocaml-findlib  # Debian: ocaml-findlib
        - ocamlfind  # Debian: ocaml-findlib
        - ocamlbuild
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libfpath-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-fpath/ocaml-fpath_${{package.version}}.orig.tar.xz
        expected-sha256: 48127addd3b6944fbd09083f0ace23ab1ae531e307d1e528711b6d71ffc62067
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-fpath/ocaml-fpath_0.7.3-4.debian.tar.xz
        strip-components: 0
        expected-sha256: 120f63a6afce8d94baaa389fcef7a6482af367e12c83b9410e6a93e07c9bd201
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc libfindlib-ocaml=ocaml-findlib perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libfpath-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libfpath-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: pathtest'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        cat > "$AUTOPKGTEST_TMP/pathtest" <<'AUTOPKGTEST_SCRIPT'
        #!/bin/sh -e
        this=pathtest
        indir=debian/tests
        outdir=${ADT_ARTIFACTS:-/tmp}/${this}
        mkdir -p ${outdir}

        cp ${indir}/${this}.ml ${outdir}
        cd ${outdir}
        echo "* Compile to bytecode:"
        ocamlbuild -use-ocamlfind -pkgs fpath ${this}.byte
        echo -n "* Run bytecode ... "
        ./${this}.byte
        echo "OK."

        if [ -x /usr/bin/ocamlopt ]
        then
            echo "* Compile to native code:"
            ocamlbuild -use-ocamlfind -pkgs fpath ${this}.native;
            echo -n "* Run native code ... "
            ./${this}.native
            echo "OK."
        fi
        AUTOPKGTEST_SCRIPT
        chmod +x "$AUTOPKGTEST_TMP/pathtest"
        "$AUTOPKGTEST_TMP/pathtest"
