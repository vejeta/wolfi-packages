package:
  name: sequoia-chameleon-gnupg
  version: '0.13.1'
  epoch: 0
  description: 'Sequoia''s reimplementation of the GnuPG interface'
  copyright:
    - license: GPL-3.0-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bzip2-dev
      - rust  # Alpine: cargo
      - cargo-auditable
      - clang  # Alpine: clang-dev
      - openssl-dev
      - sqlite-dev
      - bzip2
      - openssl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      mv sequoia-chameleon-gnupg/* .recipe-files/
      rmdir sequoia-chameleon-gnupg
  - uses: fetch
    with:
      uri: https://gitlab.com/sequoia-pgp/sequoia-chameleon-gnupg/-/archive/v${{package.version}}/sequoia-chameleon-gnupg-v${{package.version}}.tar.bz2
      expected-sha512: 68ba7dd2dd0dc1285465b92af5da5c5b0ab246a9ce4e62c0e502a841887f70fa229a7c8b4ab03e2a49288c129d4830c5618b571cfae6b5d55d51421d07632a07
  - uses: patch
    with:
      patches: .recipe-files/sequoia-openpgp-2.3.0.patch
  - name: Prepare
    runs: |
      CTARGET="${{host.triplet.rust}}"

      cargo fetch --target="$CTARGET" --locked
  - name: Build
    runs: |
      cargo auditable build --release --frozen --no-default-features --features crypto-openssl
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      install -Dm755 target/release/gpgv-sq target/release/gpg-sq \
      	-t "$pkgdir"/usr/bin
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
update:
  enabled: true
  release-monitor:
    identifier: 370878
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
