# ocaml-topkg 1.1.1-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-topkg
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-topkg
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocaml-topkg/ocaml-topkg_1.1.1.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libtopkg-ocaml-dev
  version: '1.1.1'
  epoch: 0
  description: Packager for OCaml software
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: libfindlib-ocaml-dev
      - ocamlfind  # Debian: libfindlib-ocaml-dev
      - ocaml-findlib-compat  # Debian: libfindlib-ocaml-dev
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - ocamlbuild
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - libopam-file-format-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in install_bytecode.sh install_native.sh rules; do mv libtopkg-ocaml-dev/$f .recipe-files/; done
      rmdir libtopkg-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-topkg/ocaml-topkg_${{package.version}}.orig.tar.bz2
      expected-sha256: 20da062dc9cea21b5c728f22c986ed3e3d57310e643260160a802d559712f6fc
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ./pkg/pkg.ml build --pkg-name topkg
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      for a in bytecode native; do  	  mv debian/install_$a.sh debian/install_$a.sh.old;  	done
      .recipe-files/rules .recipe-files/install_bytecode.sh
      diff -u debian/install_bytecode.sh.old .recipe-files/install_bytecode.sh
      mv debian/install_bytecode.sh.old .recipe-files/install_bytecode.sh
      mv debian/install_native.sh.old .recipe-files/install_native.sh
      OCAML_STDLIB_DIR=/usr/lib/ocaml .recipe-files/install_bytecode.sh
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/ocaml/topkg"
      cp -a usr/lib/ocaml/topkg/opam "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/META "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.ml* "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmt* "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmi "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cma "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmxs "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmti "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.a "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmx "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      cp -a usr/lib/ocaml/topkg/*.cmxa "${{targets.destdir}}/usr/lib/ocaml/topkg/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libtopkg-ocaml-dev"
      cp -a usr/doc/topkg/* "${{targets.destdir}}/usr/share/doc/libtopkg-ocaml-dev/"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libtopkg-ocaml-dev
update:
  enabled: true
  release-monitor:
    identifier: 16708
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libtopkg-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
