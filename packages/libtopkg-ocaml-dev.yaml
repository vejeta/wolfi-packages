# Generated by debian-to-melange 0.1.0 from Debian source package
# ocaml-topkg 1.1.1-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ocaml-topkg
# Debian packaging: https://salsa.debian.org/ocaml-team/ocaml-topkg
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocaml-topkg/ocaml-topkg_1.1.1.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libtopkg-ocaml-dev
  version: '1.1.1'
  epoch: 0
  description: Packager for OCaml software
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - ocaml-findlib  # Debian: libfindlib-ocaml-dev
      - ocamlfind  # Debian: libfindlib-ocaml-dev
      - ocaml-findlib-compat  # Debian: libfindlib-ocaml-dev
      - libopam-file-format-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ocaml  # Debian: ocaml
      - ocaml-compiler-libs  # Debian: ocaml
      - ocaml-findlib-compat  # Debian: ocaml
      - build-base  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - ocamlbuild
      - ocaml-findlib  # Debian: ocaml-findlib
      - ocamlfind  # Debian: ocaml-findlib
      - libopam-file-format-ocaml-dev  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright gbp.conf install_bytecode.sh install_native.sh installer-generator.ml libtopkg-ocaml-dev.docs libtopkg-ocaml-dev.install.in rules watch; do mv libtopkg-ocaml-dev/$f .recipe-files/; done
      rmdir libtopkg-ocaml-dev 2>/dev/null || true
      mkdir -p debian && cp -a .recipe-files/. debian/
      # the scripts are executable in Debian's tree
      for f in debian/*; do [ -f "$f" ] && head -c2 "$f" | grep -q '#!' && chmod +x "$f"; done
      # what Debian's scripts install into debian/tmp is the package's
      mkdir -p "${{targets.destdir}}" && ln -sfn "${{targets.destdir}}" debian/tmp
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-topkg/ocaml-topkg_${{package.version}}.orig.tar.bz2
      expected-sha256: 20da062dc9cea21b5c728f22c986ed3e3d57310e643260160a802d559712f6fc
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      ./pkg/pkg.ml build --pkg-name topkg
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      for a in bytecode native; do  	  mv debian/install_$a.sh debian/install_$a.sh.old;  	done
      ocaml debian/installer-generator.ml
      diff -u debian/install_bytecode.sh.old debian/install_bytecode.sh
      diff -u debian/install_native.sh.old debian/install_native.sh
      mv debian/install_bytecode.sh.old debian/install_bytecode.sh
      mv debian/install_native.sh.old debian/install_native.sh
      OCAML_STDLIB_DIR=/usr/lib/ocaml debian/install_bytecode.sh
      OCAML_STDLIB_DIR=/usr/lib/ocaml debian/install_native.sh
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libtopkg-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/topkg/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libtopkg-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/topkg/*
      rmdir "${{targets.destdir}}/usr/doc/topkg" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libtopkg-ocaml-dev
update:
  enabled: true
  release-monitor:
    identifier: 16708
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libtopkg-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
