# Generated by debian-to-melange 0.1.0 from Debian source package
# fonts-dejavu 2.37-9 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-dejavu
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-dejavu
#
# Conversion notes:
# - udeb package(s) left out: fonts-dejavu-udeb, fonts-dejavu-mono-udeb
# - build dependency 'sfnt2woff-zopfli' (Debian 'sfnt2woff-zopfli') not found in Wolfi; left out
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-dejavu/fonts-dejavu_2.37.orig.tar.bz2), which disappears from the pool when Debian updates
# - port debian/rules override_dh_auto_build: make full-ttf && sh debian/scripts/generate-udeb.sh && touch --no-create --date="$(shell date --utc --date=@${SOURCE_DATE_EPOCH} --iso-8601=seconds)" build/*.ttf
package:
  name: fonts-dejavu
  version: '2.37'
  epoch: 0
  description: Metapackage to pull in fonts-dejavu-core, -mono and -extra
  copyright:
    - license: bitstream-vera
  dependencies:
    runtime:
      - fonts-dejavu-core
      - fonts-dejavu-mono
      - fonts-dejavu-extra
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - fontforge
      - perl-font-ttf  # Debian: libfont-ttf-perl
      - perl
      # TODO(debian-to-melange): sfnt2woff-zopfli is not in Wolfi (Debian: sfnt2woff-zopfli); left out
      - woff2
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0002-fontconfig-remove-generic-name-assignment-and-aliasi.patch upstream-homepage.patch; do mv fonts-dejavu/$f .recipe-files/; done
      rmdir fonts-dejavu 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-dejavu/fonts-dejavu_${{package.version}}.orig.tar.bz2
      expected-sha256: 4b21c5203f792343d5e90ab1cb0cf07e99887218abe3d83cd9a98cea9085e799
  - uses: patch
    with:
      patches: .recipe-files/upstream-homepage.patch .recipe-files/0002-fontconfig-remove-generic-name-assignment-and-aliasi.patch
  - runs: |
      make -j$(nproc)
      if make -s -n install >/dev/null 2>&1; then
        make install DESTDIR="${{targets.destdir}}" PREFIX=/usr
      fi
  # TODO(debian-to-melange): port debian/rules override_dh_auto_build: make full-ttf && sh debian/scripts/generate-udeb.sh && touch --no-create --date="$(shell date --utc --date=@${SOURCE_DATE_EPOCH} --iso-8601=seconds)" build/*.ttf
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/fonts-dejavu
  - name: From debian/rules execute_after_dh_install
    runs: |
      sh debian/scripts/generate-web.sh
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - name: fonts-dejavu-core
    description: Vera font family derivate with additional characters
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu"
          mv "${{targets.destdir}}/build/DejaVuSans-Bold.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}/build/DejaVuSans.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}/build/DejaVuSerif-Bold.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}/build/DejaVuSerif.ttf" "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.avail"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-lgc-sans.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-lgc-serif.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-sans.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-serif.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/57-dejavu-sans.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/57-dejavu-serif.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/58-dejavu-lgc-sans.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/58-dejavu-lgc-serif.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-lgc-sans.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-sans.conf"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-lgc-serif.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-serif.conf"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-sans.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-sans.conf"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-serif.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-serif.conf"
          ln -sf /etc/fonts/conf.avail/57-dejavu-sans.conf "${{targets.contextdir}}/etc/fonts/conf.d/57-dejavu-sans.conf"
          ln -sf /etc/fonts/conf.avail/57-dejavu-serif.conf "${{targets.contextdir}}/etc/fonts/conf.d/57-dejavu-serif.conf"
          ln -sf /etc/fonts/conf.avail/58-dejavu-lgc-sans.conf "${{targets.contextdir}}/etc/fonts/conf.d/58-dejavu-lgc-sans.conf"
          ln -sf /etc/fonts/conf.avail/58-dejavu-lgc-serif.conf "${{targets.contextdir}}/etc/fonts/conf.d/58-dejavu-lgc-serif.conf"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core"
          cp -a AUTHORS "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
          cp -a BUGS "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
          cp -a README* "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
          cp -a langcover.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
          cp -a status.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
          cp -a unicover.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-core/"
    dependencies:
      runtime:
        - fonts-dejavu-mono
  - name: fonts-dejavu-mono
    description: Vera font family derivate with additional characters
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu"
          mv "${{targets.destdir}}"/build/DejaVuSansMono*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.avail"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-lgc-sans-mono.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/20-unhint-small-dejavu-sans-mono.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/57-dejavu-sans-mono.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mv "${{targets.destdir}}/fontconfig/58-dejavu-lgc-sans-mono.conf" "${{targets.contextdir}}/etc/fonts/conf.avail/"
          mkdir -p "${{targets.contextdir}}/etc/fonts/conf.d"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-lgc-sans-mono.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-lgc-sans-mono.conf"
          ln -sf /etc/fonts/conf.avail/20-unhint-small-dejavu-sans-mono.conf "${{targets.contextdir}}/etc/fonts/conf.d/20-unhint-small-dejavu-sans-mono.conf"
          ln -sf /etc/fonts/conf.avail/57-dejavu-sans-mono.conf "${{targets.contextdir}}/etc/fonts/conf.d/57-dejavu-sans-mono.conf"
          ln -sf /etc/fonts/conf.avail/58-dejavu-lgc-sans-mono.conf "${{targets.contextdir}}/etc/fonts/conf.d/58-dejavu-lgc-sans-mono.conf"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono"
          cp -a AUTHORS "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
          cp -a BUGS "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
          cp -a README* "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
          cp -a langcover.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
          cp -a status.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
          cp -a unicover.txt "${{targets.contextdir}}/usr/share/doc/fonts-dejavu-mono/"
  - name: fonts-dejavu-extra
    description: Vera font family derivate with additional characters (extra variants)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu"
          mv "${{targets.destdir}}"/build/DejaVu*Condensed*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}"/build/DejaVu*ExtraLight.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}"/build/DejaVu*Italic.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}"/build/DejaVuSans-*Oblique.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
          mv "${{targets.destdir}}"/build/DejaVu*Math*.ttf "${{targets.contextdir}}/usr/share/fonts/truetype/dejavu/"
    dependencies:
      runtime:
        - fonts-dejavu-core
  - name: fonts-dejavu-web
    description: Vera font family derivate with additional characters (woff/woff2)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/javascript/fonts-dejavu"
          mv "${{targets.destdir}}"/debian/javascript/* "${{targets.contextdir}}/usr/share/javascript/fonts-dejavu/"
          ln -sf /usr/share/fonts/truetype/dejavu "${{targets.contextdir}}/usr/share/javascript/fonts-dejavu/ttf"
          ln -sf /usr/share/fonts/woff/dejavu "${{targets.contextdir}}/usr/share/javascript/fonts-dejavu/woff"
          ln -sf /usr/share/fonts/woff2/dejavu "${{targets.contextdir}}/usr/share/javascript/fonts-dejavu/woff2"
    dependencies:
      runtime:
        - fonts-dejavu
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/fonts-dejavu/LICENSE
