package:
  name: libadwaita
  version: '1.10.0'
  epoch: 0
  description: Building blocks for modern GNOME applications
  copyright:
    - license: LGPL-2.1-or-later
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - appstream-dev  # Wolfi Community Packages
      - fribidi-dev
      - glib-dev
      - gobject-introspection-dev
      - glib-gir  # GLib .gir files (part of glib-dev on Alpine)
      - gtk-4-dev  # Alpine: gtk4.0-dev
      - meson
      - sassc
      - vala
pipeline:
  - uses: fetch
    with:
      uri: https://download.gnome.org/sources/libadwaita/1.10/libadwaita-${{package.version}}.tar.xz
      expected-sha512: 2c47fecd93f3ebd6dc091adea139a3bad76a6817617090eb7e937f303589e52b4548dde003b0e8ad33d13bce945084ec253733ecf4e935db30a8c87955d29fa7
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }
      want_check() { return 1; }

      CFLAGS="$CFLAGS -g1" \
      CPPFLAGS="$CPPFLAGS -g1" \
      abuild_meson \
      	-Db_lto=true \
      	--force-fallback-for=ministream \
      	-Dexamples=false \
      	-Ddocumentation=false \
      	-Dtests="$(want_check && echo true || echo false)" \
      	. output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libadwaita-dev
    description: Building blocks for modern GNOME applications (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: libadwaita-lang
    description: Building blocks for modern GNOME applications (lang)
    pipeline:
      - uses: split/locales
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(alpine-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
