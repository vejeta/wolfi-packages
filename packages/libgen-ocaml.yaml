#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/o/ocaml-gen/ocaml-gen_1.1.orig.tar.gz), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
# - autopkgtests converted to the test pipeline (1 steps)
package:
  name: libgen-ocaml
  version: '1.1'
  epoch: 0
  description: Simple, efficient iterators for OCaml (Runtime library)
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/o/ocaml-gen/ocaml-gen_${{package.version}}.orig.tar.gz
      expected-sha256: 3e6f7784ed359992e87826035154edd23561b23784a7eeeb4c9146d2b14ec4a2
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p gen -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" gen
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/libgen-ocaml
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libgen-ocaml-dev
    description: Simple, efficient iterators for OCaml (Development package)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/gen"
          mv "${{targets.destdir}}/usr/lib/ocaml/gen/dune-package" "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.ml "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.mli "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.cmi "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.cmt "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.cmti "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.a "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.cmxa "${{targets.contextdir}}/usr/lib/ocaml/gen/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/gen/*.cmx "${{targets.contextdir}}/usr/lib/ocaml/gen/"
    dependencies:
      runtime:
        - libgen-ocaml  # Debian: ${ocaml:Depends}
update:
  enabled: true
  github:
    identifier: c-cube/gen
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - build-base  # Debian: ocaml
        - ocaml-findlib  # Debian: ocaml-findlib
        - ocamlfind  # Debian: ocaml-findlib
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libgen-ocaml/LICENSE
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/o/ocaml-gen/ocaml-gen_${{package.version}}.orig.tar.gz
        expected-sha256: 3e6f7784ed359992e87826035154edd23561b23784a7eeeb4c9146d2b14ec4a2
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libgen-ocaml.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libgen-ocaml.templates" && break
        done
    - name: 'autopkgtest: ocamlfind query gen'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        ocamlfind query gen
