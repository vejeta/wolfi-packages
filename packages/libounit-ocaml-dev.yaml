#
# Generated by debian-to-melange 0.1.0 from Debian source package
# ounit 2.2.7-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ounit
# Debian packaging: https://salsa.debian.org/ocaml-team/ounit
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libounit-ocaml-dev
  version: '2.2.7'
  epoch: 0
  description: Unit testing framework for OCaml
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libxml2-utils
      - coreutils
      - findutils
  environment:
    OCAMLFIND_DESTDIR: /home/build/melange-out/libounit-ocaml-dev/usr/lib/ocaml
    OCAMLFIND_LDCONF: ignore
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gildor478/ounit
      tag: v${{package.version}}
      expected-commit: 3c0464871690562b93bd2501811d5a4b9821a5aa
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ounit2 -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ounit2
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      mkdir -p ${{targets.destdir}}/usr/lib/ocaml
      make install-ounit version=2.2.7
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libounit-ocaml-dev/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/libounit-ocaml-dev/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/libounit-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/ounit2/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libounit-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/ounit2/*
      rmdir "${{targets.destdir}}/usr/doc/ounit2" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.txt -t "${{targets.destdir}}"/usr/share/licenses/libounit-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: gildor478/ounit
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libounit-ocaml-dev/LICENSE.txt
    - uses: test/tw/ldd-check
