#
# GNU binutils for other architectures (as, ld, objdump, dlltool ...), as
# Debian's binutils-<triplet> and binutils-mingw-w64-* packages. Neither
# Wolfi nor Alpine ship them; arch-test assembles its probes with them.
# Each subpackage installs <triplet>-<tool> into /usr/bin.
package:
  name: binutils-cross
  version: '2.47'
  epoch: 0
  description: GNU binutils for other architectures
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - binutils-x86-64-linux-gnu
      - binutils-aarch64-linux-gnu
      - binutils-arm-linux-gnueabihf
      - binutils-m68k-linux-gnu
      - binutils-powerpc-linux-gnu
      - binutils-powerpc64le-linux-gnu
      - binutils-s390x-linux-gnu
      - binutils-sh4-linux-gnu
      - binutils-sparc64-linux-gnu
      - binutils-alpha-linux-gnu
      - binutils-hppa-linux-gnu
      - binutils-riscv64-linux-gnu
      - binutils-loongarch64-linux-gnu
      - binutils-arc-linux-gnu
      - binutils-mingw-w64-i686
      - binutils-mingw-w64-x86-64
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - bison
      - flex
      - texinfo
      - zlib-dev
vars:
  # the GNU triplets of the data below, for the build loop
  triplets: x86_64-linux-gnu aarch64-linux-gnu arm-linux-gnueabihf m68k-linux-gnu powerpc-linux-gnu powerpc64le-linux-gnu s390x-linux-gnu sh4-linux-gnu sparc64-linux-gnu alpha-linux-gnu hppa-linux-gnu riscv64-linux-gnu loongarch64-linux-gnu arc-linux-gnu i686-w64-mingw32 x86_64-w64-mingw32
data:
  # subpackage suffix (Debian's binutils-<suffix>): GNU triplet
  - name: targets
    items:
      x86-64-linux-gnu: x86_64-linux-gnu
      aarch64-linux-gnu: aarch64-linux-gnu
      arm-linux-gnueabihf: arm-linux-gnueabihf
      m68k-linux-gnu: m68k-linux-gnu
      powerpc-linux-gnu: powerpc-linux-gnu
      powerpc64le-linux-gnu: powerpc64le-linux-gnu
      s390x-linux-gnu: s390x-linux-gnu
      sh4-linux-gnu: sh4-linux-gnu
      sparc64-linux-gnu: sparc64-linux-gnu
      alpha-linux-gnu: alpha-linux-gnu
      hppa-linux-gnu: hppa-linux-gnu
      riscv64-linux-gnu: riscv64-linux-gnu
      loongarch64-linux-gnu: loongarch64-linux-gnu
      arc-linux-gnu: arc-linux-gnu
      mingw-w64-i686: i686-w64-mingw32
      mingw-w64-x86-64: x86_64-w64-mingw32
pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/binutils/binutils-${{package.version}}.tar.xz
      expected-sha256: 154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff
  - name: Build and install for each target
    runs: |
      for target in ${{vars.triplets}}; do
        mkdir -p "build-$target"
        (
          cd "build-$target"
          ../configure \
            --build=${{host.triplet.gnu}} --host=${{host.triplet.gnu}} --target="$target" \
            --prefix=/usr --with-sysroot=/usr/"$target" --program-prefix="$target-" \
            --disable-nls --disable-werror --disable-multilib --disable-gdb --disable-gdbserver \
            --disable-gprof --disable-gprofng --disable-gold --disable-sim --disable-readline \
            --disable-libdecnumber --disable-shared --enable-deterministic-archives --with-system-zlib
          make -j$(nproc) all-gas all-ld all-binutils
          make DESTDIR="${{targets.destdir}}" install-gas install-ld install-binutils
        )
      done
      # documentation and host libraries come with Wolfi's own binutils
      rm -rf "${{targets.destdir}}"/usr/share "${{targets.destdir}}"/usr/lib "${{targets.destdir}}"/usr/include
      install -Dm644 COPYING3 -t "${{targets.destdir}}"/usr/share/licenses/binutils-cross
  - uses: strip
subpackages:
  - range: targets
    name: binutils-${{range.key}}
    description: GNU binutils for ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/${{range.value}}-* "${{targets.contextdir}}"/usr/bin/
          mv "${{targets.destdir}}"/usr/${{range.value}} "${{targets.contextdir}}"/usr/
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            ${{range.value}}-as --version | grep -q "GNU assembler"
            ${{range.value}}-ld --version | grep -q "GNU ld"
            ${{range.value}}-objdump -i | grep -q .
update:
  enabled: true
  release-monitor:
    identifier: 7981
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        x86_64-linux-gnu-as --version | grep -q "GNU assembler"
        printf '.globl _start\n_start: nop\n' > t.s
        aarch64-linux-gnu-as t.s -o t.o && aarch64-linux-gnu-ld t.o -o t && aarch64-linux-gnu-objdump -f t | grep -q aarch64
