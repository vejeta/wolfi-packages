#
# GNU binutils for other architectures (as, ld, objdump, dlltool ...), as
# Debian's binutils-<triplet> and binutils-mingw-w64-* packages. Neither
# Wolfi nor Alpine ship them; arch-test assembles its probes with them.
# Each subpackage installs <triplet>-<tool> into /usr/bin.
package:
  name: binutils-cross
  version: '2.47'
  epoch: 0
  description: GNU binutils for other architectures
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - binutils-x86-64-linux-gnu
      - binutils-aarch64-linux-gnu
      - binutils-arm-linux-gnueabihf
      - binutils-m68k-linux-gnu
      - binutils-powerpc-linux-gnu
      - binutils-powerpc64le-linux-gnu
      - binutils-s390x-linux-gnu
      - binutils-sh4-linux-gnu
      - binutils-sparc64-linux-gnu
      - binutils-alpha-linux-gnu
      - binutils-hppa-linux-gnu
      - binutils-riscv64-linux-gnu
      - binutils-loongarch64-linux-gnu
      - binutils-arc-linux-gnu
      - binutils-mingw-w64-i686
      - binutils-mingw-w64-x86-64
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - bison
      - flex
      - texinfo
      - zlib-dev
pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/binutils/binutils-${{package.version}}.tar.xz
      expected-sha256: 154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff
  - name: Build and install for each target
    runs: |
      for target in \
        x86_64-linux-gnu \
        aarch64-linux-gnu \
        arm-linux-gnueabihf \
        m68k-linux-gnu \
        powerpc-linux-gnu \
        powerpc64le-linux-gnu \
        s390x-linux-gnu \
        sh4-linux-gnu \
        sparc64-linux-gnu \
        alpha-linux-gnu \
        hppa-linux-gnu \
        riscv64-linux-gnu \
        loongarch64-linux-gnu \
        arc-linux-gnu \
        i686-w64-mingw32 \
        x86_64-w64-mingw32 \
        ; do
        mkdir -p "build-$target"
        (
          cd "build-$target"
          ../configure \
            --build=${{host.triplet.gnu}} --host=${{host.triplet.gnu}} --target="$target" \
            --prefix=/usr --with-sysroot=/usr/"$target" --program-prefix="$target-" \
            --disable-nls --disable-werror --disable-multilib --disable-gdb --disable-gdbserver \
            --disable-gprof --disable-gprofng --disable-gold --disable-sim --disable-readline \
            --disable-libdecnumber --disable-shared --enable-deterministic-archives --with-system-zlib
          make -j$(nproc) all-gas all-ld all-binutils
          make DESTDIR="${{targets.destdir}}" install-gas install-ld install-binutils
        )
      done
      # documentation and host libraries come with Wolfi's own binutils
      rm -rf "${{targets.destdir}}"/usr/share "${{targets.destdir}}"/usr/lib "${{targets.destdir}}"/usr/include
      install -Dm644 COPYING3 -t "${{targets.destdir}}"/usr/share/licenses/binutils-cross
  - uses: strip
subpackages:
  - name: binutils-x86-64-linux-gnu
    description: GNU binutils for x86_64-linux-gnu
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/x86_64-linux-gnu-* "${{targets.contextdir}}"/usr/bin/
          mv "${{targets.destdir}}"/usr/x86_64-linux-gnu "${{targets.contextdir}}"/usr/
    test:
      pipeline:
        - runs: |
            x86_64-linux-gnu-as --version | grep -q "GNU assembler"
            x86_64-linux-gnu-ld --version | grep -q "GNU ld"
            x86_64-linux-gnu-objdump -i | grep -q .
  - name: binutils-aarch64-linux-gnu
    description: GNU binutils for aarch64-linux-gnu
    pipeline:
