update:
  enabled: true
  release-monitor:
    identifier: 7981
test:
  pipeline:
    - runs: |
        x86_64-linux-gnu-as --version | grep -q "GNU assembler"
        printf '.globl _start\n_start: nop\n' > t.s
        aarch64-linux-gnu-as t.s -o t.o && aarch64-linux-gnu-ld t.o -o t && aarch64-linux-gnu-objdump -f t | grep -q aarch64
