# Generated by debian-to-melange 0.1.0 from Debian source package
# fonts-lobstertwo 2.0-3 (3.0 (quilt)).
# https://tracker.debian.org/pkg/fonts-lobstertwo
# Debian packaging: https://salsa.debian.org/fonts-team/fonts-lobstertwo
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-lobstertwo/fonts-lobstertwo_2.0.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: fonts-lobstertwo
  version: '2.0'
  epoch: 0
  description: Updated and improved family version of the Lobster font
  copyright:
    - license: OFL-1.1
  dependencies:
    runtime:
      - fonts-lobster
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-lobstertwo/$f .recipe-files/; done
      rmdir fonts-lobstertwo 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-lobstertwo/fonts-lobstertwo_${{package.version}}.orig.tar.gz
      expected-sha256: e964b3734db3a2522bd6e44896e7afab1e64f0f4cea059b618d226d0aeadeb5c
  - name: From debian/rules override_dh_install
    runs: |
      chmod 644 lobstertwo\ v*/src/*.otf
      cd lobstertwo\ v*/src && cp LobsterTwo-BoldItalic.otf lobster.otf
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/lobstertwo"
      ln -sf /usr/share/fonts/opentype/lobster/lobster.otf "${{targets.destdir}}/usr/share/fonts/opentype/lobstertwo/LobsterTwo-BoldItalic.otf"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-lobstertwo/copyright
subpackages:
  - name: fonts-lobster
    description: Bold condensed script with many ligatures and alternates
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/fonts/opentype/lobster"
          mv "${{targets.destdir}}"/lobstertwo?v*/src/lobster.otf "${{targets.contextdir}}/usr/share/fonts/opentype/lobster/"
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-lobstertwo/copyright
