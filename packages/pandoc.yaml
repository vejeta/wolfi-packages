package:
  name: pandoc
  version: '3.11'
  epoch: 0
  description: General markup converter
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      # TODO(debian-to-melange): pandoc-data is not in Wolfi (Debian: pandoc-data); left out
      # TODO(debian-to-melange): pandoc-data is not in Wolfi (Debian: pandoc-data); left out
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      # TODO(debian-to-melange): alex is not in Wolfi (Debian: alex); left out
      - bash-completion
      # TODO(debian-to-melange): ghc is not in Wolfi (Debian: ghc); left out
      # TODO(debian-to-melange): ghc-prof is not in Wolfi (Debian: ghc-prof); left out
      # TODO(debian-to-melange): happy is not in Wolfi (Debian: happy); left out
      # TODO(debian-to-melange): haskell-devscripts is not in Wolfi (Debian: haskell-devscripts); left out
      # TODO(debian-to-melange): libghc-hslua-cli-dev is not in Wolfi (Debian: libghc-hslua-cli-dev); left out
      # TODO(debian-to-melange): libghc-hslua-cli-dev is not in Wolfi (Debian: libghc-hslua-cli-dev); left out
      # TODO(debian-to-melange): libghc-hslua-cli-prof is not in Wolfi (Debian: libghc-hslua-cli-prof); left out
      # TODO(debian-to-melange): libghc-pandoc-dev is not in Wolfi (Debian: libghc-pandoc-dev); left out
      # TODO(debian-to-melange): libghc-pandoc-dev is not in Wolfi (Debian: libghc-pandoc-dev); left out
      # TODO(debian-to-melange): libghc-pandoc-prof is not in Wolfi (Debian: libghc-pandoc-prof); left out
      # TODO(debian-to-melange): libghc-pandoc-lua-engine-dev is not in Wolfi (Debian: libghc-pandoc-lua-engine-dev); left out
      # TODO(debian-to-melange): libghc-pandoc-lua-engine-dev is not in Wolfi (Debian: libghc-pandoc-lua-engine-dev); left out
      # TODO(debian-to-melange): libghc-pandoc-lua-engine-prof is not in Wolfi (Debian: libghc-pandoc-lua-engine-prof); left out
      # TODO(debian-to-melange): libghc-temporary-dev is not in Wolfi (Debian: libghc-temporary-dev); left out
      # TODO(debian-to-melange): libghc-temporary-dev is not in Wolfi (Debian: libghc-temporary-dev); left out
      # TODO(debian-to-melange): libghc-temporary-prof is not in Wolfi (Debian: libghc-temporary-prof); left out
      # TODO(debian-to-melange): pandoc-data is not in Wolfi (Debian: pandoc-data); left out
      - coreutils
      - findutils
  environment:
    CABAL_PACKAGE: pandoc-cli
    LANG: C.UTF-8
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv pandoc/$f .recipe-files/; done
      rmdir pandoc 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/pandoc/pandoc_${{package.version}}.orig.tar.gz
      expected-sha256: a9f3fc8c64962c8778b379cc2238c7c554541e1e94fd36a210c3f92e1729e929
  - name: Install files
    runs: |
      install -Dm644 man/pandoc.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/pandoc/copyright
  - name: From debian/rules execute_after_dh_auto_install
    runs: |
      mkdir -p debian
      ${{targets.destdir}}/usr/bin/pandoc --bash-completion  		> debian/pandoc.bash-completion
update:
  enabled: true
  release-monitor:
    identifier: 2589
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        pandoc --version || (pandoc --help 2>&1 || true) | grep -qi -e usage -e pandoc
        test -f /usr/share/doc/pandoc/copyright
    - uses: test/tw/ldd-check
