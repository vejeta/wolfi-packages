#
# Generated by debian-to-melange 0.1.0 from Debian source package
# ppxlib 0.39.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/ppxlib
# Debian packaging: https://salsa.debian.org/ocaml-team/ppxlib
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/p/ppxlib/ppxlib_0.39.0.orig.tar.bz2), which disappears from the pool when Debian updates
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppxlib-ocaml-dev
  version: '0.39.0'
  epoch: 0
  description: Meta-programming for OCaml
  copyright:
    - license: MIT
    - license: LGPL-2.1-with-linking-exception
      paths:
        - ast/ast.ml
        - 'ast/pprintast.ml*'
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - libocaml-compiler-libs-ocaml-dev  # Wolfi Community Packages
      - libppx-derivers-ocaml-dev  # Wolfi Community Packages
      - libsexplib0-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - libcinaps-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/ppxlib/ppxlib_${{package.version}}.orig.tar.bz2
      expected-sha256: 441a2814dbac3f5dc0c8dcefca263548e9b4d6dda1ef2990ce6a4999e108be3c
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppxlib,ppxlib-bench,ppxlib-tools -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppxlib ppxlib-bench ppxlib-tools
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppxlib-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml-ppx/ppxlib
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppxlib-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
