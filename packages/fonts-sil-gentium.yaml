#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-sil-gentium/fonts-sil-gentium_1.03.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-sil-gentium
  version: '1.03'
  epoch: 0
  description: 'Extended Unicode Latin font ("a typeface for the nations")'
  copyright:
    - license: OFL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-gentium/$f .recipe-files/; done
      rmdir fonts-sil-gentium 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-sil-gentium/fonts-sil-gentium_${{package.version}}.orig.tar.xz
      expected-sha256: 0754edaec5837f899caf9248496438cf5adc5f2795ee36ac19e49f08bdfd751c
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/truetype/gentium"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium/"
      cp -a README.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium/"
      cp -a GENTIUM-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium/"
      cp -a QUOTES.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentium/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-gentium/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-gentium/copyright
