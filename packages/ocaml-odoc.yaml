            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
  - name: libodoc-parser-ocaml-dev
    description: Parser for OCaml documentation comments (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libodoc-parser-ocaml-dev"
          for f in "${{targets.destdir}}"/usr/doc/odoc-parser/*; do cp -a "$f" "${{targets.contextdir}}/usr/share/doc/libodoc-parser-ocaml-dev/"; done
          rm -rf "${{targets.destdir}}"/usr/doc/odoc-parser/*
          rmdir "${{targets.destdir}}/usr/doc/odoc-parser" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser && find . -type f ! \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/odoc-parser/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/odoc-parser/"$p"
          done; true
          for d in "${{targets.destdir}}"/usr/share/ocaml-dune/*/odoc-parser; do
            [ -d "$d" ] || continue
            r=${d#"${{targets.destdir}}"/}
