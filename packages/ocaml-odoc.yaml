pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Remove-unused-compiler-libs.optcomp-from-loader-depe.patch 0002-Remove-dependency-on-compiler-libs.optcomp.patch odoc.1; do mv ocaml-odoc/$f .recipe-files/; done
      rmdir ocaml-odoc 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/odoc
      tag: ${{package.version}}
      expected-commit: 6427579346781df958b3bdfe8ac6d4550194012a
  - uses: patch
    with:
      patches: .recipe-files/0001-Remove-unused-compiler-libs.optcomp-from-loader-depe.patch .recipe-files/0002-Remove-dependency-on-compiler-libs.optcomp.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p odoc,odoc,odoc-parser,odoc-parser -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" odoc odoc odoc-parser odoc-parser
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/odoc.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/ocaml-odoc"
      for f in "${{targets.destdir}}"/usr/doc/odoc/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/ocaml-odoc/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/odoc/*
      rmdir "${{targets.destdir}}/usr/doc/odoc" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-odoc
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libodoc-ocaml-dev
    description: Documentation generator for OCaml (development libraries)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/odoc ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/odoc && find . -type f ! \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/odoc/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/odoc/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/odoc/"$p"
          done; true
          for d in "${{targets.destdir}}"/usr/share/ocaml-dune/*/odoc; do
            [ -d "$d" ] || continue
            r=${d#"${{targets.destdir}}"/}
            mkdir -p "${{targets.contextdir}}"/$(dirname "$r") && mv "$d" "${{targets.contextdir}}"/"$r"
          done
    dependencies:
      runtime:
        - libodoc-ocaml  # Debian: ${ocaml:Depends}
        - libcamlp-streams-ocaml-dev  # Debian: ${ocaml:Depends}
        - libastring-ocaml-dev  # Debian: ${ocaml:Depends}
        - libfpath-ocaml-dev  # Debian: ${ocaml:Depends}
        - libcmdliner-ocaml-dev  # Debian: ${ocaml:Depends}
        - libresult-ocaml-dev  # Debian: ${ocaml:Depends}
        - libtyxml-ocaml-dev  # Debian: ${ocaml:Depends}
        - libfmt-ocaml-dev  # Debian: ${ocaml:Depends}
        - libre-ocaml-dev  # Debian: ${ocaml:Depends}
  - name: libodoc-ocaml
    description: Documentation generator for OCaml (runtime libraries)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/odoc ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/odoc && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
            mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/odoc/$(dirname "$p")
            mv "${{targets.destdir}}"/usr/lib/ocaml/odoc/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/odoc/"$p"
