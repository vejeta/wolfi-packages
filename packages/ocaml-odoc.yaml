package:
  name: ocaml-odoc
  version: '3.2.1'
  epoch: 0
  description: Documentation generator for OCaml (standalone tool)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - ocaml
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - cppo  # Wolfi Community Packages
      - ocaml-dune
      - ocaml-crunch  # Wolfi Community Packages
      - libcamlp-streams-ocaml-dev  # Wolfi Community Packages
      - libastring-ocaml-dev  # Wolfi Community Packages
      - libfpath-ocaml-dev  # Wolfi Community Packages
      - libcmdliner-ocaml-dev  # Wolfi Community Packages
      - libresult-ocaml-dev  # Wolfi Community Packages
      - libtyxml-ocaml-dev  # Wolfi Community Packages
      - libfmt-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Remove-unused-compiler-libs.optcomp-from-loader-depe.patch 0002-Remove-dependency-on-compiler-libs.optcomp.patch odoc.1; do mv ocaml-odoc/$f .recipe-files/; done
      rmdir ocaml-odoc 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/odoc
      tag: ${{package.version}}
      expected-commit: 6427579346781df958b3bdfe8ac6d4550194012a
  - uses: patch
    with:
      patches: .recipe-files/0001-Remove-unused-compiler-libs.optcomp-from-loader-depe.patch .recipe-files/0002-Remove-dependency-on-compiler-libs.optcomp.patch
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/odoc.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/share/doc/ocaml-odoc"
      cp -a usr/doc/odoc/* "${{targets.destdir}}/usr/share/doc/ocaml-odoc/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/ocaml-odoc
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libodoc-ocaml-dev
    description: Documentation generator for OCaml (development libraries)
    pipeline:
      - uses: split/dev
  - name: libodoc-ocaml
    description: Documentation generator for OCaml (runtime libraries)
    pipeline:
      # TODO(debian-to-melange): no debian/libodoc-ocaml.install; define which files go to this subpackage
      - runs: |
          true
  - name: libodoc-parser-ocaml-dev
    description: Parser for OCaml documentation comments (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libodoc-parser-ocaml-dev"
          cp -a usr/doc/odoc-parser/* "${{targets.contextdir}}/usr/share/doc/libodoc-parser-ocaml-dev/"
  - name: libodoc-parser-ocaml
    description: Parser for OCaml documentation comments (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libodoc-parser-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: ocaml/odoc
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        odoc --version || (odoc --help 2>&1 || true) | grep -qi -e usage -e odoc
        test -f /usr/share/licenses/ocaml-odoc/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/ocaml/odoc
        tag: ${{package.version}}
        expected-commit: 6427579346781df958b3bdfe8ac6d4550194012a
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/ocaml-odoc.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/ocaml-odoc.templates" && break
        done
    - name: 'autopkgtest: odoc-on-odoc'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        this=odoc-on-odoc
        indir=${PWD}
        outdir=${ADT_ARTIFACTS:-/tmp}/${this}
        mkdir -p ${outdir}
        cp -r ${indir}/*  ${outdir}
        [ ! -d ${indir}/.pc ] || cp -r ${indir}/.pc ${outdir} 

        cd ${outdir}

        dune build -p odoc @doc 2>&1

        nb_html=`find _build/default/_doc/_html/ -name "*.html" | wc -l`
        echo -n "Generated $nb_html HTML pages. "
        if [ $nb_html -gt 100 ]; then
            echo "That number seems OK."
        else
            echo "That is not enough."
        fi
