        - libtyxml-ocaml-dev  # Debian: ${ocaml:Depends}
        - libfmt-ocaml-dev  # Debian: ${ocaml:Depends}
        - libre-ocaml-dev  # Debian: ${ocaml:Depends}
  - name: libodoc-parser-ocaml
    description: Parser for OCaml documentation comments (runtime files)
    pipeline:
      - runs: |
          [ -d "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser ] && (cd "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser && find . -type f \( -name META -o -name '*.cma' -o -name '*.cmxs' \)) | while read -r p; do
