            mv "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser/"$p" "${{targets.contextdir}}"/usr/lib/ocaml/odoc-parser/"$p"
          done; true
          for a in "${{targets.destdir}}"/usr/lib/ocaml/odoc-parser/lib*.a; do
            [ -e "$a" ] || continue
            s=$(basename "$a" .a); s=${s#lib}
            d="${{targets.destdir}}"/usr/lib/ocaml/stublibs/dll$s.so
            [ -e "$d" ] && mkdir -p "${{targets.contextdir}}"/usr/lib/ocaml/stublibs && mv "$d" "${{targets.contextdir}}"/usr/lib/ocaml/stublibs/
          done; true
update:
  enabled: true
  github:
    identifier: ocaml/odoc
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - libodoc-ocaml  # Debian's @: the binary packages of the source
        - libodoc-ocaml-dev  # Debian's @: the binary packages of the source
        - libodoc-parser-ocaml  # Debian's @: the binary packages of the source
        - libodoc-parser-ocaml-dev  # Debian's @: the binary packages of the source
        - build-base  # Debian: build-essential
        - ocaml  # Debian: ocaml
        - ocaml-compiler-libs  # Debian: ocaml
        - ocaml-findlib-compat  # Debian: ocaml
        - zstd-dev  # Debian: ocaml
        - cppo  # Wolfi Community Packages
        - ocaml-dune
        - ocaml-crunch  # Wolfi Community Packages
        - libcamlp-streams-ocaml-dev  # Wolfi Community Packages
        - libastring-ocaml-dev  # Wolfi Community Packages
        - libfpath-ocaml-dev  # Wolfi Community Packages
        - libcmdliner-ocaml-dev  # Wolfi Community Packages
        - libresult-ocaml-dev  # Wolfi Community Packages
        - libtyxml-ocaml-dev  # Wolfi Community Packages
        - libfmt-ocaml-dev  # Wolfi Community Packages
        - libre-ocaml-dev  # Wolfi Community Packages
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        odoc --version || (odoc --help 2>&1 || true) | grep -qi -e usage -e odoc
        test -f /usr/share/licenses/ocaml-odoc/LICENSE
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/ocaml/odoc
        tag: ${{package.version}}
        expected-commit: 6427579346781df958b3bdfe8ac6d4550194012a
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/ocaml-odoc.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/ocaml-odoc.templates" && break
        done
    - name: 'autopkgtest: odoc-on-odoc'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        set -e

        this=odoc-on-odoc
        indir=${PWD}
        outdir=${ADT_ARTIFACTS:-/tmp}/${this}
        mkdir -p ${outdir}
        cp -r ${indir}/*  ${outdir}
        [ ! -d ${indir}/.pc ] || cp -r ${indir}/.pc ${outdir} 

        cd ${outdir}

        dune build -p odoc @doc 2>&1

        nb_html=`find _build/default/_doc/_html/ -name "*.html" | wc -l`
        echo -n "Generated $nb_html HTML pages. "
        if [ $nb_html -gt 100 ]; then
            echo "That number seems OK."
        else
            echo "That is not enough."
        fi
