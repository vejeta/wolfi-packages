# Debian packaging: https://salsa.debian.org/fonts-team/skia-pathops
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-skia-pathops for Python 3.10, 3.11, 3.12, 3.13
package:
  name: py3-skia-pathops
  version: '0.9.2'
  epoch: 0
  description: 'Python bindings for the Skia library''s Path Ops module (Python 3)'
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0
vars:
  pypi-package: skia-pathops
  import: skia_pathops
data:
  - name: py-versions
    items:
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base-dev
      - python3
      - libskia-dev  # Wolfi Community Packages
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - coreutils
      - findutils
  environment:
    BUILD_SKIA_FROM_SOURCE: '0'
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Allow-cython-3.1.0.patch; do mv py3-skia-pathops/$f .recipe-files/; done
      rmdir py3-skia-pathops 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/skia-pathops
      tag: v${{package.version}}
      expected-commit: c11e91f442462d1efc1a45d76c76ae9e74aa0de4
  - uses: patch
    with:
      patches: .recipe-files/0001-Allow-cython-3.1.0.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-skia-pathops"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/py3-skia-pathops/"
  - name: From debian/rules execute_before_dh_auto_configure
    runs: |
      ln -sf /usr/include/skia debian/skia-include-shim/include
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: fonttools/skia-pathops
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-skia-pathops
  pipeline:
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
