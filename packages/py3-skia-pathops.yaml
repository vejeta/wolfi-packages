package:
  name: py3-skia-pathops
  version: '0.9.2'
  epoch: 0
  description: 'Python bindings for the Skia library''s Path Ops module (Python 3)'
  copyright:
    - license: BSD-3-Clause
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - py3-pip
      - py3-wheel
      - py3.13-cython-bin  # Debian: cython3
      - libskia-dev  # Wolfi Community Packages
      - python3-dev
      - py3-supported-setuptools  # Debian: python3-setuptools
      - py3.13-setuptools-scm-bin  # commands of Debian's python3-setuptools-scm
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - coreutils
      - findutils
  environment:
    BUILD_SKIA_FROM_SOURCE: '0'
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Allow-cython-3.1.0.patch; do mv py3-skia-pathops/$f .recipe-files/; done
      rmdir py3-skia-pathops 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/fonttools/skia-pathops
      tag: v${{package.version}}
      expected-commit: c11e91f442462d1efc1a45d76c76ae9e74aa0de4
      recurse-submodules: true
  - uses: patch
    with:
      patches: .recipe-files/0001-Allow-cython-3.1.0.patch
  - uses: py/pip-build-install
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-skia-pathops"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/py3-skia-pathops/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/py3-skia-pathops
  - name: From debian/rules execute_before_dh_auto_configure
    runs: |
      ln -sf /usr/include/skia debian/skia-include-shim/include
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: fonttools/skia-pathops
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
  pipeline:
    - runs: |
        test -f /usr/share/licenses/py3-skia-pathops/LICENSE
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python3
        imports: import skia_pathops
