# cppo 1.8.0-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/cppo
# Debian packaging: https://salsa.debian.org/ocaml-team/cppo
#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: cppo
  version: '1.8.0'
  epoch: 0
  description: Cpp for OCaml
  copyright:
    - license: BSD-3-Clause
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - ocaml-compiler-libs  # Debian: ocaml
      - ocamlbuild
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Use-literal-file-names-in-tests.patch cppo.1; do mv cppo/$f .recipe-files/; done
      rmdir cppo 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml-community/cppo
      tag: v${{package.version}}
      expected-commit: a3e90caf8fe416000f8aff8e1b1e7ee3b309d589
  - uses: patch
    with:
      patches: .recipe-files/0001-Use-literal-file-names-in-tests.patch
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build --release -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)"
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/cppo.1 -t "${{targets.destdir}}/usr/share/man/man1"
      mkdir -p "${{targets.destdir}}/usr/bin"
      mkdir -p "${{targets.destdir}}/usr/share/doc/cppo/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/cppo/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/cppo"
      mv "${{targets.destdir}}"/usr/doc/*/* "${{targets.destdir}}/usr/share/doc/cppo/"
      rmdir "${{targets.destdir}}/usr/doc/*" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/cppo
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
update:
  enabled: true
  github:
    identifier: ocaml-community/cppo
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        cppo --version || (cppo --help 2>&1 || true) | grep -qi -e usage -e cppo
        test -f /usr/share/licenses/cppo/LICENSE.md
    - uses: test/tw/ldd-check
