package:
  name: perl-bibtex-parser
  version: '1.95'
  epoch: 0
  description: Pure Perl BibTeX parser
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
    - license: LicenseRef-public-domain
      paths:
        - Makefile.TDS
  dependencies:
    runtime:
      - perl-io-string  # Debian: libio-string-perl
      # TODO(debian-to-melange): perl-latex-tounicode is not in Wolfi (Debian: liblatex-tounicode-perl); left out
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
      - perl-io-string  # Debian: libio-string-perl
      # TODO(debian-to-melange): perl-latex-tounicode is not in Wolfi (Debian: liblatex-tounicode-perl); left out
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/B/BO/BORISV/BibTeX-Parser-${{package.version}}.tar.gz
      expected-sha256: 0f37ee5fb69170dfb7b04aa928eb257cf0a3ea31801e83ce13738f26b39aabaa
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf t/bibs/mathscinet.txt t/bug66325.t
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-bibtex-parser
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
