package:
  name: dh-autoreconf
  version: '23'
  epoch: 0
  description: Debhelper add-on to call autoreconf and clean up after the build
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - autoconf
      - automake
      - gettext  # Debian: autopoint
      - perl-debhelper  # Wolfi Community Packages (Debian: libdebhelper-perl)
      - libtool
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - coreutils
      - findutils
      - perl
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv dh-autoreconf/$f .recipe-files/; done
      rmdir dh-autoreconf 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/dh-autoreconf/dh-autoreconf_${{package.version}}.tar.xz
      expected-sha256: de3b148be7145f3cfba64435a18b9df5987949d004aadae3baa7146023a0e56b
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      pod2man -r "dh-autoreconf v${{package.version}}" -c dh-autoreconf --section=1 dh_autoreconf dh_autoreconf.1
      pod2man -r "dh-autoreconf v${{package.version}}" -c dh-autoreconf --section=1 dh_autoreconf_clean dh_autoreconf_clean.1
      pod2man -r "dh-autoreconf v${{package.version}}" -c dh-autoreconf --section=7 dh-autoreconf.pod dh-autoreconf.7
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/Debhelper/Sequence"
      cp -a autoreconf.pm "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/Debhelper/Sequence/"
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a dh_autoreconf "${{targets.destdir}}/usr/bin/"
      cp -a dh_autoreconf_clean "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share/dh-autoreconf"
      cp -a ltmain-as-needed.diff "${{targets.destdir}}/usr/share/dh-autoreconf/"
      install -Dm644 dh-autoreconf.7 -t "${{targets.destdir}}/usr/share/man/man7"
      install -Dm644 dh_autoreconf.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 dh_autoreconf_clean.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/dh-autoreconf/copyright
  - name: Commands are executable (dh_fixperms)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        [ -d "$d/usr/bin" ] && find "$d/usr/bin" -type f -exec chmod 755 {} +
      done
      true
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        dh_autoreconf --version || (dh_autoreconf --help 2>&1 || true) | grep -qi -e usage -e dh_autoreconf
        dh_autoreconf_clean --version || (dh_autoreconf_clean --help 2>&1 || true) | grep -qi -e usage -e dh_autoreconf_clean
        test -f /usr/share/doc/dh-autoreconf/copyright
