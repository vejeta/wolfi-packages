# Generated by debian-to-melange 0.1.0 from Debian source package
# pytest-runner 6.0.1-2 (3.0 (quilt)).
# https://tracker.debian.org/pkg/pytest-runner
# Debian packaging: https://salsa.debian.org/python-team/packages/pytest-runner
#
# Conversion notes:
# - debian/patches import 'packaging', not in upstream's requirements; added
# - ${python3:Depends} from upstream's requirements: packaging
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/p/pytest-runner/pytest-runner_6.0.1.orig.tar.gz), which disappears from the pool when Debian updates
# - Wolfi Python layout: py3.X-pytest-runner for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-pytest-runner
  version: '6.0.1'
  epoch: 0
  description: Invoke pytest as distutils command with dependency resolution
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
vars:
  pypi-package: pytest-runner
  import: ptr
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - py3-supported-packaging  # Debian: python3-packaging
      - py3-supported-pytest  # Debian: python3-pytest
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/pytest-runner/pytest-runner_${{package.version}}.orig.tar.gz
      expected-sha256: 70d4739585a7008f37bf4933c013fdb327b8878a5a69fcbb3316c88882f0f49b
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in stop-using-pkg_resources.patch; do mv py3-pytest-runner/$f .recipe-files/; done
      rmdir py3-pytest-runner 2>/dev/null || true
  - uses: patch
    with:
      patches: .recipe-files/stop-using-pkg_resources.patch
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-setuptools
        - py${{range.key}}-packaging
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: pytest-dev/pytest-runner
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-pytest-runner
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
