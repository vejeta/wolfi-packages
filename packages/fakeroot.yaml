environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - meson
      - acl-dev  # Debian: libacl1-dev
      - libcap-dev
      - libcap-utils  # Debian: libcap2-bin
      - attr
      - po4a  # Wolfi Community Packages
      - sharutils  # Wolfi Community Packages
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Disable-t.xattr2-because-it-fails-consistently-on-th.patch fakeroot.postinst.in; do mv fakeroot/$f .recipe-files/; done
      rmdir fakeroot 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fakeroot/fakeroot_${{package.version}}.orig.tar.xz
      expected-sha256: 0822bd5a9f0cf19d2ba0546b88b0432d4d3d9917db62c57b74044ccadba06e49
  - uses: patch
    with:
      patches: .recipe-files/0001-Disable-t.xattr2-because-it-fails-consistently-on-th.patch
  - name: Configure (from debian/rules override_dh_auto_configure)
    runs: |
      meson setup --prefix=/usr --libdir=lib --libexecdir=lib --buildtype=plain --wrap-mode=nodownload build-sysv --libdir=/usr/lib/libfakeroot -D ipc=sysv -D program_suffix=-sysv
      meson setup --prefix=/usr --libdir=lib --libexecdir=lib --buildtype=plain --wrap-mode=nodownload build-tcp --libdir=/usr/lib/libfakeroot -D ipc=tcp -D program_suffix=-tcp
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      meson compile -C build-sysv
      meson compile -C build-tcp
      mkdir -p debian
      sed 's/@FAKEROOT_SYSV_ALTPRIO@/50/;s/@FAKEROOT_TCP_ALTPRIO@/30/;'  		.recipe-files/fakeroot.postinst.in > debian/fakeroot.postinst
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      DESTDIR="${{targets.destdir}}/" meson install -C build-tcp
      ls -l ${{targets.destdir}}/usr/lib/libfakeroot
      rm -f ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-tcp.so
      mv ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-tcp-0.so ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-tcp.so
      DESTDIR="${{targets.destdir}}/" meson install -C build-sysv
      rm -f ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-sysv.so
      mv ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-sysv-0.so ${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-sysv.so
      mkdir -p ${{targets.destdir}}/etc/ld.so.conf.d
      echo /usr/lib/libfakeroot > ${{targets.destdir}}/etc/ld.so.conf.d/fakeroot-${{host.triplet.gnu}}.conf
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fakeroot"
      cp -a DEBUG "${{targets.destdir}}/usr/share/doc/fakeroot/"
      cp -a README "${{targets.destdir}}/usr/share/doc/fakeroot/"
      cp -a doc/README.saving "${{targets.destdir}}/usr/share/doc/fakeroot/"
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/fakeroot
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libfakeroot
    description: Tool for simulating superuser privileges - shared libraries
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc/ld.so.conf.d"
          mv "${{targets.destdir}}"/etc/ld.so.conf.d/fakeroot-*.conf "${{targets.contextdir}}/etc/ld.so.conf.d/"
          mkdir -p "${{targets.contextdir}}/usr/lib/libfakeroot"
          mv "${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-sysv.so" "${{targets.contextdir}}/usr/lib/libfakeroot/"
          mv "${{targets.destdir}}/usr/lib/libfakeroot/libfakeroot-tcp.so" "${{targets.contextdir}}/usr/lib/libfakeroot/"
          ln -sf /usr/lib/libfakeroot/libfakeroot-tcp.so "${{targets.contextdir}}/usr/lib/libfakeroot/libfakeroot-0.so"
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libfakeroot"
          cp -a DEBUG "${{targets.contextdir}}/usr/share/doc/libfakeroot/"
          cp -a README "${{targets.contextdir}}/usr/share/doc/libfakeroot/"
          cp -a doc/README.saving "${{targets.contextdir}}/usr/share/doc/libfakeroot/"
update:
  enabled: true
  release-monitor:
    identifier: 12048
test:
  environment:
    contents:
      packages:
        - busybox
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
  pipeline:
    - runs: |
        faked-* --version || (faked-* --help 2>&1 || true) | grep -qi -e usage -e faked-*
        fakeroot-* --version || (fakeroot-* --help 2>&1 || true) | grep -qi -e usage -e fakeroot-*
        test -f /usr/share/licenses/fakeroot/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/f/fakeroot/fakeroot_${{package.version}}.orig.tar.xz
        expected-sha256: 0822bd5a9f0cf19d2ba0546b88b0432d4d3d9917db62c57b74044ccadba06e49
    - name: 'autopkgtest: state'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        cd "$AUTOPKGTEST_TMP"
        WORKDIR=$(mktemp -d)
        trap "rm -rf $WORKDIR" EXIT INT QUIT ABRT PIPE TERM

        touch ${WORKDIR}/foo

        fakeroot -s ${WORKDIR}/state chown nobody ${WORKDIR}/foo

        real=$(stat --format '%u' ${WORKDIR}/foo)
        fake=$(fakeroot -i ${WORKDIR}/state stat --format '%U' ${WORKDIR}/foo)

        case "${real}:${fake}" in
          (0:*)
          echo >&2 "test run under root: failure"
          exit 1
          ;;
          (*:nobody)
          echo "state: OK"
          ;;
          (*)
          echo >&2 "unexpected result (${real}:${fake}): failure"
          exit 2
          ;;
        esac
