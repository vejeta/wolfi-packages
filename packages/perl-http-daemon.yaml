package:
  name: perl-http-daemon
  version: '6.17'
  epoch: 0
  description: A simple http server class
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-http-date
      - perl-http-message
      - perl-lwp-mediatypes
    replaces:
      - perl-libwww
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl-dev
      - perl-module-build-tiny
      - perl-module-build
      - perl
      - perl-http-date
      - perl-http-message
      - perl-lwp-mediatypes
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTTP-Daemon-${{package.version}}.tar.gz
      expected-sha512: a745babab5165e5948014adf6b5f3e628730cfd472327835169174836002fb252e053165a4f99621d855b2b7adb9b15d52c2952114e16e79752cdeb2faf421d9
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      perl Build.PL --installdirs=vendor
      ./Build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      ./Build install --destdir="$pkgdir"
      find "$pkgdir" \( -name perllocal.pod -o -name .packlist \) -delete
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
update:
  enabled: true
  release-monitor:
    identifier: 2975
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
