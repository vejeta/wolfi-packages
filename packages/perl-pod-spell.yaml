package:
  name: perl-pod-spell
  version: '1.27'
  epoch: 0
  description: Formatter to easily check the spelling of POD
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl-class-tiny  # Debian: libclass-tiny-perl
      - perl-file-sharedir  # Debian: libfile-sharedir-perl
      - perl-lingua-en-inflect  # Wolfi Community Packages (Debian: liblingua-en-inflect-perl)
      - perl  # Debian: libpod-simple-perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-class-tiny  # Debian: libclass-tiny-perl
      - perl-file-sharedir-install  # Debian: libfile-sharedir-install-perl
      - perl-file-sharedir  # Debian: libfile-sharedir-perl
      - perl-lingua-en-inflect  # Wolfi Community Packages (Debian: liblingua-en-inflect-perl)
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in autopkgtest.patch; do mv perl-pod-spell/$f .recipe-files/; done
      rmdir perl-pod-spell 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/H/HA/HAARG/Pod-Spell-${{package.version}}.tar.gz
      expected-sha256: 7ef56c9229f3efbc71a0462ce44490c0dd49fbf3b21fe85bb08b1eeac6f7b063
  - uses: patch
    with:
      patches: .recipe-files/autopkgtest.patch
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/perl-pod-spell"
      cp -a CONTRIBUTING "${{targets.destdir}}/usr/share/doc/perl-pod-spell/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/perl-pod-spell
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 3247
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/licenses/perl-pod-spell/LICENSE
    - name: Load the module
      runs: |
        perl -MPod::Spell -e1
