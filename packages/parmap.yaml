# parmap 1.2.5-3 (3.0 (quilt)).
# https://tracker.debian.org/pkg/parmap
# Debian packaging: https://salsa.debian.org/ocaml-team/parmap
#
# Conversion notes:
# - build dependency 'libdune-ocaml-dev' (Debian 'libdune-ocaml-dev') not found in Wolfi; left out
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - unsupported Debian build system 'ocaml_dune'
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libparmap-ocaml
  version: '1.2.5'
  epoch: 0
  description: Small OCaml library allowing to exploit multicore architectures (runtime)
  copyright:
    - license: LGPL-2-with-linking-exception
    - license: GPL-2.0-or-later
      paths:
        - 'tests/*'
    - license: GPL-2.0-or-later
      paths:
        - 'example/*'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      # TODO(debian-to-melange): libdune-ocaml-dev is not in Wolfi (Debian: libdune-ocaml-dev); left out
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Do-not-run-tests-that-are-too-heavy-for-buildds.patch; do mv parmap/$f .recipe-files/; done
      rmdir parmap 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/rdicosmo/parmap
      tag: ${{package.version}}
      expected-commit: 963608763589e03de38e744d359884d491e65460
  - uses: patch
    with:
      patches: .recipe-files/0001-Do-not-run-tests-that-are-too-heavy-for-buildds.patch
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/parmap
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libparmap-ocaml-dev
    description: Small OCaml library allowing to exploit multicore architectures (development)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libparmap-ocaml-dev"
          cp -a usr/doc/parmap/* "${{targets.contextdir}}/usr/share/doc/libparmap-ocaml-dev/"
update:
  enabled: true
  github:
    identifier: rdicosmo/parmap
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/parmap/LICENSE
    - uses: test/tw/ldd-check
