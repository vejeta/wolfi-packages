package:
  name: libcamlp-streams-ocaml-dev
  version: '5.0.1'
  epoch: 0
  description: Stream and Genlex libraries for use with Camlp4 and Camlp5 (dev files)
  copyright:
    - license: LGPL-2.1-OCaml
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ocaml/camlp-streams
      tag: v${{package.version}}
      expected-commit: 567fa15f32192a6a7cd12e6c9e804fec43460126
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libcamlp-streams-ocaml-dev"
      cp -a usr/doc/*/* "${{targets.destdir}}/usr/share/doc/libcamlp-streams-ocaml-dev/"
      install -Dm644 LICENSE -t "${{targets.destdir}}"/usr/share/licenses/camlp-streams
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libcamlp-streams-ocaml
    description: Stream and Genlex libraries for use with Camlp4 and Camlp5 (runtime files)
    pipeline:
      # TODO(debian-to-melange): no debian/libcamlp-streams-ocaml.install; define which files go to this subpackage
      - runs: |
          true
update:
  enabled: true
  github:
    identifier: ocaml/camlp-streams
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/camlp-streams/LICENSE
    - uses: test/tw/ldd-check
