package:
  name: perl-archive-cpio
  version: '0.10'
  epoch: 0
  description: Module for manipulations of cpio archives
  copyright:
    - license: Artistic-1.0-Perl OR GPL-1.0-or-later
  dependencies:
    runtime:
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - perl
      - perl-dev
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv perl-archive-cpio/$f .recipe-files/; done
      rmdir perl-archive-cpio 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PI/PIXEL/Archive-Cpio-${{package.version}}.tar.gz
      expected-sha256: 246fb31669764e78336b2191134122e07c44f2d82dc4f37d552ab28f8668bed3
  - uses: perl/make
  - uses: autoconf/make
  - uses: autoconf/make-install
  - uses: perl/cleanup
  - name: Install files
    runs: |
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/perl-archive-cpio/copyright
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
update:
  enabled: true
  release-monitor:
    identifier: 384668
test:
  environment:
    contents:
      packages:
        - busybox
        - perl
  pipeline:
    - runs: |
        test -f /usr/share/doc/perl-archive-cpio/copyright
    - name: Load the module
      runs: |
        perl -MArchive::Cpio -e1
