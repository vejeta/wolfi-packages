package:
  name: perl-crypt-sysrandom
  version: '0.007'
  epoch: 0
  description: Perl interface to system randomness
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/L/LE/LEONT/Crypt-SysRandom-${{package.version}}.tar.gz
      expected-sha512: 75d5d89e8d883560f24f4f617afbb57f8953c6f7b96c4934ff8a7d2251ffddffe372ee8b5411011cb4eae0e7d19d4a44dd8414146c50d6bdc9b489ba8a4a23a6
  - name: Build
    runs: |
      export CFLAGS=$(perl -MConfig -E 'say $Config{ccflags}')
      PERL_MM_USE_DEFAULT=1 perl -I. Makefile.PL \
      	INSTALLDIRS=vendor \
      	NO_PACKLIST=1 \
      	NO_PERLLOCAL=1
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
subpackages:
  - name: perl-crypt-sysrandom-doc
    description: Perl interface to system randomness (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
update:
  enabled: true
  release-monitor:
    identifier: 382783
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
