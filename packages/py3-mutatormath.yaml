# Debian packaging: https://salsa.debian.org/fonts-team/mutatormath
#
# Conversion notes:
# - debian/patches import 'setuptools', not in upstream's requirements; added
# - debian/patches import 'setputools', not in upstream's requirements; added
# - ${python3:Depends} from upstream's requirements: fonttools, defcon, fontmath, setuptools, setputools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - autopkgtests converted to the test pipeline (1 steps)
# - Wolfi Python layout: py3.X-mutatormath for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-mutatormath
  version: '3.0.1'
  epoch: 0
  description: Library for piecewise linear interpolations in n-dimensions
  copyright:
    - license: BSD-3-Clause-LettError
  dependencies:
    provider-priority: 0
vars:
  pypi-package: mutatormath
  import: mutatorMath
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - pandoc-cli  # Wolfi Community Packages (Debian: pandoc)
      - py3-supported-defcon  # Wolfi Community Packages (Debian: python3-defcon)
      - py3-supported-fontmath  # Wolfi Community Packages (Debian: python3-fontmath)
      - py3-supported-fonttools  # Debian: python3-fonttools
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Add-pyproject.toml.patch 0002-Purge-usage-of-distutils.patch; do mv py3-mutatormath/$f .recipe-files/; done
      rmdir py3-mutatormath 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/LettError/MutatorMath
      tag: ${{package.version}}
      expected-commit: b29fc6f3c8ab9072b5e36acdd85fd56af0b12190
  - uses: patch
    with:
      patches: .recipe-files/0001-Add-pyproject.toml.patch .recipe-files/0002-Purge-usage-of-distutils.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-mutatormath"
      cp -a Docs/* "${{targets.destdir}}/usr/share/doc/py3-mutatormath/"
      cp -a README.rst "${{targets.destdir}}/usr/share/doc/py3-mutatormath/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-fonttools
        - py${{range.key}}-defcon
        - py${{range.key}}-fontmath
        - py${{range.key}}-setuptools
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: LettError/MutatorMath
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-mutatormath
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - patch  # to apply Debian's patches to the tested source
        - py3-supported-mutatormath
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/LettError/MutatorMath
        tag: ${{package.version}}
        expected-commit: b29fc6f3c8ab9072b5e36acdd85fd56af0b12190
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/m/mutatormath/mutatormath_3.0.1-4.debian.tar.xz
        strip-components: 0
        expected-sha256: c7a7c6c327e286d3d2fa8832b1105fcc55ddbf7724cb5b57de6c03d96a0fcb26
    - name: 'Debian''s patches (autopkgtest tests the patched source)'
      runs: |
        sed -e 's/#.*//' -e '/^[[:space:]]*$/d' debian/patches/series | while read -r p opt; do
          patch ${opt:--p1} -N < "debian/patches/$p"
        done
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl python3-mutatormath=py3-mutatormath' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/python3-mutatormath.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/python3-mutatormath.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'autopkgtest: python3 Lib/mutatorMath/test/run.py'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        python3 Lib/mutatorMath/test/run.py
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
