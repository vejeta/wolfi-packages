package:
  name: libppx-expect-ocaml
  version: '0.17.3'
  epoch: 0
  description: Testing framework for OCaml (runtime files)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      # TODO(debian-to-melange): libbase-ocaml-dev is not in Wolfi (Debian: libbase-ocaml-dev); left out
      - libjane-street-headers-ocaml-dev  # Wolfi Community Packages
      - libppx-enumerate-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libppx-hash-ocaml-dev is not in Wolfi (Debian: libppx-hash-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-here-ocaml-dev is not in Wolfi (Debian: libppx-here-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-inline-test-ocaml-dev is not in Wolfi (Debian: libppx-inline-test-ocaml-dev); left out
      # TODO(debian-to-melange): libppx-sexp-conv-ocaml-dev is not in Wolfi (Debian: libppx-sexp-conv-ocaml-dev); left out
      - libppxlib-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      # TODO(debian-to-melange): libsexplib0-ocaml-dev is not in Wolfi (Debian: libsexplib0-ocaml-dev); left out
      # TODO(debian-to-melange): libstdio-ocaml-dev is not in Wolfi (Debian: libstdio-ocaml-dev); left out
      - ocaml-dune
      - ocaml
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_expect
      tag: v${{package.version}}
      expected-commit: 49b86d5ac2e11602b2464b9970e569f32c877d9b
  # TODO(debian-to-melange): unsupported Debian build system 'ocaml_dune'
  - name: Install files
    runs: |
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/ppx-expect
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-expect-ocaml-dev
    description: Testing framework for OCaml (dev files)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/libppx-expect-ocaml-dev"
          cp -a usr/doc/ppx_expect/* "${{targets.contextdir}}/usr/share/doc/libppx-expect-ocaml-dev/"
update:
  enabled: true
  github:
    identifier: janestreet/ppx_expect
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/ppx-expect/LICENSE.md
    - uses: test/tw/ldd-check
