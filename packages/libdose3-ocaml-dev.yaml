package:
  name: libdose3-ocaml-dev
  version: '7.0.0'
  epoch: 0
  description: OCaml libraries for package dependencies (development files)
  copyright:
    - license: LGPL-3.0-or-later
    - license: GPL-3.0-only
      paths:
        - scripts/pack.ml
  dependencies:
    runtime:
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - libbase64-ocaml-dev  # Wolfi Community Packages
      - libbz2-ocaml-dev  # Wolfi Community Packages
      - libcudf-ocaml-dev  # Wolfi Community Packages
      - libextlib-ocaml-dev  # Wolfi Community Packages
      - libocamlgraph-ocaml-dev  # Wolfi Community Packages
      - libre-ocaml-dev  # Wolfi Community Packages
      - libzip-ocaml-dev  # Wolfi Community Packages
      - ocaml-dune
      - ocaml
      - graphviz
      - hevea  # Wolfi Community Packages
      - texmf-dist-fontsrecommended  # Wolfi Community Packages (Debian: lmodern)
      # TODO(debian-to-melange): ocaml-odoc is not in Wolfi (Debian: ocaml-odoc); left out
      # TODO(debian-to-melange): texmf-dist-latexbase is not in Wolfi (Debian: texlive-latex-base); left out
      - texmf-dist-latexextra  # Wolfi Community Packages (Debian: texlive-latex-extra)
      # TODO(debian-to-melange): pandoc is not in Wolfi (Debian: pandoc); left out
      - dctrl-tools  # Wolfi Community Packages (Debian: grep-dctrl)
      - libounit-ocaml-dev  # Wolfi Community Packages
      - libcamlp-streams-ocaml-dev  # Wolfi Community Packages
      - libparmap-ocaml-dev  # Wolfi Community Packages
      - perl
      - py3-yaml  # Debian: python3-yaml
      - xz  # Debian: xz-utils
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-Fix-expected-test-outputs-following-update-of-ocamlg.patch 0002-Add-camlp-streams-to-debGrep-dependencies.patch apt-cudf.conf update-cudf-solvers; do mv libdose3-ocaml-dev/$f .recipe-files/; done
      rmdir libdose3-ocaml-dev 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/d/dose3/dose3_${{package.version}}.orig.tar.gz
      expected-sha256: 02db6104db2683483f8309c76e77705b2606803fc5b58ea0a402f9da30a56029
  - uses: patch
    with:
      patches: .recipe-files/0001-Fix-expected-test-outputs-following-update-of-ocamlg.patch .recipe-files/0002-Add-camlp-streams-to-debGrep-dependencies.patch
  - uses: autoconf/configure
  - uses: autoconf/make
  - uses: autoconf/make-install
  # TODO(debian-to-melange): port debian/rules override_dh_auto_build: dune build -p dose3$(DUNE_EXTRAPROFILE) @install --verbose && make -C doc/manpages man && pod2man --section 8 -release "apt-cudf $(RELEASE)"  		debian/update-cudf-solvers > debian/update-cudf-solvers.
  # TODO(debian-to-melange): port debian/rules override_dh_auto_install: dune install -p dose3$(DUNE_EXTRAPROFILE) --destdir=$(DESTDIR) --prefix=/usr --libdir=$(OCAML_STDLIB_DIR) --docdir=/usr/share/ocaml-dune/doc
  - name: Install files
    runs: |
      install -Dm644 COPYING -t "${{targets.destdir}}"/usr/share/licenses/libdose3-ocaml-dev
  - name: Remove libtool archives
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: dose-distcheck
    description: Checks whether dependencies of packages can be satisfied
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a usr/bin/dose-distcheck "${{targets.contextdir}}/usr/bin/"
          install -Dm644 doc/manpages/dose-distcheck.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          ln -sf /usr/bin/dose-distcheck "${{targets.contextdir}}/usr/bin/dose-debcheck"
          ln -sf /usr/bin/dose-distcheck "${{targets.contextdir}}/usr/bin/dose-eclipsecheck"
          ln -sf /usr/bin/dose-distcheck "${{targets.contextdir}}/usr/bin/dose-rpmcheck"
          mkdir -p "${{targets.contextdir}}/usr/share/man/man1"
          ln -sf /usr/share/man/man1/dose-distcheck.1 "${{targets.contextdir}}/usr/share/man/man1/dose-debcheck.1"
          ln -sf /usr/share/man/man1/dose-distcheck.1 "${{targets.contextdir}}/usr/share/man/man1/dose-eclipsecheck.1"
          ln -sf /usr/share/man/man1/dose-distcheck.1 "${{targets.contextdir}}/usr/share/man/man1/dose-rpmcheck.1"
    dependencies:
      runtime:
        - xz  # Debian: xz-utils
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            dose-distcheck --version || (dose-distcheck --help 2>&1 || true) | grep -qi -e usage -e dose-distcheck
        - uses: test/tw/ldd-check
  - name: dose-builddebcheck
    description: Checks whether build-dependencies can be satisfied
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a usr/bin/dose-builddebcheck "${{targets.contextdir}}/usr/bin/"
          install -Dm644 doc/manpages/dose-builddebcheck.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    dependencies:
      runtime:
        - xz  # Debian: xz-utils
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            dose-builddebcheck --version || (dose-builddebcheck --help 2>&1 || true) | grep -qi -e usage -e dose-builddebcheck
        - uses: test/tw/ldd-check
  - name: dose-extra
    description: Extra QA tools from the Dose3-library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a usr/bin/dose-ceve "${{targets.contextdir}}/usr/bin/"
          cp -a usr/bin/dose-challenged "${{targets.contextdir}}/usr/bin/"
          cp -a usr/bin/dose-deb-coinstall "${{targets.contextdir}}/usr/bin/"
          cp -a usr/bin/dose-outdated "${{targets.contextdir}}/usr/bin/"
          install -Dm644 doc/manpages/dose-ceve.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          install -Dm644 doc/manpages/dose-challenged.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          install -Dm644 doc/manpages/dose-deb-coinstall.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          install -Dm644 doc/manpages/dose-outdated.1 -t "${{targets.contextdir}}/usr/share/man/man1"
    dependencies:
      runtime:
        - xz  # Debian: xz-utils
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            dose-ceve --version || (dose-ceve --help 2>&1 || true) | grep -qi -e usage -e dose-ceve
            dose-challenged --version || (dose-challenged --help 2>&1 || true) | grep -qi -e usage -e dose-challenged
            dose-deb-coinstall --version || (dose-deb-coinstall --help 2>&1 || true) | grep -qi -e usage -e dose-deb-coinstall
            dose-outdated --version || (dose-outdated --help 2>&1 || true) | grep -qi -e usage -e dose-outdated
        - uses: test/tw/ldd-check
  - name: apt-cudf
    description: CUDF solver integration for APT
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/etc"
          cp -a .recipe-files/apt-cudf.conf "${{targets.contextdir}}/etc/"
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a .recipe-files/update-cudf-solvers "${{targets.contextdir}}/usr/bin/"
          cp -a src/applications/scripts/apt-cudf-get "${{targets.contextdir}}/usr/bin/"
          cp -a usr/bin/apt-cudf "${{targets.contextdir}}/usr/bin/"
          install -Dm644 debian/update-cudf-solvers.8 -t "${{targets.contextdir}}/usr/share/man/man8"
          install -Dm644 doc/manpages/apt-cudf-get.8 -t "${{targets.contextdir}}/usr/share/man/man8"
          install -Dm644 doc/manpages/apt-cudf.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          install -Dm644 doc/manpages/apt-cudf.conf.5 -t "${{targets.contextdir}}/usr/share/man/man5"
          mkdir -p "${{targets.contextdir}}/usr/lib/apt/solvers"
    dependencies:
      runtime:
        - aspcud  # Wolfi Community Packages
        - perl  # Debian: ${perl:Depends}
    scriptlets:
      post-install: |
        #!/bin/sh
        # Converted from debian/apt-cudf.postinst by debian-to-melange.
        # apk passes different arguments than dpkg, so the original script runs
        # in a subshell with the arguments dpkg would have used.
        debian_apt_cudf_postinst() (
        set -e

        # Will be invoked both at apt-cudf configuration time and each time the trigger
        # monitoring CUDF solver dir (usually /usr/share/cudf/solvers/) is activated.
        #
        update-cudf-solvers


        exit 0
        )
        debian_apt_cudf_postinst configure
      post-upgrade: |
        #!/bin/sh
        # Converted from debian/apt-cudf.postinst by debian-to-melange.
        # apk passes different arguments than dpkg, so the original script runs
        # in a subshell with the arguments dpkg would have used.
        debian_apt_cudf_postinst() (
        set -e

        # Will be invoked both at apt-cudf configuration time and each time the trigger
        # monitoring CUDF solver dir (usually /usr/share/cudf/solvers/) is activated.
        #
        update-cudf-solvers


        exit 0
        )
        debian_apt_cudf_postinst configure "$2"
      pre-deinstall: |
        #!/bin/sh
        # Converted from debian/apt-cudf.prerm by debian-to-melange.
        # apk passes different arguments than dpkg, so the original script runs
        # in a subshell with the arguments dpkg would have used.
        debian_apt_cudf_prerm() (
        set -e

        # Clean up EDSP (i.e. APT external) solvers which have been generated for CUDF
        # solvers. They will be added back upon (re-)installation of apt-cudf.
        #
        update-cudf-solvers --remove


        exit 0
        )
        debian_apt_cudf_prerm remove
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            test -x /usr/bin/update-cudf-solvers
            test -x /usr/bin/apt-cudf-get
            apt-cudf --version || (apt-cudf --help 2>&1 || true) | grep -qi -e usage -e apt-cudf
        - uses: test/tw/ldd-check
  - name: dose-doc
    description: Documentation for dose tools and libraries.
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/share/doc/dose-doc"
          cp -a _build/default/_doc/_html/* "${{targets.contextdir}}/usr/share/doc/dose-doc/"
          cp -a doc/apt-cudf/* "${{targets.contextdir}}/usr/share/doc/dose-doc/"
          cp -a doc/apt-external-solvers.primer/apt-external-solvers.html "${{targets.contextdir}}/usr/share/doc/dose-doc/"
          cp -a doc/debcheck.primer/debcheck-primer.html "${{targets.contextdir}}/usr/share/doc/dose-doc/"
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
        - dose-distcheck
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - dose-builddebcheck
        - dose-extra
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libdose3-ocaml-dev/COPYING
    - uses: test/tw/ldd-check
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/d/dose3/dose3_${{package.version}}.orig.tar.gz
        expected-sha256: 02db6104db2683483f8309c76e77705b2606803fc5b58ea0a402f9da30a56029
    - uses: fetch
      with:
        uri: https://deb.debian.org/debian/pool/main/d/dose3/dose3_7.0.0-8.debian.tar.xz
        strip-components: 0
        expected-sha256: d589f6fa7002d95dd0b65aa74ca930b42b2cc8f81d911e7f3640ea132ca53579
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='libc-bin=glibc libc6=glibc perl-base=perl' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/libdose3-ocaml-dev.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/libdose3-ocaml-dev.templates" && break
        done
    - name: 'autopkgtest: dose-debcheck'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        set -e

        this=dose-debcheck
        indir=debian/tests/repos
        outdir=${ADT_ARTIFACTS}/${this}
        mkdir -p ${outdir}

        packfile=$indir/Packages1
        base=$(basename $packfile)

        dose-debcheck ${packfile} \
            | tee ${outdir}/${base}.out \
            | grep -q "broken-packages: 0"
    - name: 'autopkgtest: bug811569'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # debian bug 811569: accept weird characters in debian field names

        set -e

        this=dose-debcheck
        indir=debian/tests/repos
        outdir=${ADT_ARTIFACTS}/${this}
        mkdir -p ${outdir}

        packfile=$indir/weird.fields.Packages
        base=$(basename $packfile)

        dose-debcheck ${packfile} \
