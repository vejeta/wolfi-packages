        dose-builddebcheck --deb-native-arch=amd64 ${packfile} ${sourcefile} \
            | grep -q "broken-packages: 1"
    - name: 'autopkgtest: dose-outdated'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
