    - name: 'autopkgtest: bug790422'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # debian bug 790422: accept empty input file

        set -e

        this=dose-debcheck
