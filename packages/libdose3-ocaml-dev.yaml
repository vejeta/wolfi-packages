        base=$(basename $packfile)
        dose-builddebcheck --deb-native-arch=toaster ${packfile} ${srcfile} \
            | tee ${outdir}/${base}.out \
            | grep -q "broken-packages: 0"
    - name: 'autopkgtest: bug896084'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        set +o pipefail 2>/dev/null || true
        # debian bug 896084: versioned provides and versioned build-dependency

        set -e

        this=dose-debcheck
        indir=debian/tests/repos

        packfile=$indir/Packages_896084
