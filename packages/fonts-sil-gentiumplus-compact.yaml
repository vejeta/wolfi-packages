package:
  name: fonts-sil-gentiumplus-compact
  version: '5.000'
  epoch: 0
  description: Extended smart font family for Latin, Greek and Cyrillic
  copyright:
    - license: OFL-1.1
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-sil-gentiumplus-compact/$f .recipe-files/; done
      rmdir fonts-sil-gentiumplus-compact 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-sil-gentiumplus-compact/fonts-sil-gentiumplus-compact_${{package.version}}.orig.tar.xz
      expected-sha256: 9b2092712e6aee95fb2402fc129d12c6fda5c8854e8866156da3196c0bcbda78
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus-compact"
      cp -a README.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus-compact/"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus-compact/"
      cp -a documentation/ "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus-compact/"
      cp -a GENTIUM-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-sil-gentiumplus-compact/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-sil-gentiumplus-compact/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-sil-gentiumplus-compact/copyright
