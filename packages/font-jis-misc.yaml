package:
  name: font-jis-misc
  version: '1.0.4'
  epoch: 0
  description: X.org misc font
  copyright:
    - license: LicenseRef-font-jis-misc
  dependencies:
    runtime:
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - font-util-dev
      - bdftopcf
      - encodings
      - font-alias
      - mkfontscale
      - fontconfig
      - font-util
pipeline:
  - uses: fetch
    with:
      uri: https://www.x.org/releases/individual/font/font-jis-misc-${{package.version}}.tar.xz
      expected-sha512: c54034205e7bd7a01b311c25c890f9fd1abc25f842315812d5c83d4e4091e5e6c2125a43d4d532b88c79d51cb812b86cfa8e7e4c1a87175746f1bd4e38129440
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--with-mapfiles=/usr/share/fonts/util \
      	--with-fontdir=/usr/share/fonts/misc
      make
  - name: Install
    runs: |
      pkgname="${{package.name}}"
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" \
      	MKFONTDIR=: \
      	MKFONTSCALE=: \
      	FCCACHE=: \
      	install

      install -Dm644 COPYING "$pkgdir/usr/share/licenses/$pkgname/COPYING"
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Install the license file (LicenseRef-font-jis-misc)
    runs: |
      for f in COPYING LICENSE LICENCE; do
        [ -f "$f" ] && install -Dm644 "$f" -t "${{targets.destdir}}/usr/share/licenses/${{package.name}}"
      done; true
subpackages:
  - name: font-jis-misc-doc
    description: X.org misc font (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  release-monitor:
    identifier: 17194
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline: []
