# Generated by debian-to-melange 0.1.0 from Debian source package
# triehash 0.3-3 (3.0 (quilt)).
# https://tracker.debian.org/pkg/triehash
# Debian packaging: https://github.com/julian-klode/triehash
#
# Conversion notes:
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/t/triehash/triehash_0.3.orig.tar.gz), which disappears from the pool when Debian updates
package:
  name: triehash
  version: '0.3'
  epoch: 0
  description: Generates perfect hash functions as native machine code
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - coreutils
      - findutils
      - perl
pipeline:
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/t/triehash/triehash_${{package.version}}.orig.tar.gz
      expected-sha256: 289a0966c02c2008cd263d3913a8e3c84c97b8ded3e08373d63a382c71d2199c
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      pod2man -r "triehash v0.3" -c triehash triehash.pl triehash.1
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      install -m755 -D triehash.pl ${{targets.destdir}}/usr/bin/triehash
  - name: Install files
    runs: |
      install -Dm644 triehash.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/triehash
update:
  enabled: true
  github:
    identifier: julian-klode/triehash
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/triehash/LICENSE.md
