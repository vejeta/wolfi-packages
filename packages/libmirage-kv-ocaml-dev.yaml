package:
  name: libmirage-kv-ocaml-dev
  version: '6.1.1'
  epoch: 0
  description: MirageOS signatures for key/value devices (dev)
  copyright:
    - license: ISC
  dependencies:
    runtime:
      - libmirage-kv-ocaml  # Debian: ${ocaml:Depends}
      - libfmt-ocaml-dev  # Debian: ${ocaml:Depends}
      - liblwt-ocaml-dev  # Debian: ${ocaml:Depends}
      - liboptint-ocaml-dev  # Debian: ${ocaml:Depends}
      - libptime-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - ocaml-compiler-libs  # Debian: ocaml
      - zstd-dev  # Debian: ocaml
      - libfmt-ocaml-dev  # Wolfi Community Packages
      - liblwt-ocaml-dev  # Wolfi Community Packages
      - liboptint-ocaml-dev  # Wolfi Community Packages
      - libptime-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mirage/mirage-kv
      tag: v${{package.version}}
      expected-commit: b362f636c7515781245c80c71022d1f485c790eb
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p mirage-kv -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" mirage-kv
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libmirage-kv-ocaml-dev"
      for f in "${{targets.destdir}}"/usr/doc/mirage-kv/*; do cp -a "$f" "${{targets.destdir}}/usr/share/doc/libmirage-kv-ocaml-dev/"; done
      rm -rf "${{targets.destdir}}"/usr/doc/mirage-kv/*
      rmdir "${{targets.destdir}}/usr/doc/mirage-kv" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libmirage-kv-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libmirage-kv-ocaml
    description: MirageOS signatures for key/value devices (runtime)
    pipeline:
      - runs: |
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/META; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cma; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
          for f in "${{targets.destdir}}"/usr/lib/ocaml/*/*.cmxs; do
            [ -e "$f" ] || continue
            r="${f#${{targets.destdir}}/}"
            mkdir -p "${{targets.contextdir}}/$(dirname "$r")" && mv "$f" "${{targets.contextdir}}/$r"
          done
update:
  enabled: true
  github:
    identifier: mirage/mirage-kv
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libmirage-kv-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
