package:
  name: catch2
  version: '2.13.10'
  epoch: 0
  description: A modern, C++-native, header-only, test framework for unit-tests
  copyright:
    - license: BSL-1.0
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - cmake
      - python3
      - ninja  # Alpine: samurai
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/catchorg/Catch2
      tag: v${{package.version}}
      expected-commit: 182c910b4b63ff587a3440e08f84f70497e49a81
  - name: Build
    runs: |
      cmake -B build -G Ninja \
      	-DCMAKE_BUILD_TYPE=MinSizeRel \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DCMAKE_INSTALL_LIBDIR=lib \
      	-DCATCH_ENABLE_WERROR=False
      cmake --build build
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" cmake --install build
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: catch2-doc
    description: A modern, C++-native, header-only, test framework for unit-tests (doc)
    pipeline:
      - uses: split/alldocs
update:
  enabled: true
  github:
    identifier: catchorg/Catch2
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
