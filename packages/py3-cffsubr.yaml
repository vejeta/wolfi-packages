# cffsubr 0.4.0-1 (3.0 (quilt)).
# https://tracker.debian.org/pkg/cffsubr
# Debian packaging: https://salsa.debian.org/fonts-team/cffsubr
#
# Conversion notes:
# - ${python3:Depends} from upstream's requirements: fonttools
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - Wolfi Python layout: py3.X-cffsubr for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-cffsubr
  version: '0.4.0'
  epoch: 0
  description: CFF subroutinizer based on the AFDKO tx
  copyright:
    - license: Apache-2.0
    - license: OFL-1.1
      paths:
        - tests/data/SourceSansPro-Regular.subset.ttx
        - tests/data/SourceSansVariable-Roman.subset.ttx
  dependencies:
    provider-priority: 0
vars:
  pypi-package: cffsubr
  import: cffsubr
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - python3
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - py3-supported-fonttools  # Debian: python3-fonttools
  environment:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0002-disable-building-tx-binary.patch; do mv py3-cffsubr/$f .recipe-files/; done
      rmdir py3-cffsubr 2>/dev/null || true
  - uses: git-checkout
    with:
      repository: https://github.com/adobe-type-tools/cffsubr
      tag: v${{package.version}}
      expected-commit: 4ebd0ce39a7216e9f9c5fceb802f508fd60cbd8c
      recurse-submodules: true
  - uses: patch
    with:
      patches: .recipe-files/0002-disable-building-tx-binary.patch
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/python3/dist-packages/cffsubr"
      ln -sf /usr/libexec/afdko/tx "${{targets.destdir}}/usr/lib/python3/dist-packages/cffsubr/tx"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-fonttools
        - afdko-bin  # Wolfi Community Packages
        - py3.13-fonttools-bin  # commands of Debian's python3-fonttools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 LICENSE NOTICE -t "${{targets.contextdir}}"/usr/share/licenses/py${{range.key}}-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: true
  github:
    identifier: adobe-type-tools/cffsubr
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-cffsubr
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
