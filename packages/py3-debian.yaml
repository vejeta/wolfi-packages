# python-debian 1.1.1 (3.0 (native)).
# https://tracker.debian.org/pkg/python-debian
# Debian packaging: https://salsa.debian.org/python-debian-team/python-debian
#
# Conversion notes:
# - native package: using SETUPTOOLS_SCM_PRETEND_VERSION=$(shell debian/make_pep440_compliant "$(DEB_VERSION)") from debian/rules as the version (Debian version is 1.1.1)
# - Debian-native package: source from the Debian archive
# - test dependency 'debian-keyring' (Debian 'debian-keyring') not found in Wolfi; left out
# - autopkgtest 'python3-debian' left out: it needs packages that are not in Wolfi
# - test dependency 'debian-keyring' (Debian 'debian-keyring') not found in Wolfi; left out
# - autopkgtest 'python3-debian-no-apt-pkg' left out: it needs packages that are not in Wolfi
# - Wolfi Python layout: py3.X-debian for Python 3.10, 3.11, 3.12, 3.13, 3.14
package:
  name: py3-debian
  version: '$(shell debian/make_pep440_compliant "${{package.version}}")'
  epoch: 0
  description: Python 3 modules to work with Debian-related data formats
  copyright:
    - license: GPL-2.0-or-later
    - license: GPL-3.0-or-later
      paths:
        - 'examples/debtags/*'
        - src/debian/debtags.py
        - src/debian/doc-debtags
        - tests/test_debtags.py
    - license: GPL-3.0-or-later
      paths:
        - 'examples/debfile/*'
        - src/debian/arfile.py
        - src/debian/debfile.py
        - tests/test_debfile.py
    - license: GPL-3.0-or-later
      paths:
        - src/debian/watch.py
        - tests/test_watch.py
  dependencies:
    provider-priority: 0
vars:
  pypi-package: debian
  import: debian
data:
  - name: py-versions
    items:
      3.14: '314'
      3.13: '313'
      3.12: '312'
      3.11: '311'
      3.10: '310'
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - py3-supported-build-base
      - perl
      - dpkg-dev
      - binutils
      - gpgv
      - python3-apt  # Wolfi Community Packages
      - py3-supported-charset-normalizer  # Debian: python3-charset-normalizer
      - py3-supported-pytest  # Debian: python3-pytest
      - py3-supported-setuptools-scm  # Debian: python3-setuptools-scm
      - zstd
      - coreutils
      - findutils
  environment:
    FORBID_MISSING_APT_PKG: '1'
    FORBID_MISSING_CHARSET_NORMALIZER: '1'
    FORBID_MISSING_GPGV: '1'
    FORBID_MISSING_AR: '1'
    FORBID_MISSING_DPKG_DEB: '1'
    FORBID_MISSING_ZSTD: '1'
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv py3-debian/$f .recipe-files/; done
      rmdir py3-debian 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/p/python-debian/python-debian_1.1.1.tar.xz
      expected-sha256: 59cc8a9a6236f6386ae622564e7d13c846e65cfa63948c9a75e02358dfeaac20
  - name: From debian/rules execute_after_dh_auto_build
    runs: |
      src/debian/doc-debtags > README.debtags
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-debian/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/py3-debian/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/py3-debian"
      cp -a README.rst "${{targets.destdir}}/usr/share/doc/py3-debian/"
      cp -a HISTORY.deb822 "${{targets.destdir}}/usr/share/doc/py3-debian/"
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          install -Dm644 .recipe-files/copyright "${{targets.contextdir}}"/usr/share/doc/py${{range.key}}-${{vars.pypi-package}}/copyright
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
        - py3.14-${{vars.pypi-package}}
    test:
      environment:
        contents:
          packages:
            - busybox
            - apk-tools
      pipeline:
        - uses: test/metapackage
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version (debian/rules SETUPTOOLS_SCM_PRETEND_VERSION) by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - python3
        - py3-supported-debian
  pipeline:
    # TODO(debian-to-melange): autopkgtest 'python3-debian' left out; it needs packages that are not in Wolfi
    # TODO(debian-to-melange): autopkgtest 'python3-debian-no-apt-pkg' left out; it needs packages that are not in Wolfi
    - uses: python/import
      with:
        python: python3
        imports: import ${{vars.import}}
