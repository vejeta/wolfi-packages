#
# Conversion notes:
# - upstream from debian/watch (GitHub), pinned to the tag's commit
# - dh --with ocaml has no direct melange equivalent; review
package:
  name: libppx-hash-ocaml-dev
  version: '0.17.0'
  epoch: 0
  description: Ppx writer generating hash functions (development)
  copyright:
    - license: MIT
    - license: CC0-1.0
      paths:
        - 'runtime-lib/siphash/siphash.c*'
  dependencies:
    runtime:
      - libppx-hash-ocaml  # Debian: ${ocaml:Depends}
      - libppx-compare-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppx-sexp-conv-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-jane-ocaml-dev  # Debian: ${ocaml:Depends}
      - libppxlib-ocaml-dev  # Debian: ${ocaml:Depends}
      # Debian Recommends (not supported by apk): ocaml-findlib
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - ocaml
      - ocaml-dune
      - ocaml-findlib
      - ocamlfind
      - ocaml-findlib-compat
      - bash
      - libppx-compare-ocaml-dev  # Wolfi Community Packages
      - libppx-sexp-conv-ocaml-dev  # Wolfi Community Packages
      - libppxlib-jane-ocaml-dev  # Wolfi Community Packages
      - libppxlib-ocaml-dev  # Wolfi Community Packages
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/janestreet/ppx_hash
      tag: v${{package.version}}
      expected-commit: abaac61f5f752ad661cc14b62cceb6f4bc1de9ac
  - name: 'Build (dh-ocaml''s ocaml_dune build system)'
    runs: |
      dune build -p ppx_hash -j $(nproc) @install
  - name: Install
    runs: |
      dune install --destdir="${{targets.destdir}}" --prefix=/usr --libdir="$(ocamlc -where)" ppx_hash
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/libppx-hash-ocaml-dev"
      mv "${{targets.destdir}}"/usr/doc/ppx_hash/* "${{targets.destdir}}/usr/share/doc/libppx-hash-ocaml-dev/"
      rmdir "${{targets.destdir}}/usr/doc/ppx_hash" "${{targets.destdir}}/usr/doc" 2>/dev/null || true
      install -Dm644 LICENSE.md -t "${{targets.destdir}}"/usr/share/licenses/libppx-hash-ocaml-dev
  - name: Usr-merge (sbin into bin)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        for s in usr/sbin sbin bin; do
          [ -d "$d/$s" ] && [ ! -L "$d/$s" ] || continue
          mkdir -p "$d/usr/bin" && mv "$d/$s"/* "$d/usr/bin/" 2>/dev/null; rmdir "$d/$s"
        done
      done
  - uses: strip
subpackages:
  - name: libppx-hash-ocaml
    description: Ppx writer generating hash functions (runtime)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash"
          mv "${{targets.destdir}}/usr/lib/ocaml/ppx_hash/META" "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/expander"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/expander/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/expander/"
          mkdir -p "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/runtime-lib"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/runtime-lib/*.cma "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/runtime-lib/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/expander/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/expander/"
          mv "${{targets.destdir}}"/usr/lib/ocaml/ppx_hash/runtime-lib/*.cmxs "${{targets.contextdir}}/usr/lib/ocaml/ppx_hash/runtime-lib/"
update:
  enabled: true
  github:
    identifier: janestreet/ppx_hash
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/licenses/libppx-hash-ocaml-dev/LICENSE.md
    - uses: test/tw/ldd-check
