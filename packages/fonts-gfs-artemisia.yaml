#
# Conversion notes:
# - license MIT read from the notice in debian/copyright (not DEP-5); check it
# - upstream download not reachable; using Debian's copy of the upstream tarball (https://deb.debian.org/debian/pool/main/f/fonts-gfs-artemisia/fonts-gfs-artemisia_1.1.orig.tar.xz), which disappears from the pool when Debian updates
package:
  name: fonts-gfs-artemisia
  version: '1.1'
  epoch: 0
  description: Greek font (Times Greek-like)
  copyright:
    - license: MIT
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv fonts-gfs-artemisia/$f .recipe-files/; done
      rmdir fonts-gfs-artemisia 2>/dev/null || true
  - uses: fetch
    with:
      uri: https://deb.debian.org/debian/pool/main/f/fonts-gfs-artemisia/fonts-gfs-artemisia_${{package.version}}.orig.tar.xz
      expected-sha256: e5492163e6d7713af8387086cf1d66a7aadd6801e8a3feb00bea453e7bae6f87
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/fonts/opentype/artemisia"
      mkdir -p "${{targets.destdir}}/usr/share/doc/fonts-gfs-artemisia"
      cp -a OFL-FAQ.txt "${{targets.destdir}}/usr/share/doc/fonts-gfs-artemisia/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/fonts-gfs-artemisia/copyright
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(debian-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/fonts-gfs-artemisia/copyright
