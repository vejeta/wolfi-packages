# libfoo 1:2.3.4+dfsg-2 (3.0 (quilt)).
#
# Conversion notes:
# - Debian repacks the upstream tarball (1:2.3.4+dfsg-2); check debian/copyright Files-Excluded before using the pristine upstream source
