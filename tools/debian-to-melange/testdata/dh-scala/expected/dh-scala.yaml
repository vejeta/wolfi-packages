# Generated by debian-to-melange 0.1.0 from Debian source package
# dh-scala 0.1 (3.0 (native)).
# Debian packaging: https://salsa.debian.org/mendezr/dh-scala
#
# Conversion notes:
# - autopkgtests converted to the test pipeline (5 steps)
package:
  name: dh-scala
  version: '0.1'
  epoch: 0
  description: Debhelper build system for Scala libraries
  copyright:
    - license: GPL-3.0-or-later
    - license: FSFAP
      paths:
        - .perltidyrc
  dependencies:
    runtime:
      - openjdk-25-default-jdk  # Debian: default-jdk-headless
      - perl-archive-zip  # Debian: libarchive-zip-perl
      - perl-dpkg  # Debian: libdpkg-perl
      - perl  # Debian: ${perl:Depends}
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - perl-archive-zip  # Debian: libarchive-zip-perl
      - perl-dpkg  # Debian: libdpkg-perl
      - perl-xml-libxml  # Debian: libxml-libxml-perl
      - perl
      - coreutils
      - findutils
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv dh-scala/$f .recipe-files/; done
      rmdir dh-scala 2>/dev/null || true
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      mkdir -p man
      pod2man --center=dh-scala --release=${{package.version}} --date=$(date -u -d @${SOURCE_DATE_EPOCH} +%F) --section=1 --name=dh_scala dh_scala man/dh_scala.1
      pod2man --center=dh-scala --release=${{package.version}} --date=$(date -u -d @${SOURCE_DATE_EPOCH} +%F) --section=1 --name=dh-make-scala dh-make-scala man/dh-make-scala.1
      pod2man --center=dh-scala --release=${{package.version}} --date=$(date -u -d @${SOURCE_DATE_EPOCH} +%F) --section=5 --name=scala-build scala-build.pod man/scala-build.5
      pod2man --center=dh-scala --release=${{package.version}} --date=$(date -u -d @${SOURCE_DATE_EPOCH} +%F) --section=7 --name=dh-scala dh-scala.pod man/dh-scala.7
      pod2man --center=dh-scala --release=${{package.version}} --date=$(date -u -d @${SOURCE_DATE_EPOCH} +%F) --section=3pm --name=Debian::Debhelper::Buildsystem::scala  	  lib/Debian/Debhelper/Buildsystem/scala.pm man/Debian::Debhelper::Buildsystem::scala.3pm
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/bin"
      cp -a dh_scala "${{targets.destdir}}/usr/bin/"
      mkdir -p "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian"
      cp -a lib/Debian/DhScala.pm "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/"
      cp -a lib/Debian/Debhelper "${{targets.destdir}}/usr/share/perl5/vendor_perl/Debian/"
      mkdir -p "${{targets.destdir}}/usr/share/dh-scala"
      cp -a smoke/smoke-test "${{targets.destdir}}/usr/share/dh-scala/"
      cp -a smoke/Smoke.java "${{targets.destdir}}/usr/share/dh-scala/"
      install -Dm644 man/dh_scala.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 man/scala-build.5 -t "${{targets.destdir}}/usr/share/man/man5"
      install -Dm644 man/Debian::Debhelper::Buildsystem::scala.3pm -t "${{targets.destdir}}/usr/share/man/man3"
      install -Dm644 man/dh-scala.7 -t "${{targets.destdir}}/usr/share/man/man7"
      mkdir -p "${{targets.destdir}}/usr/share/doc/dh-scala/examples"
      cp -a examples/* "${{targets.destdir}}/usr/share/doc/dh-scala/examples/"
      mkdir -p "${{targets.destdir}}/usr/share/doc/dh-scala"
      cp -a README.md "${{targets.destdir}}/usr/share/doc/dh-scala/"
      cp -a doc/guide.md "${{targets.destdir}}/usr/share/doc/dh-scala/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/dh-scala/copyright
  - name: Commands are executable (dh_fixperms)
    runs: |
      for d in "${{targets.destdir}}" "${{targets.outdir}}"/*; do
        [ -d "$d/usr/bin" ] && find "$d/usr/bin" -type f -exec chmod 755 {} +
      done
      true
subpackages:
  - name: dh-make-scala
    description: Start Debian packages of Scala libraries from Maven Central
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          cp -a dh-make-scala "${{targets.contextdir}}/usr/bin/"
          mkdir -p "${{targets.contextdir}}/usr/share/perl5/vendor_perl/Debian/DhScala"
          cp -a lib/Debian/DhScala/Make.pm "${{targets.contextdir}}/usr/share/perl5/vendor_perl/Debian/DhScala/"
          cp -a lib/Debian/DhScala/Make "${{targets.contextdir}}/usr/share/perl5/vendor_perl/Debian/DhScala/"
          install -Dm644 man/dh-make-scala.1 -t "${{targets.contextdir}}/usr/share/man/man1"
          find "${{targets.contextdir}}/usr/bin" -type f -exec chmod 755 {} +
    dependencies:
      runtime:
        - ca-certificates-bundle  # Debian: ca-certificates
        - git
        - perl-archive-zip  # Debian: libarchive-zip-perl
        - perl-io-socket-ssl  # Debian: libio-socket-ssl-perl
        - perl-net-ssleay  # Debian: libnet-ssleay-perl
        - perl-xml-libxml  # Debian: libxml-libxml-perl
        - licensecheck
        - xz  # Debian: xz-utils
        - perl  # Debian: ${perl:Depends}
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - runs: |
            dh-make-scala --version || (dh-make-scala --help 2>&1 || true) | grep -qi -e usage -e dh-make-scala
update:
  enabled: false
  manual: true
  exclude-reason: 'Debian-native package; bump the version by hand'
test:
  environment:
    contents:
      packages:
        - busybox
        - build-base  # Debian: build-essential
        - scala-2.12  # Debian: scala
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - scala-2.13
        - scala-3.8  # Debian: scala3
  pipeline:
    - runs: |
        dh_scala --version || (dh_scala --help 2>&1 || true) | grep -qi -e usage -e dh_scala
        test -f /usr/share/doc/dh-scala/copyright
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='build-essential=build-base libc-bin=glibc libc6=glibc perl-base=perl scala=scala-2.12 scala3=scala-3.8' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/dh-scala.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/dh-scala.templates" && break
        done
    - name: 'autopkgtest: debian/tests/build-library 2.12'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        debian/tests/build-library 2.12
    - name: 'autopkgtest: debian/tests/build-library 2.13'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        debian/tests/build-library 2.13
    - name: 'autopkgtest: debian/tests/build-library 3'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        debian/tests/build-library 3
    - name: 'autopkgtest: debian/tests/build-library cross'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        debian/tests/build-library cross
    - name: 'autopkgtest: debian/tests/build-library no-buildsystem'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        debian/tests/build-library no-buildsystem
