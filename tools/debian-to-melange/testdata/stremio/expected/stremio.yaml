# Generated by debian-to-melange 0.1.0 from Debian source package
# stremio 1.2.0+ds-1 (3.0 (quilt)).
# Debian packaging: https://salsa.debian.org/mendezr/stremio
#
# Conversion notes:
# - set expected-commit for tag v1.2.0 (re-run with --download, or git ls-remote)
package:
  name: stremio
  version: '1.2.0'
  epoch: 0
  description: Modern media center (WebKitGTK client)
  copyright:
    - license: GPL-3.0-only
    - license: MIT
      paths:
        - data/com.stremio.Stremio.metainfo.xml
  dependencies:
    runtime:
      - nodejs
      # Debian Recommends (not supported by apk): stremio-server-installer
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - rust  # Debian: cargo
      - pkgconf-dev  # Debian: pkgconf
      - libgtk-4-dev
      - libadwaita-1-dev
      - libwebkitgtk-6.0-dev
      - mpv-dev  # Debian: libmpv-dev
      - libepoxy-dev
      - mesa-dev  # Debian: libegl-dev
      - gettext
      - glib  # Debian: libglib2.0-bin
  environment:
    CARGO_PROFILE_RELEASE_DEBUG: 'true'
    RUSTFLAGS: --remap-path-prefix=/home/build=.
    XDG_DATA_HOME: /home/build/debian/xdg_data_home
pipeline:
  # TODO(debian-to-melange): set expected-commit for tag v1.2.0 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://github.com/Stremio/stremio-linux-shell
      tag: v${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in 0001-disable-image-exr-feature.patch 0002-pin-crate-versions-to-debian.patch 0003-add-man-page.patch 0004-fix-window-state-typo.patch copyright stremio-wrapper; do mv stremio/$f .recipe-files/; done
      rmdir stremio 2>/dev/null || true
  - name: Remove files excluded by Debian (debian/copyright Files-Excluded)
    runs: |
      rm -rf data/server.js
  - uses: patch
    with:
      patches: .recipe-files/0001-disable-image-exr-feature.patch .recipe-files/0002-pin-crate-versions-to-debian.patch .recipe-files/0003-add-man-page.patch .recipe-files/0004-fix-window-state-typo.patch
  - name: Build (from debian/rules override_dh_auto_build)
    runs: |
      cargo build --release --features offline-build
  - name: Install (from debian/rules override_dh_auto_install)
    runs: |
      install -D -m755 target/release/stremio-linux-shell ${{targets.destdir}}/usr/libexec/stremio/stremio-bin
      install -D -m755 .recipe-files/stremio-wrapper ${{targets.destdir}}/usr/bin/stremio
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/applications"
      cp -a data/com.stremio.Stremio.desktop "${{targets.destdir}}/usr/share/applications/"
      mkdir -p "${{targets.destdir}}/usr/share/metainfo"
      cp -a data/com.stremio.Stremio.metainfo.xml "${{targets.destdir}}/usr/share/metainfo/"
      mkdir -p "${{targets.destdir}}/usr/share/icons/hicolor/scalable/apps"
      cp -a data/icons/com.stremio.Stremio.svg "${{targets.destdir}}/usr/share/icons/hicolor/scalable/apps/"
      mkdir -p "${{targets.destdir}}/usr/share/glib-2.0/schemas"
      cp -a data/com.stremio.Stremio.gschema.xml "${{targets.destdir}}/usr/share/glib-2.0/schemas/"
      install -Dm644 data/stremio.1 -t "${{targets.destdir}}/usr/share/man/man1"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/stremio/copyright
  - uses: strip
update:
  enabled: true
  github:
    identifier: Stremio/stremio-linux-shell
    strip-prefix: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        test -f /usr/share/doc/stremio/copyright
    - uses: test/tw/ldd-check
