package:
  name: xwpe
  version: '1.6.6'
  epoch: 0
  description: Programming environment and editor for console and X11
  copyright:
    - license: GPL-2.0-only
    - license: FSFAP
      paths:
        - io.codeberg.mendezr.xwpe.metainfo.xml
    - license: MIT
      paths:
        - icons/xwpe.svg
        - icons/xwpe-small.svg
  dependencies:
    runtime:
      - ttf-dejavu  # Debian: fontconfig-config depends on fonts-dejavu-core
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - pkgconf-dev  # Debian: pkgconf
      - texinfo
      - libgpmg1-dev
      - ncurses-dev  # Debian: libncurses-dev
      - libx11-dev
      - libxext-dev
      - libxft-dev
      - fontconfig-dev  # Debian: libfontconfig-dev
      - freetype-dev  # Debian: libfreetype-dev
      - cairo-dev  # Debian: libcairo2-dev
      - pango-dev  # Debian: libpango1.0-dev
      - libvterm-dev
      - json-c-dev  # Debian: libjson-c-dev
      - xorgproto  # Debian: x11proto-core-dev
      - zlib-dev  # Debian: zlib1g-dev
      - rsvg-convert  # Debian: librsvg2-bin
pipeline:
  - name: Move the recipe files out of the build tree
    runs: |
      mkdir -p .recipe-files
      for f in copyright; do mv xwpe/$f .recipe-files/; done
      rmdir xwpe 2>/dev/null || true
  # TODO(debian-to-melange): set expected-commit for tag v1.6.6 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://codeberg.org/mendezr/xwpe.git
      tag: v${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - name: 'Debian''s include/ncursesw'
    runs: |
      mkdir -p /usr/include/ncursesw
      for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
               panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
        [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
      done
      true
  - name: Install files
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/doc/xwpe"
      cp -a README "${{targets.destdir}}/usr/share/doc/xwpe/"
      install -Dm644 .recipe-files/copyright "${{targets.destdir}}"/usr/share/doc/xwpe/copyright
update:
  enabled: true
  git:
    strip-prefix: v
test:
  environment:
    contents:
      packages:
        - busybox
        - py3-pyte  # Debian: python3-pyte
        - py3-pytest  # Debian: python3-pytest
        - glibc-locale-en  # Debian: locales-all
        - build-base  # Debian: gcc
        - glibc-dev  # Debian: libc6-dev
        - gfortran
        - gdb
        - perl
        - bash  # Essential in Debian, so on every testbed
        - coreutils  # Essential in Debian, so on every testbed
        - diffutils  # Essential in Debian, so on every testbed
        - dpkg  # Essential in Debian, so on every testbed
        - findutils  # Essential in Debian, so on every testbed
        - grep  # Essential in Debian, so on every testbed
        - gzip  # Essential in Debian, so on every testbed
        - sed  # Essential in Debian, so on every testbed
        - python3
        - py3-pillow  # Debian: python3-pil
        - xvfb-run  # Debian: xvfb
        - xkbcomp  # Debian: xvfb
        - xkeyboard-config  # Debian: xvfb
        - matchbox-window-manager
        - xdotool
        - x11-apps  # TODO(debian-to-melange): a Debian bundle; list the programs used (atobm, bitmap, bmtoa...)
        - x11-xserver-utils  # TODO(debian-to-melange): a Debian bundle; list the programs used (iceauth, sessreg, showrgb...)
        - xclip
        - imagemagick-7  # Debian: imagemagick
        - netpbm  # Debian: imagemagick
  pipeline:
    - runs: |
        test -f /usr/share/doc/xwpe/copyright
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://codeberg.org/mendezr/xwpe.git
        tag: v${{package.version}}
        expected-commit: '0000000000000000000000000000000000000000'
    - name: dpkg database (as on a Debian testbed)
      runs: |
        db=/var/lib/dpkg
        mkdir -p "$db/info" && touch "$db/status"
        awk -v db="$db" -v aliases='g++=build-base gcc=build-base imagemagick=imagemagick-7 libc-bin=glibc libc6=glibc libc6-dev=glibc-dev locales-all=glibc-locale-en perl-base=perl python3-pil=py3-pillow python3-pyte=py3-pyte python3-pytest=py3-pytest xvfb=xvfb-run' '
          BEGIN { n = split(aliases, a, " "); for (i = 1; i <= n; i++) { split(a[i], kv, "="); alias[kv[2]] = alias[kv[2]] " " kv[1] } }
          function add(   m, j, f) {
            m = split(pkg alias[pkg], names, " ")
            for (j = 1; j <= m; j++) {
              if (seen[names[j]]++) continue  # one entry per name: dpkg rejects duplicates
              f = db "/info/" names[j] ".list"
              printf "%s", files > f; close(f)
              gsub(/_/, "~", ver)
              printf "Package: %s\nStatus: install ok installed\nPriority: optional\nArchitecture: all\nVersion: %s\nMaintainer: Wolfi\nDescription: %s (apk package %s)\n\n", names[j], ver, names[j], pkg >> (db "/status")
            }
            pkg = ""
          }
          /^P:/ { pkg = substr($0, 3); files = ""; dir = "" }
          /^V:/ { ver = substr($0, 3) }
          /^F:/ { dir = substr($0, 3); files = files "/" dir "\n" }
          /^R:/ { files = files (dir == "" ? "" : "/" dir) "/" substr($0, 3) "\n" }
          /^$/ && pkg != "" { add() }
          END { if (pkg != "") add() }
        ' /lib/apk/db/installed
        for t in debian/xwpe.templates debian/templates; do
          # po-debconf's translatable fields (_Description, __Choices) in the C locale
          [ -f "$t" ] && sed '/^#/d; s/^__*//' "$t" > "$db/info/xwpe.templates" && break
        done
        # / and /tmp as on a Debian testbed: sandboxes may make / 0700 (apt's _apt reads below it)
        chmod 755 / 2>/dev/null || true
        chmod 1777 /tmp 2>/dev/null || true
        # base-files' vendor (dpkg-vendor, dpkg-buildpackage)
        mkdir -p /etc/dpkg/origins
        [ -e /etc/dpkg/origins/debian ] || printf 'Vendor: Debian\nVendor-URL: https://www.debian.org/\nBugs: debbugs://bugs.debian.org\n' > /etc/dpkg/origins/debian
        [ -e /etc/dpkg/origins/default ] || ln -s debian /etc/dpkg/origins/default
    - name: 'Debian''s include/ncursesw'
      runs: |
        mkdir -p /usr/include/ncursesw
        for h in curses.h ncurses.h ncurses_dll.h term.h term_entry.h termcap.h tic.h unctrl.h \
                 panel.h menu.h form.h eti.h etip.h cursesapp.h cursesf.h cursesm.h cursesp.h cursesw.h cursslk.h; do
          [ -e /usr/include/$h ] && ln -sf ../$h /usr/include/ncursesw/$h
        done
        true
    - name: 'autopkgtest: XWPE_TEST_WAIT_SCALE=3 WPE_BIN=/usr/bin/wpe python3 -m pytes'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        (
        XWPE_TEST_WAIT_SCALE=3 WPE_BIN=/usr/bin/wpe python3 -m pytest -q tests --ignore=tests/x11
        ) || echo 'autopkgtest marked flaky failed (ignored)'
    - name: 'autopkgtest: XWPE_TEST_WAIT_SCALE=3 XWPE_BIN=/usr/bin/xwpe python3 -m pyt'
      runs: |
        export AUTOPKGTEST_TMP="$(mktemp -d)"
        export LANG="${LANG:-C.UTF-8}"
        set +o pipefail 2>/dev/null || true
        (
        XWPE_TEST_WAIT_SCALE=3 XWPE_BIN=/usr/bin/xwpe python3 -m pytest -q tests/x11
        ) || echo 'autopkgtest marked flaky failed (ignored)'
