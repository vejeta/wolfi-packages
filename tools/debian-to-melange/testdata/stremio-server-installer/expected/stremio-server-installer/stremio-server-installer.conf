# Configuration for stremio-server-installer.
#
# server.js is Stremio's proprietary streaming server, which enables
# BitTorrent-based streaming in the stremio client. It is not included in
# this package: it is downloaded from Stremio's own servers (dl.strem.io),
# subject to Stremio's terms of service (https://www.stremio.com/tos).
#
# Set to "no" to skip the automatic download on package install/upgrade.
# stremio still works without it, with BitTorrent streaming unavailable.
# Run "stremio-server-install" manually at any time to download it.
STREMIO_SERVER_DOWNLOAD=yes
