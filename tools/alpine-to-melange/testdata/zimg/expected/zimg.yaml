# Generated by alpine-to-melange 0.1.0 from the Alpine APKBUILD of zimg 3.0.6-r0.
# Upstream: https://github.com/sekrit-twc/zimg
#
# Conversion notes:
# - set expected-commit for tag release-3.0.6 (re-run with --download, or git ls-remote)
package:
  name: zimg
  version: '3.0.6'
  epoch: 0
  description: Scaling, colorspace conversion and dithering library
  copyright:
    - license: WTFPL
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - autoconf
      - automake
      - libtool
      - cmake
      - linux-headers
      - ninja  # Alpine: samurai
pipeline:
  # TODO(alpine-to-melange): set expected-commit for tag release-3.0.6 (re-run with --download, or git ls-remote)
  - uses: git-checkout
    with:
      repository: https://github.com/sekrit-twc/zimg
      tag: release-${{package.version}}
      expected-commit: '0000000000000000000000000000000000000000'
  - name: Create $srcdir
    runs: |
      mkdir -p /home/build/_srcdir
  - uses: fetch
    with:
      uri: https://github.com/google/googletest/archive/refs/tags/v1.16.0.tar.gz
      expected-sha512: bec8dad2a5abbea8e9e5f0ceedd8c9dbdb8939e9f74785476b0948f21f5db5901018157e78387e106c6717326558d6642fc0e39379c62af57bf1205a9df8a18b
      strip-components: 0
      directory: _srcdir
  - name: Prepare
    runs: |
      pkgdir="${{targets.destdir}}"
      srcdir="/home/build/_srcdir"
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/zimg-release-3.0.6" ] || ln -s /home/build "/home/build/_srcdir/zimg-release-3.0.6"

      mkdir -p "$pkgdir"
      # googletest is required in-tree
      ln -s "$srcdir"/googletest-*/* test/extra/googletest
      autoreconf -vfi
  - name: Build
    runs: |
      CARCH="${{build.arch}}"
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      case "$CARCH" in
      s390x)
      	# https://github.com/sekrit-twc/zimg/pull/156
      	;;
      *)
      	# build and run test binaries here
      	./configure \
      		--build=$CBUILD \
      		--host=$CHOST \
      		--prefix=/usr \
      		--sysconfdir=/etc \
      		--mandir=/usr/share/man \
      		--localstatedir=/var \
      		--disable-static \
      		--enable-unit-test
      	make
      	ninja -C test/extra/googletest/build
      	make test/unit_test.log
      	test/unit_test
      	make clean
      	;;
      esac

      export CFLAGS="$CFLAGS -O2 -flto=auto"
      export CXXFLAGS="$CXXFLAGS -O2 -flto=auto"

      # build release binaries here without enabling tests,
      # as they make zimg slower
      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--localstatedir=/var \
      	--disable-static
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: zimg-doc
    description: Scaling, colorspace conversion and dithering library (doc)
    pipeline:
      - runs: |
          for d in usr/share/doc usr/share/man usr/share/info usr/share/html usr/share/sgml \
                   usr/share/licenses usr/share/gtk-doc usr/share/devhelp usr/share/help; do
            [ "$d" = usr/share/licenses ] && continue  # Wolfi keeps the license in the package
            [ -d "${{targets.destdir}}/$d" ] || continue
            mkdir -p "${{targets.contextdir}}/$(dirname $d)"
            mv "${{targets.destdir}}/$d" "${{targets.contextdir}}/$d"
          done
  - name: zimg-dev
    description: Scaling, colorspace conversion and dithering library (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
update:
  enabled: true
  github:
    identifier: sekrit-twc/zimg
    strip-prefix: release-
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
