package:
  name: rubberband
  version: '4.0.0'
  epoch: 0
  description: Library for audio time-stretching and pitch-shifting
  copyright:
    - license: GPL-2.0-only
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - bash
      - fftw-dev
      - ladspa-dev
      - libsamplerate-dev
      - libsndfile-dev
      - lv2-dev
      - meson
      - vamp-sdk-dev
pipeline:
  - uses: fetch
    with:
      uri: https://breakfastquay.com/files/releases/rubberband-${{package.version}}.tar.bz2
      expected-sha512: 975ceead691c9fb9cb8b876d00d5661986d85ba59a97bb3c17bc8a835e8aeaf0bc324dd43ffa20f2854e019572b404d37d5e4868a99076d422f279359c44a7b4
  - name: Build
    runs: |
      abuild_meson() {
      	meson setup --prefix=/usr --libdir=/usr/lib --libexecdir=/usr/libexec \
      		--bindir=/usr/bin --sbindir=/usr/sbin --includedir=/usr/include \
      		--datadir=/usr/share --mandir=/usr/share/man --infodir=/usr/share/info \
      		--localedir=/usr/share/locale --sysconfdir=/etc --localstatedir=/var \
      		--sharedstatedir=/var/lib --buildtype=plain --auto-features=auto \
      		--wrap-mode=nofallback -Db_staticpic=true -Db_pie=true \
      		-Dpython.bytecompile=0 "$@"
      }

      # release needed since sets extra defines
      abuild_meson \
      	--buildtype=release \
      	-Db_lto=true \
      	-Dresampler=libsamplerate \
      	-Dfft=fftw \
      	. output
      meson compile -C output
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      DESTDIR="$pkgdir" meson install --no-rebuild -C output
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - name: Usr-merge (sbin into bin)
    runs: |
      for s in usr/sbin sbin bin lib; do
        d="${{targets.destdir}}/$s"
        [ -d "$d" ] && [ ! -L "$d" ] || continue
        t=usr/bin; [ "$s" = lib ] && t=usr/lib
        mkdir -p "${{targets.destdir}}/$t" && cp -a "$d"/. "${{targets.destdir}}/$t/" && rm -rf "$d"
      done
  - uses: strip
subpackages:
  - name: rubberband-libs
    description: Library for audio time-stretching and pitch-shifting (libs)
    pipeline:
      - uses: split/lib
  - name: rubberband-static
    description: Library for audio time-stretching and pitch-shifting (static)
    pipeline:
      - uses: split/static
  - name: rubberband-dev
    description: Library for audio time-stretching and pitch-shifting (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(alpine-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
