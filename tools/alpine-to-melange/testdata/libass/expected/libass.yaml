package:
  name: libass
  version: '0.17.5'
  epoch: 0
  description: Portable library for SSA/ASS subtitle rendering
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - fontconfig-dev
      - fribidi-dev
      - freetype-dev
      - harfbuzz-dev
      - libunibreak-dev
      - nasm
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/libass/libass/releases/download/${{package.version}}/libass-${{package.version}}.tar.xz
      expected-sha512: b9e06023e9f5760ba1946f8dbcd8c411908bc6c77030099098f8252edabd31c98a6523cffb7cccf7b62e12bb374d136600a98e29a7916ccc218100ff694bfb7c
  - name: Build
    runs: |
      CBUILD="${{host.triplet.gnu}}"
      CHOST="${{host.triplet.gnu}}"

      CFLAGS="$CFLAGS -flto=auto" \
      ./configure \
      	--build=$CBUILD \
      	--host=$CHOST \
      	--prefix=/usr \
      	--sysconfdir=/etc \
      	--mandir=/usr/share/man \
      	--infodir=/usr/share/info \
      	--localstatedir=/var \
      	--disable-static \
      	--with-pic
      make
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"

      make DESTDIR="$pkgdir" install
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: libass-dev
    description: Portable library for SSA/ASS subtitle rendering (dev)
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - fontconfig-dev
        - fribidi-dev
        - freetype-dev
        - harfbuzz-dev
        - libunibreak-dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
update:
  enabled: true
  github:
    identifier: libass/libass
    use-tag: true
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
