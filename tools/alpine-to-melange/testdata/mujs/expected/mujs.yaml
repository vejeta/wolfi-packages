# Upstream: https://mujs.com/
package:
  name: mujs
  version: '1.3.9'
  epoch: 0
  description: An embeddable JavaScript interpreter
  copyright:
    - license: ISC
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - python3
      - readline-dev
pipeline:
  - uses: fetch
    with:
      uri: https://mujs.com/downloads/mujs-${{package.version}}.tar.gz
      expected-sha512: a3be06a861f88fe8b10151bc2e56c19b8122078579f3c65a84f0874385d1e7c90dbc7891eff5c78c75c290fff62160a3babc43717fe03982668ca7aa40289552
  - name: Build
    runs: |
      pkgver="${{package.version}}"
      _sover=${pkgver#1.}
      _sover=${_sover%%.*}

      make release OPTIM="-O2" CFLAGS="${CFLAGS/-Os/} -Wl,-soname,libmujs.so.$_sover"
  - name: Install
    runs: |
      pkgver="${{package.version}}"
      pkgdir="${{targets.destdir}}"
      _sover=${pkgver#1.}
      _sover=${_sover%%.*}

      ver3=${pkgver#*.*.}; ver3=${ver3%%[^0-9]*}

      make install-shared prefix=/usr DESTDIR="$pkgdir"
      make install prefix=/usr DESTDIR="$pkgdir"

      cd "$pkgdir"

      mv usr/lib/libmujs.so usr/lib/libmujs.so.$_sover.$ver3
      ldconfig -n usr/lib
      ln -s libmujs.so.$_sover.$ver3 usr/lib/libmujs.so
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: mujs-static
    description: An embeddable JavaScript interpreter (static)
    pipeline:
      - uses: split/static
  - name: mujs-dev
    description: An embeddable JavaScript interpreter (dev)
    pipeline:
      - uses: split/dev
    test:
      environment:
        contents:
          packages:
            - busybox
      pipeline:
        - uses: test/pkgconf
  - name: mujs-libs
    description: An embeddable JavaScript interpreter (libs)
    pipeline:
      - uses: split/lib
update:
  enabled: true
  release-monitor:
    identifier: 0  # TODO(alpine-to-melange): set the release-monitoring.org project id
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
