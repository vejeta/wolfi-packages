# Generated by alpine-to-melange 0.1.0 from the Alpine APKBUILD of foobar 2.1.0_rc3-r1.
# Upstream: https://github.com/example/foobar
#
# Conversion notes:
# - options=net: the build needs network access
# - subpackage foobar-openrc skipped: OpenRC init scripts are not used on Wolfi
# - package() installs OpenRC files (/etc/init.d, /etc/conf.d); Wolfi does not use OpenRC
package:
  name: foobar
  version: 2.1.0_rc3
  epoch: 0
  description: Frobnicating daemon
  copyright:
    - license: GPL-2.0-or-later AND MIT
  target-architecture:
    - x86_64
    - aarch64
  dependencies:
    runtime:
      - bash
      - ca-certificates-bundle
  scriptlets:
    pre-install: |
      #!/bin/sh
      addgroup -S foobar 2>/dev/null
      adduser -S -D -H -G foobar foobar 2>/dev/null
      exit 0
    post-install: |
      #!/bin/sh
      echo "foobar: edit /etc/foobar.conf"
var-transforms:
  - from: ${{package.version}}
    match: _rc
    replace: -rc
    to: mangled-pkgver
environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - build-base
      - busybox
      - cmake
      - ninja  # Alpine: samurai
      - linux-headers
pipeline:
  - uses: fetch
    with:
      uri: https://github.com/example/foobar/archive/refs/tags/v${{vars.mangled-pkgver}}.tar.gz
      expected-sha512: '1111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111111'
  - uses: patch
    with:
      patches: foobar/0001-fix-musl.patch
  - name: Build
    runs: |
      pkgver="${{package.version}}"
      JOBS="$(nproc)"
      _major=${pkgver%%.*}

      cmake -B build -G Ninja \
      	-DCMAKE_INSTALL_PREFIX=/usr \
      	-DFOOBAR_MAJOR=$_major
      cmake --build build -j $JOBS
  - name: Install
    runs: |
      pkgdir="${{targets.destdir}}"
      srcdir="/home/build/_srcdir"
      mkdir -p "$srcdir"
      [ -e "/home/build/_srcdir/foobar-2.1.0-rc3" ] || ln -s /home/build "/home/build/_srcdir/foobar-2.1.0-rc3"
      cp -a /home/build/foobar/foobar.initd "$srcdir"/
      cp -a /home/build/foobar/foobar.conf "$srcdir"/

      DESTDIR="$pkgdir" cmake --install build
      install -Dm644 "$srcdir"/foobar.conf "$pkgdir"/etc/foobar.conf
      install -Dm755 "$srcdir"/foobar.initd "$pkgdir"/etc/init.d/foobar
  - name: Remove libtool archives (abuild does this by default)
    runs: |
      find "${{targets.destdir}}" -name "*.la" -delete
  - uses: strip
subpackages:
  - name: foobar-doc
    description: Frobnicating daemon (doc)
    pipeline:
      - uses: split/alldocs
  - name: foobar-tools
    description: Frobnicating daemon (command line tools)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/bin/foobar-*
    dependencies:
      runtime:
        - foobar
  - name: foobar-bash-completion
    description: Frobnicating daemon (bash-completion)
    pipeline:
      - runs: |
          pkgdir="${{targets.destdir}}"
          subpkgdir="${{targets.contextdir}}"
          amove() {
          	for _p in "$@"; do
          		_p=${_p#/}
          		for _f in "$pkgdir"/$_p; do
          			[ -e "$_f" ] || [ -L "$_f" ] || continue
          			_d=${_f#"$pkgdir"/}
          			mkdir -p "$subpkgdir/${_d%/*}"
          			mv "$_f" "$subpkgdir/${_d%/*}/"
          		done
          	done
          }

          amove usr/share/bash-completion/completions
update:
  enabled: true
  github:
    identifier: example/foobar
    strip-prefix: v
  version-transform:
    - match: '\-rc'
      replace: _rc
test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - uses: test/tw/ldd-check
